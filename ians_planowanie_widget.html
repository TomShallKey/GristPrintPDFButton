<script type="application/json" id="lz-opisy-data">{"AI-APP":{"terminy":[{"s":"2026-10-05 10:00","e":"2026-10-06 16:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2026-11-23 10:00","e":"2026-11-24 16:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"AI-APP","title_full":"AI technologies and Applications in ATM [AI-APP]","title_clean":"AI technologies and Applications in ATM","description":"The objective of the “AI technologies and Applications in ATM'' course is to provide a basic understanding of the technical aspects of AI in a wider sense. It provides information about the full bandwidth of AI technologies (i.e. not limited to machine learning), explains the application areas of different AI technologies in the aviation domain with appropriate examples, explores the organisational and technical prerequisites for a successful introduction of (existing) AI technologies in safety relevant environments and offers tools to anticipate their possible benefits and constraints. The course also aims at offering the participants some initial “hands-on” experiences with various AI technologies, by means of structured practical exercises.","objectives":"After successful completion of the course, participants will be able to understand the fundamental concept of AI, identify use cases of AI in aviation, and pondering possible benefits and limitations. Moreover, they will be able to understand the basic terminology, tools, program languages used in AI applications, they will benefit from a first hands-on experience of AI applications and they will appreciate the potential of risks and biases in AI implementations.","audience":"The course is designed for a wide audience, including but not limited to managers interested in ATM technological innovation, safety managers, ATCOs, engineers and system developers and ATSEPs.","duration":"This course takes place over 2 days.","price":"The price per course participant from all organisations or individuals is 1110 EUR.","delivered_by":"Ioana TOANCHINA - Course manager\nStefano Bonelli - Tutor\nDr., PhD Daniele Baranzini - Tutor","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course will be split into two courses: AI technologies and Applications in ATM [AI-APP] and Understanding the technicalities of Artificial Intelligence [AI-APP-LAB], each delivered over two days.AI-APP will focus on the general knowledge of AI applications, including key techniques and practical considerations, while AI-APP-LAB will provide a deeper, hands-on exploration of practical AI applications.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"AI-APP-LAB":{"terminy":[{"s":"2026-10-07 10:00","e":"2026-10-08 16:00","dni":2,"dow":"Śr-Czw","lok":"Luxembourg"},{"s":"2026-11-25 10:00","e":"2026-11-26 16:00","dni":2,"dow":"Śr-Czw","lok":"Luxembourg"}],"course_id":"AI-APP-LAB","title_full":"Understanding the technicalities of Artificial Intelligence [AI-APP-LAB]","title_clean":"Understanding the technicalities of Artificial Intelligence","description":"The course deepens the technical aspects of Artificial Intelligence introduced in the AI technologies and Applications in ATM [AI-APP] course. The course focuses on the technical foundations of AI, including different types of AI, algorithms,program languages, and libraries, while analysing their strengths, limitations, and implementation challenges in the aviation and ATM context. The course includes various hands-on sessions covering multiple AI technologies, by means of structured practical exercises with realistic datasets. The topics covered in this course are: - Available and deployable AI technologies - Software environments to set up and deploy AI frameworks - Coding and programming language for AI projects - Key libraries for Machine Learning and Deep Learning solutions - Train AI algorithms on data for selected aviation applications - Tools and methods to assess AI performance and its impact on operations","objectives":"After successful completion of the course, participants will be able to: - Operate various AI coding and programming methods - Test AI tools and software for end-to-end AI projects - Assess AI models performance for reliable and valid results - Apply on practical case studies","audience":"The course is intended for technical profiles involved in the design, development, testing, or deployment of AI solutions in the ATM and aviation domain, in particular AI engineers, data scientists, and other technical specialists wishing to deepen their practical and technical understanding of Artificial Intelligence.","duration":"This course takes place over 2 days.","price":"The price per course participant from all organisations or individuals is 740 EUR.","delivered_by":"Ioana TOANCHINA - Course manager\nDr Giuseppe Frau - Tutor\nDr., PhD Daniele Baranzini - Tutor","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembou Intelligence in Future ATM","description":"Artificial intelligence (AI) is a fast-evolving family of technologies inspired by human intellectual processes, such as the ability to reason, discover meaning, generalise, act flexibly, or learn from past experience. By improving prediction and optimising operations and resource allocation, the use of artificial intelligence has already delivered breakthroughs in various applications and has the potential for a wide array of economic and societal benefits across the entire spectrum of industries and social activities, including aviation. AI can, however, also entail new risks or have negative consequences for individuals, organisations, or society. For this reason, the European Commission has recently adopted the AI Act, which introduces a regulatory framework for AI, including requirements for AI literacy. As of February 2, 2025, organizations involved in the development, adoption, commercialization, or use of AI systems must ensure their personnel have the necessary knowledge, skills, and awareness to make informed decisions when deploying AI. This course supports these literacy objectives by equipping participants with foundational AI concepts and an understanding of its regulatory and operational implications in aviation. The EASA Artificial Intelligence Roadmap further highlights the importance of this topic, outlining the its vision on its safety and ethical dimensions.","objectives":"This course represents an introductory course on the subject of the introduction of artificial intelligence in the ATM sector. After completing the course: Participants will have an understanding of the foundational concepts of artificial intelligence (AI), with a particular focus on the current and future applications of AI in the ATM domain. Participants will be able to describe possible applications and analyse benefits for individuals, organisations, and the overall ATM system, as well as the possible safety, ethical, and legal implications of using AI systems. Participants will recognize the AI literacy requirements under the EU AI Act including the essential skills and knowledge needed for informed AI deployment in aviation. The course will raise awareness about the AI roadmap developed by EASA and the regulatory aspects of using AI systems at European level.","audience":"The course is designed for a wide audience, including but not limited to managers interested in ATM technological innovation, safety managers, ATCOs, and ATSEPs.","duration":"This course takes place over 3 days.","price":"The price per course for all participant is 1110 EUR.","delivered_by":"Ioana TOANCHINA Course manager Paola Lanzi Tutor Dr. Elisa Spiller Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"AI-INTRO-V":{"terminy":[{"s":"2027-02-03 10:00","e":"2027-02-05 15:00","dni":3,"dow":"Śr-Pt","lok":"Online"}],"course_id":"AI-INTRO-V","title_full":"Artificial Intelligence in Future ATM [AI-INTRO-V]","title_clean":"Artificial Intelligence in Future ATM","description":"Artificial intelligence (AI) is a fast-evolving family of technologies inspired by human intellectual processes, such as the ability to reason, discover meaning, generalise, act flexibly or learn from past experience. By improving prediction and optimising operations and resource allocation, the use of artificial intelligence has already delivered breakthroughs in various applications and has the potential for a wide array of economic and societal benefits across the entire spectrum of industries and social activities, including aviation. AI can, however, also entail new risks or have negative consequences for individuals, organisations, or society. For this reason, the European Commission has recently adopted the AI Act, which introduces a regulatory framework for AI, including requirements for AI literacy. As of February 2, 2025, organizations involved in the development, adoption, commercialization, or use of AI systems must ensure their personnel have the necessary knowledge, skills, and awareness to make informed decisions when deploying AI. This course supports these literacy objectives by equipping participants with foundational AI concepts and an understanding of its regulatory and operational implications in aviation. The EASA Artificial Intelligence Roadmap further highlights the importance of this topic, outlining its vision on its safety and ethical dimensions.","objectives":"This is an introductory course on the subject of the introduction of artificial intelligence in the ATM sector. After completing the course: Participants will have an understanding of the foundational concepts of artificial intelligence (AI), with a particular focus on the current and future applications of AI in the ATM domain. Participants will be able to describe possible applications and analyse benefits for individuals, organisations, and the overall ATM system, as well as the possible safety, ethical, and legal implications of using AI systems. Participants will recognize the AI literacy requirements under the EU AI Act including the essential skills and knowledge needed for informed AI deployment in aviation. The course will raise awareness about the AI roadmap developed by EASA and the regulatory aspects of using AI systems at European level.","audience":"The course is designed for a wide audience, including but not limited to managers interested in ATM technological innovation, safety managers, ATCOs, and ATSEPs.","duration":"This course takes place over 3 days. You will have 3 virtual sessions. You need to plan 12 hours to complete this course.","price":"The price per course participant is 1110 EUR.","delivered_by":"Ioana TOANCHINA Course manager Dr. Elisa Spiller Tutor Paola Lanzi Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"APT-ACAP":{"terminy":[{"s":"2026-09-29 09:00","e":"2026-10-01 16:30","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"APT-ACAP","title_full":"Airport Capacity and Performance [APT-ACAP]","title_clean":"Airport Capacity and Performance","description":"With the introduction of the SES framework, the need for familiarisation with airport capacity and its performance in the network context has become a very important topic. IR 390/ 2013 requires local target setting for airports at national level. In many cases smaller airports have no means for assessing their capacities. The Stakeholders/Actors involved in ATM do not have the same background on all parts of the network, in this case airports and the determination of their capacity. If the Network CDM processes are to be improved, a better understanding of the existing interdependencies is pivotal.","objectives":"At the end of the course, ATM stakeholders should have an understanding of airport capacity and its relevance within the network context.","audience":"Airport Planners, Flow managers, ATC staff (Tower), NSAs, Airline Operators, Performance Managers.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Frederic ROOSELEER Content Manager Sandrine TASQUIN Course manager Dimitrios KASTANIS Speaker Yves DE WANDELER Speaker Catherine CHALON MORGAN Speaker Valerio CAPPELLAZZO Speaker Francisco HOYAS Speaker Ivan DE VISSCHER Speaker Jaroslaw NIEWINSKI Speaker About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"APT-ACDM":{"terminy":[{"s":"2026-10-13 09:00","e":"2026-10-15 15:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-03-16 09:00","e":"2027-03-18 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-10-19 09:00","e":"2027-10-21 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"APT-ACDM","title_full":"Airport Collaborative Decision Making [APT-ACDM]","title_clean":"Airport Collaborative Decision Making","description":"Given the traffic movements expected in the aviation industry in the coming years and the recent enhancements to the ATC en-route network, European airports are a restricting bottleneck of the overall ATM system. It is therefore important to make the best possible use of the existing airport infrastructure. Airport CDM is about partners working together more efficiently and transparently in how they share data. This course begins by highlighting the importance of full and common operational situational awareness for airport partners. Subsequently, it provides the participants with knowledge of the A-CDM process by describing the various elements involved. Furthermore, it describes the relationship and interaction with the ATFM network. The course content also provides some guidance on how to implement A-CDM at the airport, and this is complemented by presentations from invited airport stakeholders that have successfully implemented A-CDM. Pre-requisites It is strongly recommended to follow an eLearning Course on Airport Collaborative Decision Making (Course code in the catalogue: APT-ACDM-FUND) prior to attendance to the A-CDM classroom course.","objectives":"After completing the course participants will have a detailed understanding of the Airport CDM process and will have received practical guidance on its implementation. In addition, they will have gained an understanding of the difficulties that may be encountered and of how to successfully overcome those. There is an emphasis on the A-CDM benefits brought to all airport partners and the overall ATFM network.","audience":"This course is designed for operational staff of ANSPs, airports, airlines and ground handlers. It may also be of interest to anyone from other organisations involved in the implementation of A-CDM activities.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"David BOOTH Content Manager Sandrine TASQUIN Course manager Calin PAVLOV Speaker Tarja KETTUNEN Speaker Jaroslaw NIEWINSKI Speaker Mattia BONAVENTURA Speaker Francisco HOYAS Speaker Ioana SUCIU tegy to prevent these occurrences from happening. The successful introduction of a local runway safety team is fundamental to ensuring the prevention of runway and taxiway incursions. The goal of such a team is to work together to identify the local causal factors of the incursions and find local solutions to prevent their recurrence. Currently all the members of these multi-professional teams work at the forefront of operational safety as individuals, whereas they need to be carrying out their work on the manoeuvring area as a team. This course is designed to train people in facilitating local runway safety teams involving all operational staff working on the manoeuvring area. The facilitation process and its corresponding techniques is a fundamental element of this course. Pre-requisites Course participants will be asked to facilitate group discussions during several case studies throughout the course. A sufficient command of English to lead such a discussion is absolutely essential to successfully follow the course. Participants are required to read the associated EUROCONTROL document ‘A guide to ARM and facilitation’ (available for download in Learning Zone) prior to the course.","objectives":"After completing the course, participants will have an awareness of the daily operational hazards faced when working on or around the manouevring area and runway, and they will understand the importance of communication, error management and situational awareness for managing the risks associated with these hazards. This course aims to give participants knowledge on how to lead group discussions through the use of facilitation techniques by investigating several real-life case studies.","audience":"This course is designed for operational staff working on the manoeuvring area, including aerodrome air traffic controllers, pilots, and people whose jobs require them to drive in the manoeuvring area. The course will also be useful to members of airport local runway safety teams and others involved with runway safety activities.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"David BOOTH Content Manager Sandrine TASQUIN Course manager Francisco HOYAS Speaker Jaroslaw NIEWINSKI Speaker About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"APT-ASMGCS-DPL":{"terminy":[{"s":"2026-12-14 13:00","e":"2026-12-17 12:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"APT-ASMGCS-DPL","title_full":"Deployment of A-SMGCS services [APT-ASMGCS-DPL]","title_clean":"Deployment of A-SMGCS services","description":"This course provides in-depth knowledge of the Services (Surveillance, Airport Safety Support, Routing and Guidance) and requirements for an Advanced-Surface Movement Guidance and Control System (A-SMGCS) to support their deployment at an aerodrome. It mainly reflects the content of the EUROCONTROL Specification for A-SMGCS Services published on the 22nd of April 2020. The Airport Safety Support and the Routing Services are planned for synchronised deployment in a total of 24 airports in Europe, in accordance with the Commission Implementing Regulation (EU) 2021/116 of 1 February 2021 on the establishment of the Common Project One. This course elaborates on the experience gained from the European implementation of A-SMGCS Surveillance and Runway Monitoring and Conflict Alerting (RMCA) Services and includes the new Services (Airport Safety Support, Routing and Guidance) that have been subject to validation in the SESAR programme. Pre-requisites Basic knowledge of A-SMGCS surveillance and display systems","objectives":"After a brief introduction of how the current status was reached and an overview of the available documentation the four A-SMGCS services and their sub-functions will be explained. The experience from validations using the research platform Integrated Tower Working Position (ITWP) within the SESAR project will be disseminated. The course also includes practical exercises with ITWP.","audience":"Personnel of airports/ANSPs that have installed A-SMGCS surveillance and that have sufficient knowledge of the A-SMGCS surveillance service. Manufacturers who produce A-SMGCS","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Ing. Mohamed ELLEJMI Content Manager Sandrine TASQUIN Course manager David BOOTH Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCO tems needed for drones and regular planes to work together smoothly.","objectives":"After completing the course participants will be able to: list possible use cases for use of unmanned aircraft in airport environments. explain the operational requirements for effective and safe use of UAS depending on the application in relevant airport environments apply the required regulatory processes to operate UAS in airport environments. identify the processes and infrastructures (e.g. U-space) required for coordination between manned and unmanned aircraft.","audience":"Staff from CAAs, airport operators, UAS operators and ANSPs","duration":"This course takes place over 3 days.","price":"The price per course participant from other organisations or individuals is 1110EUR.","delivered_by":"Dr Aycan MUTLU Course manager Dr. Marco Ducci Speaker About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"ASM-ATFCM":{"terminy":[{"s":"2026-09-07 10:00","e":"2026-09-11 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-10-05 10:00","e":"2026-10-09 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-11-16 10:00","e":"2026-11-20 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"ASM-ATFCM","title_full":"Introduction to Air Traffic Flow and Capacity Management [ASM-ATFCM]","title_clean":"Introduction to Air Traffic Flow and Capacity Management","description":"Air traffic flow and capacity management (ATFCM) has become a vital part of air traffic management (ATM). ATFCM enables the full capacity of the air transport system to be exploited without running the risk of safety being infringed as a result of overload situations. The Network Manager Operation Centre (NMOC), with all its supporting personnel and systems, together with the local flow management positions (FMPs) in the area control centres, will continue to be vital elements in the management of these important functions, in conjunction with the airports community and the airline operators (AOs). The course provides an overview of the functions and procedures applicable to this area, and highlights the roles and responsibilities of the main actors.","objectives":"After completing the course, participants will have a general overview of the provision of air traffic flow and capacity management within Europe, including information on: • the NMOC and its current operations, and how the NMOC plans to cope with the future challenges; • the priorities and working principles for FMP positions, Airport and AO operation. Please note that it is strongly recommended that flow management position (FMP) staff who wish to develop an in-depth understanding of FMP operations follow the dedicated modular course offered by the EUROCONTROL NMOC for flow management staff.","audience":"This course is designed for staff working in air traffic management, airline operations and the military, for whom a general overview of the NMOC and air traffic flow and capacity management is desirable.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisation. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe TOUCHARD Course manager Mr Alessandro PRESTIGIACOMO Tutor Francisco SALGUERO Tutor Ralph TERREIN Tutor Stéphane ANDRIANJAKARIVELO Tutor Carlo VERELST Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"ASM-CAP":{"terminy":[{"s":"2026-11-09 13:00","e":"2026-11-10 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-06-14 13:00","e":"2027-06-15 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-10-18 13:00","e":"2027-10-19 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"ASM-CAP","title_full":"Network Capacity Planning [ASM-CAP]","title_clean":"Network Capacity Planning","description":"A capacity planning process has been implemented for two decades and it has been recently re-enforced through the creation of the Network Manager and the implementation of the European Performance Scheme. In order to apply a consolidated and harmonised process network-wide, all involved stakeholders have to fully understand the details and the various steps of the capacity planning process and its supporting tools and data. Understanding and implementing these mechanisms is essential to improve operational performance at local and network level. This course starts with an overview of the regulatory background and then explores the various steps of the capacity planning process. Pre-requisites Basic knowledge of airspace structure and ACC operational aspects.","objectives":"This course enables stakeholders to understand and perform the capacity planning process and to see how this ensures a harmonised network integration.","audience":"Operational/strategic planning units from ANSPs (ACC staff, HQ staff), NSAs and FAB teams.","duration":"This course takes place over 2 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisation. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Raffaele RUSSO Content Manager Sandrine TASQUIN Course manager Jelena MILENKOVIC Speaker Andrej MIKULA Speaker Laszlo ELBERT Speaker Goran PAVLOVIC Speaker About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"ASM-LARA-HK":{"terminy":[  Use of airspace concept at levels 2 and 3.","audience":"The course is designed for the following staff: a. Staff working in airspace management cells, military operations and flow management positions. b. Airspace providers, CAA and NSA staff requiring knowledge of operational management and use of airspace.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Jan SCHOLZ Content Manager Sandrine TASQUIN Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"On request, the course can be adapted for an audience outside of Europe with a focus on the Flexible Use of Airspace Concept (FUA) as adopted by ICAO. Pre-requisites Operational expertise in ATS provision.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"ASM-PRISMIL-CURA":{"terminy":[{"s":"2026-09-30 09:00","e":"2026-10-01 16:30","dni":2,"dow":"Śr-Czw","lok":"Luxembourg"}],"course_id":"ASM-PRISMIL-CURA","title_full":"PRISMIL-CURA: From Data to Decisions [ASM-PRISMIL-CURA]","title_clean":"PRISMIL-CURA: From Data to Decisions","description":"PRISMIL-CURA, the Pan-European Repository of Information Supporting Civil–Military performance monitoring, supports collaborative civil-military data-driven decision-making. It provides data-centric customised dashboards facilitating the civil/military cooperation at national and regional level, reporting measures and KPIs on military demand, utilisation of airspaces, impact on civil traffic and mission effectiveness. This course is designed to provide designated States’ operators with the essential knowledge and skills to effectively operate the Oracle Analytics Server (OAS), PRISMIL’s legacy web based post-operation reporting tool. The training covers the basics of the tool’s User interface (UI) and the specifics of the elements used to build CURA reports (i.e. Dimensions and measures of the CURA dedicated OAS Subject Area). The tool combines data from multiple sources (National and Network manager), enabling multi-layered interactive reports: user can either take advantage predefined national dashboards, or develop custom or ad-hoc reports on their specific needs. Reports can be saved, exported or shared with other stakeholders. Dashboards and reports can be generated at any time, with the possibility of comparing the latest archived results, with trends over several years. Pre-requisites No formal technical background is strictly required, but some knowledge of ASM/ATM may greatly help when conceptualizing and building more elaborate reports. The tool is object oriented and overall user friendly, therefore SQL expertise is only optional.","objectives":"Upon completion of this course, participants will: Understand the basics of OAS (concept, UI, Key components) Understand the CURA Subject area, its specific dimensions and measures (DIMs and FACTs) Be able to build queries and reports (save, edit and manage them) Be able to build and maintain interactive prompt driven dashboards","audience":"The course is indicated for staff who have key roles in FUA implementation or performance measurements of the management of airspace in their respective countries.","duration":"This course takes place over 2 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Alvaro RAMOS DEL RIO Content Manager S anisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1200 EUR.","delivered_by":"Dr Giuseppe ACAMPORA Content Manager Sandrine TASQUIN Course manager Catalin LEPADATU Tutor Alberto PERDONES DIAZ Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"CNS-EVOL":{"terminy":[{"s":"2026-11-23 10:00","e":"2026-11-26 13:00","dni":4,"dow":"Pon-Czw","lok":"Brussels"}],"course_id":"CNS-EVOL","title_full":"CNS Evolution in Europe [CNS-EVOL]","title_clean":"CNS Evolution in Europe","description":"This course provides a comprehensive overview of the planned evolution of the European Communication, Navigation and Surveillance (CNS) infrastructure. It focuses on the strategic framework for optimising and modernising Europe''s CNS infrastructure, the CNS Evolution Plan, which is key to realising the vision of the ATM Master Plan. This five-day course equips participants with the knowledge and tools to understand and address the challenges and opportunities associated with evolving CNS technologies and supporting regulatory and standardisation framework. Through a combination of expert presentations and practical exercises, participants will gain insights into the CNS Evolution Plan''s key components, including spectrum management, advancements in CNS domains, civil-military interoperability, and the EU regulatory and standardisation framework. Participants will benefit from diverse perspectives, including insights from the pilots, ANSP managers, and CNS domain experts, culminating in a hands-on exercise focusing on defining and implementing Minimum Operational Networks (MONs). The course offers a collaborative environment for networking and exchanging the best practices, fostering alignment with the European and global CNS modernisation initiatives. Key Topics Covered: Introduction to the CNS Evolution Plan and its strategic objectives. In-depth exploration of Communication, Navigation, and Surveillance domains. Spectrum management and frequency allocation challenges and solutions. Integration of civil and military CNS requirements. Avionics and operational perspectives from cockpit operations. Presentation of the European CNS MON concept and design criteria, and how to address local requirements in the development of national MONs. Practical approaches to CNS modernisation and optimisation","objectives":"Gain a comprehensive understanding of the CNS Evolution Plan, its strategic objectives, and its alignment with the European ATM Master Plan. Develop detailed insights into the latest developments, challenges, and future prospects across the Communication, Navigation, and Surveillance domains. Understand modern methodologies for Frequency and Spectrum management, Civil-Military Interoperability, and integration of new technologies. Engage in discussions and practical exercises to address key challenges such as modernisation of CNS systems and defining Minimum Operational Networks. Connect diverse perspectives from pilots, ANSP managers, regulators, and other stakeholders to drive CNS evolution.","audience":"This course is designed for civil and military staff from Air Navigation Service Providers (ANSPs), Aerodrome Operators, National Competent Authorities, such as National Supervisory Authorities (NSAs) and Civil Aviation Authorities (CAAs), involved in the regulatory oversight and compliance of CNS systems.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE Course manager LtCol Jorge PEREIRA Tutor Bogdan PETRICEL Tutor Dominique GUILLERM Tutor Petr JONAS Tutor Francisco HOYAS Tutor John MICALLEF Tutor Dusan UGRENOVIC Tutor Dr Aycan MUTLU Tutor André Gustavo Botelho Maia Tutor Tereza TOPKOVA Tutor Mr. Nicolas EERTMANS Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course will take place in EUROCONTROL HQ in Brussels and will last 4 days instead of 5 days due to a shorter schedule. Pre-requisites Participants should have a professional background in aviation, with experience in Communication, Navigation, and Surveillance (CNS) systems, Air Traffic Management, or related fields. Familiarity with EU regulatory framework, EUROCAE technical standards, European ATM Master Plan and ICAO Global Air Navigation Plan (GANP), is highly beneficial. While technical expertise is advantageous, the course is designed to accommodate participants with diverse levels of knowledge, making it suitable for both technical and managerial roles.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"COM-AMHS-OPS":{"terminy":[{"s":"2026-10-19 09:00","e":"2026-10-21 13:00","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"}],"course_id":"COM-AMHS-OPS","title_full":"ATS Message Handling System - Operational Aspects [COM-AMHS-OPS]","title_clean":"ATS Message Handling System - Operational Aspects","description":"This course provides an overview, suitable for operational staff, of the messaging techniques and applications used in ATM from an operational perspective. This course describes in detail AMHS operational topics and issues identified by ANSPs after years of operation of AMHS systems: • AMHS Addressing (CAAS and XF) and Registry. • AFTN/AMHS address conversion. • AMHS routing • Conversion performed by the MTCU between AMHS and AFTN objects (AFTN ACK messages, RN, SVC ADS UNKNOWN messages, SS messages, etc.) • Management of operational error cases, reacting properly to unusual AMHS traffic situations (NDR Handling). • Routing of extended services AMHS Messages (FTBP) . Recommended practices to handle SS ACK / RN messages. • Legal AMHS recording. • Legacy procedures. Practical experience from real AMHS operations is a highlight of this course. More advanced concepts and practical tutored group exercises are covered in the companion COM-AMHS classroom course.","objectives":"The main objective of the course is to improve knowledge of COM Centre Operators to execute common COM Centre functions and react properly to unusual AMHS traffic situations, such as emergency situation, system outage, etc. After completing the course, participants will have information and skills that will assist them in practical AMHS operation. Students will: • learn how to implement operational procedures for management of error cases in traffic flows; • share lessons learned and experience on operating AMHS systems.","audience":"COM center operators (AFTN/AMHS)","duration":"This course takes place over 3 days.","price":"The price for all course participant is 1110 EUR.","delivered_by":"Philippe SACRE Course manager Manuel Garcia Martin Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Pre-requisites Participants shall either: - have attended the general COM-AMHS course in physical or virtual form or - have a strong background in AMHS, sufficient to follow the course dedicated to operational aspects, being aware that no reminder will be made of basic AMHS principles.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"COM-AMHS-V":{"terminy":[{"s":"2026-10-19 12:00","e":"2026-10-23 18:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"COM-AMHS-V","title_full":"ATS Messaging [COM-AMHS-V]","title_clean":"ATS Messaging","description":"The ATS Message Handling System (AMHS) has been specified by ICAO as the new message handling standard to replace the current AFTN/CIDIN (Aeronautical Fixed Telecommunication Network/Common ICAO Data Interchange Network). This course provides an overview, suitable for technical, operational and managerial staff, of the messaging techniques and applications used in ATM. It addresses the current situation (AFTN/CIDIN), the near future (AMHS) and how to migrate to AMHS. The course provides a summary of the planned implementation of AMHS in Europe and worldwide, and its coexistence with the AFTN/CIDIN. The ATS Messaging Management Centre (AMC) and European Directory Services (EDS) are also presented. Relevant Single European Sky Community Specification and a discussion of the position of AMHS in recent strategic plans (SESAR, etc.) are also included. The planned transition to SWIM - System Wide Information Management - is also discussed with examples, putting everything in the global ICAO GANP and ASBU context. Initial concepts related to SWIM transition and AMHS coexistence are introduced, as well as the role of a potential SWIM-AMHS gateway. Practical experience from real AMHS operations is a highlight of this course.","objectives":"After completing the course, participants will have a good understanding of the \"big picture\" of the ATS Message Handling System and its management. In addition, participants will have information and skills that will assist them in practical AMHS deployment plans and will be informed on the future plans for a possible transition to the next step, System Wide Information Management (SWIM).","audience":"This course is designed for those who are or will be involved in the planning, procurement, installation, operation and/or use of the current and future aeronautical messaging systems, i.e. technical, operational, managerial and procurement staff. It may also be of interest to users and developers of systems making use of ATS messaging technologies, and to NSA staff involved in corresponding system approval.","duration":"This course takes place over 5 days. You will have 5 virtual sessions. You need to plan 25 hours to complete this course.","price":"The price for all course participant or individuals is 1480 EUR.","delivered_by":"Philippe SACRE Course manager Manuel Garcia Martin Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"The course takes place from 9 AM to 3 PM, for 5 days, including a one-hour lunch break. Pre-requisites A general background in data communications technology and its application to ATM will be useful. The IM-DE1 course would provide suitable background knowledge.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"COM-FCI":{"terminy":[{"s":"2026-10-26 10:00","e":"2026-10-30 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"COM-FCI","title_full":"Air/Ground Data Links, ATS-B2 and Future Communications Infrastructure [COM-FCI]","title_clean":"Air/Ground Data Links, ATS-B2 and Future Communications Infrastructure","description":"This course is dedicated to the Future Communications Infrastructure (FCI), which includes air/ground Data Link networks (ATN/OSI and ATN/IPS), existing and planned Data Link technologies such as VDL2, SATCOMS, LDACS, etc, as well as applications like CPDLC and ADS-C among others. Both technical and operational aspects for the various families of Data Link are covered in detail. The coexistence with the ACARS world is also explained, including Airline Operational Communications (AOC) and oceanic (FANS) and airport applications. Data Link is a rich and complex world, and is at the core of current and future operational concepts in Europe and the world. In Europe itself, the \"Data Link Services\" mandate from the European Commission (Commission Regulation (EC) 29/2009, amended by Regulation (EU) 2015/310) has been fully in force above FL285 since February 2020 for air and ground stakeholders. ATN Baseline 1 and the CPDLC application (controller-pilot data link communications) is thus used operationally in continental European airspace, and the course will address lessons learned and experience obtained from this implementation. In 2022, the course increases its focus on the next steps of Data Link implementation, i.e. ATS-S Baseline 2 and the ADS-C application (Automatic Dependent Surveillance - Contract), under the CP1 regulation (IR 116/2021) in support of initial and full 4D management concepts. Necessary additional air/ground Data Link technologies have been or are being developed in SESAR, including new satellite communications, AeroMACS and LDACS.They are covered in the course, as well as crucial radio spectrum aspects. The institutional and regulatory aspects will also be covered, as well as relevant strategy roadmaps at ICAO and European levels. A strong element of the course remains the sharing of lessons learned by experienced professionals from airlines, air navigation service providers, regulators and industry, who present the subject from their perspective throughout the course.","objectives":"On completion of the course, participants will have a better understanding of the complexities of the Data Link world, and be able to more efficiently support deployment in their respective environments. Data Link is a core enabler of any future ATM Concept of Operations, and this understanding will be a valuable skill. Now that ATN Baseline 1 has been deployed in Europe, participants will have a view of lessons learned and understand the next steps, including Baseline 2 (ATS-B2), as explained by specialists from industry, ANSPs and airlines.","audience":"This course has been designed for those undertaking work related to the implementation of Data Link services. This includes management, technical and operational staff from ANSPs, airlines, and regulatory agencies.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE Course manager Thierry SALEE Tutor Dan IVANESCU Tutor Bart VAN DEN EINDEN Tutor Francisco HOYAS Tutor Dr. Davide Tomassini Tutor Kacper WALCZAK Tutor Cyril OLLIER Tutor Anonymized Anonymized Tutor Corinne Lefebvre Tutor Miquel Alimbau Tutor LtCol Jorge PEREIRA Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is the successor of the COM-DLK course, which is removed from the portfolio","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"COM-VOIP":{"terminy":[{"s":"2026-09-21 10:00","e":"2026-09-25 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"COM-VOIP","title_full":"Implementing Voice over IP in Aeronautical Communications [COM-VOIP]","title_clean":"Implementing Voice over IP in Aeronautical Communications","description":"Ground-Ground and Air-Ground voice communications are a key component of ATM service provision. This course provides a detailed view of the principles of aeronautical telephony and radio networks. After a review of the analogue and digital signalling techniques used in aviation (MFC-R2 and ATS-QSIG), the course largely focuses on Voice over Internet Protocol (VoIP), and looks in detail at VoIP principles and its use in aeronautical communications for fixed and mobile voice communication. The standardisation work of EUROCAE WG 67 is reviewed in detail, and the question of integrating VoIP into the ATM network architecture is discussed. The benefits of using VoIP are highlighted, together with other aspects such as security and ICAO, EUROCONTROL and SESAR strategic plans and developments. An outlook on futuristic concepts addressed in SESAR, such as sectorless operations and digital air/ground voice, are also included. Demos are also included in the course with some hands-on experience for participants. Pre-requisites It is recommended that participants have a general background in telecommunications technology and its application to ATM.","objectives":"After completing the course, participants will have an understanding of ATM fixed voice communication systems in general and of current strategic developments. In addition, participants will have information and skills that will assist them in practical deployment plans.","audience":"This course is designed for technical staff working with voice communication systems and for managers involved in procurement decisions related to voice communication systems. It may also be of interest to NSA staff involved in corresponding system approval.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE Course manager Manuel Garcia Martin Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"DPS-DPC":{"terminy":[{"s":"2026-06-29 09:00","e":"2026-07-03 12:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-11-30 09:00","e":"2026-12-04 12:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"DPS-DPC","title_full":"Understanding the Data Processing Chain in ATM [DPS-DPC]","title_clean":"Understanding the Data Processing Chain in ATM","description":"This course provides a foundational understanding of the ATM Data Processing Chain (Flight Data Processing (FDP) and Surveillance Data Processing (SDP)) and an overview of its use in ATM operations. For FDP, the course describes the core functions associated with flight plan processing and the advanced functions offered by a state-of-the art flight data processing system. Topics include the processing of the initial flight plan (IFPL), coordination and transfer messages (e.g. OLDI), trajectory prediction, conflict detection and arrival management. An emphasis is made on the associated SES Implementing Rules and specifications. Illustrated examples are provided referring and connecting to the EUROCONTROL Maastricht Upper Area Centre main Flight Data Processing System (FDPS), and its operations. For SDP, besides classical surveillance, more recent techniques like Enhanced Mode S, ADS-B and Multilateration are covered. Detailed examples are provided referring to the EUROCONTROL Surveillance Services systems (SDDS, ARTAS, SASS-C). Finally, the course introduces the Interoperability/Conformity Assessment Regulation explaining how the different Implementing Rules have an impact on the ATM Data Processing Chain. Pre-requisites Participants should have knowledge of conventional ATC techniques and will need a high level of conversational English language proficiency. Before attending this course, participants must complete the GEN-ATM-INTRO e-learning course.","objectives":"After completing the course, participants will have an understanding of the principles used in flight data processing and have received an overview of their use in today's and tomorrow's ATM operations.","audience":"This course is designed for operational and technical staff with an interest in data processing within ATC systems.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Francois PIRIOU Tutor Kristof SCHIPPERS Tutor Pierre GUYADER Tutor Georgiana URSACHI Tutor Kacper WALCZAK Tutor Igor POLTORACKI Tutor ATM Training Expert Fabrice LABOR Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"ELPAC-ACR":{"terminy":[{"s":"2026-06-29 10:00","e":"2026-07-02 15:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"},{"s":"2026-09-15 10:00","e":"2026-09-18 15:00","dni":4,"dow":"Wt-Pt","lok":"Winterthur"},{"s":"2026-11-23 10:00","e":"2026-11-26 15:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"ELPAC-ACR","title_full":"ELPAC Accreditation Course [ELPAC-ACR]","title_clean":"ELPAC Accreditation Course","description":"ICAO and the European Commission have implemented English language requirements for air traffic controllers and flight crew licence holders. EUROCONTROL has designed an English language proficiency test (ELPAC – English Language Proficiency for Aeronautical Communication) to assess the English language proficiency of air traffic controllers and pilots in accordance with the ICAO Language Proficiency Requirements. More info about ELPAC is available here. EUROCONTROL provides a training and accreditation course for ELPAC test administrators and ELPAC paper 2 examiners. The course takes 4 days. Courses are held regularly throughout the year. Only participants from organisations that signed an ELPAC licence agreement with EUROCONTROL will be admitted to the courses. After successful completion of the course, EUROCONTROL will recommend the participant to be accredited in their respective role(s). Pre-requisites ELPAC test administrator: Background as operational expert (air traffic controller or pilot) or as an English language expert (ELE) is an advantage; English language ability should be a minimum IELTS level 6.0 or equivalent; Computer literacy (internet, MS Office). ELPAC paper 2 examiners: For the role of the operational expert (OPE) Operational air traffic controller or pilot with a current or expired licence; English language should be minimum ICAO level 5, (IELTS level 6.5 or equivalent for reference, no need for IELTS certificate). For the role of the English language expert (ELE) Educational background in English language teaching, language testing, applied linguistics or similar; Good command of English language (IELTS level 7.5 or equivalent for reference, no need for IELTS certificate) or native speakers of English.","objectives":"Because of the high stakes nature of the language proficiency test, it is very important to maintain standards of marking and examining. At the end of the course the participants will have to demonstrate good knowledge of the ELPAC examiner assessor sheets, good interlocutor and assessor skills and the ability to assess test takers against the ICAO Language Proficiency rating scale in the oral performance interview in paper 2 of the ELPAC test. Also, participants must be able to deliver a reliable, standardised and fair test in accordance with the ELPAC assessment guidelines.","audience":"Persons nominated by their organisations (ANSPs, CAAs, Air Operators, training organisations) to become ELPAC examiners, and/or test administrators.","duration":"This course takes place over 4 days.","price":"This course is sponosred for staff members of ELPAC users organisations.","delivered_by":"Pieke SATIJN Course manager Dr William AGIUS Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"ELPAC-REF":{"terminy":[{"s":"2026-09-25 09:00","e":"2026-09-25 15:00","dni":1,"dow":"Pt","lok":"Online"},{"s":"2026-10-19 09:00","e":"2026-10-19 15:00","dni":1,"dow":"Pon","lok":"Online"},{"s":"2026-11-27 09:00","e":"2026-11-27 15:00","dni":1,"dow":"Pt","lok":"Online"},{"s":"2026-12-14 09:00","e":"2026-12-14 15:00","dni":1,"dow":"Pon","lok":"Online"}],"course_id":"ELPAC-REF","title_full":"ELPAC Examiner Refresher Course [ELPAC-REF]","title_clean":"ELPAC Examiner Refresher Course","description":"This is a refresher course for ELPAC examiners who have completed the ELPAC examiner accreditation course [ELPAC-ACR]. ELPAC examiners shall complete ELPAC examiner refresher training at least every three year, unless the local competent authority issued other requirements. The courses provides an opportunity to share experience with ELPAC examiners from other organisations and to practise and maintain the required standards in administering the ELPAC test and grading ELPAC test takers. Prior experience with the EUROCONTROL ELPAC test is required before registering for this course. This course is only available for ELPAC examiners having completed the ELPAC-ACR course.","objectives":"Because of the high stakes nature of the language proficiency test it is important to maintain standards of examining. The objective of the ELPAC refresher course is to ensure ELPAC standards are being maintained and to train the accredited ELPAC examiners in administering the ELPAC test and grading ELPAC test takers.","audience":"Accredited ELPAC test examiners (OPE and ELE)","duration":"This course takes place over 1 days. You will have 1 virtual sessions. You need to plan 6 hours to complete this course.","price":"This course is free of charge for staff members of ELPAC user organisations. For all other course participants, the price is 200 EUR.","delivered_by":"Pieke SATIJN Course manager Andrea Howard Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"This ELPAC examiner refresher virtual course is an instructor led online course for ELPAC examiners to comply with the ELPAC examiner training guidelines.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"ENV-AWARE":{"terminy":[{"s":"2026-09-29 10:00","e":"2026-10-02 13:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"ENV-AWARE","title_full":"Towards an environment friendly future for aviation [ENV-AWARE]","title_clean":"Towards an environment friendly future for aviation","description":"Global demand for passenger travel is increasing. This growth needs managing sustainably and respond to society''s demands to address aviation''s environmental impact and contribution to climate change. To achieve this it is essential that minimising environmental impacts becomes normal business practice for all stakeholders involved. This course provides a unique multi-stakeholder overview of the environmental impact of the aviation sector. It addresses measures that all stakeholders can take to maintain the sector''s current operations whilst securing its future sustainable development. Outcomes will help you to: Identify the main environmental regulatory frameworks Understand environmental impact assessment Understand climate change in an aviation context Discuss operational responses Explain how Collaborative Environmental Management (CEM) fosters collaboration and communication between stakeholders. During the course, participants are given the opportunity to apply both their professional practice, and the knowledge and understanding acquired through a series of interactive sessions and practical exercises.","objectives":"After completing the course, participants will have gained a broad overview and understanding of the aviation sector’s environmental impact and measures it can take to reduce them. Specifically, they will be equipped with the tools to understand the role that ATM stakeholders can play to minimise its impacts, maintain current operations and enable the sustainable development of the aviation sector.","audience":"Developed in the first instance for aviation sector personnel recently tasked by their management with carrying out any type of environmental duties, this course may also be of interest to individuals, trade associations, regulators, business aviation, academia and other interested parties.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Maria POPESCU-BOBOC Course manager Francisco HOYAS Tutor Konstantinos PAPOUTSIS Tutor Alexander VANWELSENAERE Tutor Pascal HOP Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"This is the introductory course which deals with environmental aspects within the aviation sector.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"ENV-IMPACT-NOISE":{"terminy":[{"s":"2026-07-07 14:00","e":"2026-07-08 16:00","dni":2,"dow":"Wt-Śr","lok":"Online"}],"course_id":"ENV-IMPACT-NOISE","title_full":"Environmental NOISE impact assessments with IMPACT [ENV-IMPACT-NOISE]","title_clean":"Environmental NOISE impact assessments with IMPACT","description":"IMPACT is a secure web-based application developed and hosted by EUROCONTROL. It is designed to support the evaluation of the amount of fuel burnt, as well as the noise emitted, and the greenhouse gases, particulate matter and other air pollutants produced during flight operations. For this purpose, IMPACT includes an advanced aircraft-performance-based trajectory calculator using the most recent version of the ANP and BADA databases. IMPACT has been thoroughly reviewed and approved by the ICAO Committee on Aviation Environmental Protection (CAEP) as one of the models suitable for conducting CAEP assessments. IMPACT's noise calculation package is compliant with the latest edition (4th Edition) of ECAC-CEAC Doc 29, whilst retaining the possibility of computing noise contours in accordance with the calculation method described in the 3rd Edition of Doc 29.","objectives":"During the \"Environmental noise impact assessments with IMPACT\" training, participants will discover the various features and modelling capabilities of IMPACT for assessing noise emissions. The training will be mainly based on practical examples.","audience":"Staff with a basic understanding of environmental aspects, related to aviation, and who need to assess the environmental impact of noise emissions.","duration":"This course takes place over 2 days. You will have 2 virtual sessions. You need to plan 6 hours to complete this course.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 600 EUR.","delivered_by":"Maria POPESCU-BOBOC Course manager Laurent CAVADINI Tutor Teddy COURIOL Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"If you do not yet have an active IMPACT user account, please request one by contacting impact@eurocontrol.int once your registration for this course is confirmed. Temporary access details will be assigned and provided a few days before the course begins and will be revoked 7 days after the course concludes. Familiarising yourself with the tool beforehand is recommended to enhance your training experience.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"ENV-OAL":{"terminy":[{"s":"2026-10-12 10:00","e":"2026-10-12 13:00","dni":1,"dow":"Pon","lok":"Online"}],"course_id":"ENV-OAL","title_full":"Airport Local Air Quality with OpenALAQS [ENV-OAL]","title_clean":"Airport Local Air Quality with OpenALAQS","description":"OpenALAQS is a EUROCONTROL open-source tool designed to model and analyse emissions from aircraft operations and various airport sources. It is developed as a plugin for the open-source Geographic Information System QGIS, simplifying the definition of various airport emission sources (such as runways, taxiways, and buildings) and can be used to prepare emission inventories, visualize data, and perform dispersion modelling with the help of AUSTAL. OpenALAQS is compliant with the ICAO recommendations on Air Quality modelling (ICAO Doc. 9889). It has been thoroughly reviewed and approved by the ICAO Committee on Aviation Environmental Protection (CAEP) as one of the models suitable for conducting CAEP assessments.","objectives":"• Describe the core features of OpenALAQS for assessing airport emissions. • Explore the modelling capabilities of OpenALAQS. • Interpret results and understand their implications for air quality management at airports.","audience":"Staff with a basic understanding of environmental aspects, related to aviation, and who need to assess the environmental impact of airport emissions.","duration":"This course takes place over 1 days. You will have 1 virtual sessions. You need to plan 3 hours to complete this course.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 200 EUR.","delivered_by":"Maria POPESCU-BOBOC Course manager Stavros STROMATAS Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"FEAST-ADM-T":{"terminy":[{"s":"2026-10-26 13:00","e":"2026-10-27 16:00","dni":2,"dow":"Pon-Wt","lok":"Brussels"}],"course_id":"FEAST-ADM-T","title_full":"FEAST - Administrator training (including tests) [FEAST-ADM-T]","title_clean":"FEAST - Administrator training (including tests)","description":"This training course is open to newly appointed staff working for accredited FEAST user organisations. It offers a complete training on the FEAST Administrator role. The role of the FEAST Administrator is to assure quality in selection procedures, to prepare, organise and supervise testing sessions. The course offers a familiarization with all FEAST tests, including FEAST I (Core and Full), FEAST II (RADAR and MULTI-PASS) and FEAST III (FPQ). Furthermore, the training course covers best practice in the test administration of FEAST and offers a familiarisation and practical training on the software platform that hosts the FEAST tests and the database. Accreditation as a FEAST administrator is a prerequisite for the FEAST user role.","objectives":"Training for FEAST Administrator role.","audience":"This course is designated for and restricted to newly appointed staff from FEAST user organisations, who have been nominated by their FEAST focal point in their organisation. A booking confirmation of the FEAST Service team is required.","duration":"This course takes place over 2 days.","price":"This course is free of charge for licenced users.","delivered_by":"Marc DAMITZ Course manager Doris DEHN Tutor Nathalie BOSSIROY Tutor Tobias SCHÖNFELD Tutor Martina MANTELLI Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is workin estionnaire (FPQ).","audience":"Accredited FEAST users and psychologists from FEAST user organisations. A confirmation of the FEAST Service team is required.","duration":"This course takes place over 1 days.","price":"This course is free of charge for licenced users.","delivered_by":"Marc DAMITZ Course manager Doris DEHN Tutor Nathalie BOSSIROY Tutor Tobias SCHÖNFELD Tutor Martina MANTELLI Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"FEAST-USER":{"terminy":[{"s":"2026-10-28 09:00","e":"2026-10-28 14:30","dni":1,"dow":"Śr","lok":"Brussels"}],"course_id":"FEAST-USER","title_full":"FEAST User Training [FEAST-USER]","title_clean":"FEAST User Training","description":"The FEAST User course aims at decision-makers in the recruitment of ATCO trainees. The training will enable the participants to take recruitment decisions based on the FEAST test scores. To do so, the training will provide - detailed knowledge of the FEAST I (Classic and Plus) and FEAST II tests (abilities assessed and scoring method), - their underlying psychometric properties, and - the interpretation of the test scores. The course is suitable for staff newly appointed to a FEAST role as well as for accredited users who would like to follow a refresher course.","objectives":"After completing this course participants will have a detailed knowledge of the FEAST test system and be able to work with FEAST in their recruitment process.","audience":"This course is designated for FEAST users and newly appointed users. The course is restricted to staff from FEAST user organisations who have been nominated by their FEAST focal point in their organisation. A booking confirmation of the FEAST Service team is required.","duration":"This course takes place over 1 days.","price":"This course is free of charge for licenced users.","delivered_by":"Marc DAMITZ Course manager Doris DEHN Tutor Nathalie BOSSIROY Tutor Tobias SCHÖNFELD Tutor Martina MANTELLI Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Please note that the course will take place in : NEXUS classroom.
