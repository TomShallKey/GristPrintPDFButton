2021/665) and eConspicuity (per (EU) 2021/666). Interactions with national authorities and the European Union Aviation Safety Agency","objectives":"Participants joining this course aim to: Describe the EU U-space regulatory framework, specifically Commission Implementing Regulations (EU) 2021/664, 665, and 666, and how they enable the safe integration of drones into European airspace Identify the roles and responsibilities of key stakeholders such as U-space Service Providers (USSPs), Common Information Service Providers (CISPs), and UAS operators, NCAs & EASA including the operational differences between decentralized and centralized CIS model Identify certification requirements for both U-space and Common Information Service Providers. Explain mandatory and optional U-space services, including network identification, geo-awareness, traffic information, and flight authorization. Describe how U-space airspace is designated and managed, with attention to safety concepts such as Airspace Risk Assessment (ARA) and Dynamic Airspace Reconfiguration (DAR). Learn how U-space stakeholders interact with national authorities and EASA, ensuring compliance and effective coordination in U-space deployment Discuss interoperability with manned aviation (eConspicuity) & anticipate future developments for U-space","audience":"Personnel of National Competent Authorities (NCAs), U-space Service Providers (USSPs) and Common Information Service Providers (CISPs), Air Traffic Service (ATS) Providers / ANSPs, Manned Aviation Operators in U-space Airspace, UAS Operators and anybody who wishes to develop an understanding of EU U-space regulatory framework","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Dr Aycan MUTLU - Course manager\nCecilia CLARAMUNT PUCHOL - Tutor\nStephane VAUBOURG - Tutor\nNorberto VERA VELEZ - Tutor","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"The course is developed with partnership with EASA.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"NAV-DEM":{"terminy":[{"s":"2026-10-26 10:00","e":"2026-10-30 16:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"NAV-DEM","title_full":"Navigation Infrastructure Assessment using DEMETER [NAV-DEM]","title_clean":"Navigation Infrastructure Assessment using DEMETER","description":"This revised tools course is aimed at supporting navigation infrastructure planners, technical experts, procedure designers and flight inspectors by providing clear, concise, and hands-on training on how to maximise the benefits of using the DEMETER software. The course commences with a short overview of PBN and then focuses on the navigation infrastructure, which includes GNSS and its vulnerabilities, and the role of terrestrial aids in GNSS reversion. The navigation infrastructure assessment process is explained based on the EUROCONTROL Guidelines for RNAV 1 Infrastructure Assessment, Edition 2.0 (EUROCONTROL-GUID-114), including how this process interfaces with other actors required for PBN implementation. Following this theoretical training, the course goes on to explain how to use DEMETER for infrastructure assessment and optimization, using a series of hands-on exercises. These exercises include the set up and configuration of DEMETER (NAVAID and terrain databases), facility coverage, area RNAV performance and procedure-specific RNAV performance assessments. The various tools, including flight inspection data interfaces and the siting tool, will be demonstrated explained and put into practice in a combined final exercise. The expectation is that this training will support the State when terrestrial infrastructures assessments are required.","objectives":"This course aims to give an overview of the role of navigation infrastructure role in supporting PBN and hands-on experience in using the DEMETER software for infrastructure assessment and planning. Furthermore, the course aims to provide answers to any questions participants may have on navigation infrastructure planning and the use of DEMETER in support of this task. This DEMETER training will prepare participants to provide support to their State when terrestrial infrastructure optimisation is required in view of PBN implementation.","audience":"The DEMETER course is designed specifically for navigation infrastructure experts, flight inspectors, procedure designers and airspace designers. It aims to provide support to any expert who may be responsible for any aspect of the assessment and planning of navigation infrastructure to support PBN operations. The course is not recommended for anyone who does not work on terrestrial navigation aid assessment and planning or GNSS reversion planning.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Dusan UGRENOVIC Course manager Ihor SKYRDA Tutor Valeriu VITAN Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"NAV-GBAS-V":{"terminy":[{"s":"2026-11-16 09:00","e":"2026-11-20 13:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"NAV-GBAS-V","title_full":"Ground Based Augmentation System (GBAS) Implementation - Virtual Course [NAV-GBAS-V]","title_clean":"Ground Based Augmentation System (GBAS) Implementation - Virtual Course","description":"This Virtual GBAS implementation course aims to provide an overview of the technology and application of Ground Based Augmentation Systems for GNSS to airport, ATC and airline operations. Basic knowledge of the function of GNSS systems are of benefit to understand the course material. Day One will cover basic principles, architecture, services and the regulatory context, while the second day is dedicated to the air-ground interface and the ground subsystem functions. The third day is dedicated to installation, airport infrastructure integration, siting, and the roles and responsibilities in operations, while the fourth day covers airborne systems and operations, including ATM and procedure design aspects. On the last half day, data analysis, evaluation and monitoring, notably with the PEGASUS toolset, are introduced.","objectives":"By the end of this course, you will be able to: Describe how the aviation GNSS augmentations work Explain the architecture, services and European regulatory aspects of the GBAS system Describe GBAS ground and airborne system structure and function Understand the GBAS installation, siting, safeguarding and interfacing requirements Understand the GBAS operational aspects Understand the use of GBAS data evaluation and monitoring tools","audience":"ANSP staff planning GBAS implementation Regulator staff performing activities linked to GBAS ground system, avionics, aircraft and operational approval Airspace user staff implementing and performing GBAS approaches for their airline Industry wishing to produce GBAS components and systems or supporting ANSPs, regulators or airspace users Research personnel contributing to further development and standardization of GBAS","duration":"This course takes place over 5 days. You will have 5 virtual sessions. You need to plan 32 hours to complete this course.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Dusan UGRENOVIC Course manager Andreas LIPP Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"Training managers and focal points can contact us to get a quote to have this course delivered at their organisation. For individual requests only the equivalent classroom course is available. Pre-requisites As a minimum, all participants must have followed a course on the principles of GNSS. The NAV-GNSS course from our catalogue is an acceptable preparatory course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"NAV-GNSS":{"terminy":[{"s":"2026-09-28 10:00","e":"2026-10-02 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"NAV-GNSS","title_full":"Global Navigation Satellite System for Aviation [NAV-GNSS]","title_clean":"Global Navigation Satellite System for Aviation","description":"Will GNSS ever become the \"sole means\" navigation service? What does this mean? Can the current satellite systems be improved to achieve \"sole means\" and what are the enhancements required to make the system acceptable for civil aviation use? This 5 day GNSS course is designed to give a clear explanation of satellite constellations used for navigation, signal structures, system errors and a full explanation of the different types of augmentation that can be applied. The course will look at the current limitations of satellite systems, reviews GNSS vulnerabilities and discusses GNSS reversion. The course will also discuss future planned improvements to GPS and GLONASS before reviewing the European and Chinese constellations: GALILEO and BEIDOU. The course will provide insight to the different types of augmentation and review the progress of SBAS and GBAS. This course aims to provide participants with an in-depth view of GNSS, its principles and benefits for civil aviation.","objectives":"After completing the course, participants will have an in-depth understanding of GNSS, its principles and benefits for civil aviation.","audience":"This course is designed for anyone who wishes to obtain a broad understanding of GNSS, its principles and its limitations.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Dusan UGRENOVIC Course manager Mikaël MABILLEAU Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"NAV-PBN":{"terminy":[{"s":"2026-09-14 10:00","e":"2026-09-18 16:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-12-14 10:00","e":"2026-12-18 16:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"NAV-PBN","title_full":"Performance Based Navigation (PBN) for ECAC [NAV-PBN]","title_clean":"Performance Based Navigation (PBN) for ECAC","description":"The EUROCONTROL Performance Based Navigation course, reviews the PBN concept, which was initially released in 2008. The course discusses the evolution of the concept and explains the principles of PBN. The course then focuses on the three components of PBN: the Navigation Application, Navigation Specifications and the Navigation Infrastructure. Once these tenets are understood, the course considers how to implement PBN and follows the principles laid out in the European Airspace Concept Handbook for PBN Implementation Edition 4. This document provides step-by-step guidance to support a successful PBN airspace change. Specifically focused on the European area, the handbook provides States excellent guidance on implementation and this document builds upon ICAO Doc 9992. Finally, the European Commission has published the PBN Implementing Regulation (EU 2018/1048) as well as the Common Project One Implementing Regulation (EU 116/2021). The PBN IR defines the future development of navigation applications within European airspace over the next decade and drives through the ICAO General Assembly Resolution (37/11) on the requirement for approach procedures with vertical guidance (APV) for all instrument runway ends. The CP 1 IR in ATM Functionality (AF) #3 requires all contracting Member States to implement Free Routes Airspace (FRA) initially at or above FL305 and later providing direct connectivity to the Terminal Airspaces. Therefore, the course will review the requirements on PBN functionality to meet the PBN IR and will consider the navigation requirements to support the FRA as identified in CP 1.","objectives":"This course provides an introduction to the PBN concept and a high level understanding of the differing navigation infrastructure and aircraft functionalities supporting to the different navigation specifications. After completing the course, participants will: - Understand the meaning and principles associated with area navigation (RNAV) and the PBN concept; and - Explain the difference between RNAV and RNP specifications; and - State which navigation applications support the different phases of flight; and - State the minimum en-route and terminal requirements and timelines of the PBN IR; and - Describe PBN implementation processes; and - List the different stages of the PBN implementation processes.","audience":"This PBN course is primarily designed for anyone involved in the airspace or navigation domains. However, the course is suitable for anyone who wishes to obtain a good understanding of PBN and the implementation processes that must be followed to enable a State, or region, to introduce a specific navigation application supporting a defined airspace concept.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Dusan UGRENOVIC Course manager Kleber ARGUELLO Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course will be delivered over 5 days starting in September 2026.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"NAV-PBN-ACU":{"terminy":[{"s":"2026-09-22 10:00","e":"2026-09-25 12:00","dni":4,"dow":"Wt-Pt","lok":"Online"}],"course_id":"NAV-PBN-ACU","title_full":"PBN for Airspace Concept Upgrades [NAV-PBN-ACU]","title_clean":"PBN for Airspace Concept Upgrades","description":"The focus of this course is on what States and ANSPs must do in the coming 5 years (in line with the PBN Implementing Regulation) to implement PBN in their Terminal Areas. Now that the first milestone (December 2020) has passed and the second milestone (25 January 2024) is overdue, efforts must shift toward preparing for PBN IR Milestone No. 3 in 2030. The second milestone required Member States to implement RNAV 1 (or RNP 1 with RF) SID and STAR procedures for each Instrument Runway End (IRE) and establish RNP approaches (RNP APCHs) at all IREs, providing a backup to Precision Approaches where applicable. The third milestone requires RNAV 1 or RNP 1 (with RF) to be implemented for all SID and STAR procedures. To meet the 2030 targets, it is critical for the competent authorities within States to urgently finalize and approve a PBN Transition Plan. This plan, created by ATM/ANS providers in consultation with all relevant stakeholders, must now focus on ensuring the continued rollout of SIDs/STARs and RNP APCHs, paving the way for full PBN implementation by the 2030 deadline.","objectives":"The aim of this virtual course is to enhance PBN airspace design readiness by catching up with PBN IR Milestone No. 2 (January 2024) and preparing for Milestone No. 3 (June 2030).","audience":"Staff from CAA/NSA and ANSP who are involved in the implementation of PBN in their Terminal Areas","duration":"This course takes place over 4 days. You will have 4 virtual sessions. You need to plan 8 hours to complete this course.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 800 EUR.","delivered_by":"Dusan UGRENOVIC Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"NAV-PBN-ATC-BR":{"terminy":[{"s":"2026-07-06 10:00","e":"2026-07-06 14:00","dni":1,"dow":"Pon","lok":"Online"},{"s":"2026-07-07 10:00","e":"2026-07-07 14:00","dni":1,"dow":"Wt","lok":"Online"},{"s":"2026-07-08 10:00","e":"2026-07-08 14:00","dni":1,"dow":"Śr","lok":"Online"},{"s":"2026-08-25 10:00","e":"2026-08-25 14:00","dni":1,"dow":"Wt","lok":"Online"}],"course_id":"NAV-PBN-ATC-BR","title_full":"PBN Air Traffic Controller Briefing [NAV-PBN-ATC-BR]","title_clean":"PBN Air Traffic Controller Briefing","description":"This PBN training for Air Traffic Controllers (ATCOs) is designed as a concise and practical introduction to Performance-Based Navigation (PBN), with a strong focus on the operational perspective. The course aims to provide controllers with a clear and simplified understanding of how PBN affects their day-to-day operations, including key concepts, procedures, and implications for air traffic management. Emphasis is placed on what ATCOs need to know to safely and efficiently manage PBN operations in real environments. This training is intended as a high-level awareness course and complements more detailed or locally delivered PBN training required for national implementation. It does not include skills or competency assessment, nor does it involve formal examination. Pre-requisites Participants are strongly recommended to complete one of the NAV-PBN courses, such as NAV-PBN-AWR.","objectives":"Participants aim to gain a clear operational understanding of PBN and its impact on air traffic control, including how to manage PBN procedures in daily operations and enhance situational awareness.","audience":"The training is intended for Air Traffic Controllers (ATCOs) who will be involved in airspace where PBN procedures are being implemented.","duration":"This course takes place over 1 days. You will have 1 virtual sessions. You need to plan 4 hours to complete this course.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 400 EUR.","delivered_by":"Dusan UGRENOVIC Course manager Bert KLINKERS Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"NMO-FMP-2-C":{"terminy":[{"s":"2026-09-21 10:00","e":"2026-09-25 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-10-19 10:00","e":"2026-10-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-12-07 10:00","e":"2026-12-11 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"NMO-FMP-2-C","title_full":"FMP Module 2 [NMO-FMP-2-C]","title_clean":"FMP Module 2","description":"Network Operations serves the Aircraft Operators and Air Traffic Services. The vital link at local level in ATFCM operations is the Flow Management Position (FMP). The training of FMP personnel is essential for the success of ATFCM operations. This course is part of a modular training programme for FMP staff consisting of two classroom-based modules (one week each), supported by web based training modules, and now on request a refresher or tailor made module for suitably qualified staff (FMP4). This course is the first classroom-based module: FMP Module 2. Content: Theoretical classroom training in which the concepts and basics of ATFCM are explained, such as; - NM systems and main flows of data - Capacity and demand - Traffic volumes - Traffic counts (differences between entry & occupancy counts) - The different ATFCM solutions - Regulations - The slot pre-allocation and allocation processes - IR 255 and compliance monitoring - ATFCM phases - A-CDM and impact of the DPI messages in ETFMS & CIFLO - CIFLO operational procedures - All ATFCM messages The FMP courses consist of four Modules: - Module 1 contains the \"Fundamentals of ATFCM\" and \"Ops Room Tour\" web based training modules - Module 2 is a one-week theory course taking place either in Luxembourg or on site (UUP) - Module 3 is a one-week practical course taking place either in Luxembourg or on site (UPP) - Module 4 is a four-day regionally focused refresher or tailor made course which is organised on request only (UPP). Pre-requisites Participants have to have completed the FMP 1 course (Fundamentals of ATFCM). Additionally, for participants that are not that familiar with CHMI, the CIFLO - CHMI Interface for Flow [NMO-CIFLO-HELP] reference material is provided within the course.","objectives":"After completing the course, participants will have an understanding of the fundamental concepts of operation applied by Network Operations and of FMPs.","audience":"This course is only for Flow Management Position staff, Air Traffic Controllers, ATS unit managers and personnel who are directly (or are about to be) involved in the daily operation of Network Operations and the Flow Management Position concept.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from world-wide airspace users and participants from Member States? competent authorities and certified organisation. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe TOUCHARD Course manager Sijmen SMIDT Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide cat iation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This classroom course is a combination of the NMO-FPFM-1-C and NMO-FPFM-2-C course, which covers the theoretical and practical part of the flight planning and flow management ATFCM messages exchange. Pre-requisites NMO-FPL-INTRO, NMO-ATFCM-BASIC and NMO-ATFCM-MSG e-learning courses are recommended.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-CHG-AC-1":{"terminy":[{"s":"2026-06-29 10:00","e":"2026-07-03 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"},{"s":"2026-09-21 10:00","e":"2026-09-25 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"},{"s":"2026-11-23 10:00","e":"2026-11-27 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"},{"s":"2027-03-08 10:00","e":"2027-03-12 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"},{"s":"2027-06-07 10:00","e":"2027-06-11 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"},{"s":"2027-09-20 10:00","e":"2027-09-24 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"},{"s":"2027-11-29 10:00","e":"2027-12-03 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"}],"course_id":"SAF-CHG-AC-1","title_full":"Assessment of Changes to the Functional System Part 1 [SAF-CHG-AC-1]","title_clean":"Assessment of Changes to the Functional System Part 1","description":"The \"Assessment of Changes in the ATM/ANS Part 1\" course builds on the knowledge acquired in the \"Management & Oversight of Changes in ATM/ANS\" course (SAF-CHG-INTRO), the \"Change Management Process: First Steps\" course (SAF-CHG-FS) or the \"Overview of Regulation 2017/373\" course (LEX-373-INTRO). The course provides an overview of the steps to be undertaken during the assessment, from a safety perspective, of a change to the ATM/ANS functional system, covering both its safety assessment and its safety support assessment, if appropriate, as per Regulation 2017/373 and its AMC/GM. It combines \"theory\" and practical exercises, both based on real and topical examples of changes to the ATM/ANS functional system: - remote tower operations at an international, medium-sized airport (exercises) - Radio Direction Finder System (RDFS) at a busy ACC (illustration of the \"theory\") - Replacement of Voice Communication System (VCS) - Implementation of an Aerodrome Weather Observation System (AWOS) The course covers the following topics: safety assessment of changes to the ATM/ANS functional system safety support assessment of changes to the ATM/ANS functional system interactions between safety assessments and safety support assessments multi-actor changes and overarching argument","objectives":"After completing the course, participants should: have a detailed understanding of: the generic steps to be undertaken during the safety assessment and safety support assessment of a change to the ATM/ANS functional system the interactions between safety assessments and safety support assessments multi-actor changes and overaching argument the main changes between safety risk management (in accordance with ICAO Safety Management Manual, section 2.5) and safety (support) assessment as per Regulation 2017/373 and its AMC/GM be able to contribute to the safety assessment and/or safety support assessment of a change to the ATM/ANS functional system, as per Regulation 2017/373 and its AMC/GM.","audience":"This course is designed for personnel working for an ATM/ANS service provider who need a detailed and practical understanding of the steps to be undertaken during the safety assessment and/or safety support assessment of a change to the ATM/ANS functional system as per Regulation 2017/373 and its AMC/GM. Staff working for ATM/ANS service providers involved in assessment of changes to the ATM/ANS functional system (safety assessment and safety support assessment), as well as staff working for competent authorities involved in the review of changes to the functional system.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Francois PIRIOU Course manager Frederic ROOSELEER Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HungaroControl Headquarters, Budapest (HUNGARY) Display details Course Registration Request","important_note":"This course content has been checked by the ATM Department of EASA in January 2023 against the EU Regulation 2017/373 common requirements for providers of ATM/ANS services. EASA has evaluated that the content of the course material is in line and meets the intent of the rule. Pre-requisites Before attending this course, you must have completed: the SAF-CHG-BASIC e-learning course and the SAF-CHG-INTRO classroom course, OR the SAF-CHG-BASIC e-learning course and the LEX-373-INTRO classroom course. You may also submit to the course manager a request for exemption from the pre-requisite courses if you can show that you have experience in safety assessment and/or safety support assessment.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-CHG-INTRO":{"terminy":[{"s":"2026-09-07 10:00","e":"2026-09-11 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-12-14 10:00","e":"2026-12-18 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-03-08 10:00","e":"2027-03-12 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-05-31 10:00","e":"2027-06-04 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-09-06 10:00","e":"2027-09-10 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-12-13 10:00","e":"2027-12-17 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-CHG-INTRO","title_full":"Management and Oversight of Changes [SAF-CHG-INTRO]","title_clean":"Management and Oversight of Changes","description":"This course is the entry point for two training programmes: Management and assessment of changes - Reg 2017/373 [SAF-PRG-CHG-373] Oversight of changes as per Reg 2017/373 [LEX-PRG-CHG-373]. This course provides an overview, from the perspective of both ATM/ANS service providers and the competent ATM/ANS authorities of: The management of changes in ATM/ANS; The process of change assessment, from a safety perspective (including safety assessment and safety support assessment for changes to the ATM/ANS functional system); The process for the oversight of changes in ATM/ANS. The course also highlights the relationship between the management and assessment of changes, including both quality and safety management systems, and the project lifecycle and project-related activities. The course is consistent with Regulation No. 2017/373 and its relevant AMC/GM. It combines theoretical and practical exercises based on both ATS and non-ATS examples of changes. Pre-requisites The SAF-CHG-BASIC e-learning course must be successfully completed before this course can be followed. Completion of the LEX-RULE and LEX-REG e-learning courses is recommended.","objectives":"After completing the course, participants should be able to: Explain the generic steps required in a typical change management process; Explain the generic steps required in a typical safety (support) assessment process; Explain the relationship between change management processes and a quality and safety management system; Explain the relationship between safety (support) assessment processes, and both a quality/safety management system, and the project lifecycle and project-related activities; Explain the generic steps required in a typical process for the oversight of changes in ATM/ANS; Explain the main roles and responsibilities (as regards changes in ATM/ANS), of - and the interactions between- providers of ATM/ANS services and the competent ATM/ANS authorities.","audience":"This course is designed for personnel working in the field of ATM/ANS, either for a service provider or for a competent authority.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Michel DE REDE Content Manager Sandrine TASQUIN Course manager 5 5 Ratings 5 0 0 0 0 About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course Timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-CHG-MC-1":{"terminy":[{"s":"2027-04-19 13:00","e":"2027-04-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-CHG-MC-1","title_full":"Monitoring of Changes in ATM/ANS Part 1 [SAF-CHG-MC-1]","title_clean":"Monitoring of Changes in ATM/ANS Part 1","description":"The Monitoring of Changes in ATM/ANS Part 1 course builds on the knowledge provided by the Management and Oversight of Changes in ATM/ANS course [SAF-CHG-INTRO] or Management and Oversight of Changes: First Steps [SAF-CHG-FS]. The course covers all aspects of the safety monitoring of changes in operations. It addresses questions relating to: the maintenance/updating of safety cases and/or safety support cases; the follow-up of system behaviour/specifications and safety support requirements during operations for non-ATSPs; the follow-up of safety criteria (objectives) and safety requirements during operations for ATSPs; and the migration/move to a unit safety dashboard/case. The course is consistent with Regulation No. 2017/373 (laying down common requirements for service and the oversight in air traffic management/air navigation services and other air traffic management network functions) and its relevant Acceptable Means of Compliance (AMC) and Guidance Material (GM).","objectives":"After completing the course, participants will be able to contribute to the monitoring of changes in ATM/ANS, including the maintenance / update of safety (support) cases, in accordance with Regulation No. 2017/373 and its AMC and GM.","audience":"This course is designed for personnel working for an ATM/ANS service provider involved in the monitoring of changes in ATM/ANS, and in the maintenance / update of safety (support) cases.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Michel DE REDE Content Manager Sandrine TASQUIN Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is an equivalent to the \"Monitoring of Changes in ATM/ANS Part 1 [SAF-CHG-MC-1-V]\" virtual course. Please do not register if you already attended to the virtual course. Pre-requisites The SAF-CHG-INTRO or SAF-CHG-FS course must be successfully completed before this course can be followed. Participants should be aware of their internal change management and maintenance processes. This information is usually part of the quality/safety management system of their organisation. Completion of the SAF-CHG-AC-1 course would be helpful.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-CHG-SW-C":{"terminy":[{"s":"2026-11-23 13:30","e":"2026-11-27 12:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-CHG-SW-C","title_full":"ATM Software Safety Assessment [SAF-CHG-SW-C]","title_clean":"ATM Software Safety Assessment","description":"Today''''s ATM systems are heavily dependent on software for efficient operation. Given the paramount importance of safety in our industry, the supporting software plays a critical role. This course offers comprehensive guidance on managing software safety assurance activities for ATM systems and equipment. It covers Safety (Support) Assessment concepts as per Regulation 2017/373 and its associated AMC/GM, as well as software assurance concepts as per Regulation 2013/1768, relevant Detailed Specifications, and their AMC/GM. Central to the course are the industrial standards listed in the Software GM. The entire software lifecycle is addressed, including planning, identifying software requirements, allocating software assurance levels (SWALs), ensuring compliance with SWALs, and conducting audits and reviews.","objectives":"After completing the course, participants will be able to describe the software safety assurance process, its relationship with the overall risk assessment activity and its relationship with existing industry software standards (ED-109A and ED-153). In addition, participants will be able to: assist in the conduct of a software safety assessment, and; assist in the creation of a software safety case.","audience":"This course is designed for those involved in software development and/or maintenance, those involved in the assessment of software development processes, and manufacturers of ATM equipment. It may also be of interest to CA staff involved in the oversight of requirements related to software.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States'''' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Ing. Christian VISANI Content Manager Sandrine TASQUIN Course manager Jean-Michel DE REDE Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course uses ED Decision 2019-022-R as a reference. This course is equivalent to the \"ATM Software Safety Assessment [SAF-CHG-SW]\" virtual course. Pre-requisites The SAF-CHG-BASIC e-learning course must be successfully completed before this course is followed.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-INV":{"terminy":[{"s":"2026-09-14 09:00","e":"2026-09-18 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-09-28 09:00","e":"2026-10-02 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-INV","title_full":"ATM Occurrence Investigation and Analysis [SAF-INV]","title_clean":"ATM Occurrence Investigation and Analysis","description":"The course provides instruction on current best practices for systemic ATM safety investigation techniques, and the efficient use and synchronised interpretation of EUROCONTROL’s Systemic Occurrence Analysis Methodology (SOAM) guidelines. The course provides participants with necessary knowledge and a wide range of practical skills to assist with the investigation of ATM safety occurrences. The course is generic enough to be understandable and applicable for systemic safety investigation across the global ATM/ANS community: - whatever the institutional arrangements in place for the provision of ATM services; - whatever the size of the “regulated” service provider organisations; - whatever the cultural environment in which it is intended to be applied. Pre-requisites There is a small amount of preparatory work suggested for this course. Some pre-course reading will be emailed to you about a week before your course commences, and it would be helpful if you could read this prior attending. While there are no formal SAF-INV course pre-requisites, if you have not completed training on Safety Management Systems in ATM [e.g. SAF-SMS-O, SAF-SMS-A] you may find it useful to do so before attending this course. Additionally, some basic Human Factors knowledge could help participants'' understanding of the topics presented during the course. The SMS courses can be found under the Safety domain of our training catalogue.","objectives":"After completing the SAF-INV course, participants will appreciate the reasons for conducting systemic safety occurrence investigations (including incidents and accidents) and will be able to apply a range of practical safety investigation techniques. Participants will also be able to apply specific systemic investigation and analysis tools, including EUROCONTROL’s SOAM.","audience":"The course is designed for experienced ATM service provider personnel with sound operational knowledge, who have been or may be appointed as ATM occurrence investigators. As well, participants from other organisations such as national competent authorities (NCAs) and state safety investigation authorities (SIAs) are welcome to attend the course and have evaluated it as being very useful for their day-to-day operations.","duration":"This course takes place over 5 days.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1850 EUR.","delivered_by":"Claudiu BOJAN Course manager Brent Hayward Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-SAS-1":{"terminy":[{"s":"2026-10-06 09:00","e":"2026-10-08 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"SAF-SAS-1","title_full":"Safety Management Survey - Stage 1 [SAF-SAS-1]","title_clean":"Safety Management Survey - Stage 1","description":"ICAO Annex 19 (Safety Management Systems requirements), Regulation 2017/373, also known as Common Requirements, and the EUROCONTROL SMS requirements (ESSAR 3) identify Safety Survey as an important tool for monitoring the safety performance of ATS. This course, consistent with the requirements of these safety requirements (at global and regional level), provides an overview of safety assurance activities and the role of safety survey within an SMS. The course then looks at a typical safety survey process, the roles and responsibilities of the various actors and the techniques available to collect survey data. The 3-day safety survey course also provides the introductory module to a three-phase training for safety surveyors. Participants to the SAF-SAS course have the possibility of returning in order to present an actual survey and participate in the critical analysis of their activities. This phase of the training will require participants to conduct a safety survey at their own location at some point during the 3 to 4 month gap between the two classroom phases. Participants wishing to complete the full three-phase training should indicate this on the booking form. Confirmation will be requested closer to the date of the first phase of training.","objectives":"After completing the course, participants will be able to identify appropriate survey techniques for the analysis of the safety of service provision and the effectiveness of the SMS.","audience":"This course, and particularly when combined with the subsequent stages, is designed for personnel who are to assist the safety department with the planning and conducting of individual safety surveys within a structured safety survey regime. The 3-day introductory course on its own will also be of interest to personnel responsible for the safety oversight of safety survey activities and operational and technical staff requiring more information on the assurance of the on-going safety of service provision.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Claudiu BOJAN Course manager Cosmin-Mihai OGICA Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Participants enrolling for this 3-day safety survey course (SAF-SAS-1) also have the possibility of completing an actual survey (SAF-SAS-2) and returning for a subsequent 2 day training course to present their activities (SAF-SAS-3). Attendees wishing to participate to all 3 phases should indicate this on the booking form and will be required to confirm prior to attendance on the initial 3-day survey course. The course is consistent with the Common Requirements defined in regulation 2017/373, the global ICAO SMS requirements – Annex 19, and the EUROCONTROL SMS requirements – ESSAR 3.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-SAS-3":{"terminy":[{"s":"2027-01-26 10:00","e":"2027-01-27 16:00","dni":2,"dow":"Wt-Śr","lok":"Luxembourg"}],"course_id":"SAF-SAS-3","title_full":"Safety Management Survey - Stage 3 [SAF-SAS-3]","title_clean":"Safety Management Survey - Stage 3","description":"This is the third stage of the Safety Management Survey Training Programme. Participants must have completed the 3-day SAF-SAS-1 Safety Management Survey course and participated in at least one safety survey within their own organisation before attending this course, which represents the stage 2 of this course (SAF-SAS-2). During stage 3 (SAF-SAS-3), course participants review, analyse and discuss the surveys conducted during stage 2.","objectives":"By the end of stage 3 of the Safety Management Survey Training Programme, participants will be able to critically review and further improve their ability to conduct a safety survey.","audience":"The Safety Survey Stage 3 is restricted to participants who have completed the 3-day SAF-SAS-1 course and have participated in at least one safety survey within their own organisation (SAF-SAS-2).","duration":"This course takes place over 2 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Claudiu BOJAN Course manager Cosmin-Mihai OGICA Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is only scheduled when a sufficient number of participants has expressed interest in attending. If you are interested in joining this course, please use the button ''Show interest'' to let us know. Pre-requisites Participants must have completed stages 1 and 2 before attending this course.","more_information":"Course timetable","certificate_awarded":"Candidates passing the assessment(s) will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-SC":{"terminy":[{"s":"2026-11-02 13:00","e":"2026-11-06 16:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-06-14 13:00","e":"2027-06-18 16:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-10-18 13:00","e":"2027-10-22 16:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-SC","title_full":"Safety Case Fundamentals for ATM/ANS [SAF-SC]","title_clean":"Safety Case Fundamentals for ATM/ANS","description":"In the context of Regulation (EU) 2017/373 and its AMC and GM; this course aims at providing ANSP and NCA participants the knowledge on how to build a Safety (Support) Argument, structure the Safety (Support) Case, identify the relevant evidence and how the oversight could be performed.","objectives":"After completing the course, participants will be able to contribute to the building and development of Safety (Support) Cases in accordance with Regulation (EU) 2017/373 and its AMC and GM. It addresses questions relating to: The development of the safety (support) argument The building of the structure of the safety (support) case The understanding of the different elements of the arguments (criteria, justification, context, assumptions) The identification of the required direct and backing evidence The development of the Safety (Support) Case report The lifecycle of the Safety (Support) Case and the link to Unit Safety (Support) Case","audience":"Representatives of the ANSPs: staff involved in (Safety) Management who need to develop procedures and templates, staff in charge of managing changes to the functional system, project managers, staff in charge of the continuous demonstration that the service provided is in line with the safety criteria or the service specifications (as applicable) Representatives of the NCAs in charge of the oversight of changes to the functional system or the continuous oversight of operations.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Michel DE REDE Content Manager Sandrine TASQUIN Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-SMS-A":{"terminy":[{"s":"2026-10-27 09:00","e":"2026-10-29 16:00","dni":3,"dow":"Wt-Czw","lok":"Brussels"},{"s":"2026-12-08 09:00","e":"2026-12-10 16:00","dni":3,"dow":"Wt-Czw","lok":"Brussels"}],"course_id":"SAF-SMS-A","title_full":"Introduction to ATM Safety Management System [SAF-SMS-A]","title_clean":"Introduction to ATM Safety Management System","description":"This course is designed as an introduction to all aspects of safety management in ATM. It aims to present the SMS implementation within an ATSP. To reinforce the learning points and trigger interaction between participants a number of real life examples and best practices of SMS implementation will be given. The objective is to improve participants'' safety awareness and to help them understand their safety roles and responsibilities within their own organisation. The SAF-SMS-A (Awareness) course constitutes the foundation for all current courses within the SAF domain, particularly the Safety Manager course.","objectives":"This course is designed to give the attendees a basic understanding of the elements and functions involved in a compliant ICAO and EASA Safety Management System. Thus the objectives of the course are: Understand the need for the implementation of the Safety Management System; Describe the primary elements of the SMS; Explain and summarise the links between the various SMS elements; Enable participants to network and share information and materials with other attendees.","audience":"The course is open to all participants who have an interest in safety management or will be embarking on a career in safety management. Any person from the Air Navigation Service Providers, in particular Air Traffic Service Providers or Competent Authority will benefit from attending it.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Claudiu BOJAN Course manager Christian THIRIJ Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Present EU regulations mandate that all service providers must implement a Management System (MS) but Air Traffic Service Providers (ATSPs) will need to implement a Safety Management System (SMS) in addition to the Management System. The SMS tasks are normally spread over three levels: Corporate, Local and Safety Specialisation. The Safety Director/Safety Manager, who is responsible for the implementation, administration and overall operation of the SMS, is usually at the highest or corporate level. In large organisations these tasks are then cascaded down to local safety managers, sometimes referred to as Safety Coordinators or Safety Officers. These persons therefore perform tasks similar to the Safety Managers but on a reduced (local) scale. In smaller organisations often this level is not used since it leads only to duplication of work without any significant benefits. The final level of the SMS involves a number of persons performing tasks related to only one element/area of the SMS. Such persons are called experts/practitioners/specialists and usually perform the role of Occurrence Investigator, Safety Assessor, Safety Surveyor or a combination of these roles. It is recommended that before embarking on a career in SMS, whatever the level of activity, the employees receive basic knowledge of the whole SMS. Such knowledge ensures that they know the constituent elements of the SMS and understand the relationships and interaction of these elements. Thus, this knowledge will be a great asset in assisting them when later they come to apply and analyse their particular area of SMS specialisation.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SAF-WS-INTRO":{"terminy":[{"s":"2026-09-15 10:00","e":"2026-09-16 15:00","dni":2,"dow":"Wt-Śr","lok":"Brussels"}],"course_id":"SAF-WS-INTRO","title_full":"Weak Signals - Theoretical Foundations [SAF-WS-INTRO]","title_clean":"Weak Signals - Theoretical Foundations","description":"Only finding and counting human errors, failures or breakdowns is not an appropriate way to gain better insight of how today’s systems work and possibly fail. This transition calls for extending reactive management strategies based on hindsight towards proactive ones, able to create foresight and to anticipate future threats. A better understanding of the interactions and couplings among system components is necessary. Nonetheless, only little information is usually taken to analyse everyday scenarios that happen successfully. There are situations where the variability of daily performance exceeds a normal range and therefore becomes a strong signal, visible to everyone. On the other hand, processes are characterized by a large number of weak signals, which can be seen as seemingly random or disconnected pieces of information that at first appear to be background noise but can be recognized as part of a significant pattern by viewing them through a different frame or connecting it with other pieces of information. The course provides an overview of the fundamentals of systems theory and knowledge management for weak signals and introduces a practical method to unearth them in modern socio-technical systems, i.e., SECA (Structured Exploration of Complex Adaptations). While this course [SAF-WS-INTRO] offers an introduction to the theory of weak signals and can be taken on its own, it is designed as a precursor to Weak Signals in High-Risk Industries: Practical Application [SAF-WS-APPL], which builds on the topics covered here with deeper, hands-on implementation cases and examples. The get a full picture of the Weak Signals concept and the associated methodology, both courses are recommended.","objectives":"After completing the course, participants will: gain knowledge on systems thinking, resilience engineering, and weak signals management have an introduction to the implementation of the SECA method be able to perform interviews following SECA guidelines to collect valuable data on otherwise silent everyday work","audience":"The course is designed primarily for ATM and aviation stakeholders; however it could be beneficial for other safety-critical industries (railway, maritime, nuclear plants, offshore, healthcare). The course is highly recommended for practitioners working in safety, human factors and ergonomics, project and change management, as well as for front-line operators (pilots, ATCOs, ATSEPs/engineers, AIS/MET, etc.).","duration":"This course takes place over 2 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Adriana-Dana SCHMITZ - Content Manager\nClaudiu BOJAN - Course manager\nDr. Riccardo PATRIARCA - Tutor","location_text":"HQ - Headquarters, Brussels (Belgium) Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SEC-CYBER":{"terminy":[{"s":"2026-11-03 10:00","e":"2026-11-06 12:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-01-19 10:00","e":"2027-01-22 12:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-03-02 10:00","e":"2027-03-05 12:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-11-09 10:00","e":"2027-11-12 12:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"SEC-CYBER","title_full":"Cyber security in ATM - Main threats and solutions [SEC-CYBER]","title_clean":"Cyber security in ATM - Main threats and solutions","description":"This is an awareness course for all ATM staff who deal with information systems for ATM, including CNS systems and operational data. It starts with an introduction on ATM security principles, regulatory aspects and the security risk assessment methodology. This 1-day introduction is followed by presentations about information security, incident management - including how it is implemented in EATM and an example ANSP - and a few case studies. The rapid development of Information Systems technology is obviously increasing cyber risks. Threats to ATM systems accessible via data communications networks are becoming prevalent and sophisticated. Vulnerabilities inherent in almost all computer operating systems, many support services and, network and CNS applications can be exploited in a variety of ways. On the other hand, civil aviation organisations rely on the interconnection of electronic communications networks even for critical parts of their operations, including safety-critical functions (e.g. surveillance data exchange, flight plan processing, etc). The protection of information systems from malicious attacks and the means of dealing with the consequences of such attacks are encompassed by cyber security. Security events and security incidents could be the result of accidental or deliberate acts of staff or malicious attacks by an external attacker. They may also arise from weaknesses in hardware, software, configurations or processes. This course describes the Cyber threats to ATM, the vulnerabilities to be mitigated and the methods for managing incidents. Pre-requisites It is recommended to have attended the SEC-RA course, in order to understand the steps to be conducted during a Security risk assessment.","objectives":"At the end of the course the student will be able: - to describe the scope of ATM cyber security - to state the different cyber threats in ATM - to state the vulnerabilities to be mitigated - to explain how Cyber security incidents can be managed","audience":"- all ATM staff who deal with information systems for ATM, including CNS systems and operational data - ATM staff dealing with security, more specifically cyber security - Project leaders of cyber-related projects, i.e. CNS and IM - System managers of ATM systems.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480EUR.","delivered_by":"Kristof LAMONT Content Manager Sandrine TASQUIN Course manager Szymon LOZA Tutor Aleksandar MOMIROSKI Tutor Tim STELKENS-KOBSCH Tutor Patrick MANA Tutor Timo BLUNCK Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your tr
