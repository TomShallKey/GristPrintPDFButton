full":"Managing security in ATM [SEC-RA]","title_clean":"Managing security in ATM","description":"ATM security is concerned with those threats that are aimed at (primary scope) the ATM system directly, such as attacks on ATM assets, and (secondary scope) where ATM plays a key role in the prevention or response to threats to other parts of the aviation system (or national and international assets of high value) and limiting their effects on the overall ATM network. ATM security measures, as part of aviation security, are designed to safeguard civil aviation against acts of unlawful interference and are therefore becoming ever more important in the ATM industry. This course provides participants with a systematic approach to managing ATM security risks. It teaches the participants how to conduct a security Risk Assessment (RA) and how to deal with the result of this RA, i.e. putting in place security controls. As an important introduction to ATM security risk management, the course sets out some fundamentals regarding scope, regulatory framework and security management systems.","objectives":"This course provides ATM personnel with the knowledge, skills and attitudes required to integrate a security culture into their daily tasks. Having successfully completed the course, the participants will be able to: identify ATM security assets; identify risks; select control options;","audience":"All ATM personnel (e.g. project managers, systems engineers, operational personnel, regulatory personnel, etc.) with little or no expertise in ATM security.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Timo BLUNCK Content Manager Sandrine TASQUIN Course manager Kristof LAMONT Tutor Tim STELKENS-KOBSCH Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Pre-requisites A basic understanding of an ATM system and ATM operations is required.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-ADS-B-MLAT":{"terminy":[{"s":"2026-11-24 13:00","e":"2026-11-26 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"SUR-ADS-B-MLAT","title_full":"Implementation of Automatic Dependent Surveillance - Broadcast/Multilateration [SUR-ADS-B-MLAT]","title_clean":"Implementation of Automatic Dependent Surveillance - Broadcast/Multilateration","description":"The introduction of ADS-B and Multilateration in the surveillance infrastructure provides important features which can be exploited by the ATM Network, from full network-wide surveillance coverage to high performance, more efficient flight profiles and increased safety. The course gives example of ADS-B and Multilateration implementation from a technical, operational and financial point of view in wide area and at airport level. The course also give the latest information about Space-based ADS-B and provides overview on the monitoring tools deployed. This 3 days SUR ADS-B/MLAT course focuses on all of these aspects. It includes training from technical personnel directly involved in their local implementation, a business case study and also includes a session on the integration of those surveillance data in our current surveillance environment and on the security aspects.","objectives":"After completing the course, participants will have an understanding of the operational and technical aspects of ADS-B and multilateration, and a deeper knowledge of multilateration implementation (WAM and LAM).","audience":"This course is designed for operational, technical, managerial ATM staff interested in the automatic dependent surveillance-broadcast and multilateration techniques, especially with a view to implementation in their own environment. It also addresses issues to be considered by NSA staff involved in current or future ADS-B or multilateration system approval.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Dusan UGRENOVIC Course manager Angel JARAMA Speaker Anonymized Anonymized Speaker André Gustavo Botelho Maia Speaker Petr JONAS Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is focusing on the implementation of ADS-B and Multilateration.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-ARTAS-TRK":{"terminy":[{"s":"2026-10-20 10:00","e":"2026-10-23 16:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"SUR-ARTAS-TRK","title_full":"Understanding the ARTAS Tracker in depth algorithms [SUR-ARTAS-TRK]","title_clean":"Understanding the ARTAS Tracker in depth algorithms","description":"ARTAS (ATM Surveillance Tracker and Server) is the European state-of-the-art SDPS (surveillance data processing system). ARTAS is operational in an increasing number of European states and is being implemented in a number of other states for pre-operational evaluation. The latest version of ARTAS supports all modern surveillance techniques, such as Mode S, ADS-B and wide-area multilateration (WAM). This course, designed for ARTAS engineers, aims at an in-depth understanding of the ARTAS tracker. Simulations and exercises are used to demonstrate the theoretical parts of the course. The hands-on exercises are performed on a MATHLAB based modelisation of the ARTAS tracking algorithms. The resulting simulator software is used instead of the whole ARTAS system, for efficiency reasons and for easing the learning process. Pre-requisites We recommend that the SUR-ARTAS-TRK course participants shall have attended the SUR-ARTAS course or shall have equivalent experience. Additionally the participants shall preferably have reasonable mathematical knowledge in the fields of probabilities and tracking.","objectives":"After completing the course, participants will be able to describe the main algorithms of the ARTAS tracker. In addition they will have the elements for starting ARTAS tracker tuning activities, aiming at optimising tracking quality.","audience":"This course is designed for engineers who envisage an in-depth understanding of the ARTAS tracker algorithms. Tuning the tracker through its parameters is typically part of his/her job.","duration":"This course takes place over 4 days.","price":"The price per course participant from all organisations or individuals is 1480 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Dr. Hans van Hintum Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-ARTAS-TUN":{"terminy":[{"s":"2026-12-07 10:00","e":"2026-12-11 15:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SUR-ARTAS-TUN","title_full":"ARTAS Tuning Course [SUR-ARTAS-TUN]","title_clean":"ARTAS Tuning Course","description":"ARTAS (ATM Surveillance Tracker and Server) is the European state-of-the-art SDPS (surveillance data processing system). ARTAS is operational in an increasing number of European states and is being implemented in a number of other states for pre-operational evaluation. The latest version of ARTAS supports all modern surveillance techniques, such as Mode S, ADS-B & C and wide-area multilateration (WAM). The scope of the course is the following: - Tuning those functions in ARTAS that focus on surveillance performance and surveillance information dissemination - Installation procedures are not included (installed basic ARTAS system is expected) - Setting up communication with (other) external systems are not included (normal users, adjacent units, snmp clients) - SMS (Airport Surveillance) is not (yet) included in this course Pre-requisites Participants are recommended to have attended the SUR-ARTAS and SUR-ARTAS-TRK courses, before attending the SUR-ARTAS-TUN course.","objectives":"Through hands-on sessions, the participants shall learn how to perform the Basic Tuning (ref. ARTAS Tuning Guide (ATG)) of a default ARTAS installation in a target environment, and to acquire knowledge to progress from Basic to Fine Tuning (ref. ATG).","audience":"This course is primarily designed for engineers who require in-depth understanding of the ARTAS tracker algorithms and whose job typically includes ensuring optimum tracker quality. Participants would preferably have the following profile: BACKGROUND - Basic knowledge of the ARTAS system, its documentation - Read the ARTAS Tuning Guidelines document. - Attended the ARTAS-LAMOS Course - Attended the ARTAS-TRK Course COMPETENCIES - Experience with the domain of Surveillance data processing techniques and sensor technologies, including Radar (PSR, SSR, SMR and Mode-S), ADS-B/-C and MLAT/WAM. - Experience with Surveillance tools to record, replay and analyse sensor and track data (e.g. JDiff, SDL, RESURF, AVTool, AOC) - Experience with sensor and tracking performance evaluation tool (e.g. SASS-C) - Experience with CRAFT, - Experience with ARTAS accelerated mode is an advantage","duration":"This course takes place over 5 days.","price":"The price per course participant from all organisations or individuals is 1850 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Dr. Hans van Hintum Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-EMIT":{"terminy":[{"s":"2026-11-03 09:00","e":"2026-11-05 15:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"SUR-EMIT","title_full":"European Monitoring of Interrogators and Transponders [SUR-EMIT]","title_clean":"European Monitoring of Interrogators and Transponders","description":"This European Monitoring of Interrogators and Transponders (EMIT) training is conducted in form of a workshop. It aims at understanding of the 1030/1090 MHz monitoring service and introducing basic use cases of the EMIT web-based tool. During the first part, details of the 1030/1090 MHz monitoring system will be presented, explaining how the system collects and interprets data, what data are available to users and what are the limitations of the system. During the second and third part, attendees will work with the EMIT tool on different generic use cases and/or on their own use cases with the support of the course mentors. While the main focus of the workshop is the EMIT web-based tool, interpretation and usage of 1030/1090 MHz flight monitoring data will also be reinforced and additional offline tools will also be presented. A spectrum browser tool to visualize raw RF recordings, Python toolset to decode Mode S messages, Excel-based analyses of exported data.","objectives":"The learning objectives shall allow to: gain a good understanding of all the functionalities of EMIT and how can they be combined together to maximize the gain of information for the purpose of evaluation and investigation be able to utilize additional analysis of extracted data (using also other tools, such as Excel, Python etc.) understand patterns detectable in the data and use them for the purpose of investigation and root cause detection","audience":"Surveillance specialists CNS inspectors 1030/1090 MHz focal points Telecom regulators","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Petr JONAS Content Manager Dusan UGRENOVIC Course manager Sara FILIPOVA Speaker About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"The course participants are expected to bring their own laptops on which they will access the EMIT web interface. Pre-requisites The course participant shall: be a user of EMIT watch the EMIT video tutorial have understanding of technologies utilising 1030/1090 MHz","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-INTRO":{"terminy":[{"s":"2026-10-26 13:00","e":"2026-10-30 13:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SUR-INTRO","title_full":"Introduction to ATM Surveillance [SUR-INTRO]","title_clean":"Introduction to ATM Surveillance","description":"This course provides a broad definition of ATM surveillance within the ECAC area. A wide variety of aspects are covered, including the mission, the technical backbone, the organisation, regulation, and management of ATM SUR. On the technical side, the course examines the benefits and limitations of the various SUR ground sensor technologies and the reciprocal onboard equipment. It provides information on primary, secondary and Mode S radars, as well as ADS-B and multi-lateration systems, and the related transponder equipment. In addition, the course covers the SUR data processing chain and its different applications. With regard to SUR stakeholders, this training course examines the topic of civil/military cooperation and related safety and cyber security situations. In addition, the course investigates recent regulatory developments relating to the ATM/ANS equipment conformity framework. Finally, the course provides an overview of EUROCONTROL''s role and the different initiatives in place for optimising the EUROPEAN ATM SUR network.","objectives":"After completing the course, participants will be able to: Understand the main SUR sensor technologies, their principle, benefits, and limitations, understand the reciprocal necessary on-board equipment and their current challenges, understand the basics of the SUR data processing chain and its applications, from the sensor to the controller screen, understand the civil-military cooperation and the safety and security challenges, understand the regulatory and organisational aspects of the ATM SUR network in ECAC.","audience":"This course is designed for a wide audience (specially newcomers), including managers, engineers, technicians, controllers, or staff involved in regulatory aspects. The candidate might start working in the SUR domain or might want to refresh his expertise. It is not aimed at experts seeking advanced or in-depth technical training.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Cyrille FAQUET Tutor Angel JARAMA Tutor Miroslav SPÁK Tutor Javier CEBALLOS GUTIERREZ Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course serves as an introduction to all the aspects related to the Surveillance chain. For that it covers and extend material included in: the Surveillance Data Processing section of the DPS-DPC training, the ADS-B and WAM section of the SUR-ADS-B-MLAT training, the surveillance overview section of the GEN-ICNSS training, the spectrum section of the SUR-EMIT training. It further provides sections on avionics, spectrum, performance-based surveillance, surveillance applications, civil-military cooperation, safety and security, the regulation framework and the surveillance network management and organisation.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-RAD-ADV":{"terminy":[{"s":"2026-11-02 10:00","e":"2026-11-05 16:30","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"SUR-RAD-ADV","title_full":"Advanced Radar Technology [SUR-RAD-ADV]","title_clean":"Advanced Radar Technology","description":"Radar is still the widespread technique for independent Surveillance, with an important contribution to safety and the overall performance of the Network. This course goes into the details of primary and secondary radar, including Mode S. At the end of the course the student will have an in-depth understanding of what happens from detection to output: antenna, receiver/transmitter, signal processing and plot processing/extraction. The course consists of 3 days theoretical lectures and a 1-day practical session.","objectives":"At the end of the course students will be able to: - Explain the complete radar chain - Describe the main blocks in the radar chain (Antenna, TX/RX, Signal and plot processing) - Explain radar limitations - Explain how radar measurements and analysis can be made - Explain the context in which radar operates (regulation, safety, performance)","audience":"Surveillance engineers with a Surveillance understanding that corresponds with the objectives of the SUR-INTRO or DPS-DPC course","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Anonymized Anonymized Speaker Anonymized Anonymized Speaker DOMIEN DE RUYCK Speaker Malcolm Maclean Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Be sure you can stay until at least 16.00h on the last day, otherwise you miss an interesting practical session. Pre-requisites Basic radar knowledge, corresponding to the radar sections of the SUR-INTRO or DPS-DPC course, is required.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-SASSC-CFG":{"terminy":[{"s":"2026-11-18 10:00","e":"2026-11-20 14:30","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"}],"course_id":"SUR-SASSC-CFG","title_full":"Advanced configuration of the SASS-C VERIFication system [SUR-SASSC-CFG]","title_clean":"Advanced configuration of the SASS-C VERIFication system","description":"This course is designed for already experienced VERIFication users who want to deepen their system expertise by e.g. exploiting the high level of configurability of DISPlay, adapting existing or creating new configurations for REPORT, and also being able to define extra data processing before or after a VERIFication “action”. This course is based on the latest versions of the VERIFication. The course is intended to transfer the knowledge on The SASS-C DataBase structure and its use The DISPlay configurability (Scatter View, Histogram View, Mosaics, Chains, Filters, …) The REPORT configurability The programming of “pre/post action” programs The practical exercises make up to 50% of the training and are based on a standard dataset. EUROCONTROL provides working positions with prepared computers for every student.","objectives":"After completing the course, participants will be able to: create any kind of configuration in DISPlay, create any kind of REPORT configuration, program “pre/post action” programs.","audience":"This course is designed for engineers and technicians involved in surveillance sensor and tracker evaluation willing to go deeper in functionality configurations and extra programming. It may also be of interest to managers and operational staff involved in surveillance system evaluation and incident investigation.","duration":"This course takes place over 3 days.","price":"The price per course participant from all organisations or individuals is 1110 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Natalja SIGNEJEVA Tutor Jean-Remi Dunand Tutor Matthieu SANCHEZ Tutor Ms Jekaterina TROFIMOVA Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"The course participants can also book the \"Tracker performance analysis course [SUR-SASSC-TRK]\" course which takes place in the first part of the same week. Pre-requisites The participant must have attended the “Fundamentals of the SASS-C VERIFication system [SUR-SASSC-INTRO]” course or guarantee the knowledge and experience on the related matter. A strong knowledge of the different ATM surveillance techniques (e.g. RADAR, multilateration, ADS-B, tracker) is critical to follow and understand this course. Finally, for the REPORT configuration, and the DISPlay record attribute configuration, the participants must have a good understanding and experience of the SQL language and PL/SQL programming language.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-SASSC-INTRO":{"terminy":[{"s":"2026-09-14 10:00","e":"2026-09-18 15:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SUR-SASSC-INTRO","title_full":"Fundamentals of the SASS-C VERIFication system [SUR-SASSC-INTRO]","title_clean":"Fundamentals of the SASS-C VERIFication system","description":"This course establishes the foundation knowledge essential for unlocking the full potential of subsequent courses from the SASS-C series. Designed as a prerequisite, this course introduces participants to the latest iteration of the VERIFication system, laying the groundwork for the development of comprehensive knowledge and fundamental skills. Throughout this course, participants will gain knowledge and first hand experience in how to: define the surveillance infrastructure elements in VERIFication acquire surveillance data in the VERIFication module database, verify the inventory level using the DISPlay module, configure and run the core part of VERIFication called OTR (Object Trajectory Reconstruction) and verify its output, filter data programme the RQM (suRveillance Quality Monitoring) function; participants will also be given a concise introduction to the SCDB (SASS-C DataBase), providing crucial insights into data inventory and organisation. Practical exercises constitute up to 50% of the training, empowering participants with hands-on experience using a standard dataset. Each participant will benefits from a dedicated workstation, ensuring optimal learning conditions. Surveillance sensors performance evaluation is performed in subsequent courses of the SASSC training portfolio. Pre-requisites Strong knowledge of different ATM surveillance techniques (e.g. RADAR, multilateration, ADS-B, tracker) is critical in order to be able to follow and understand the training.","objectives":"After completing the course, participants will be able to: manage VERIFication processes and configuration, configure/run a data acquisition, check the report output and data investigation/analysis using DISPlay, configure/run a reference reconstruction, check the report output and investigate/analyse the data using DISPlay, use the filtering capability, manage backup and data cleaning, programme RQM.","audience":"This course is designed for engineers and technicians involved in surveillance sensors and tracker evaluation. It may also be of interest to managers and operational staff involved in surveillance system evaluation and incident investigation.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Natalja SIGNEJEVA Tutor Jean-Remi Dunand Tutor Matthieu SANCHEZ Tutor Ms Jekaterina TROFIMOVA Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-SASSC-SENSOR":{"terminy":[{"s":"2026-09-28 10:00","e":"2026-10-02 13:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-12-14 10:00","e":"2026-12-18 13:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SUR-SASSC-SENSOR","title_full":"RADAR, MLAT and ADS-B performance analysis with VERIF and PREDICT [SUR-SASSC-SENSOR]","title_clean":"RADAR, MLAT and ADS-B performance analysis with VERIF and PREDICT","description":"The course is designed for RADAR, MLAT and ADS-B systems performance analysis, using the last versions of the PREDICTion and VERIFication modules. The course explains how to run performance assessments against existing surveillance standards, including ED-142 and ED-129. For RADAR systems, a partial assessment is performed (Detection Analysis and Gap Analysis) as part of the reconstruction. The remaining part is covered in the so-called CMP-SPA (Comparator-Sensor Performance Assessment). For MLAT and ADS-B (ED-142 and ED-129), an assessment is carried out through the CMP-SPA (Comparator-Sensor Performance Assessment) but also through the unofficially named, CMP-ECA2 (Comparator – ESASSP Ed2 Conformity Assessment). The following topics are covered: detection analysis & gap analysis, false plots analysis, resolution analysis (for RADAR), accuracy analysis, SSR code analysis, Mode-S analysis (for RADAR). Since DA/GA are based on theoretical visibility volume, PREDICTion will also cover screening file calculations. Practical exercises constitute up to 50% of the training and are based on a standard dataset. EUROCONTROL provides individual working positions with prepared computers for all participants.","objectives":"After completing the course, participants will be able to: configure and run PREDICTion for RADAR, MLAT and ADS-B coverage assessment, as well as for MLAT accuracy assessment, import generated screenings into VERIFication, configure/run CMP-SPA for RADAR, MLAT and ADS-B performance assessment, check the report output and investigate/analyse the data using DISPlay. configure/run CMP-ECA2 for MLAT/ADS-B assessment, check the report output and investigate/analyse the data using DISPlay.","audience":"This course is designed for engineers and technicians involved in surveillance sensor evaluation with a special interest in RADAR, ADS-B and MLAT systems performance analysis. It may also be of interest to managers and operational staff involved in surveillance system evaluation and incident investigation.","duration":"This course takes place over 5 days.","price":"The price per course participant is 1850 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Natalja SIGNEJEVA Tutor Jean-Remi Dunand Tutor Matthieu SANCHEZ Tutor Ms Jekaterina TROFIMOVA Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"The participant must have attended the “Fundamentals of the SASS-C VERIFication system [SUR-SASSC-INTRO]” course or guarantee knowledge and experience on the related matter. A strong knowledge of RADAR, ADS-B and MLAT systems is critical to follow and understand this course. This is essential for ensuring a smooth training run for everyone. Pre-requisites The participant must have attended the “Fundamentals of the SASS-C VERIFication system [SUR-SASSC-INTRO]” course or must have proven knowledge and experience on the related area. Strong knowledge of RADAR, ADS-B and MLAT systems is critical to be able to follow and understand this course, ensuring a smooth training run for everyone.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-SASSC-TRK":{"terminy":[{"s":"2026-11-16 10:00","e":"2026-11-17 16:30","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"SUR-SASSC-TRK","title_full":"Tracker performance analysis [SUR-SASSC-TRK]","title_clean":"Tracker performance analysis","description":"This course is designed for tracker performance analysis using VERIFication. This course is based on the latest versions of the VERIFication. The course is intended to transfer knowledge on how to run performance assessments of a tracker in line with the current surveillance standards for (“Blue Book” for raw technical aspects, and ESASSP for the service to controller perspective). The assessment is covered in the CMP-TPA (Comparator-Tracker Performance Assessment) but also in the CMP-ECA1 (Comparator – ESASSP Ed1 Conformity Assessment). The following topics will be covered: accuracy analysis (TAA), detection analysis (TDA), probability of update (PUA), position error (PEA), false update (FUA) delay & time (DTA). The practical exercises comprise up to 50% of the training and are based on a standard dataset. EUROCONTROL provides working positions with prepared computers for all students.","objectives":"After completing the course, participants will be able to: configure/run CMP-TPA, check the report output and investigate/analyse the data using DISPlay, configure/run CMP-ECA1 for tracker assessment, check the report output and investigate/analyse the data using DISPlay.","audience":"This course is designed for engineers and technicians involved in surveillance tracker performance evaluation or verification against ESASSP Ed 1. It may also be of interest to managers and operational staff involved in surveillance system evaluation and incident investigation.","duration":"This course takes place over 2 days.","price":"The price per course for all participant is 740 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Natalja SIGNEJEVA Tutor Jean-Remi Dunand Tutor Matthieu SANCHEZ Tutor Ms Jekaterina TROFIMOVA Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Participants might also wish to attend to the SUR-SASSC-CFG course, held in the second part of the same week and lasting 2.5 days. The SUR-SASS-CFG course is designed for already experienced VERIFication users who want to deepen their system expertise. Pre-requisites The participant must have attended the “Fundamentals of the SASS-C VERIFication system [SUR-SASSC-INTRO]” course or have proven knowledge and experience on the related area. Strong knowledge of Tracker behaviour and ESASSP Ed 1 is critical in order to be able to follow and understand this course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"SUR-SDDS":{"terminy":[{"s":"2026-11-02 09:00","e":"2026-11-06 16:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SUR-SDDS","title_full":"Surveillance Data Distribution System [SUR-SDDS]","title_clean":"Surveillance Data Distribution System","description":"SDDS (Surveillance Data Distribution), the successor of the RMCDE, is the European state-of-the-art system for Surveillance Data Distribution and as such operational in an increasing number of European States. This course provides participants with a solid understanding of the SDDS network architecture, along with the skills required for SDDS configuration, operation, and management. The programme combines both theoretical and practical components. Participants first receive a structured introduction to surveillance data distribution concepts, focusing on network principles, ASTERIX, and the SDDS system architecture. These theoretical sessions are immediately followed by hands-on exercises that simulate real operational tasks. Attendees install, configure, monitor, and maintain the system using realistic scenarios that reflect real life SDDS operations. Pre-requisites Basic understanding of Surveillance and G/G Data Communication. Basic familiarity with Linux OS, which will be an advantage for the practical exercises.","objectives":"After completing the course, participants will be able to: - explain the principles of a SDD Network - describe the architecture of a SDD Network - perform essential configuration actions on the SDDS - perform essential monitoring actions on the SDDS - perform essential maintenance actions on the SDDS","audience":"This course is designed for engineers and technicians who are or will be involved in Surveillance Data Distribution.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Dr Cosimo Damiano TARANTINO Tutor Anonymized Anonymized Tutor Hajar BERDOUZI Tutor Anonymized Anonymized Tutor Johannes HOUBEN Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"UAS-ATM":{"terminy":[{"s":"2026-10-12 10:00","e":"2026-10-15 13:30","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"},{"s":"2026-12-07 10:00","e":"2026-12-10 13:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"},{"s":"2027-06-01 10:00","e":"2027-06-04 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-10-12 10:00","e":"2027-10-15 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"UAS-ATM","title_full":"Unmanned Aircraft Systems - ATM Integration [UAS-ATM]","title_clean":"Unmanned Aircraft Systems - ATM Integration","description":"Unmanned Aircraft Systems (UAS) have the capability to provide new services and make a substantial contribution to the economy. To achieve the full potential of this technology, it will be necessary to accommodate UAS in airspace previously dominated by manned aviation without compromising the good safety record. The adoption of the U-space regulatory package in the EU is expected to create the conditions necessary for both drones and manned aircraft to operate safely in U-space airspace. At the same time, integration in the existing ATM environment is challenging and new procedures and technologies are needed. This course provides an overview of processes for the integration of UAS in the existing ATM environment and the implementation of U-space and its main services from an ATM perspective.","objectives":"After completing the course, participants should be able to: Identify key initiatives related to U-space and UAS Traffic Management (UTM) led by entities such as ICAO, the European Commission, EASA, SESAR JU and FAA. Explaining the regulatory procedures linked to the provision of U-space/UTM services. Describing the operational concept underpinning UAS integration into Air Traffic Managment (ATM). Applying Commission Implementing Regulation EU 2021/664 Highlighting the primary characteristics of U-space types proposed by SESAR JU and Project CORUS. Identifying roles and deliverables generated by Standards Development Organisations (SDOs).","audience":"Personnel of ANSPs, airport operators and competent authorities.","duration":"This course takes place over 4 days.","price":"The price per course participant from all organisations or individuals is 1480 EUR.","delivered_by":"Dr Aycan MUTLU Course manager Toby Enzerink Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"The material presented in this course assumes participants have at least a basic knowledge of ATM, UAS, U-space and the relevant European Commission Regulations. For those unfamiliar with these regulations, it is strongly recommended to participate in the virtual course, UAS-REG-V, before attending the UAS-ATM integration course. Please note that availability of presenters may cause changes to the course timetable. Participants will be notified in advance as far as practicable. Pre-requisites The material presented in this course assumes participants have at least a basic knowledge of ATM, UAS, U-space and the relevant European Commission Regulations. For those unfamiliar with these regulations, it is strongly recommended to participate in the UAS-REG course, before attending the UAS-ATM integration course. It is strongly recommended to complete the \"Fundamentals of UAS and U-space Airspace [UAS-REG-FUND]\" e-learning course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"UAS-CUAS":{"terminy":[{"s":"2026-11-09 09:00","e":"2026-11-10 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-02-15 09:00","e":"2027-02-16 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-02-17 09:00","e":"2027-02-18 17:00","dni":2,"dow":"Śr-Czw","lok":"Luxembourg"},{"s":"2027-10-25 09:00","e":"2027-10-26 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-10-27 09:00","e":"2027-10-28 17:00","dni":2,"dow":"Śr-Czw","lok":"Luxembourg"}],"course_id":"UAS-CUAS","title_full":"Counter UAS Fundamentals [UAS-CUAS]","title_clean":"Counter UAS Fundamentals","description":"In support of NATO’s ongoing efforts to strengthen Counter-Unmanned Aircraft Systems (C-UAS) capabilities, the Joint Air Power Competence Centre has developed a C-UAS Fundamentals Training Course tailored for the NATO C-UAS Community of Interest (COI). Starting in 2025, the C-UAS Fundamentals Training Course is offered to members across all ranks of the NATO C-UAS COI, including relevant law enforcement agencies and critical infrastructure stakeholders. The course aims to raise drone awareness and provide a foundational understanding of the C-UAS problem. The curriculum currently includes lessons about drone operation tactics, techniques and procedures (TTP), drone threats throughout the spectrum of terrorism, espionage, sabotage, subversion, and organized crime (TESSOC), drone detection and relevant sensing methods, passive drone mitigation in peacetime and operations, active drone mitigation and relevant engagement methods, potential future UAS and C-UAS concepts, as well as C-UAS planning, including a tabletop planning exercise.","objectives":"This course aims to raise awareness of drone threats and provide foundational understanding of C-UAS challenges.","audience":"NATO C-UAS Community of Interest (Includes military, civilian, law enforcement, academic, defence, and critical infrastructure personnel)","duration":"This course takes place over 2 days. Partner","price":"This course is free of charge.","delivered_by":"Lt Col Andre Haider Content Manager Dr Aycan MUTLU Course manager Timo BLUNCK Tutor Rocco Burdo Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is delivered by JAPCC. Only course instances hosted at EUROCONTROL Aviation Learning Centre are advertised here. To see a full training schedule at all other locations, please visit https://www.japcc.org/training/#cuas","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"UAS-REG":{"terminy":[{"s":"2026-09-22 10:00","e":"2026-09-24 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-03-09 10:00","e":"2027-03-11 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-09-14 10:00","e":"2027-09-16 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"UAS-REG","title_full":"Unmanned Aircraft Systems - a Regulatory Overview [UAS-REG]","title_clean":"Unmanned Aircraft Systems - a Regulatory Overview","description":"The course provides an overview of the emerging ICAO provisions and regulations on UAS (Unmanned Aircraft Systems). This includes standards and recommended practices from ICAO, recommended requirements from JARUS, and emerging rules from FAA and EASA. The course focuses also on the changes introduced by the new EASA Basic Regulation (2018/1139) that extended the mandate of EASA to drones of any mass, and presents the related implementing and delegated acts as well as the differences among open, specific and certified categories of UAS operations. Standard scenarios defined by JARUS and EASA are also presented in the course. The EU Legislation applicable to civil drones goes much beyond safety, so not only 2018/1139 and associated rules will be covered, but also other relevant EU Regulations (e.g. 765/2004, 679/2016, 376/2014 and 996/2010) will be highlighted, as well as the provisions on U-Space (e.g. Implementing Regulations 2021/664, 2021/665, 2021/666). The course is composed of both theoretical modules, necessary to understand the regulatory framework, and group exercises and use cases, meant to consolidate the assimilated concepts and to share knowledge among the participants. Nevertheless, this course does not train participants to execute a specific regulatory or operational task linked to non-military drones. The course instead intends to provide attendees with a thorough insight in the overall scenario related to drones, including the societal point of view.","objectives":"At the end of the course, participants will be able to: Summarise key principles of emerging rules across the aviation domains (organisations, airworthiness, competence of remote pilots, operations, detect and avoid, command and control data link, airspace integration etc.). List the main EU Regulations affecting non-military UAS and explain their applicability. Envisage expected developments of emerging ICAO provisions and requirements at global level (ICAO, JARUS)","audience":"Professionals from industry wishing to acquire familiarisation with drone rules, or wishing to understand the regulatory context around their specific task. Staff of aviation authorities (potentially) dealing with non-military drones for policy development, rulemaking, certification, licensing and oversight.","duration":"This course takes place over 3 days.","price":"The price per course participant is 1110 EUR.","delivered_by":"Dr Aycan MUTLU Course manager Laura González Combrink Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is organised back-to-back with \"UAS Regulations in Practice: Operational Implementation\" course, delivered by CNFPC, to allow participants to attend them in the same week and location for completing the “UAS Regulation - From Theory to Practice [UAS-LP-REG]” learning path. Please consider registering for both courses during the same week! An update to the course title and agenda is planned for 2027. Pre-requisites It is strongly recommended to follow the \"Fundamentals of UAS and U-space Airspace [UAS-REG-FUND]\" eLearning course prior to attendance to the UAS-REG course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"UAS-SAF":{"terminy":[{"s":"2026-11-10 10:00","e":"2026-11-12 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-04-13 10:00","e":"2027-04-15 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-10-05 10:00","e":"2027-10-07 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"UAS-SAF","title_full":"Overview of UAS Specific Operations Risk Assessment (SORA) Methodology [UAS-SAF]","title_clean":"Overview of UAS Specific Operations Risk Assessment (SORA) Methodology","description":"EU Regulations 2019/947 and 2019/945 establish a risk-based regulatory framework for UAS, categorizing operations into open, specific, and certified. Specific operations require UAS operators to submit a risk assessment to the CAA for approval, using the EASA''s Specific Operations Risk Assessment (SORA). SORA evaluates ground and air risk from the UAS operator''s perspective, considering the applicable operational scenarios. The process includes identifying potential hazards, assessing risks, and determining appropriate mitigation measures to ensure safe operation. This course covers how SORA assesses ground and air risks from various viewpoints, including UAS operators, ANSP, and aviation authorities, providing a comprehensive understanding of the risk assessment process and its practical application in ensuring safe UAS operations.","objectives":"Participants will be able to: explain the various subcategories in EU Regulation 2019/947 understand the key concepts of the Specific Operations Risk Assessment (SORA) apply the basics of the SORA methodology to a pre-determined use case. Participants from the competent authorities should be able to assist in the review of the application received from the drone operators with respect to ground risks and air risks and the applied mitigations.","audience":"Personnel of service providers that want to understand how SORA deal with the interaction between UAS and other traffic. Personnel of competent authorities that need to evaluate applications based on SORA for operations in complex airspace environments. Personnel of UAS industry, remote pilots, instructors and other aviation professionals","duration":"This course takes place over 3 days.","price":"The price per course participant is 1110 EUR.","delivered_by":"Dr Aycan MUTLU Course manager Laura González Combrink Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Participants are asked to bring their own laptops due to an exercise conducted. This course is organised back-to-back with \"SORA in Practice: Conducting an Authorised UAS Operation\" course, delivered by CNFPC, to allow participants to attend them in the same week and location for completing the “UAS SORA Framework with Hands-on implementation [UAS-LP-SAF]” learning path. Please consider registering for both courses during the same week! An update to the course title and agenda is planned for 2027. Pre-requisites The material presented in this course assumes participants have at least a basic knowledge of ATM, UAS, U-space and the relevant European Commission Regulations. For those unfamiliar with these regulations, it is strongly recommended to participate in the virtual or classroom UAS-REG course, before attending the UAS-SAF course. It is strongly recommended to complete the \"Fundamentals of UAS and U-space Airspace [UAS-REG-FUND]\" e-learning course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"}}</script>

<script>
"use strict";
const REF_COLS=['Pracownik','Szkolenie','Termin'],LS_WIDTHS='ians-planner-col-widths-v3';
const COLS=[
 {key:'_sel',def:30,min:30,max:30},{key:'Pracownik',def:210,min:110},{key:'Szkolenie',def:300,min:120},{key:'Termin',def:190,min:75},{key:'Priorytet',def:58,min:36},{key:'Uzasadnienie',def:160,min:90},{key:'Dyr_Akceptacja',def:74,min:58},{key:'Dyr_Komentarz',def:150,min:90},{key:'Prezes_Akceptacja',def:74,min:58},{key:'Prezes_Komentarz',def:150,min:90}
];
const state={main:[],prac:new Map(),szk:new Map(),term:new Map(),flags:{kiero:false,dyr:false,prezes:false},groupBy:'none',collapsed:new Set(),selected:new Set(),sort:null,search:'',loaded:false,colWidths:{},groupSortDesc:false,pracOpts:[],szkOpts:[],termOptsBySzk:new Map(),pracByLabel:new Map(),szkByLabel:new Map(),termByKey:new Map(),lastMainJson:'',suppressUntil:0};
try{Object.assign(state.colWidths,JSON.parse(localStorage.getItem(LS_WIDTHS)||'{}'))}catch(e){}
let reloadPending=false,reloadTimer=null,searchTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function colToRecs(data){return(data.id||[]).map((id,i)=>{const r={id};for(const c of Object.keys(data))if(c!=='id')r[c]=data[c][i];return r})}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='',err?3500:1400)}
const pracLabel=id=>state.prac.get(id)?.Kom_Osoba||'',pracKom=id=>state.prac.get(id)?.Komorka||'',szkLabel=id=>state.szk.get(id)?.title_full||'';
function validTermin(r){const t=state.term.get(r.Termin);return t&&t.SzkolenieRef_id===r.Szkolenie?t:null}
function widthOf(c){const n=Number(state.colWidths[c.key]);return Math.max(c.min,Math.min(c.max||1000,Number.isFinite(n)?n:c.def))}
function tableWidth(){return COLS.reduce((s,c)=>s+widthOf(c),0)}
function renderCols(){document.getElementById('colgroup').innerHTML=COLS.map(c=>`<col data-colkey="${c.key}" style="--cw:${widthOf(c)}px">`).join('');document.getElementById('tbl').style.width=tableWidth()+'px'}
function setColWidth(key,w){const c=COLS.find(x=>x.key===key);if(!c||key==='_sel')return;w=Math.max(c.min,Math.min(c.max||1000,Math.round(w)));state.colWidths[key]=w;const col=document.querySelector(`#colgroup col[data-colkey="${CSS.escape(key)}"]`);if(col)col.style.setProperty('--cw',w+'px');document.getElementById('tbl').style.width=tableWidth()+'px';try{localStorage.setItem(LS_WIDTHS,JSON.stringify(state.colWidths))}catch(e){}}
async function loadAll(){const a=grist.docApi,[main,prac,szk,term]=await Promise.all([a.fetchTable('Main'),a.fetchTable('Pracownicy'),a.fetchTable('Baza_UnikatoweReczne'),a.fetchTable('BazaTerminow')]);state.main=colToRecs(main);state.lastMainJson=JSON.stringify(main);state.prac=new Map(colToRecs(prac).map(r=>[r.id,r]));state.szk=new Map(colToRecs(szk).map(r=>[r.id,r]));state.term=new Map(colToRecs(term).map(r=>[r.id,r]));buildOpts();await loadFlags();const first=!state.loaded;state.loaded=true;render(first)}
async function loadFlags(){let f=null;try{const p=colToRecs(await grist.docApi.fetchTable('PanelSterowania'))[0];if(p)f={kiero:!!p.EdycjaKiero,dyr:!!p.AkceptacjaDyr,prezes:!!p.AkceptacjaPrezes}}catch(e){}if(!f&&state.main.length){const m=state.main[0];f={kiero:!!m.EdycjaKiero,dyr:!!m.AkceptacjaDyr,prezes:!!m.AkceptacjaPrezes}}const changed=f&&JSON.stringify(f)!==JSON.stringify(state.flags);if(f)state.flags=f;return changed}
function buildOpts(){const cmp=(a,b)=>String(a[1]||'').localeCompare(String(b[1]||''),'pl');state.pracOpts=[...state.prac.values()].map(p=>[p.id,p.Kom_Osoba||'']).sort(cmp);state.szkOpts=[...state.szk.values()].map(s=>[s.id,s.title_full||'']).sort(cmp);state.pracByLabel=new Map(state.pracOpts.map(([i,l])=>[l,i]));state.szkByLabel=new Map(state.szkOpts.map(([i,l])=>[l,i]));state.termOptsBySzk=new Map();state.termByKey=new Map();for(const t of state.term.values()){if(!t.SzkolenieRef_id)continue;if(!state.termOptsBySzk.has(t.SzkolenieRef_id))state.termOptsBySzk.set(t.SzkolenieRef_id,[]);state.termOptsBySzk.get(t.SzkolenieRef_id).push([t.id,t.termin||'']);state.termByKey.set(t.SzkolenieRef_id+'|'+(t.termin||''),t.id)}for(const l of state.termOptsBySzk.values())l.sort(cmp);let h=`<datalist id="dl-prac">${state.pracOpts.map(([,l])=>`<option value="${esc(l)}">`).join('')}</datalist><datalist id="dl-szk">${state.szkOpts.map(([,l])=>`<option value="${esc(l)}">`).join('')}</datalist>`;for(const[i,l]of state.termOptsBySzk)h+=`<datalist id="dl-term-${i}">${l.map(([tid,x])=>{const t=state.term.get(tid),info=[t?.lokalizacja,t?.dni_robocze?t.dni_robocze+' dn.':'',t?.koszt].filter(Boolean).join(' · ');return`<option value="${esc(x)}"${info?` label="${esc(info)}"`:''}>`}).join('')}</datalist>`;document.getElementById('datalists').innerHTML=h}
async function loadMain(){const main=await grist.docApi.fetchTable('Main'),fc=await loadFlags(),j=JSON.stringify(main);if(j===state.lastMainJson&&!fc)return;state.lastMainJson=j;state.main=colToRecs(main);state.selected=new Set([...state.selected].filter(id=>state.main.some(r=>r.id===id)));updateBulkBtn();render()}
function scheduleReload(){if(Date.now()<state.suppressUntil)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#tbody')){reloadPending=true;return}clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>loadMain().catch(console.error),150)}
async function updateRec(id,fields){const r=state.main.find(x=>x.id===id),prev=r?{...r}:null;if(r)Object.assign(r,fields);(state.groupBy!=='none'&&REF_COLS.some(c=>c in fields)||state.sort&&state.sort.col in fields)?render():rerenderRow(id);try{await grist.docApi.applyUserActions([['UpdateRecord','Main',id,fields]]);state.suppressUntil=Date.now()+2500;toast('Zapisano')}catch(e){if(r&&prev)Object.assign(r,prev);toast('Nie udało się zapisać — brak uprawnień na tym etapie?',true);loadAll()}}
async function addRec(){try{await grist.docApi.applyUserActions([['AddRecord','Main',null,{}]]);toast('Dodano wpis');loadMain()}catch(e){toast('Nie udało się dodać wpisu',true)}}
async function delSelected(){const ids=[...state.selected];if(!ids.length||!confirm(`Usunąć ${ids.length} wpisów?`))return;try{await grist.docApi.applyUserActions([['BulkRemoveRecord','Main',ids]]);state.selected.clear();updateBulkBtn();toast('Usunięto');loadMain()}catch(e){toast('Nie udało się usunąć',true)}}

 .toc a{display:block;color:#1F4E78;text-decoration:underline;font-size:12.5px;padding:2px 0}
 .toc a:hover{color:#B42318}
 .kurs h2{font-size:18px;color:#1F4E78;margin:0 0 12px;line-height:1.35}
 .kurs h3{font-size:12.5px;color:#1F4E78;text-transform:uppercase;letter-spacing:.4px;margin:16px 0 4px}
 .kurs h3.free{color:#2E7D32}.kurs h3.paid{color:#B42318}
 .kurs p{margin:0;font-size:13px;white-space:pre-line}
 table{border-collapse:collapse;width:100%;margin:2px 0 6px;font-size:11.5px}
 th{background:#1F4E78;color:#f5f5f5;text-align:center;padding:6px 8px;font-weight:600}
 td{padding:5px 8px;border:.5px solid #CCCCCC;text-align:center}
 td.mono{font-family:"Red Hat Mono",Consolas,monospace}
 tr:nth-child(even) td{background:#fff}tr:nth-child(odd) td{background:#F5F5F5}
 table tr:first-child th{border:.5px solid #CCCCCC}
 .fee{border:1.5px solid;border-radius:6px;padding:9px 13px;font-size:13px;margin-top:2px}
 .fee.paid{background:#F8D7DA;border-color:#B42318;color:#7a1a12}
 .fee.free{background:#D9F4D8;border-color:#2E7D32;color:#1b4d1e}
 .fee.none{background:#f5f5f5;border-color:#ccc}
 .note{background:#FFF3CD;border:1px solid #F4D58D;color:#A15C00;border-radius:6px;padding:9px 13px;font-size:13px;margin-top:2px}
 .top{position:absolute;bottom:22px;right:54px;font-size:11.5px;color:#1F4E78;text-decoration:none}
 .top:hover{text-decoration:underline}
 @media print{body{background:#fff}.toolbtn,.top{display:none}.page{box-shadow:none;margin:0;width:auto;min-height:0;padding:24px 0;page-break-after:always}}
 </style></head><body>
 <button class="toolbtn" onclick="print()">🖨 Drukuj / zapisz PDF</button>
 <section class="page cover"><h1>KATALOG SZKOLEŃ</h1><div class="sub">LearningZone EUROCONTROL Aviation Learning Centre</div>
  <div class="info"><b>Liczba unikalnych szkoleń:</b> ${items.length}<br><b>Data generacji:</b> ${esc(today)}<br>${okres?`<b>Okres:</b> ${esc(okres)}<br>`:''}<br><i>Każda strona zawiera szczegóły szkolenia i wszystkie dostępne terminy.</i></div></section>
 <section class="page" id="toc"><h2 class="toch">Spis treści</h2><p class="hint">Kliknij tytuł, aby przejść do odpowiedniej sekcji.</p><nav class="toc">${toc}</nav></section>
 ${body}
 <scr`+`ipt>document.addEventListener('click',function(e){var a=e.target.closest('a[href^="#"]');if(!a)return;var el=document.getElementById(a.getAttribute('href').slice(1));if(el){e.preventDefault();el.scrollIntoView(true)}});<\/scr`+`ipt>
 </body></html>`}
bookletBtn.onclick=()=>{bookletOverlay.hidden=false;renderBooklet();bookletSearch.focus()};
bookletPdfBtn.onclick=()=>{
 try{
  const url=URL.createObjectURL(new Blob([bookletHtml()],{type:'text/html'}));
  const w=window.open(url,'_blank');
  if(w)return;
 }catch(e){}
 toast('Zezwól na wyskakujące okna, aby otworzyć biuletyn PDF',true);
};
bookletClose.onclick=()=>bookletOverlay.hidden=true;
infoClose.onclick=()=>infoModal.hidden=true;
bookletSearch.oninput=()=>renderBooklet();
bookletOverlay.addEventListener('click',e=>{if(e.target===bookletOverlay)bookletOverlay.hidden=true});
infoModal.addEventListener('click',e=>{if(e.target===infoModal)infoModal.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){bookletOverlay.hidden=true;infoModal.hidden=true}});
// lazy render pełnego opisu przy rozwinięciu karty biuletynu
bookletBody.addEventListener('click',e=>{const h=e.target.closest('.bk-head');if(!h)return;const c=h.parentElement,d=c.querySelector('.bk-det');if(!c.classList.contains('open')&&!d.dataset.f){const o=opisFor(c.dataset.code);if(o){d.innerHTML=renderOpis(o,true,true)+terminyList(c.dataset.code);d.dataset.f='1'}}c.classList.toggle('open')});
grist.ready({requiredAccess:'full'});grist.onRecords(scheduleReload);loadAll().catch(e=>{console.error(e);tbody.innerHTML='<tr><td colspan="10"><div class="state-msg"><b>Nie udało się wczytać danych.</b></div></td></tr>'});setInterval(()=>{if(!document.hidden)scheduleReload()},45000);
</script>
</body>
</html>
