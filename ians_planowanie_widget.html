<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planowanie szkoleń</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg2:#F7F8FA; --line:#E9EAEE; --line2:#F1F2F5;
    --txt:#1D1F24; --mut:#8A8F98; --mut2:#B4B8BF;
    --kiero:#3B82F6; --dyr:#8B5CF6; --prezes:#10B981; --red:#DC2626;
    --kiero-bg:rgba(59,130,246,.055); --dyr-bg:rgba(139,92,246,.055); --prezes-bg:rgba(16,185,129,.06);
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Red Hat Text',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:12.5px; color:var(--txt); background:var(--bg2);
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    flex:0 0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:9px 14px; background:var(--bg); border-bottom:1px solid var(--line);
  }
  .brand{font-size:13.5px; font-weight:650; letter-spacing:-.01em; white-space:nowrap;}
  .steps{display:flex; align-items:center; gap:3px; min-width:0; overflow:hidden;}
  .step{
    display:flex; align-items:center; gap:6px;
    padding:3px 9px; border-radius:999px; color:var(--mut);
    font-weight:500; white-space:nowrap; border:1px solid transparent; font-size:12px;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .step .dot{width:6px; height:6px; border-radius:50%; background:var(--mut2); flex:0 0 auto; transition:background .2s ease;}
  .step.on{color:var(--txt); background:var(--bg2); border-color:var(--line); font-weight:600;}
  .step.on.s-kiero .dot{background:var(--kiero); --pc:59,130,246;}
  .step.on.s-dyr .dot{background:var(--dyr); --pc:139,92,246;}
  .step.on.s-prezes .dot{background:var(--prezes); --pc:16,185,129;}
  .step.on .dot{animation:pulse 2.6s ease-in-out 4; box-shadow:0 0 0 3px rgba(var(--pc),.16);}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 3px rgba(var(--pc),.16);}
    50%{box-shadow:0 0 0 6px rgba(var(--pc),.05);}
  }
  .step-arrow{color:var(--mut2); font-size:11px;}
  .spacer{flex:1;}

  input#search{
    width:150px; padding:5px 11px; border:1px solid var(--line);
    border-radius:8px; font:inherit; background:var(--bg); outline:none;
    transition:border-color .18s ease, box-shadow .18s ease, width .22s cubic-bezier(.2,.7,.3,1);
  }
  input#search:hover{background:var(--bg);}
  input#search:focus{width:210px; border-color:var(--kiero); box-shadow:0 0 0 3px var(--kiero-bg);}

  .seg{display:flex; background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:2px;}
  .seg button{
    border:0; background:transparent; font:inherit; color:var(--mut); font-size:12px;
    padding:3px 9px; border-radius:6px; cursor:pointer; white-space:nowrap; font-weight:500;
    transition:background .18s ease, color .18s ease, box-shadow .18s ease, transform .12s ease;
  }
  .seg button:hover:not(.on){color:var(--txt);}
  .seg button:active{transform:scale(.95);}
  .seg button.on{background:var(--bg); color:var(--txt); font-weight:600; box-shadow:var(--shadow);}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--bg); color:var(--txt);
    font:inherit; font-weight:550; padding:5px 11px; border-radius:8px; cursor:pointer;
    transition:background .18s ease, opacity .18s ease, transform .12s ease, box-shadow .18s ease;
  }
  .btn:hover{background:var(--bg2);}
  .btn:active:not(:disabled){transform:scale(.96);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.icon{padding:5px 8px;}
  .btn.danger{background:var(--red); border-color:var(--red); color:#fff;}
  .btn.danger:hover{opacity:.88; background:var(--red);}

  /* ---------- Table ---------- */
  .wrap{flex:1 1 auto; overflow:auto; padding:0 14px 40px;}
  .card{background:var(--bg); border:1px solid var(--line); border-top:0; border-radius:0 0 var(--radius) var(--radius); box-shadow:var(--shadow); overflow:visible; min-width:min-content;}
  table{border-collapse:separate; border-spacing:0; width:100%;}
  thead th{
    position:sticky; z-index:5; background:var(--bg);
    font-size:10.5px; font-weight:600; color:var(--mut); text-align:left;
    text-transform:uppercase; letter-spacing:.04em;
    padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  thead tr.sections th{top:0; z-index:6; border-bottom:1px solid var(--line2); padding:7px 8px 3px;}
  thead tr.cols th{top:26px; z-index:5;} /* top adjusted dynamically by renderHead() */
  th.sec-kiero{color:var(--kiero);} th.sec-dyr{color:var(--dyr);} th.sec-prezes{color:var(--prezes);}
  th .live{
    display:inline-block; margin-left:7px; padding:1px 7px; border-radius:999px;
    font-size:10px; letter-spacing:.02em; text-transform:none; font-weight:600;
  }
  th.sec-kiero .live{background:var(--kiero-bg); color:var(--kiero);}
  th.sec-dyr .live{background:var(--dyr-bg); color:var(--dyr);}
  th.sec-prezes .live{background:var(--prezes-bg); color:var(--prezes);}
  th.sortable{cursor:pointer; user-select:none;}
  th.sortable:hover{color:var(--txt);}
  th.sortable .arr{margin-left:4px; font-size:10px; opacity:0; transition:opacity .15s;}
  th.sortable.sorted .arr{opacity:1; color:var(--kiero);}
  th.selcol{width:30px; text-align:center; padding:6px 4px;}

  tbody td{
    padding:4px 8px; border-bottom:1px solid var(--line2);
    vertical-align:middle; background:var(--bg);
    transition:background .14s ease;
  }
  tbody tr:hover td{background:#FBFBFC;}
  tbody tr:last-child td{border-bottom:0;}
  td.selcol{width:30px; text-align:center; padding:4px;}
  .rowsel{visibility:hidden; cursor:pointer; accent-color:var(--kiero);}
  tbody tr:hover .rowsel, .rowsel:checked, tbody.has-sel .rowsel{visibility:visible;}
  #selAll{cursor:pointer; accent-color:var(--kiero);}

  /* active-stage tint */
  td.on.c-kiero{background:var(--kiero-bg);}
  td.on.c-dyr{background:var(--dyr-bg);}
  td.on.c-prezes{background:var(--prezes-bg);}
  tbody tr:hover td.on.c-kiero{background:rgba(59,130,246,.09);}
  tbody tr:hover td.on.c-dyr{background:rgba(139,92,246,.09);}
  tbody tr:hover td.on.c-prezes{background:rgba(16,185,129,.09);}

  /* zielony obwód aktywnej sekcji */
  td.on.sec-l{box-shadow:inset 2.5px 0 0 rgba(16,185,129,.45);}
  td.on.sec-r{box-shadow:inset -2.5px 0 0 rgba(16,185,129,.45);}
  tr.sections th.sec-act{box-shadow:inset 0 -2px 0 rgba(16,185,129,.55);}

  /* zablokowane sekcje: kontrolki nieaktywne, ale treść w pełni czytelna */
  td.off{position:relative;}
  td.off > *{pointer-events:none;}
  td.off input, td.off textarea, td.off select{color:var(--txt);}
  td.off .switch{opacity:.75;}
  td.off::after{content:""; position:absolute; inset:0; cursor:not-allowed;}

  /* group rows */
  tr.group td{
    background:var(--bg2); border-bottom:1px solid var(--line);
    font-weight:650; font-size:12px; height:34px; cursor:pointer; user-select:none;
  }
  tr.group td:hover{background:#F1F2F5;}
  tr.group .chev{display:inline-block; width:16px; color:var(--mut); transition:transform .12s; font-size:10px;}
  tr.group.collapsed .chev{transform:rotate(-90deg);}
  tr.group .meta{margin-left:10px; color:var(--mut); font-weight:500; font-size:11px;}
  tr.sub td{
    background:#FCFCFD; font-weight:600; font-size:11.5px; color:var(--mut);
    height:28px; padding-left:34px; border-bottom:1px solid var(--line2);
  }
  tr.sub .meta{margin-left:8px; font-weight:400;}

  /* wiersz "dodaj wpis" na dole gridu */
  tr.addrow td{padding:0; background:var(--bg);}
  .addline{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    color:var(--mut); cursor:pointer; font:inherit; font-weight:550; padding:9px 12px;
    transition:background .15s ease, color .15s ease;
  }
  .addline:hover{background:var(--kiero-bg); color:var(--kiero);}

  /* inputs */
  select, input[type=text], textarea{
    width:100%; min-width:0; font:inherit; color:var(--txt);
    border:1px solid transparent; background:transparent; border-radius:6px;
    padding:4px 6px; outline:none; transition:border-color .12s, background .12s, box-shadow .12s;
  }
  textarea{resize:none; overflow:hidden; line-height:1.4; display:block; field-sizing:content; min-height:26px;}
  select{cursor:pointer; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23B4B8BF' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 6px center; padding-right:20px;
  }
  select:hover, input[type=text]:hover, textarea:hover{background:rgba(255,255,255,.9); border-color:var(--line);}
  select:focus, input[type=text]:focus, textarea:focus{background:#fff; border-color:var(--kiero); box-shadow:0 0 0 3px var(--kiero-bg);}
  select:disabled{color:var(--mut2); cursor:not-allowed; background-image:none;}
  input::placeholder, textarea::placeholder{color:var(--mut2);}
  option{color:var(--txt);}
  input[list]{text-overflow:ellipsis;}

  .cellcol .sub{font-size:11px; color:var(--mut); margin-top:1px; padding-left:7px; white-space:nowrap;}
  .cellcol .sub.online, .cellcol .sub .online{color:var(--prezes); font-weight:600;}
  .empty-val{color:var(--mut2);}

  /* switch */
  .switch{position:relative; display:inline-block; width:32px; height:19px; vertical-align:middle;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .switch .track{
    position:absolute; inset:0; border-radius:999px; background:#DFE1E6;
    transition:background .2s ease; cursor:pointer;
  }
  .switch .track::before{
    content:""; position:absolute; width:15px; height:15px; left:2px; top:2px;
    border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2);
    transition:transform .28s cubic-bezier(.34,1.4,.64,1);
  }
  .switch:active .track::before{transform:scale(.92);}
  .switch:active input:checked + .track::before{transform:translateX(13px) scale(.92);}
  .switch input:checked + .track{background:var(--prezes);}
  .switch.dyr input:checked + .track{background:var(--dyr);}
  .switch.kiero input:checked + .track{background:var(--kiero);}
  .switch input:checked + .track::before{transform:translateX(13px);}
  .switch input:focus-visible + .track{box-shadow:0 0 0 3px var(--kiero-bg);}

  .cost-paid{color:var(--red); font-weight:650;}
  .cost-free{color:var(--prezes); font-weight:650;}

  /* empty & loading */
  .state-msg{padding:50px 20px; text-align:center; color:var(--mut);}
  .state-msg b{color:var(--txt);}

  /* toast */
  #toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(10px) scale(.96);
    background:var(--txt); color:#fff; padding:8px 16px; border-radius:10px;
    font-size:12.5px; opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .3s cubic-bezier(.2,.9,.3,1.2);
    z-index:50; box-shadow:0 4px 14px rgba(0,0,0,.18); max-width:80vw;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}
  #toast.err{background:var(--red);}

  /* wejście wierszy (tylko przy załadowaniu / zmianie grupowania) */
  @keyframes rowIn{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;}}
  tbody.fx tr{animation:rowIn .3s cubic-bezier(.2,.7,.3,1) both;}

  /* skeleton */
  .skel{
    height:11px; border-radius:6px; margin:8px 0;
    background:linear-gradient(90deg,#EEF0F3 25%,#F7F8FA 50%,#EEF0F3 75%);
    background-size:200% 100%; animation:shimmer 1.3s linear infinite;
  }
  @keyframes shimmer{from{background-position:200% 0;} to{background-position:-200% 0;}}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation:none !important; transition:none !important;}
  }

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#D7D9DE; border-radius:99px; border:2px solid var(--bg2);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Column resizer ---------- */
  thead th{position:relative;}
  .resizer{
    position:absolute; right:0; top:0; bottom:0; width:5px;
    cursor:col-resize; user-select:none; z-index:10;
  }
  .resizer:hover,.resizer.rz-active{background:rgba(59,130,246,.4);}

  /* ---------- Szkolenie wrapping cell ---------- */
  label.szk-cell{display:block; position:relative;}
  label.szk-cell input{
    position:absolute; top:0; left:0; width:100%; height:0;
    padding:0; border:none; opacity:0; pointer-events:none;
  }
  label.szk-cell:focus-within input{
    position:static; height:auto; opacity:1; pointer-events:auto;
    padding:4px 6px; border:1px solid var(--kiero); box-shadow:0 0 0 3px var(--kiero-bg);
    border-radius:6px; background:#fff;
  }
  label.szk-cell:focus-within .szk-disp{display:none;}
  .szk-disp{
    display:block; padding:4px 6px; white-space:normal; word-break:break-word;
    min-height:26px; font:inherit; cursor:text; border-radius:6px; line-height:1.35;
    border:1px solid transparent; transition:border-color .12s, background .12s;
  }
  label.szk-cell:not(:focus-within):hover .szk-disp{background:rgba(255,255,255,.9); border-color:var(--line);}
  td.off label.szk-cell .szk-disp{cursor:default;}
  td.off label.szk-cell:hover .szk-disp{background:transparent; border-color:transparent;}

  /* ---------- Group sort button ---------- */
  .grp-sort.active{background:var(--kiero-bg); color:var(--kiero); border-color:var(--kiero);}

  /* ---------- Priority checkbox ---------- */
  .priority-cb{
    width:16px; height:16px; cursor:pointer; display:block; margin:2px auto;
    accent-color:var(--kiero);
  }
  .priority-cb:disabled{opacity:.55; cursor:not-allowed;}
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">Planowanie szkoleń</div>
  <div class="steps" id="steps"></div>
  <div class="spacer"></div>
  <button class="btn danger" id="bulkDel" hidden>Usuń zaznaczone</button>
  <input id="search" type="text" placeholder="Szukaj…">
  <div class="seg" id="groupSeg">
    <button data-g="none" class="on">Brak</button>
    <button data-g="biuro">Biuro</button>
    <button data-g="komorka">Komórka</button>
    <button data-g="pracownik">Pracownik</button>
    <button data-g="szkolenie">Temat</button>
  </div>
  <button class="btn icon grp-sort" id="groupSortBtn" title="Sortuj grupy wg liczby wpisów (malejąco)" hidden>
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="4" x2="9" y2="4"/><line x1="1" y1="8" x2="7" y2="8"/><line x1="1" y1="12" x2="5" y2="12"/><line x1="12" y1="2" x2="12" y2="14"/><polyline points="9,11 12,14 15,11"/></svg>
  </button>
  <button class="btn icon" id="refreshBtn" title="Odśwież">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
  </button>
</div>

<div class="wrap">
  <div class="card">
    <table id="tbl">
      <thead>
        <tr class="sections" id="secRow"></tr>
        <tr class="cols" id="colRow"></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="10" style="padding:18px 16px">
          <div class="skel" style="width:62%"></div>
          <div class="skel" style="width:84%"></div>
          <div class="skel" style="width:71%"></div>
          <div class="skel" style="width:78%"></div>
        </td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="datalists"></div>
<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   Planowanie szkoleń — custom widget dla Grist
   Zapis przez applyUserActions; uprawnienia egzekwują Access Rules.
   Widget jedynie wizualnie akcentuje aktywny etap (PanelSterowania)
   i blokuje kontrolki sekcji nieaktywnych (treść zostaje czytelna).
   ============================================================ */

const REF_COLS = ['Pracownik', 'Szkolenie', 'Termin'];

const state = {
  main: [],
  prac: new Map(),      // id -> rec Pracownicy
  szk:  new Map(),      // id -> rec Baza_UnikatoweReczne
  term: new Map(),      // id -> rec BazaTerminow
  flags: { kiero:false, dyr:false, prezes:false },
  groupBy: 'none',
  collapsed: new Set(),
  selected: new Set(),  // zaznaczone wiersze (checkboxy)
  sort: null,           // {col, dir} | null (null = kolejność naturalna, nowe na dole)
  search: '',
  loaded: false,
  colWidths: {},        // col -> px (persists across renders)
  groupSortDesc: false,  // sort groups by count descending
  // cache wydajnościowy — budowane raz przy załadowaniu danych
  pracOpts: [], szkOpts: [],
  termOptsBySzk: new Map(),   // szkolenieId -> [[id, termin], ...]
  pracByLabel: new Map(), szkByLabel: new Map(),
  termByKey: new Map(),       // "szkId|termin" -> terminId
  lastMainJson: '',
  suppressUntil: 0,           // okno ignorowania echa onRecords po własnym zapisie
};

let reloadPending = false;
let reloadTimer = null;
let searchTimer = null;

/* ---------- utils ---------- */

function colToRecs(data){
  const out = [];
  const cols = Object.keys(data).filter(k => k !== 'id');
  (data.id || []).forEach((id, i) => {
    const r = { id };
    for (const c of cols) r[c] = data[c][i];
    out.push(r);
  });
  return out;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = '', err ? 3500 : 1400);
}

const pracLabel = id => state.prac.get(id)?.Kom_Osoba || '';
const pracKom   = id => state.prac.get(id)?.Komorka || '';
const szkLabel  = id => state.szk.get(id)?.title_full || '';

// termin ważny tylko, gdy należy do wybranego szkolenia (odpowiednik Termin_Cleared)
function validTermin(rec){
  const t = state.term.get(rec.Termin);
  return (t && t.SzkolenieRef_id === rec.Szkolenie) ? t : null;
}

/* ---------- data loading ---------- */

async function loadAll(){
  const api = grist.docApi;
  const [main, prac, szk, term] = await Promise.all([
    api.fetchTable('Main'),
    api.fetchTable('Pracownicy'),
    api.fetchTable('Baza_UnikatoweReczne'),
    api.fetchTable('BazaTerminow'),
  ]);
  state.main = colToRecs(main);
  state.lastMainJson = JSON.stringify(main);
  state.prac = new Map(colToRecs(prac).map(r => [r.id, r]));
  state.szk  = new Map(colToRecs(szk).map(r => [r.id, r]));
  state.term = new Map(colToRecs(term).map(r => [r.id, r]));
  buildOpts();
  await loadFlags();
  const firstLoad = !state.loaded;
  state.loaded = true;
  render(firstLoad);
}

async function loadFlags(){
  let f = null;
  try {
    const p = colToRecs(await grist.docApi.fetchTable('PanelSterowania'))[0];
    if (p) f = { kiero: !!p.EdycjaKiero, dyr: !!p.AkceptacjaDyr, prezes: !!p.AkceptacjaPrezes };
  } catch (e) { /* brak dostępu do panelu — fallback niżej */ }
  if (!f && state.main.length){
    const m = state.main[0];
    f = { kiero: !!m.EdycjaKiero, dyr: !!m.AkceptacjaDyr, prezes: !!m.AkceptacjaPrezes };
  }
  const changed = f && JSON.stringify(f) !== JSON.stringify(state.flags);
  if (f) state.flags = f;
  return changed;
}

// listy opcji, mapy label->id i wspólne <datalist> — raz, nie per komórka
function buildOpts(){
  const byLabel = (a,b) => a[1].localeCompare(b[1], 'pl');
  state.pracOpts = [...state.prac.values()].map(p => [p.id, p.Kom_Osoba]).sort(byLabel);
  state.szkOpts  = [...state.szk.values()].map(s => [s.id, s.title_full]).sort(byLabel);
  state.pracByLabel = new Map(state.pracOpts.map(([id,l]) => [l, id]));
  state.szkByLabel  = new Map(state.szkOpts.map(([id,l]) => [l, id]));

  state.termOptsBySzk = new Map();
  state.termByKey = new Map();
  for (const t of state.term.values()){
    const k = t.SzkolenieRef_id;
    if (!k) continue;
    if (!state.termOptsBySzk.has(k)) state.termOptsBySzk.set(k, []);
    state.termOptsBySzk.get(k).push([t.id, t.termin || '']);
    const key = k + '|' + (t.termin || '');
    if (!state.termByKey.has(key)) state.termByKey.set(key, t.id);
  }
  for (const list of state.termOptsBySzk.values()) list.sort(byLabel);

  let dl = `<datalist id="dl-prac">${state.pracOpts.map(([,l]) => `<option value="${esc(l)}">`).join('')}</datalist>`;
  dl += `<datalist id="dl-szk">${state.szkOpts.map(([,l]) => `<option value="${esc(l)}">`).join('')}</datalist>`;
  for (const [szkId, list] of state.termOptsBySzk){
    dl += `<datalist id="dl-term-${szkId}">${list.map(([tid, label]) => {
      const t = state.term.get(tid);
      return `<option value="${esc(label)}" label="${esc(t.lokalizacja || '')}">`;
    }).join('')}</datalist>`;
  }
  document.getElementById('datalists').innerHTML = dl;
}

// lekki refetch: tylko Main + flagi etapów (słowniki dociąga loadAll)
async function loadMain(){
  const main = await grist.docApi.fetchTable('Main');
  const flagsChanged = await loadFlags();
  const j = JSON.stringify(main);
  if (j === state.lastMainJson && !flagsChanged) return;  // nic się nie zmieniło
  state.lastMainJson = j;
  state.main = colToRecs(main);
  // wyczyść zaznaczenia wierszy, które zniknęły
  state.selected = new Set([...state.selected].filter(id => state.main.some(r => r.id === id)));
  updateBulkBtn();
  render();
}

function scheduleReload(){
  // echo własnego zapisu — stan lokalny jest już aktualny, nie refetchuj
  if (Date.now() < state.suppressUntil) return;
  // nie przerywaj użytkownikowi w trakcie pisania
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA') && ae.closest('#tbody')){
    reloadPending = true;
    return;
  }
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(() => loadMain().catch(console.error), 150);
}

/* ---------- writes ---------- */

// podmienia tylko jeden wiersz zamiast przebudowywać całą tabelę
function rerenderRow(id){
  const tr = document.querySelector(`#tbody tr[data-id="${id}"]`);
  const rec = state.main.find(r => r.id === id);
  if (!tr || !rec){ render(); return; }
  const tmp = document.createElement('tbody');
  tmp.innerHTML = rowHtml(rec);
  const fresh = tmp.firstElementChild;
  tr.replaceWith(fresh);
  fitTextareas(fresh);
}

async function updateRec(id, fields){
  const rec = state.main.find(r => r.id === id);
  const prev = rec ? { ...rec } : null;
  if (rec) Object.assign(rec, fields);   // optymistycznie
  // pełny render tylko, gdy edycja zmienia przypisanie do grupy lub sortowanie
  const structural =
    (state.groupBy !== 'none' && REF_COLS.some(c => c in fields)) ||
    (state.sort && state.sort.col in fields);
  structural ? render() : rerenderRow(id);
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Main', id, fields]]);
    state.suppressUntil = Date.now() + 2500;
    toast('Zapisano');
  } catch (e) {
    if (rec && prev) Object.assign(rec, prev);
    toast('Nie udało się zapisać — brak uprawnień na tym etapie?', true);
    loadAll().catch(console.error);
  }
}

async function addRec(){
  try {
    await grist.docApi.applyUserActions([['AddRecord', 'Main', null, {}]]);
    toast('Dodano wpis');
    loadMain().catch(console.error);
  } catch (e) {
    toast('Nie udało się dodać wpisu', true);
  }
}

async function delSelected(){
  const ids = [...state.selected];
  if (!ids.length) return;
  if (!confirm(`Usunąć ${ids.length} ${ids.length === 1 ? 'wpis' : (ids.length < 5 ? 'wpisy' : 'wpisów')}?`)) return;
  try {
    await grist.docApi.applyUserActions([['BulkRemoveRecord', 'Main', ids]]);
    state.selected.clear();
    updateBulkBtn();
    toast('Usunięto');
    loadMain().catch(console.error);
  } catch (e) {
    toast('Nie udało się usunąć', true);
  }
}

function updateBulkBtn(){
  const b = document.getElementById('bulkDel');
  b.hidden = state.selected.size === 0;
  b.textContent = `Usuń zaznaczone (${state.selected.size})`;
  document.getElementById('tbody').classList.toggle('has-sel', state.selected.size > 0);
}

/* ---------- rendering ---------- */

function renderSteps(){
  const f = state.flags;
  const items = [
    { k:'kiero',  full:'Kierownicy planują szkolenia pracowników',     short:'Kierownicy',  on:f.kiero },
    { k:'dyr',    full:'Dyrektorzy akceptują zaproponowane szkolenia', short:'Dyrektorzy',  on:f.dyr },
    { k:'prezes', full:'Prezesi zatwierdzają uczestnictwo',            short:'Prezesi',     on:f.prezes },
  ];
  document.getElementById('steps').innerHTML = items.map((s,i) =>
    (i ? '<span class="step-arrow">›</span>' : '') +
    `<span class="step s-${s.k}${s.on ? ' on' : ''}" title="${esc(s.full)}">
      <span class="dot"></span>${esc(s.on ? s.full : s.short)}</span>`
  ).join('');
}

function renderHead(){
  const f = state.flags;
  const live = ' <span class="live">aktywny etap</span>';
  document.getElementById('secRow').innerHTML =
    `<th class="selcol"></th>` +
    `<th colspan="5" class="sec-kiero${f.kiero ? ' sec-act' : ''}">Planowanie Kierowników${f.kiero ? live : ''}</th>` +
    `<th colspan="2" class="sec-dyr${f.dyr ? ' sec-act' : ''}">Akceptacja Dyrektorów${f.dyr ? live : ''}</th>` +
    `<th colspan="2" class="sec-prezes${f.prezes ? ' sec-act' : ''}">Zatwierdzenie Prezesów${f.prezes ? live : ''}</th>`;

  const sortTh = (col, label, def) => {
    const sorted = state.sort && state.sort.col === col;
    const arr = sorted ? (state.sort.dir > 0 ? '↑' : '↓') : '↑';
    const px = state.colWidths[col] || def;
    return `<th class="sortable${sorted ? ' sorted' : ''}" data-sortcol="${col}" data-rescol="${col}"
      style="min-width:${px}px; width:${px}px" title="Sortuj">${label}<span class="arr">${arr}</span><div class="resizer"></div></th>`;
  };
  const plainTh = (col, style, label) => {
    const stored = col && state.colWidths[col];
    const st = stored ? `width:${stored}px; min-width:${stored}px` : style;
    return `<th${col ? ` data-rescol="${col}"` : ''} style="${st}">${label}<div class="resizer"></div></th>`;
  };
  document.getElementById('colRow').innerHTML =
    `<th class="selcol"><input type="checkbox" id="selAll" title="Zaznacz wszystkie"></th>
     ${sortTh('Pracownik', 'Pracownik', 210)}
     ${sortTh('Szkolenie', 'Szkolenie', 300)}
     ${sortTh('Termin', 'Termin', 190)}
     ${plainTh('Priorytet', 'width:54px; text-align:center', 'Priorytet')}
     ${plainTh('Uzasadnienie', 'min-width:110px; max-width:200px', 'Uzasadnienie')}
     ${plainTh('Dyr_Akceptacja', 'width:60px; text-align:center', 'Akcept.')}
     ${plainTh('Dyr_Komentarz', 'min-width:130px', 'Komentarz')}
     ${plainTh('Prezes_Akceptacja', 'width:60px; text-align:center', 'Zatw.')}
     ${plainTh('Prezes_Komentarz', 'min-width:130px', 'Komentarz')}`;

  // Fix cols row sticky top to match actual secRow height
  requestAnimationFrame(() => {
    const secH = document.getElementById('secRow')?.getBoundingClientRect().height || 26;
    document.querySelectorAll('#colRow th').forEach(th => { th.style.top = secH + 'px'; });
  });
}

function cellPracownik(r, on){
  return `<input type="text" data-id="${r.id}" data-col="Pracownik" list="dl-prac"
    value="${esc(pracLabel(r.Pracownik))}" placeholder="— wybierz —"
    title="${esc(pracLabel(r.Pracownik))}" ${on ? '' : 'disabled'}>`;
}

function cellSzkolenie(r, on){
  const label = szkLabel(r.Szkolenie);
  const disp = label
    ? `<span class="szk-disp">${esc(label)}</span>`
    : `<span class="szk-disp empty-val">— wybierz —</span>`;
  return `<div class="cellcol">
    <label class="szk-cell">
      ${disp}
      <input type="text" data-id="${r.id}" data-col="Szkolenie" list="dl-szk"
        value="${esc(label)}" placeholder="— wybierz —" title="${esc(label)}" ${on ? '' : 'disabled'}>
    </label>
    </div>`;
}

function cellTermin(r, on){
  const t = validTermin(r);
  const dis = !on || !r.Szkolenie;
  // druga linia: lokalizacja · dni tygodnia · liczba dni · koszt
  const parts = [];
  if (t){
    const loc = t.lokalizacja || '';
    if (loc) parts.push(`<span class="${/online|zdaln/i.test(loc) ? 'online' : ''}">${esc(loc)}</span>`);
    const dniTyg = ((t.Termin_Detail || '').match(/\(([^)]+)\)\s*$/) || [])[1];
    if (dniTyg) parts.push(esc(dniTyg));
    if (t.dni_robocze) parts.push(esc(t.dni_robocze + ' dn.'));
    if (t.koszt){
      const free = /bezkoszt/i.test(t.koszt);
      parts.push(`<span class="${free ? 'cost-free' : 'cost-paid'}">${esc(t.koszt)}</span>`);
    }
  }
  const tip = t ? [t.Termin_Detail, t.termin_dt].filter(Boolean).join(' · ') : '';
  return `<div class="cellcol">
    <input type="text" data-id="${r.id}" data-col="Termin" list="dl-term-${r.Szkolenie || 0}"
      value="${esc(t ? t.termin : '')}" placeholder="${r.Szkolenie ? '— termin —' : 'najpierw szkolenie'}"
      title="${esc(tip)}" ${dis ? 'disabled' : ''}>
    ${parts.length ? `<div class="sub">${parts.join(' · ')}</div>` : ''}</div>`;
}

// textarea: zawija tekst, Shift+Enter = nowa linia, Enter = zapis
function cellText(r, col, on, ph){
  return `<textarea rows="1" data-id="${r.id}" data-col="${col}"
    placeholder="${esc(ph)}" ${on ? '' : 'disabled'}>${esc(r[col])}</textarea>`;
}

function cellSwitch(r, col, on, cls){
  return `<label class="switch ${cls}">
    <input type="checkbox" data-id="${r.id}" data-col="${col}" ${r[col] ? 'checked' : ''} ${on ? '' : 'disabled'}>
    <span class="track"></span></label>`;
}

function cellPriority(r, on){
  return `<input type="checkbox" class="priority-cb" data-id="${r.id}" data-col="Priorytet"
    ${r.Priorytet ? 'checked' : ''} ${on ? '' : 'disabled'}>`;
}

function rowHtml(r){
  const f = state.flags;
  const k = f.kiero, d = f.dyr, p = f.prezes;
  const cls = (sec, on, edge) => `class="c-${sec} ${on ? 'on' : 'off'}${edge ? ' ' + edge : ''}"`;
  return `<tr data-id="${r.id}">
    <td class="selcol"><input type="checkbox" class="rowsel" data-selid="${r.id}"
      ${state.selected.has(r.id) ? 'checked' : ''}></td>
    <td ${cls('kiero',k,'sec-l')}>${cellPracownik(r,k)}</td>
    <td ${cls('kiero',k)}>${cellSzkolenie(r,k)}</td>
    <td ${cls('kiero',k)}>${cellTermin(r,k)}</td>
    <td ${cls('kiero',k)} style="text-align:center">${cellPriority(r,k)}</td>
    <td ${cls('kiero',k,'sec-r')}>${cellText(r,'Uzasadnienie_Kierownika',k,'Uzasadnienie…')}</td>
    <td ${cls('dyr',d,'sec-l')} style="text-align:center">${cellSwitch(r,'Dyr_Akceptacja',d,'dyr')}</td>
    <td ${cls('dyr',d,'sec-r')}>${cellText(r,'Dyr_Komentarz',d,'Komentarz…')}</td>
    <td ${cls('prezes',p,'sec-l')} style="text-align:center">${cellSwitch(r,'Prezes_Akceptacja',p,'')}</td>
    <td ${cls('prezes',p,'sec-r')}>${cellText(r,'Prezes_Komentarz',p,'Komentarz…')}</td>
  </tr>`;
}

function groupRowHtml(key, label, count){
  const collapsed = state.collapsed.has(key);
  return `<tr class="group${collapsed ? ' collapsed' : ''}" data-gkey="${esc(key)}">
    <td colspan="10"><span class="chev">▾</span>${esc(label)}
    <span class="meta">${count} ${count === 1 ? 'wpis' : (count < 5 ? 'wpisy' : 'wpisów')}</span></td></tr>`;
}

function subRowHtml(label, count){
  return `<tr class="sub"><td colspan="10">${esc(label)}
    <span class="meta">· ${count} os.</span></td></tr>`;
}

function addRowHtml(){
  if (!state.flags.kiero) return '';
  return `<tr class="addrow"><td colspan="10">
    <button class="addline" id="addLine">＋ Dodaj wpis</button></td></tr>`;
}

function filteredRecords(){
  const q = state.search.trim().toLowerCase();
  let recs = state.main.slice();
  if (q){
    recs = recs.filter(r =>
      pracLabel(r.Pracownik).toLowerCase().includes(q) ||
      szkLabel(r.Szkolenie).toLowerCase().includes(q) ||
      pracKom(r.Pracownik).toLowerCase().includes(q) ||
      (r.Uzasadnienie_Kierownika || '').toLowerCase().includes(q)
    );
  }
  return recs;
}

function sortKey(r, col){
  if (col === 'Pracownik') return pracLabel(r.Pracownik);
  if (col === 'Szkolenie') return szkLabel(r.Szkolenie);
  if (col === 'Termin'){ const t = validTermin(r); return t ? (t.termin || '') : ''; }
  return '';
}

// bez sortowania: kolejność naturalna (nowe wpisy zostają na dole)
function cmpRecs(a, b){
  if (!state.sort) return a.id - b.id;
  const {col, dir} = state.sort;
  return sortKey(a, col).localeCompare(sortKey(b, col), 'pl') * dir || (a.id - b.id);
}

// przeglądarki z field-sizing:content (Chrome/Edge 123+) rosną same, bez JS;
// fallback robi zapisy i odczyty wsadowo (1 reflow zamiast jednego na textarea)
const FIELD_SIZING = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('field-sizing', 'content');
function fitTextareas(scope){
  if (FIELD_SIZING) return;
  const tas = [...scope.querySelectorAll('textarea')];
  if (!tas.length) return;
  for (const ta of tas) ta.style.height = 'auto';
  const hs = tas.map(ta => ta.scrollHeight);
  tas.forEach((ta, i) => ta.style.height = (hs[i] + 2) + 'px');
}

function render(fx){
  renderSteps();
  renderHead();
  const tbody = document.getElementById('tbody');
  tbody.classList.toggle('fx', !!fx);
  tbody.classList.toggle('has-sel', state.selected.size > 0);
  const recs = filteredRecords();

  if (!recs.length){
    tbody.innerHTML = `<tr><td colspan="10"><div class="state-msg">
      ${state.main.length ? 'Brak wyników dla tego filtra.' :
        '<b>Brak wpisów.</b><br>' + (state.flags.kiero
          ? 'Kliknij „Dodaj wpis”, aby rozpocząć planowanie.'
          : 'Wpisy pojawią się po rozpoczęciu etapu planowania.')}
    </div></td></tr>` + addRowHtml();
    return;
  }

  let html = '';
  const emit = r => { html += rowHtml(r); };

  if (state.groupBy === 'none'){
    recs.sort(cmpRecs).forEach(emit);

  } else if (state.groupBy !== 'szkolenie'){
    const keyFn =
      state.groupBy === 'biuro'   ? r => (r.Pracownik_biuro || '— bez biura') :
      state.groupBy === 'komorka' ? r => (pracKom(r.Pracownik) || '— bez przydziału')
                                  : r => (pracLabel(r.Pracownik) || '— bez przydziału');
    const groups = new Map();
    for (const r of recs){
      const k = keyFn(r);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    const grpCmp = state.groupSortDesc
      ? (a,b) => groups.get(b).length - groups.get(a).length
      : (a,b) => a.localeCompare(b,'pl');
    for (const k of [...groups.keys()].sort(grpCmp)){
      const rows = groups.get(k).sort(cmpRecs);
      html += groupRowHtml(k, k, rows.length);
      if (!state.collapsed.has(k)) rows.forEach(emit);
    }

  } else { // szkolenie → podgrupy per termin
    const groups = new Map();
    for (const r of recs){
      const k = szkLabel(r.Szkolenie) || '— bez szkolenia';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    const grpCmpS = state.groupSortDesc
      ? (a,b) => groups.get(b).length - groups.get(a).length
      : (a,b) => a.localeCompare(b,'pl');
    for (const k of [...groups.keys()].sort(grpCmpS)){
      const rows = groups.get(k);
      html += groupRowHtml(k, k, rows.length);
      if (state.collapsed.has(k)) continue;
      const subs = new Map();
      for (const r of rows){
        const t = validTermin(r);
        const sk = t ? (t.Termin_Detail || t.termin) : '— bez terminu';
        if (!subs.has(sk)) subs.set(sk, []);
        subs.get(sk).push(r);
      }
      for (const sk of [...subs.keys()].sort((a,b) => a.localeCompare(b,'pl'))){
        const srows = subs.get(sk).sort(cmpRecs);
        html += subRowHtml(sk, srows.length);
        srows.forEach(emit);
      }
    }
  }

  tbody.innerHTML = html + addRowHtml();
  fitTextareas(tbody);
  if (fx){
    let i = 0;
    for (const tr of tbody.rows) tr.style.animationDelay = Math.min(i++ * 14, 280) + 'ms';
    // bezpiecznik: gdy zegar animacji w iframe nie wystartuje (throttling),
    // wiersze zostałyby na opacity:0 — po czasie animacji zdejmujemy efekt
    clearTimeout(render._fxT);
    render._fxT = setTimeout(() => tbody.classList.remove('fx'), 700);
  }
}

/* ---------- events ---------- */

// mapowanie tekstu z comboboxa na id rekordu; undefined = nie znaleziono
function resolveRef(col, txt, rec){
  if (!txt) return 0;
  if (col === 'Pracownik') return state.pracByLabel.get(txt);
  if (col === 'Szkolenie') return state.szkByLabel.get(txt);
  if (col === 'Termin')    return state.termByKey.get(rec.Szkolenie + '|' + txt);
}

function refLabel(col, rec){
  if (col === 'Pracownik') return pracLabel(rec.Pracownik);
  if (col === 'Szkolenie') return szkLabel(rec.Szkolenie);
  if (col === 'Termin'){ const t = validTermin(rec); return t ? t.termin : ''; }
  return '';
}

document.getElementById('tbody').addEventListener('change', e => {
  const el = e.target;

  // zaznaczanie wierszy
  if (el.classList.contains('rowsel')){
    const id = Number(el.dataset.selid);
    el.checked ? state.selected.add(id) : state.selected.delete(id);
    updateBulkBtn();
    return;
  }

  const id = Number(el.dataset.id);
  const col = el.dataset.col;
  if (!id || !col) return;
  const rec = state.main.find(r => r.id === id);
  if (!rec) return;

  let value;
  if (el.type === 'checkbox'){
    value = el.checked;
  } else if (REF_COLS.includes(col)){
    value = resolveRef(col, el.value.trim(), rec);
    if (value === undefined){
      el.value = refLabel(col, rec);           // przywróć poprzednią wartość
      toast('Nie znaleziono takiej pozycji na liście', true);
      return;
    }
    if (value === (rec[col] || 0)) { el.value = refLabel(col, rec); return; }
  } else {
    value = el.value;
    if (value === (rec[col] || '')) return;
  }

  const fields = { [col]: value };

  // zmiana szkolenia unieważnia termin, jeśli nie pasuje do nowego szkolenia
  if (col === 'Szkolenie'){
    const t = state.term.get(rec.Termin);
    if (!t || t.SzkolenieRef_id !== value) fields.Termin = 0;
  }
  updateRec(id, fields);
});

document.getElementById('tbody').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (el.tagName === 'TEXTAREA'){
    if (e.shiftKey) return;          // Shift+Enter = nowa linia
    e.preventDefault(); el.blur();   // Enter = zapis
  } else if (el.tagName === 'INPUT' && el.type === 'text'){
    el.blur();
  }
});

document.getElementById('tbody').addEventListener('input', e => {
  if (e.target.tagName === 'TEXTAREA' && !FIELD_SIZING){
    e.target.style.height = 'auto';
    e.target.style.height = (e.target.scrollHeight + 2) + 'px';
  }
});

// combobox: fokus pokazuje od razu pełną listę (wartość chowa się do placeholdera);
// wyjście bez wyboru przywraca poprzednią wartość
document.getElementById('tbody').addEventListener('focusin', e => {
  const el = e.target;
  if (el.tagName === 'INPUT' && el.hasAttribute('list') && !el.disabled){
    el.dataset.prev = el.value;
    el.dataset.ph = el.placeholder;
    if (el.value){ el.placeholder = el.value; el.value = ''; }
  }
});

document.getElementById('tbody').addEventListener('focusout', e => {
  const el = e.target;
  if (el.isConnected && el.tagName === 'INPUT' && el.hasAttribute('list')){
    if (el.value === '' && el.dataset.prev) el.value = el.dataset.prev;
    if (el.dataset.ph !== undefined) el.placeholder = el.dataset.ph;
    delete el.dataset.prev; delete el.dataset.ph;
  }
  if (reloadPending){ reloadPending = false; scheduleReload(); }
});

document.getElementById('tbody').addEventListener('click', e => {
  if (e.target.closest('#addLine')){ addRec(); return; }
  const g = e.target.closest('tr.group');
  if (g && !e.target.closest('input,select,button,textarea')){
    const k = g.dataset.gkey;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    render();
  }
});

// sortowanie po kliknięciu nagłówka: rosnąco → malejąco → wyłączone
document.getElementById('colRow').addEventListener('click', e => {
  if (e.target.closest('.resizer')) return; // ignoruj kliknięcie na uchwyt resize
  const th = e.target.closest('th.sortable');
  if (!th) return;
  const col = th.dataset.sortcol;
  if (!state.sort || state.sort.col !== col) state.sort = { col, dir: 1 };
  else if (state.sort.dir === 1) state.sort.dir = -1;
  else state.sort = null;
  render();
});

// resize kolumn
document.getElementById('colRow').addEventListener('mousedown', e => {
  const rz = e.target.closest('.resizer');
  if (!rz) return;
  e.preventDefault(); e.stopPropagation();
  const th = rz.closest('th');
  const col = th.dataset.rescol || th.dataset.sortcol;
  const startX = e.clientX;
  const startW = th.getBoundingClientRect().width;
  rz.classList.add('rz-active');
  function onMove(ev){
    const newW = Math.max(40, startW + ev.clientX - startX);
    th.style.width = newW + 'px';
    th.style.minWidth = newW + 'px';
    if (col) state.colWidths[col] = newW;
  }
  function onUp(){
    rz.classList.remove('rz-active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

// zaznacz / odznacz wszystkie widoczne
document.getElementById('colRow').addEventListener('change', e => {
  if (e.target.id !== 'selAll') return;
  if (e.target.checked) filteredRecords().forEach(r => state.selected.add(r.id));
  else state.selected.clear();
  updateBulkBtn();
  render();
});

document.getElementById('groupSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-g]');
  if (!b) return;
  state.groupBy = b.dataset.g;
  state.collapsed.clear();
  document.querySelectorAll('#groupSeg button')
    .forEach(x => x.classList.toggle('on', x === b));
  const sortBtn = document.getElementById('groupSortBtn');
  const isGrouped = state.groupBy !== 'none';
  sortBtn.hidden = !isGrouped;
  if (!isGrouped){ state.groupSortDesc = false; sortBtn.classList.remove('active'); }
  render(true);
});

document.getElementById('groupSortBtn').addEventListener('click', () => {
  state.groupSortDesc = !state.groupSortDesc;
  document.getElementById('groupSortBtn').classList.toggle('active', state.groupSortDesc);
  render();
});

document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = e.target.value; render(); }, 180);
});

document.getElementById('bulkDel').addEventListener('click', delSelected);
document.getElementById('refreshBtn').addEventListener('click', () => {
  loadAll().then(() => toast('Odświeżono')).catch(() => toast('Błąd odświeżania', true));
});

/* ---------- init ---------- */

grist.ready({ requiredAccess: 'full' });
grist.onRecords(() => scheduleReload());

loadAll().catch(err => {
  console.error(err);
  document.getElementById('tbody').innerHTML =
    `<tr><td colspan="10"><div class="state-msg"><b>Nie udało się wczytać danych.</b><br>
    Sprawdź, czy widget ma dostęp „pełny” (full access) i czy tabele Main / Pracownicy /
    Baza_UnikatoweReczne / BazaTerminow są dostępne.</div></td></tr>`;
});

// PanelSterowania nie wyzwala onRecords dla Main u wszystkich — delikatny polling
setInterval(() => { if (!document.hidden) scheduleReload(); }, 45000);
</script>
</body>
</html>
