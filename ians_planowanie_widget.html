onal relationships in the workplace. Leadership The importance of leadership and behaviours that can help a supervisor to be accepted by colleagues as an effective leader are explored. Teamwork This module considers how a supervisor can support their organisation in obtaining the benefits of teamwork. Managing Conflict The causes of conflict, individual reaction to conflict situations and how these can be constructively dealt with are explored using various scenarios. Motivation What motivates people about their job, how this can change over time and tools that a supervisor can use to help motivate colleagues is considered. The course uses virtual classroom facilitation and teaching techniques to develop participants'''''''' basic knowledge of relevant subjects required to be effective in the role of an ATC operations supervisor. An interactive learning environment combines theory and practice, enabling the participants to share experiences and learn from each other. Group exercises, questionnaires and discussions are used to enable self-discovery by each participant and to reflect on their own attitudes in the operational context.","objectives":"To faciltate the transition of ATC staff into supervisory roles. To equip operational supervisors with the knowledge, skills and confidence to enhance performance in their current or future supervisory roles. To enable suprvisors to follow a systematic process that gives appropriate importance to all aspects of their role. To link performance to the internal and external environments.","audience":"This course is designed to facilitate the transition of operational ATC staff to supervisory roles. The course is equally designed for operational ATC staff recently appointed to supervisory roles.","duration":"This course takes place over 4 days. You will have 4 virtual sessions. You need to plan 14 hours to complete this course.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 800 EUR.","delivered_by":"Peter ALDERSON Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"Please note this course is intended for once only attendance. Refresher training for experienced supervisors is available for delivery at the client''s premises on request.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"HUM-SYS":{"terminy":[{"s":"2026-12-01 10:00","e":"2026-12-03 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"HUM-SYS","title_full":"Systems Thinking [HUM-SYS]","title_clean":"Systems Thinking","description":"To understand and improve the way that organisations work, we must think in systems. On this course, participants will explore 10 principles of systems thinking for safety to make sense of – and improve – system performance. The principles also help with practical implementation of Safety-II (i.e. ensuring that things go right). A variety of systems thinking methods will be introduced. The HUM-SYS course is delivered in a workshop format and provides a background understanding for the majority of the existing SAF and HUM Domain courses.","objectives":"The course will explore concepts of safety and systems, perspectives of the people in systems, system conditions, system behaviour and outcomes.","audience":"The course may be of interest to reach anyone involved in complex sociotechnical systems, but particularly managers, safety investigators, and safety representatives.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Fabrice DROGOUL Course manager Dr Steven SHORROCK Tutor Svetlana BUNJEVAC Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-TRM-ADV":{"terminy":[{"s":"2026-11-16 13:00","e":"2026-11-19 13:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"HUM-TRM-ADV","title_full":"TRM advance training [HUM-TRM-ADV]","title_clean":"TRM advance training","description":"TRM advanced training is a course for facilitators who need further practice in the application and implementation of a team resource management campaign. The course is also a refresher course for current TRM facilitators and provides participants with a new set of tools and the opportunity to work on practice additional HF aspects beyond the standard modules of the TRM guidelines. Pre-requisites be already a TRM facilitor","objectives":"Practice conducting advanced facilitated sessions on different HF topics Understand how to prepare a TRM campaign Integrate more tools and methods of facilitation Facilitate discussions between ops experts on their concerns or lessons learned through practice","audience":"Current TRM facilitators who requires further skills in order to be able to conduct more TRM sessions and TRM facilitators who need to refresh their skills.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Fabrice DROGOUL Course manager Ana Margarido Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-TRM-F":{"terminy":[{"s":"2026-10-19 10:00","e":"2026-10-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-02-08 10:00","e":"2027-02-12 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-TRM-F","title_full":"TRM Facilitator [HUM-TRM-F]","title_clean":"TRM Facilitator","description":"Team Resource Management (TRM) focuses on operational human performance and teamwork in ATM operations. It explores the gap between \"Work as Imagined\" and \"Work as Done\" in human factors terms. When implemented effectively, TRM focuses on things that go well during daily ATM operations and facilitates ways to replicate this success. It encourages the exchange and understanding of operational pitfalls and strengthens the human safety net. Personnel attending this course will be trained so that they are able to deliver TRM sessions for air traffic controllers. A high level of English language proficiency is needed as participants can expect to facilitate a group discussion and to co-facilitate a half-day TRM session.","objectives":"By the end of the course, participants will be able to: Use facilitation techniques to deliver TRM subject material Customize TRM training materials.","audience":"This course is designed for personnel who wish to become TRM facilitators. It is primarily aimed at air traffic controllers. However ATSEP and AIM personnel will also benefit from this course.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Peter ALDERSON Course manager Maximilian Bezzina Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"EU Commission Regulation 2015/340 states that one of the Acceptable Means of Compliance (AMC) for meeting the human factors ATC Refresher Training requirements (as part of Continuation Training) is to train air traffic controllers in team resource management. EUROCONTROL’s well-established TRM concept and prototype training material may be used by ANSPs to implement this AMC and consequently meet the regulatory requirement. Pre-requisites A sound theoretical background of the TRM initiative is needed as this course focuses on practical TRM aspects. Participants are therefore required to have either completed the TRM in ATM course, Introduction to TRM course or Team Resource Management: The basics course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-TTI":{"terminy":[{"s":"2027-03-01 09:00","e":"2027-03-05 15:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-TTI","title_full":"Theoretical Training Instructor Skills [HUM-TTI]","title_clean":"Theoretical Training Instructor Skills","description":"Training is a vital part of ensuring that everybody involved in ATM is competent for the tasks that they are asked to undertake. Training can take many forms, but to be effective it is important that the trainer understands the fundamental elements involved in transferring knowledge during a lesson. This course is designed to help those who are asked to produce and deliver classroom training material or to deliver work related presentations - to do it in the most effective way. Although mostly focused on a classroom-based training environment and ATCO training, the principles covered by this course are equally applicable to many other training situations (ATSEP; AIS/AIM ..)","objectives":"With this course we aim at supporting you in tailoring your work presentations and lessons. After completing this course, participants will have hands-on experience of delivering short theoretical training in lesson format. You will be asked to prepare and design, develop and deliver two lessons lasting up to 25 min each, together with designing one written test. Participant's sessions are debriefed, based on set guidelines.","audience":"This course is appropriate for colleagues who will be asked to design, develop and deliver theoretical training for ATM staff and/or presentation on ATM related events. It aims at fulfilling criteria from Acceptable Means of Compliance to Part-ATCO, subpart C, Section 1 (Instructors) for Commission Regulation (EU) 2015/340.","duration":"This course takes place over 5 days.","price":"This course is subject to User-Pays-Principle (UPP) from 1 Sep 2022. The price for all course participants is 1850 EUR.","delivered_by":"Fabrice DROGOUL Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is an examined and assessed training course. Pre-requisites We welcome interested participants with ICAO English language skills at level 4 or higher.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination & assessment(s) will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"IM-ADL":{"terminy":[{"s":"2026-11-02 09:00","e":"2026-11-03 12:00","dni":2,"dow":"Pon-Wt","lok":"Online"},{"s":"2026-11-05 09:00","e":"2026-11-06 12:00","dni":2,"dow":"Czw-Pt","lok":"Online"},{"s":"2026-11-12 09:00","e":"2026-11-13 12:00","dni":2,"dow":"Czw-Pt","lok":"Online"},{"s":"2026-12-17 09:00","e":"2026-12-18 12:00","dni":2,"dow":"Czw-Pt","lok":"Online"}],"course_id":"IM-ADL","title_full":"eEAD: AIS Document Library for Data Provider [IM-ADL]","title_clean":"eEAD: AIS Document Library for Data Provider","description":"This course provides the participants with an overview of the AIS Document Library application, a product designed to facilitate the management (storage, pre-publication, publication , versioning, retrieval, subscription) of AIS products for authorized users. On top of the management of the products such as AIPs, Amendments, Supplements, Circulars (AIC), Charts and eAIS packages, the AIS Document Maintenance Library supports the storing and retrieval of the ICAO Digital Data Sets. Participants will become acquainted with the workflows implemented in eEAD ADL and will learn how to manage them, including monitoring compliance with the AIRAC cycle.","objectives":"By the end of this course, participants will be able to: 1. Explain the purpose of the AIS Document Maintenance Library (ADL) product within eEAD system. 2. Identify the main functionalities of the ADL product within eEAD system. 3. Differentiate between Aeronautical Information Products within ADL including AIPs, Amendments, Supplements, AICs, Charts and eAIS packages. 4. Retrieve Aeronautical Information Products from ADL 5. Store ICAO Digital Data Sets in the AIS Document Maintenance Library. 6. Retrieve ICAO Digital Data Sets from the AIS Document Maintenance Library. 7. Apply the eEAD ADL workflows to process AIS products. 8. Monitor AIRAC cycle compliance within ADL.","audience":"This course is designed for aeronautical information operational professionals working in AIP units of AISPs.","duration":"This course takes place over 2 days. You will have 3 virtual sessions. You need to plan 6 hours to complete this course.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 290 EUR.","delivered_by":"Ioana TOANCHINA Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"IM-ADM":{"terminy":[{"s":"2026-07-13 10:00","e":"2026-07-17 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"},{"s":"2026-09-07 10:00","e":"2026-09-11 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"},{"s":"2026-10-19 10:00","e":"2026-10-23 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"},{"s":"2026-11-23 10:00","e":"2026-11-27 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"}],"course_id":"IM-ADM","title_full":"eEAD: AIS Data Maintenance for Data Provider [IM-ADM]","title_clean":"eEAD: AIS Data Maintenance for Data Provider","description":"This course provides participants with a mix of hands-on demonstrations and practical sessions on the eEAD ADM HMI, allowing them to maintain AIXM 5.1(.1) data in ADM (AIS Data Change Proposal Management, AIS Data Explorer applications), including uploading and downloading data. This is supplemented with an overview of the AIXM 5.1(.1) data structure and its hierarchy. This course also covers Digital NOTAM conceptual elements, including the AIXM Temporality Concept, the DNOTAM scenarios and the business rules management. as seen from the Data Maintenance application. Participants will become acquainted with the workflows implemented in eEAD ADM and will learn how to use them as administrative tools, supported by the customised AIS Data business rules that can be implemented individually by users (AIS Data Business Rules Management application). In support of the implementation of ICAO AIS Digital Data Sets, this course provides the participants with an overview of the Digital Data Sets extraction functionality (AIS Data Set Extraction Rule Management).","objectives":"By the end of this course, participants will be able to: 1. Explain the purpose of the ADM application as part of the eEAD system. 2. Identify the main functionalities of the product within eEAD system. 3. Apply the AIS Data Change Proposal (DCP) workflow to create, manage, verify and release Events for permanent and temporary AIS data changes within ADM. 4. Encode and manage Digital NOTAM Events in ADM using predefined DNOTAM scenarios and the AIXM 5.1(.1) Event extension in accordance with operational rules. 5. Configure and manage AIS Data Retrieval processes by creating Extraction Rules, Report Templates and Subscriptions. 6. Apply Business Rules Validation (BRV) mechanisms to verify AIS data quality, interpret validation results, and act on the customized business rules within ADM. 7. Identify the purpose and key elements of the Event extension and the AIXM TimeSlice used in Digital NOTAM coding. 8. Encode Digital NOTAM in support of the NOF. 9. Apply the AIS Data Retrieval functionalities in support of ICAO AIS Digital Data Sets.","audience":"This course is designed for aeronautical information operational professionals working in NOTAM offices and aeronautical data units of AISPs.","duration":"This course takes place over 5 days.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1270 EUR.","delivered_by":"Oscar CENTENO GIRALDE Content Manager Ioana TOANCHINA Course manager Razvan GULEAC Tutor Aleksander WOJTOWICZ Tutor Oleksandr SHUTOV Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) Display details Course Registration Request","important_note":"This course will take place at the EUROCONTROL Headquarter at 96, rue de la Fusée B - 1130 Brussels (BELGIUM) in the meeting room NEXUS. Pre-requisites Before taking this course, an understanding of Aeronautical Information Services/Management, and a basic knowledge of AIXM 5.1(.1) are required. In addition to this, knowledge of current EAD applications and procedures is required in order to facilitate this conversion course. The following EUROCONTROL Learning Zone modules are recommended before taking this course: AIXM 5 Information Modelling and Data Coding Basics [IM-AIXM-1] AIXM 5 purpose, scope and design concepts [IM-AIXM-2] AIXM 5 coding and provision of the Digital Data Sets [IM-AIXM-3]","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"IM-AIM":{"terminy":[{"s":"2026-10-12 10:00","e":"2026-10-15 15:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"IM-AIM","title_full":"From AIS to AIM towards SWIM [IM-AIM]","title_clean":"From AIS to AIM towards SWIM","description":"Major changes are taking place today in the way that aeronautical information is collected, managed and distributed. These changes are driven by the implementation of the aeronautical information management (AIM) concept within the Single European Sky ATM Research (SESAR) programme and the needs of aircraft operators. AIM is about providing the right digital aeronautical information in the right place at the right time. This course provides an awareness of the strategy designed to implement AIM across Europe. The course also provides a detailed view of the recent products and deliverables of the EUROCONTROL AIM Domain and the European AIS Database (EAD). The impact which the transition from the present aeronautical information services (AIS) to AIM will have on current working practices is also discussed. With the advent of modern flight management and navigation systems on aircraft, accuracy of aeronautical information is becoming increasingly important, and the course addresses the Single European Sky Aeronautical Data Quality (ADQ) Implementing Rule (IR) and Means of Compliance, together with the relevant European Single Sky Implementation (ESSIP) objective and the ICAO ‘Roadmap for the Transition from AIS to AIM’. The course also covers the safety impact of aeronautical information and the drivers for the evolution to a fully digital environment within AIM. Still more generally, accurate information (aeronautical, weather, flight, etc.) is essential for efficient and safe flight, which is recognised by the role of information management in SESAR. The future will bring many changes to the way in which such information is generated and used, evolving towards SWIM (system-wide information management.","objectives":"After completing the course, participants will have an understanding of current developments designed to provide a more efficient and effective AIM environment, and of the crucial role of the AIM concept in SESAR and the Single European Sky. Participants will also have an understanding of the capabilities and functionalities of the most recent products and deliverables of the Agency, and of the practical operating procedures necessary for handling, both for static and dynamic aeronautical data. They will also have the opportunity to handle Digital NOTAM demonstrators, providing them with hands-on experience with these new concepts of crucial importance for the near future. Participants will also develop an understanding of the role of information management and SWIM in the future ATM system as envisaged in SESAR.","audience":"This course is designed for AIS/AIM professionals, other aviation professionals whose business relates to AIS/AIM, and ATM professionals in general who want to follow and prepare for the developments in the field. It may also be of interest to NSA staff involved in corresponding system approval.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Ioana TOANCHINA Course manager Philippe SACRE Tutor Scott WILSON Tutor Francisco HOYAS Tutor Marko Zoricic Tutor Boris CORIC Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and
