Pre-requisites A pre-requisite for participation is a FEAST Administrator accreditation or a concurrent enrolment in a FEAST administrator course (FEAST-ADM-T).","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"GEN-AE":{"terminy":[{"s":"2026-10-06 11:00","e":"2026-10-09 14:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-01-26 11:00","e":"2027-01-29 14:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-04-06 11:00","e":"2027-04-09 14:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"GEN-AE","title_full":"Airline Economics: Principles and Realities [GEN-AE]","title_clean":"Airline Economics: Principles and Realities","description":"This course provides an overview of the evolution of the aviation industry, exploring political shifts, liberalisation, and privatisation. The market segmentation, its sophistication, and personalisation will be examined and explained. Network planning, the hub-and-spoke model, and factors such as geographical location, night curfews, and time zones will be discussed, followed by a comparison with the point-to-point model. The capacity management challenges will be explored, including denied boardings and involuntary rerouting, as well as sales strategies and the evolution of sales channels. The unique cost structure of the airline industry, where production cannot be stored, will be addressed. Aviation’s regulatory landscape, shaped by bilateralism and impacted by open skies agreements, will be analysed, with a focus on their effects on regional economies. The session will conclude with fleet planning, the industry's most complex task, and a look at future challenges in aviation.","objectives":"• Identify the economic principles governing airlines and how they differ from those in other industries. • Explain the specifics related to airline planning, including time horizons and the complexity of the decision-making process. • Recognise the contrasting characteristics of legacy and low-cost carriers. • Develop the ability to critically analyse current issues in the aviation industry, such as the impact of airspace closures on competition and the challenges of sustainability, including the potential for major airlines to achieve environmental sustainability.","audience":"Individuals already working in aviation, including staff from ANSPs, oversight authorities, as well as those at airports or in operational and supporting divisions of airlines are welcome.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member State Certified Organisations.The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Maria POPESCU-BOBOC Course manager Dr Piotr Ikanowicz Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"GEN-ATC-INTRO":{"terminy":[{"s":"2026-12-14 09:00","e":"2026-12-15 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-06-14 09:00","e":"2027-06-15 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-12-13 09:00","e":"2027-12-14 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"GEN-ATC-INTRO","title_full":"Discover Air Traffic Control [GEN-ATC-INTRO]","title_clean":"Discover Air Traffic Control","description":"Many people with an interest in aviation or employed in the support of Air Traffic Services (ATS) such as CNS, AIS, MET, finance, legal service, human resources or administration etc, would like to understand more about the job of the Air Traffic Controller. The GEN-ATC-INTRO course has been designed to provide a basic understanding of today’s Air Traffic Management (ATM), and to experience the working environment for air traffic controllers through “hands-on” practical exercises using real-time Air Traffic Control simulators. All participants will actively conduct guided Air Traffic Control simulator exercises in an Area Control environment and in a Tower Control environment. The insights and the experience that they will acquire will help the participants to appreciate the role of Air Traffic Control within the ATM system. Pre-requisites You need to have completed the GEN-ATM-INTRO e-learning course before attending this course.","objectives":"The aim is to give non-operational personnel, with an interest in aviation, the opportunity to understand and experience first hand the working environment, tasks and responsibilities of air traffic controllers.","audience":"GEN-ATC-INTRO is a short journey of discovery open to anyone interested or involved in ATC/ATM, eager to gain a better understanding what it feels like to be an air traffic controller. No prior Air Traffic Control (ATC) experience is required. The course and its pre-requisite are targeted at participants without aviation knowledge but participants should have a good command of the English language.","duration":"This course takes place over 2 days.","price":"The price per course participant is 740 EUR.","delivered_by":"Philip AMMERMANN Course manager Dragan MILANOVSKI Tutor Dr Aycan MUTLU Tutor Peter ALDERSON Tutor Miroslav ANDREEVSKI Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"GEN-ATM-UNI":{"terminy":[{"s":"2026-06-29 10:00","e":"2026-07-03 13:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-07-05 10:00","e":"2027-07-09 13:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"GEN-ATM-UNI","title_full":"ATM Summer School [GEN-ATM-UNI]","title_clean":"ATM Summer School","description":"The first three days of the week-long Summer School Programme start with an overview on relevant Air Traffic Management (ATM) system components and stakeholders based on current challenging developments. Topics covered are for example Network Operations and Planning, Performance Based Navigation, Airports, Sustainability, Security, Air Traffic Controller Selection and Artificial Intelligence. In addition to technical subjects, a pilot in active service with an airline will describe aviation’s constraints from an airline''s point of view. The last two days of the programme provide the participant with hands-on training on an air traffic controller’s tasks. After raising awareness about the different kinds of airspace used by commercial flights - how it is constructed and managed according to the landing, approach and en-route phases of flight -, the students are presented with traffic handling tools and safety nets used by controllers. This is all then brought together in a unique opportunity for participants to control traffic on high-fidelity simulators in the en-route phase of flight, as well as, depending on number of participants, a Tower simulation. Experienced air traffic control instructors will help participants maximise their understanding and appreciation of the thought processes required to handle busy traffic scenarios in modern-day European airspace. This training course provides students with a unique opportunity to learn from the different experts lecturing in this Summer School Programme. Pre-requisites Mandatory e-Learning: GEN-ATM-INTRO NAV-PBN-AWR NMO-ATFCM-FE NMO-ATFCM-BASIC SAF-CHG-BASIC Optional e-Learning: LEX-SES-E NMO-FPL-INTRO ATC-I-BASIC-ACFT ATC-I-BASIC-MET Separate registration is required for all these courses.","objectives":"After completing the course, participants will have - A thorough understanding of the existing European Air Traffic Management system and how it may evolve in the future. - Hands-on experience practical training on high-fidelity ATC simulator on from Tower and Area Control. - Interaction and networking of students from different universities studying aviation related programs. - One week (aviation) English interaction only","audience":"This course is designed for newcomers or university students in the domain of Air Traffic Management or Air Traffic Services who are eager to participate in a theoretical training in ATM as well as a practical ATC training.","duration":"This course takes place over 5 days.","price":"The price per course participant is 740 EUR.","delivered_by":"Philip AMMERMANN Course manager Dr Aycan MUTLU Tutor Miroslav ANDREEVSKI Tutor Philippe SACRE Tutor Dragan MILANOVSKI Tutor Christian FABER Tutor Peter ALDERSON Tutor Marc DAMITZ Tutor Timo BLUNCK Tutor Francisco HOYAS Tutor Mr Guy HAWSON Tutor David BOOTH Tutor Tobias SCHÖNFELD Tutor Dusan UGRENOVIC Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"GEN-CIVMIL":{"terminy":[{"s":"2026-10-20 13:00","e":"2026-10-23 14:00","dni":4,"dow":"Wt-Pt","lok":"Brussels"}],"course_id":"GEN-CIVMIL","title_full":"Civil - Military ATM Coordination [GEN-CIVMIL]","title_clean":"Civil - Military ATM Coordination","description":"This course, provided by the EUROCONTROL Civil-Military Coordination Division, looks at the work being done to enhance future civil-military coordination in the Single European Sky. The course examines the improvement of European ATM efficiency and effectiveness for the benefit of civil and military aerial needs and the development of viable solutions to support military ATM/CNS performance and civil-military systems interoperability. The military participation in all relevant Single European Sky (SES) and Single European Sky ATM Research (SESAR) activities is also discussed. Particular emphasis is given to national security and defence requirements.","objectives":"After completing the course, participants will have an improved understanding of civil-military ATM/CNS requirements and of the need for greater military involvement in national and international ATM processes.","audience":"This course is designed for civil and military staff from national civil and military aviation authorities, air navigation service providers, manufacturers and airspace users, working at both national and international level.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Mariana ANGUELOVA Content Manager Sandrine TASQUIN Course manager Timo BLUNCK Tutor Edgar REUBER Tutor Col. Igor KUREN Tutor LtCol Jorge PEREIRA Tutor Pavlin BELICHOVSKY Tutor Patrick PETRÉ Tutor Mario BOYERO PEREZ Tutor Mónica LOPES Tutor Yordan ILIEV Tutor Remus LACATUS Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"GEN-FUT":{"terminy":[{"s":"2027-06-14 10:00","e":"2027-06-18 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"GEN-FUT","title_full":"Towards the Digital European Sky [GEN-FUT]","title_clean":"Towards the Digital European Sky","description":"One of the flagship courses in the Aviation Learning Centre, GEN-FUT brings you into the future of ATM and Aviation. Articulated around the evolving SESAR concept of operations and near/long-term deployment plans, we will cover a lot of ground to give you an overview of the field in one week. Specifically, we will address institutional and general aspects (e.g. who is doing what in the Single European Sky, what are the challenges to growth), technical elements (CNS and Spectrum, SWIM, Artificial Intelligence, Cyber-Security etc.) and the crucial present and future operational concepts at airports, ATC centres and the Network Manager. The key topics of Civil/Military Interoperability, Aviation Safety, Drones, Sustainability, Human Factors, and others will also be addressed, as well as a view from the cockpit. Beyond EUROCONTROL experts, our presenters come from the whole industry, including SESAR3JU, EASA, Airspace Users etc. In its wide scope, the course will provide a taster to the detailed training provided on each of these topics in ALC.","objectives":"After completing the course, participants will have an appreciation of how the future European air traffic management system supporting aviation will evolve.","audience":"This course is designed for personnel working in any area of ATM, interested by an overview of how the future ATM world might look like.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE Course manager David BOOTH Tutor Marc DAMITZ Tutor Cengiz ARI Tutor Ralph TERREIN Tutor Timo BLUNCK Tutor Francisco HOYAS Tutor Magnus Molbaek Tutor Kacper WALCZAK Tutor Dr Paolino DE FALCO Tutor Lado Kuljanishvili Tutor Ioana TOANCHINA Tutor Dr Aycan MUTLU Tutor Quentin Van Keymeulen Tutor David BRAIN Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"From 2023, this course is based in the EUROCONTROL Aviation Learning Center in Luxembourg, once a year. It will be offered a second time per year in virtual form over several weeks.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"GEN-MANS":{"terminy":[{"s":"2026-09-15 10:00","e":"2026-09-18 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2026-12-07 10:00","e":"2026-12-10 13:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"},{"s":"2027-02-16 10:00","e":"2027-02-19 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-11-23 10:00","e":"2027-11-26 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"GEN-MANS","title_full":"Management Systems in the context of ATM/ANS [GEN-MANS]","title_clean":"Management Systems in the context of ATM/ANS","description":"Many successful organisations have for years been implementing management systems, or functional systems for quality, safety, environmental, etc. The motivation for those organisations was mainly to improve the business and/or to comply with regulations requiring the implementation of a management system. The implementation of management systems has not, however, always resulted in actual measurable improvements. The reasons for failure were mostly owing the fact that the concept of management systems was not understood, was misinterpreted or was ineffectively implemented, without taking account of the context of the organisation. Management commitment and staff buy-in are pre-requisite for an effective management system. The importance of management systems in the Single European Sky context has considerably increased. The implementation of a management system is compulsory for competent authority and service providers for all services within the ATM/ANS framework. Staff of the competent authorities involved in the oversight of service providers need to have knowledge what management systems are in order to effectively verify compliance, in particular in the view to execute risk based oversight The course will provide a systemic view of management systems, addressing the key components such as process management, risk management, compliance management, performance management, etc. Furthermore, it details some practices for the design and implementation of management systems. Finally, it addresses the Single European Sky (SES) regulatory requirements related to management systems, as well as practices for the competent authority and for service providers conducting internal audits of the management system. The course will attempt to provide answers to the following themes: Why do we need management systems? What are the components of a generic management system? Why do processes need to be managed? How do we know that the management system is performing as planned? What is the purpose of an ISO 9001 certificate? What is the purpose of compliance management? What are the regulatory requirements with regards to management systems? How do project management tools help to succeed with a change?","objectives":"Upon completing this course you will be able to: Understand the principles of management systems and the benefits they bring to the Organisation; Understand what management systems are composed of; Understand the concept of processes, their interrelations and their management; Understand the concept of performance measurement to monitor the performance of Management Systems; Understand the principles and the elements of the ISO 9001 standard; Understand the concept of compliance management, ensuring that an organisation complies with the applicable regulations and able to demonstrate it to the competent authority; Understand programme management tools and how they can be applied to implement management systems; Appreciate the Single European Sky (SES) regulations related to management systems; Appreciate the techniques associated with the oversight of management systems.","audience":"This course is recommended for staff from: ATM/ANS providers Complementary knowledge and skills for internal auditors and staff working in the area of quality, safety, security, etc. Competent Authority Complementary knowledge and skills for inspectors to support audits in the context of risk-based oversight. Organisations involved in ATM/ANS","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480,- EUR.","delivered_by":"Igor POLTORACKI Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"GEN-MENT":{"terminy":[{"s":"2026-11-03 09:00","e":"2026-11-04 16:30","dni":2,"dow":"Wt-Śr","lok":"Luxembourg"},{"s":"2027-05-26 09:00","e":"2027-05-27 16:30","dni":2,"dow":"Śr-Czw","lok":"Luxembourg"}],"course_id":"GEN-MENT","title_full":"Prepare and run an effective Mentoring program [GEN-MENT]","title_clean":"Prepare and run an effective Mentoring program","description":"The two day course is designed for HR specialists, Human Factor specialists and expertsworking on Diversity, Equity and Inclusion (DEI). The course gives introduction on mentoring in general, mentoring in aviation, how to set up, deploy, and manage an efficient mentoring programme. Mentoring is found to be one of the most efficient techniques in improving DEI in any company and specifically in CRM/TRM in aviation in general. ICAO will disseminate the PTP under its own auspices as well as through the TRAINAIR PLUS network.","objectives":"By the end of the course the participants will be able to explain: Fundaments of mentoring Mentoring in aviation Phases of mentoring program Basics of being an effective mentor/mentee Reverse mentoring","audience":"HR specialists, Human Factors specialists, DEI specialists","duration":"This course takes place over 2 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Milena BOWMAN Content Manager Sandrine TASQUIN Course manager Allyson Kukel Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"GEN-NMF":{"terminy":[{"s":"2026-09-28 09:00","e":"2026-09-30 16:00","dni":3,"dow":"Pon-Śr","lok":"Brussels"}],"course_id":"GEN-NMF","title_full":"Network Management Functions in European Air Traffic Management [GEN-NMF]","title_clean":"Network Management Functions in European Air Traffic Management","description":"This training course aims to provide participants with a comprehensive understanding of the network functions, tasks and responsibilities of the Network Manager in European Air Traffic Management (ATM). Participants will gain insights into the key tasks performed by the Network Manager in support of the execution of the network functions and their significance in maintaining safe, efficient, and harmonized air traffic operations. The training course will also provide an overview on the procedural, operational, and technical aspects across various entities in the ATM network.","objectives":"Describe the ATM network functions, and the tasks performed by the Network Manager and their implications for procedural, operational and technical aspects. Understand the role and significance of the Network Manager in ATM and its impact on the entire network. Explain the interactions and collaboration with various stakeholders involved in the Network Management functions and NM tasks. Identify the tools, systems, and processes used by the Network Manager and their integration with existing operational, technical frameworks and interfaces. Comprehend the challenges and considerations in managing air traffic flows, optimizing airspace capacity, coordinating scarce resources, and harmonizing procedures across the network. Analyse real-world case studies and examples related to the network functions and the tasks of the Network Manager and their implications for procedural, operational, and technical aspects.","audience":"Senior Air Traffic Controllers Air Traffic Management Experts Airline Operations and Planning Managers Airport Operations Personnel and Managers Civil Aviation Authorities (CAAs) and Regulators Aviation Managers and Decision Makers Aviation System Engineers and Technicians Flight Dispatchers and Operations Planners and CFSPs Aviation Policy Makers and Planners Industry Stakeholders and Consultants Military experts European institutions","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Christian FABER Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) Display details Course Registration Request","important_note":"This course will take place in the meeting room : VEGA Pre-requisites Background in Air Traffic Management (ATM): Participants should ideally have foundational knowledge and experience in air traffic management processes and systems to fully grasp the complex interactions and responsibilities discussed in the course. Familiarity with Air Traffic Control: Experience as air traffic controllers or familiarity with air traffic control operations can be highly beneficial, as the course delves into network-wide strategies for managing air traffic flows and capacity. Understanding of ATM Systems and Tools: Knowledge of the systems and tools used in ATM, such as those for flow management, capacity planning, and crisis management, would allow participants to better understand the technical discussions in the course. Experience in Aviation Operations: Experience in airline operations, airport management, or civil aviation authority roles would provide a practical perspective on how network management functions impact various stakeholders within the aviation industry. Regulatory and Policy Framework Knowledge: Awareness of the regulatory environment governing European airspace and how Eurocontrol interacts with various aviation stakeholders would be advantageous. Technical Expertise: Engineers and technicians involved in the maintenance and development of ATM systems would benefit from understanding how these systems are integrated and used by network managers. Strategic Planning and Decision-Making Skills: Senior managers, planners, and decision-makers in the aviation sector who are involved in strategic planning and operational decision-making would find the course particularly relevant.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-CCA":{"terminy":[{"s":"2026-10-12 10:00","e":"2026-10-16 16:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-11-16 10:00","e":"2026-11-20 16:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-03-08 10:00","e":"2027-03-12 17:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-12 10:00","e":"2027-04-16 17:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-10-04 10:00","e":"2027-10-08 17:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-11-15 10:00","e":"2027-11-19 17:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-CCA","title_full":"Controller Competency Assessor [HUM-CCA]","title_clean":"Controller Competency Assessor","description":"This course is approved by the Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. A key element of assuring the safety of air traffic services is ensuring that controllers are competent to perform their tasks safely. Because of this, both the EC Single European Sky regulatory framework and the EUROCONTROL Guideline Material include obligations to ensure that a controller is assessed as competent before being granted an air traffic controller licence. This is a competency based training course which utilizes CBTA methods and principles as prescribed by ICAO and EASA. The assessment process being taught, uses a formal competence scheme and an adapted competency model to assess the competence of air traffic controllers and to make a decision on whether they are competent to acquire a new qualification or renew an existing qualification. The course covers the use of both practical (dedicated and continuous) and oral assessments as means to determine competency of a candidate. Participants are provided with the rationale, knowledge, techniques and practical skills needed to undertake the role of a competence assessor. Pre-requisites Participants must hold or have held an air traffic controller licence.","objectives":"After completing this regulated course, participants will have been assessed on practical and pedagogical skills of competence assessment and will have an understanding of the current European controller competence regulations and the principles of competence assessment. In addition, participants will have an appreciation of competence assessment techniques and best practices to prepare them to take on the role of Competence Assessor.","audience":"This course is designed for air traffic controllers who will carry out assessments of competence of other air traffic controllers for either the issue of new qualifications or the renewal of existing qualifications.","duration":"This course takes place over 5 days.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1850 EUR.","delivered_by":"Philip AMMERMANN Course manager Dragan MILANOVSKI Tutor Peter ALDERSON Tutor Maximilian Bezzina Tutor Miroslav ANDREEVSKI Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the assessment(s) will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-CCA-R":{"terminy":[{"s":"2026-09-14 09:00","e":"2026-09-15 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2026-11-23 09:00","e":"2026-11-24 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-04-26 09:00","e":"2027-04-27 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-05-10 09:00","e":"2027-05-11 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-09-27 09:00","e":"2027-09-28 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-11-29 09:00","e":"2027-11-30 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"HUM-CCA-R","title_full":"Controller Competency Assessor – Refresher [HUM-CCA-R]","title_clean":"Controller Competency Assessor – Refresher","description":"This course is approved by the Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. This course provides experienced air traffic controllers who are competency assessors/examiners with refresher training that highlights and reinforces the knowledge and skills required to conduct effective assessments. The course encourages the active involvement of the participants. In addition to instructor-led presentations, participants are expected to analyse different topics and to participate in and facilitate small working groups. The cross-fertilisation of participant''s assessor experience has proved to be an important positive feature of the course. It is required that this course is taken by suitably qualified assessors at least every 3 years. As a practical element is part of this course, a valid Assessor endorsement will be required for all course participants. On the second day of the course participants will require to take a theory exam. Upon satisfactory completion of the course (examination pass mark = 75 %) each candidate is issued with a \"Certificate of Accomplishment\". Theoretical examination conducted in the HUM-CCA-R course shall have the structure and format of standard TZ computer based test. In case of failure, candidate(s) will be issued a \"Certificate of Attendance\". Pre-requisites Participants must hold or must have held an air traffic controller licence with a valid Assessor endorsement.","objectives":"After completing the course, participants with previous controller competency assessment (CCA) experience will have undertaken refresher training that reinforces the knowledge and skills in assessment techniques needed by a competency assessor.","audience":"This course is designed for air traffic controllers who are (or who were) competency assessors or who have previously completed a CCA course.","duration":"This course takes place over 2 days.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price for all course participants is 740 EUR.","delivered_by":"Miroslav ANDREEVSKI Course manager Philip AMMERMANN Tutor Peter ALDERSON Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance. Extra certificate text This course is approved by BSA-ANS (Belgian Supervisory Authority for Air Navigation Services).","terms_and_conditions":"Please see our Price List"},"HUM-CISM":{"terminy":[{"s":"2026-09-07 09:00","e":"2026-09-09 16:00","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"},{"s":"2027-04-12 09:00","e":"2027-04-14 16:00","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"}],"course_id":"HUM-CISM","title_full":"Critical Stress Management Peer training (certified course) [HUM-CISM]","title_clean":"Critical Stress Management Peer training (certified course)","description":"CISM is an interlocking and comprehensive peer-based programme to support colleagues after experiencing a critical incident. The aim is to manage the stress reactions caused by the critical incident and restore the individual''''s ability to work. This course is delivered with the support of the EUROPEAN CISM user group and the course is affiliated with ICISF. The following topics are included: natures & definitions of a psychological crisis and psychological crisis intervention nature and definition of critical incident stress management and its role as a continuum of care. empathic communication techniques practice of psychological triage SAFER-Revised model of individual psychological crisis intervention risks of iatrogenic “harm” associated with psychological crisis intervention principles of self-care","objectives":"- Understand the concepts behind CISM and the practicalities of the approach. - Understand the need and ways to implement CISM based on EASA regulations and EUROCONTROL best practices. - Discover examples of CISM intervention from ATM examples. - Gain certification of indivudual and group Crisis intevention skills ffrom ICISF on top of the EUROCONTROL diploma.","audience":"ATCOs, supervisors, safety and operational staff that are going to become CISM peers.","duration":"This course takes place over 3 days.","price":"The price per course participant is 1110 EUR.","delivered_by":"Fabrice DROGOUL Course manager Marc Baumgartner Tutor Claudine Meyer-Sager Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-DESIGN":{"terminy":[{"s":"2026-07-06 10:00","e":"2026-07-10 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-10-19 10:00","e":"2026-10-23 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-DESIGN","title_full":"Design and Assessment of Systems Using Human Centered Approaches [HUM-DESIGN]","title_clean":"Design and Assessment of Systems Using Human Centered Approaches","description":"Human Factors (HF) are concerned with the design of systems to optimise human well-being and overall system performance. To this end, HF practitioners contribute to the design and evaluation of tasks, jobs, products, environments and systems in order to make them compatible with the needs, abilities and limitations of people. However, practical experience shows that HF knowledge and methods are not systematically and not enough used in system design, although a lot of guidance material is available. Possible reasons include time pressure, costs, lack of involvement of HF expertise, scattered HF knowledge or just a lack of local experience. As a result, even basic ergonomic and HF principles are often not complied with in system design. This decreases overall system usability and user experience, reduces performance, increases workload and even undermines safety in air traffic control (ATC) operations. High additional expenses and delayed schedules are common consequences on a project management level. This course aims to identify in a systematic way the potential discrepancies between systems design, operations design and operators’ needs. The course promotes the human in the loop approach within design process as well as human-centred design processes. The course will detail the knowledge required to identify enhancements in current systems and how these evolutions can be developed in practice. The course covers critical elements in the design and construction of command-and-control systems including automation, information visualization and visual analytics but also interaction techniques and interaction technologies. These aspects can significantly modify operations making them less error-prone, more efficient and with a better user experience. However, these elements come with limitations such as complacency on automation or additional training. The course highlights trade-off between benefits and limitations of the different processes and techniques. Real-life examples from the aviation and space domains and other relevant domain will be used to illustrate the issues of complexity, unexpected resistance and the many limitations that can be encountered in designing interactive command-and-control systems. Pre-requisites have basic knowledge of HF Know the principle of system thinking.","objectives":"The course is aimed at ATM managers, regulators and operational staff who need to: - Describe iterative processes and detail how to involve users in the design process - List and describe the specificities of interactive systems and why they require specific development processes - Recall how to ensure usability and user experience in operational systems - State how to manage system development carried out by stakeholders following user-centric and iterative development processes - Explain how to ensure operators'''' performance, the quality of training material and to avoid human error - Descrbie how to design and assess the qualities of information visualizations and how information visualization impacts operations’ performance - Explain the benefits and drawbacks of automation on operators'''' performance, skills, training and well-being.","audience":"All ATM actors","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Fabrice DROGOUL Course manager Prof. Philippe Palanque Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination & assessment(s) will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-FRMS":{"terminy":[{"s":"2026-12-02 10:00","e":"2026-12-04 16:00","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"}],"course_id":"HUM-FRMS","title_full":"Fatigue Risk Management in ATM [HUM-FRMS]","title_clean":"Fatigue Risk Management in ATM","description":"In the context of the EU regulation 2017/373 requiring ANSPs to actively manage and monitor fatigue, this course equips participants with practical tools and data-driven approaches to fatigue risk management in ATM operations. The course provides an overview of the core scientific principles of sleep and fatigue, including predictive, proactive, and reactive elements of the fatigue management toolbox. It also includes insights into effective data collection, analysis, and treatment related to fatigue. Examples of real-world FRMS implementation practices within ATM environment will be discussed. Pre-requisites This course requires participants to have knowledge on Fatigue and Stress, either by having followed HUM-SFM or equivalent. Participants who have not followed SFM course will be registered on an e-learning course after having been selected for the FRMS course. The e-learning course has to be completed at least 2 months before the start of the FRMS course, to avoid the risk of being cancelled for not having met the pre-requisites.","objectives":"Recall the main scientific principles of sleep and fatigue. Explain the concept of Fatigue Risk Management Vs Fatigue Risk Management systems. Use tools to measure fatigue in operation. Describe the tools and data used for fatigue management in ATM to develop a clearer understanding of their role and impact. Explain how Fatigue Risk Management Systems (FRMS) can be integrated into Air Navigation Service Providers (ANSPs) to support operational safety.","audience":"ANSP staff in charge of fatigue management in their organisation and personnel that will be appointed to introduce FRMS in their organisation.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Fabrice DROGOUL Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-HF-CASE":{"terminy":[{"s":"2026-11-24 10:00","e":"2026-11-26 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-09-21 10:00","e":"2027-09-23 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"HUM-HF-CASE","title_full":"Integrating Human Factors in ATM Projects [HUM-HF-CASE]","title_clean":"Integrating Human Factors in ATM Projects","description":"EUROCONTROL has developed methods to systematically manage the identification and treatment of HF issues as early as possible in a project life cycle. The HF case methodology and HP assessment processes are designed to provide: * an explicit way to manage HF issues; * a checklist and traceability for HF issues as the project evolves; * risk minimisation for HF issues occurring at a critical stage; * ownership within the project team for HF; * improved decision-making, resource and budget justification for HF. The course is module-based and covers each of the stages involved in the preparation of a case for HF and the use of the HF case e-tool.","objectives":"After completing the course, participants will be able to apply the EUROCONTROL method as a practical HF integration process within ATM projects. Pre-requisites Participants are expected to have completed the HUM-HFA course. Active HF Experts and participants of other HF courses can contact the course manager to determine eligibility.","audience":"This course is designed for Human Factor (HF) specialists and other ATM personnel with HF knowledge and experience who are interested in applying a method to assess HF/HP in ATM projects.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110,-EUR.","delivered_by":"Adriana-Dana SCHMITZ Content Manager Sandrine TASQUIN Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-HFA":{"terminy":[{"s":"2026-10-19 10:00","e":"2026-10-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-12-07 10:00","e":"2026-12-11 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-01-11 10:00","e":"2027-01-15 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-HFA","title_full":"Human Factors for ATM Safety Actors [HUM-HFA]","title_clean":"Human Factors for ATM Safety Actors","description":"Human factors (HF) is a discipline looking at all aspects of the human being at work. Thus, understanding HF in safety activities is crucial. This course covers the fundamentals of HF and is designed for a wide audience. The course focuses on understanding the strengths of the human being in order to intervene in the working environment to capitalise on human flexibility, adaptability and good judgement.","objectives":"After completing the course, participants will have an understanding of safety issues from a human factors perspective, which encompasses individual factors, social and organisational factors, the HMI and working environment factors. Participants will be able to recognise and emphasise the strengths of the human being - such as flexibility, adaptability and learning skills - thereby enlarging the scope of HF analysis beyond human errors and incident investigation. Additionally, participants will have an understanding of the central contribution of the human factor to any safety activity. The large number of theoretical training (over 20 hours) on HF topics and the range of these topics make the course compliant to the HF requirements of EU regulations 965/2012, 1321/2014, 2015/340 as well as consistent with the ICAO documents 7192 in terms of HF (Training Manual).","audience":"This course is designed for staff having any safety role and responsibility in an ATM system, and other interested persons with a good understanding of operational matters.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Fabrice DROGOUL Course manager Nicola Cavagnetto Tutor Simone Pozzi Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-OJTI":{"terminy":[{"s":"2026-11-30 10:00","e":"2026-12-11 16:30","dni":12,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-01-25 10:00","e":"2027-02-05 16:30","dni":12,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-OJTI","title_full":"Practical Training Instructor skills for OJTI and STDI [HUM-OJTI]","title_clean":"Practical Training Instructor skills for OJTI and STDI","description":"The Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) has approved this course as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. The training for On-the-Job Training Instructors (OJTI) and Synthetic Training Device Instructors (STDI) provides theoretical knowledge and practical skills for ATC controllers who will undertake OJTI/STDI duties. The course uses various teaching methods such as role plays, videos, quizzes and discussions. Expect an interactive team and reflective learning classroom activites. The course comprises practical exercises in training techniques, coupled with comprehensice feedback from the course instructors. The practical exercises are carried out on radar simulators, using a Radar Skill Trainer (RST). No previous preparation is needed regardless of your ATC rating. This is an assessed course which includes examinations and assessments in both theory and practical OJTI/STDI skills.","objectives":"After completing the course, future On-the-Job Training Instructors (OJTI) and Synthetic Training Device Instructors (STDI) will have the skills necessary to help and safely guide air traffic controllers and students to progress toward a successful conclusion of their training.","audience":"This course is designed for air traffic controllers holding (or who have held) a surveillance rating who will be undertaking OJTI/STDI duties.","duration":"This course takes place over 10 days.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 3700 EUR.","delivered_by":"Peter ALDERSON Course manager Miroslav ANDREEVSKI Tutor Dragan MILANOVSKI Tutor Philip AMMERMANN Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"During the practical exercises, students will have the following roles: Student OJTIs Student controllers Pseudo-pilots, for which training will be provided. This course includes an exam of theoretical knowledge and understanding as well as practical assessments of OJTI and STDI skills. The exam is held on Monday in the second course week (Day 6). A student must achieve a minimum of 75% to pass the theoretical part of the training. A re-sit will be organised if a student fails to achieve 75%. On Wednesday and Thursday of the second week (Days 8 and 9), the assessment of practical OJTI/STDI skills takes place. The final assessment result is calculated based on two competence assessments per student conducted by two independent assessors. If a student fails to pass the assessment, a re-sit will be conducted on Friday, the last day of the course (Day 10). Pre-requisites Participants must hold or have held an air traffic controller licence.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination & assessment(s) will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-OJTI-M":{"terminy":[{"s":"2026-09-07 09:00","e":"2026-09-11 16:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-02-22 09:00","e":"2027-02-26 16:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-OJTI-M","title_full":"Practical Training Instructor skills for OJTI and STDI [HUM-OJTI-M]","title_clean":"Practical Training Instructor skills for OJTI and STDI","description":"This course is subject of approval by the Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. The Training Programme for On-the-Job Training Instructors (OJTI) and Synthetic Training Device Instructors (STDI) provides theoretical knowledge and practical skills for air traffic controllers who will undertake OJTI/STDI duties. The course combines virtual (online) sessions, self-paced e-learning and one week practical training in Luxembourg through variety of interactive learning methods such as case studies, role plays, videos, self-tests, discussions and practical exercises. The practical exercises are carried out on a ACS simulator. Participants act as practical instructors, students and pseudo-pilots focussing on coaching techniques, coupled with extensive feedback and assessments from the course instructors.","objectives":"After completing the course, future On-the-Job Training and Synthetic Training Device Instructors will have the skills necessary to help student controllers and trainees to progress toward a successful conclusion of their operational or simulator training.","audience":"This course is designed for air traffic controllers holding (or who have held) an ATCO licence with the associated rating(s) who will be undertaking OJTI/STDI duties.","duration":"This course takes place over 5-6 weeks. You will have 2 virtual sessions, and self-paced e-learning before attending 5 days in the classroom on the dates listed. You need to plan 50 hours to complete this course; 20 before the classroom, 30 in the classroom.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 3700 EUR.","delivered_by":"Peter ALDERSON Course manager Miroslav ANDREEVSKI Tutor Dragan MILANOVSKI Tutor Philip AMMERMANN Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"Registrations will close 4 weeks before the start date of the course in Luxembourg to allow time for completion of the e-learning part of this course. It is essential that participants are allowed at least 20 hours of official time in the 4 weeks before the start of the course in Luxembourg to complete the e-learning. This course includes a theory exam and practical assessments of OJTI and STDI skills that take place in Luxembourg. Two virtual sessions will be arranged with the participants in the weeks before the practical part of the course to review the e-learning and prepare for the theory exam. The theory exam is held on Day 1 in Luxembourg. A student must achieve a minimum of 75% to pass the theoretical part of the training. A re-sit will be organised if a student fails to achieve 75%. The practical assessments take place on Day 4 and 5. A student must achieve a minimum average of 75% in two assessements to pass the practical part of the training. A re-sit will be organised if a student fails to achieve 75%. Pre-requisites Participants must hold or have held an air traffic controller licence.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination & assessment(s) will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-OJTI-R":{"terminy":[{"s":"2026-09-16 09:00","e":"2026-09-18 16:30","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"},{"s":"2026-11-25 09:00","e":"2026-11-27 16:30","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"},{"s":"2027-04-28 09:00","e":"2027-04-30 16:30","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"},{"s":"2027-05-12 09:00","e":"2027-05-14 16:30","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"}],"course_id":"HUM-OJTI-R","title_full":"Practical Training Instructor Skills for OJTI and STDI - Refresher [HUM-OJTI-R]","title_clean":"Practical Training Instructor Skills for OJTI and STDI - Refresher","description":"This course is approved by the Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. It is required that the refresher course is taken by suitably qualified OJTIs/STDIs every 3 years. This course encourages the active participation through discussions in a reflective classroom. During the theory part, in addition to instructor-led presentations, the participants will be analysing various scenarios and exploring different contexts the practical instructors may experience. The exchange of experience between participants of different backgrounds has proved to be a significant added value of refresher training. The practical training and the assessment is carried out on a radar skill trainer where the course participants will be performing roles of OJTIs, and EALC course instructors/assessors will be playing the role of a student.","objectives":"The objective of this course is to refresh and enhance the knowledge, skills and instructional techniques of the practical instructors holding or have held OJTI or STDI endorsement (revalidation and renewal).","audience":"This course is designed for ATCOs (civil or military) who have previously completed training for practical instructors.","duration":"This course takes place over 3 days.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1110 EUR.","delivered_by":"Peter ALDERSON Course manager Miroslav ANDREEVSKI Tutor Dragan MILANOVSKI Tutor Philip AMMERMANN Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is based on the Commission Implementing Regulation (EU) 2015/340, ATCO.C.020 (b),(c) and ATCO.C.040 (b), (c) allowing REVALIDATION (a valid endorsement) and RENAWAL (an expired endorsement) of practical training instructor endorsements. Therefore, all practical instructors holding or have held an OJTI or STDI endorsements are welcome on the course. Two weeks before the course starts, all participants will receive access to training material including mandatory eLearning. To successfully complete the course, a participant must pass the practical instructor competence assessment. Pre-requisites A course participant must hold or have held an ATCO licence with an OJTI or STDI endorsement.","more_information":"Course timetable","certificate_awarded":"Candidates passing the assessment(s) will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-SFM":{"terminy":[{"s":"2026-10-27 10:00","e":"2026-10-29 14:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-03-22 10:00","e":"2027-03-24 14:00","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"}],"course_id":"HUM-SFM","title_full":"Stress and Fatigue management [HUM-SFM]","title_clean":"Stress and Fatigue management","description":"Based on Commission Implementing Regulation (EU) 2017/373 and ICAO annex 11 EUROCONTROL provides a safety related course on fatigue and stress management. The course will enable participants through practise and discussions to grasp the key factors producing stress and fatigue and to evaluate and recognise impacts and develop coping strategies.The course will then give you practicle ways to start developing Fatigue management in ATM and to understand the difference between FRM and FRMS. Pre-requisites Participants should have a basic knowledge on fatigue and stress and impact on human performance. This can be obtained by following the HUM-FAT-MGT and HUM-STRESS e-learning modules.","objectives":"To provide tools and support at both individual and organisational levels for managing stress and fatigue in operations. The course will provide participants with practical tools and knowledge to start a management plan (both at prescriptive and FRMS level).","audience":"Managers and professionals that need to understand how to manage stress and fatigue in ATM. Personnel that are going to start implementing systems for faitgue management in ATM, HR people concerned with rostering...","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Fabrice DROGOUL Course manager Anonymized Anonymized Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-SIM":{"terminy":[{"s":"2026-07-13 10:00","e":"2026-07-17 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-09-21 10:00","e":"2026-09-25 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-09-28 10:00","e":"2026-10-02 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-11-02 10:00","e":"2026-11-06 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-11-09 10:00","e":"2026-11-13 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-02-08 10:00","e":"2027-02-12 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-03-01 10:00","e":"2027-03-05 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-19 10:00","e":"2027-04-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-09-20 10:00","e":"2027-09-24 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-11-08 10:00","e":"2027-11-12 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-11-22 10:00","e":"2027-11-26 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-SIM","title_full":"Design of ATC Simulation Exercises and Courses [HUM-SIM]","title_clean":"Design of ATC Simulation Exercises and Courses","description":"The current European ATM regulatory framework requires all staff undertaking safety-related tasks to be appropriately trained and competent. Such training is often carried out using a combination of practical skills training and classroom-based training. Practical skills training for air traffic controllers is carried out using simulators. In order to be of value, it is important that this training is designed according to specific objectives. Our course includes both theoretical and practical work to achieve meaningful training for the creation of ATC simulation exercises for ACS/APS based on predefined training objectives. The topics covered include the fundamental principles and parameters of simulation exercise design, workload evaluation and evaluation of a simulation course. Pre-requisites Participants should have ATC experience. Experience with PCs (Windows) and MS Excel is strongly recommended.","objectives":"After completing the course, participants will have an understanding of the necessary elements in ATC simulation exercise and course design and will have gained practical experience in designing such exercises.","audience":"This course is designed for ATC instructors who are, or will be, involved in simulation courses and developing ATC simulation courses.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Miroslav ANDREEVSKI Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-SUP":{"terminy":[{"s":"2026-10-05 09:00","e":"2026-10-08 13:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"},{"s":"2026-11-10 09:00","e":"2026-11-13 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-04-20 09:00","e":"2027-04-23 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"HUM-SUP","title_full":"Operational Supervisor [HUM-SUP]","title_clean":"Operational Supervisor","description":"The skills required to supervise an operations room are very different from those needed to provide air traffic services. This course develops participants'''' knowledge on the following subjects in an interactive environment that encourages discussion and the sharing of experience. Communication This is a key skill as supervisors need to communicate effectively to obtain the help of others in carrrying out their duties. The Supervisor & Safety The significant difference between the role of a controller and a supervisor in providing a safe ATC service is explained. Individual Style This module helps to improve awareness of how individuals behave and the impact this can have on interpersonal relationships in the workplace. Leadership The importance of leadership and behaviours that can help a supervisor to be accepted by colleagues as an effective leader are explored. Teamwork This module considers how a supervisor can support their organisation in obtaining the benefits of teamwork. Motivation What motivates people about their job, how this can change over time and tools that a supervisor can use to help motivate colleagues is considered. Managing Conflict The causes of conflict, individual reaction to conflict situations and how these can be constructively dealt with are explored using various scenarios.","objectives":"To facilitate the transition of ATC staff into supervisory roles. To equip operational supervisors with the knowledge, skills and confidence to enhance performance in their current or future supervisory roles. To enable supervisors to follow a systematic process that gives appropriate importance to all aspects of their role. To link performance to the internal and external environments.","audience":"This course is designed to facilitate the transition of ATC staff into supervisory roles. The course is equally designed for operational ATC staff recently appointed into supervisory roles.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Peter ALDERSON Course manager Philip AMMERMANN Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"Please note this course is intended for once only attendance. Refresher training for experienced supervisors is available for delivery at the client''s premises on request. Pre-requisites A high level of English language proficiency is essential.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"HUM-SUP-B":{"terminy":[{"s":"2026-12-15 10:00","e":"2026-12-18 15:00","dni":4,"dow":"Wt-Pt","lok":"Online"}],"course_id":"HUM-SUP-B","title_full":"Operational Supervisor - Basic Course [HUM-SUP-B]","title_clean":"Operational Supervisor - Basic Course","description":"The skills required to supervise an operations room are very different from those needed to provide air traffic services. This basic course is designed to facilitate the transition of operational ATC staff to supervisory roles and covers the following subjects. Communication This is a key skill as supervisors need to communicate effectively to obtain the help of others in carrrying out their duties. The Supervisor & Safety The significant difference between the role of a controller and a supervisor in providing a safe ATC service is explained. Individual Style This module helps to improve awareness of how individuals behave and the impact this can have on interpers
