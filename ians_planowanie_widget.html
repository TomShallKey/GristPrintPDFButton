<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planowanie szkoleń</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#fff;--bg2:#f7f8fa;--line:#e9eaee;--line2:#f1f2f5;--txt:#1d1f24;--mut:#8a8f98;--mut2:#b4b8bf;--k:#3b82f6;--d:#8b5cf6;--p:#10b981;--red:#dc2626;--kb:rgba(59,130,246,.055);--db:rgba(139,92,246,.055);--pb:rgba(16,185,129,.06);--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font:12.5px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:13.5px;font-weight:650;white-space:nowrap}.steps{display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden}.step{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;color:var(--mut);font-weight:500;white-space:nowrap;border:1px solid transparent;font-size:12px}.step .dot{width:6px;height:6px;border-radius:50%;background:var(--mut2);flex:none}.step.on{color:var(--txt);background:var(--bg2);border-color:var(--line);font-weight:600}.step.on.s-kiero .dot{background:var(--k)}.step.on.s-dyr .dot{background:var(--d)}.step.on.s-prezes .dot{background:var(--p)}.step-arrow{color:var(--mut2)}.spacer{flex:1}
#search{width:150px;padding:5px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;outline:0;transition:.18s}#search:focus{width:210px;border-color:var(--k);box-shadow:0 0 0 3px var(--kb)}.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:2px}.seg button{border:0;background:transparent;font:inherit;color:var(--mut);font-size:12px;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:500}.seg button.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:var(--shadow)}.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--txt);font:inherit;font-weight:550;padding:5px 11px;border-radius:8px;cursor:pointer}.btn:hover{background:var(--bg2)}.btn.icon{padding:5px 8px}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.wrap{flex:1;overflow:auto;padding:0 14px 40px}.card{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;box-shadow:var(--shadow);min-width:max-content}table{border-collapse:separate;border-spacing:0;table-layout:fixed}col{width:var(--cw)}thead th{position:sticky;z-index:5;background:#fff;font-size:10.5px;font-weight:600;color:var(--mut);text-align:left;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}thead tr.sections th{top:0;z-index:6;padding:7px 8px 3px}thead tr.cols th{top:26px}.sec-kiero{color:var(--k)}.sec-dyr{color:var(--d)}.sec-prezes{color:var(--p)}th .live{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;font-size:10px;text-transform:none}.sec-kiero .live{background:var(--kb);color:var(--k)}.sec-dyr .live{background:var(--db);color:var(--d)}.sec-prezes .live{background:var(--pb);color:var(--p)}th.sortable{cursor:pointer;user-select:none}th .arr{margin-left:4px;opacity:0}th.sorted .arr{opacity:1;color:var(--k)}.selcol{width:30px!important;text-align:center;padding:4px!important}
.resizer{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;user-select:none;z-index:20}.resizer:hover,.resizer.rz-active{background:rgba(59,130,246,.4)}body.resizing{cursor:col-resize;user-select:none}body.resizing *{cursor:col-resize!important}
tbody td{padding:4px 8px;border-bottom:1px solid var(--line2);vertical-align:middle;background:#fff;overflow:hidden}tbody tr:hover td{background:#fbfbfc}td.on.c-kiero{background:var(--kb)}td.on.c-dyr{background:var(--db)}td.on.c-prezes{background:var(--pb)}tr.sections th.sec-act{box-shadow:inset 0 3px 0 rgba(16,185,129,.6),inset 3px 0 0 rgba(16,185,129,.6),inset -3px 0 0 rgba(16,185,129,.6)}thead tr.cols th.sec-l{box-shadow:inset 3px 0 0 rgba(16,185,129,.6)}thead tr.cols th.sec-r{box-shadow:inset -3px 0 0 rgba(16,185,129,.6)}td.on.sec-l{box-shadow:inset 3px 0 0 rgba(16,185,129,.55)}td.on.sec-r{box-shadow:inset -3px 0 0 rgba(16,185,129,.55)}tr.lastdata td.on.sec-l{box-shadow:inset 3px 0 0 rgba(16,185,129,.55),inset 0 -3px 0 rgba(16,185,129,.55)}tr.lastdata td.on.sec-r{box-shadow:inset -3px 0 0 rgba(16,185,129,.55),inset 0 -3px 0 rgba(16,185,129,.55)}td.off{position:relative}td.off>*{pointer-events:none}td.off:after{content:"";position:absolute;inset:0;cursor:not-allowed}.rowsel{visibility:hidden;cursor:pointer;accent-color:var(--k)}tr:hover .rowsel,.rowsel:checked,tbody.has-sel .rowsel{visibility:visible}
tr.group td{background:var(--bg2);border-bottom:1px solid var(--line);font-weight:650;height:34px;cursor:pointer}tr.group .chev{display:inline-block;width:16px;color:var(--mut)}tr.group.collapsed .chev{transform:rotate(-90deg)}tr.group .meta,tr.sub .meta{margin-left:10px;color:var(--mut);font-weight:500;font-size:11px}tr.sub td{background:#fcfcfd;font-weight:600;font-size:11.5px;color:var(--mut);height:28px;padding-left:34px}tr.addrow td{padding:0}.addline{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--mut);cursor:pointer;font:inherit;font-weight:550;padding:9px 12px}.addline:hover{background:var(--kb);color:var(--k)}
input[type=text],textarea{width:100%;min-width:0;font:inherit;color:var(--txt);border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;outline:0}textarea{resize:none;overflow:hidden;line-height:1.4;display:block;min-height:26px;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}input[type=text]:hover,textarea:hover{background:rgba(255,255,255,.9);border-color:var(--line)}input[type=text]:focus,textarea:focus{background:#fff;border-color:var(--k);box-shadow:0 0 0 3px var(--kb)}input:disabled,textarea:disabled{color:var(--txt)}input::placeholder,textarea::placeholder{color:var(--mut2)}.cellcol{min-width:0;overflow:hidden}.cellcol .sub{font-size:11px;color:var(--mut);margin-top:1px;padding-left:7px;white-space:normal;overflow-wrap:anywhere;line-height:1.25}.online{color:var(--p);font-weight:600}.cost-paid{color:var(--red);font-weight:650}.empty-val{color:var(--mut2)}
.szk-cell{display:block;position:relative;min-width:0}.szk-cell input{position:absolute;width:100%;height:0;padding:0;border:0;opacity:0;pointer-events:none}.szk-cell:focus-within input{position:static;height:auto;opacity:1;pointer-events:auto;padding:4px 6px;border:1px solid var(--k);box-shadow:0 0 0 3px var(--kb);background:#fff}.szk-cell:focus-within .szk-disp{display:none}.szk-disp{display:block;padding:4px 6px;white-space:normal;overflow-wrap:anywhere;min-height:26px;line-height:1.35}
.priority-star{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:2px}.priority-star input,.accept-toggle input{position:absolute;opacity:0;width:0;height:0}.priority-star .star{font-size:17px;color:var(--mut2)}.priority-star input:checked+.star{color:#f59e0b}.accept-toggle{display:inline-flex;border-radius:6px;border:1px solid var(--line);overflow:hidden;cursor:pointer}.at-no,.at-yes{padding:2px 7px;font-size:13px;font-weight:700}.at-no{color:var(--red);background:rgba(220,38,38,.07);border-right:1px solid var(--line)}.at-yes{color:var(--mut2)}.accept-toggle input:checked+.at-no{color:var(--mut2);background:transparent}.accept-toggle input:checked+.at-no+.at-yes{color:var(--p);background:rgba(16,185,129,.07)}
.state-msg{padding:50px 20px;text-align:center;color:var(--mut)}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--txt);color:#fff;padding:8px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:50}#toast.show{opacity:1;transform:translateX(-50%)}#toast.err{background:var(--red)}.skel{height:11px;border-radius:6px;margin:8px 0;background:#eef0f3}.grp-sort.active{background:var(--kb);color:var(--k);border-color:var(--k)}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d7d9de;border-radius:99px;border:2px solid var(--bg2)}
</style>
</head>
<body>
<div class="toolbar"><div class="brand">Planowanie szkoleń</div><div class="steps" id="steps"></div><div class="spacer"></div><button class="btn danger" id="bulkDel" hidden>Usuń zaznaczone</button><input id="search" type="text" placeholder="Szukaj…"><div class="seg" id="groupSeg"><button data-g="none" class="on">Brak</button><button data-g="biuro">Biuro</button><button data-g="komorka">Komórka</button><button data-g="pracownik">Pracownik</button><button data-g="szkolenie">Temat</button></div><button class="btn icon grp-sort" id="groupSortBtn" title="Sortuj grupy wg liczby wpisów" hidden>⇩</button><button class="btn icon" id="refreshBtn" title="Odśwież">↻</button></div>
<div class="wrap"><div class="card"><table id="tbl"><colgroup id="colgroup"></colgroup><thead><tr class="sections" id="secRow"></tr><tr class="cols" id="colRow"></tr></thead><tbody id="tbody"><tr><td colspan="10" style="padding:18px"><div class="skel"></div><div class="skel"></div></td></tr></tbody></table></div></div>
<div id="datalists"></div><div id="toast"></div>
<script>
"use strict";
const REF_COLS=['Pracownik','Szkolenie','Termin'],LS_WIDTHS='ians-planner-col-widths-v3';
const COLS=[
 {key:'_sel',def:30,min:30,max:30},{key:'Pracownik',def:210,min:110},{key:'Szkolenie',def:300,min:120},{key:'Termin',def:190,min:75},{key:'Priorytet',def:58,min:36},{key:'Uzasadnienie',def:160,min:90},{key:'Dyr_Akceptacja',def:74,min:58},{key:'Dyr_Komentarz',def:150,min:90},{key:'Prezes_Akceptacja',def:74,min:58},{key:'Prezes_Komentarz',def:150,min:90}
];
const state={main:[],prac:new Map(),szk:new Map(),term:new Map(),flags:{kiero:false,dyr:false,prezes:false},groupBy:'none',collapsed:new Set(),selected:new Set(),sort:null,search:'',loaded:false,colWidths:{},groupSortDesc:false,pracOpts:[],szkOpts:[],termOptsBySzk:new Map(),pracByLabel:new Map(),szkByLabel:new Map(),termByKey:new Map(),lastMainJson:'',suppressUntil:0};
try{Object.assign(state.colWidths,JSON.parse(localStorage.getItem(LS_WIDTHS)||'{}'))}catch(e){}
let reloadPending=false,reloadTimer=null,searchTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function colToRecs(data){return(data.id||[]).map((id,i)=>{const r={id};for(const c of Object.keys(data))if(c!=='id')r[c]=data[c][i];return r})}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='',err?3500:1400)}
const pracLabel=id=>state.prac.get(id)?.Kom_Osoba||'',pracKom=id=>state.prac.get(id)?.Komorka||'',szkLabel=id=>state.szk.get(id)?.title_full||'';
function validTermin(r){const t=state.term.get(r.Termin);return t&&t.SzkolenieRef_id===r.Szkolenie?t:null}
function widthOf(c){const n=Number(state.colWidths[c.key]);return Math.max(c.min,Math.min(c.max||1000,Number.isFinite(n)?n:c.def))}
function tableWidth(){return COLS.reduce((s,c)=>s+widthOf(c),0)}
function renderCols(){document.getElementById('colgroup').innerHTML=COLS.map(c=>`<col data-colkey="${c.key}" style="--cw:${widthOf(c)}px">`).join('');document.getElementById('tbl').style.width=tableWidth()+'px'}
function setColWidth(key,w){const c=COLS.find(x=>x.key===key);if(!c||key==='_sel')return;w=Math.max(c.min,Math.min(c.max||1000,Math.round(w)));state.colWidths[key]=w;const col=document.querySelector(`#colgroup col[data-colkey="${CSS.escape(key)}"]`);if(col)col.style.setProperty('--cw',w+'px');document.getElementById('tbl').style.width=tableWidth()+'px';try{localStorage.setItem(LS_WIDTHS,JSON.stringify(state.colWidths))}catch(e){}}
async function loadAll(){const a=grist.docApi,[main,prac,szk,term]=await Promise.all([a.fetchTable('Main'),a.fetchTable('Pracownicy'),a.fetchTable('Baza_UnikatoweReczne'),a.fetchTable('BazaTerminow')]);state.main=colToRecs(main);state.lastMainJson=JSON.stringify(main);state.prac=new Map(colToRecs(prac).map(r=>[r.id,r]));state.szk=new Map(colToRecs(szk).map(r=>[r.id,r]));state.term=new Map(colToRecs(term).map(r=>[r.id,r]));buildOpts();await loadFlags();const first=!state.loaded;state.loaded=true;render(first)}
async function loadFlags(){let f=null;try{const p=colToRecs(await grist.docApi.fetchTable('PanelSterowania'))[0];if(p)f={kiero:!!p.EdycjaKiero,dyr:!!p.AkceptacjaDyr,prezes:!!p.AkceptacjaPrezes}}catch(e){}if(!f&&state.main.length){const m=state.main[0];f={kiero:!!m.EdycjaKiero,dyr:!!m.AkceptacjaDyr,prezes:!!m.AkceptacjaPrezes}}const changed=f&&JSON.stringify(f)!==JSON.stringify(state.flags);if(f)state.flags=f;return changed}
function buildOpts(){const cmp=(a,b)=>String(a[1]||'').localeCompare(String(b[1]||''),'pl');state.pracOpts=[...state.prac.values()].map(p=>[p.id,p.Kom_Osoba||'']).sort(cmp);state.szkOpts=[...state.szk.values()].map(s=>[s.id,s.title_full||'']).sort(cmp);state.pracByLabel=new Map(state.pracOpts.map(([i,l])=>[l,i]));state.szkByLabel=new Map(state.szkOpts.map(([i,l])=>[l,i]));state.termOptsBySzk=new Map();state.termByKey=new Map();for(const t of state.term.values()){if(!t.SzkolenieRef_id)continue;if(!state.termOptsBySzk.has(t.SzkolenieRef_id))state.termOptsBySzk.set(t.SzkolenieRef_id,[]);state.termOptsBySzk.get(t.SzkolenieRef_id).push([t.id,t.termin||'']);state.termByKey.set(t.SzkolenieRef_id+'|'+(t.termin||''),t.id)}for(const l of state.termOptsBySzk.values())l.sort(cmp);let h=`<datalist id="dl-prac">${state.pracOpts.map(([,l])=>`<option value="${esc(l)}">`).join('')}</datalist><datalist id="dl-szk">${state.szkOpts.map(([,l])=>`<option value="${esc(l)}">`).join('')}</datalist>`;for(const[i,l]of state.termOptsBySzk)h+=`<datalist id="dl-term-${i}">${l.map(([tid,x])=>{const t=state.term.get(tid),info=[t?.lokalizacja,t?.dni_robocze?t.dni_robocze+' dn.':'',t?.koszt].filter(Boolean).join(' · ');return`<option value="${esc(x)}"${info?` label="${esc(info)}"`:''}>`}).join('')}</datalist>`;document.getElementById('datalists').innerHTML=h}
async function loadMain(){const main=await grist.docApi.fetchTable('Main'),fc=await loadFlags(),j=JSON.stringify(main);if(j===state.lastMainJson&&!fc)return;state.lastMainJson=j;state.main=colToRecs(main);state.selected=new Set([...state.selected].filter(id=>state.main.some(r=>r.id===id)));updateBulkBtn();render()}
function scheduleReload(){if(Date.now()<state.suppressUntil)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#tbody')){reloadPending=true;return}clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>loadMain().catch(console.error),150)}
async function updateRec(id,fields){const r=state.main.find(x=>x.id===id),prev=r?{...r}:null;if(r)Object.assign(r,fields);(state.groupBy!=='none'&&REF_COLS.some(c=>c in fields)||state.sort&&state.sort.col in fields)?render():rerenderRow(id);try{await grist.docApi.applyUserActions([['UpdateRecord','Main',id,fields]]);state.suppressUntil=Date.now()+2500;toast('Zapisano')}catch(e){if(r&&prev)Object.assign(r,prev);toast('Nie udało się zapisać — brak uprawnień na tym etapie?',true);loadAll()}}
async function addRec(){try{await grist.docApi.applyUserActions([['AddRecord','Main',null,{}]]);toast('Dodano wpis');loadMain()}catch(e){toast('Nie udało się dodać wpisu',true)}}
async function delSelected(){const ids=[...state.selected];if(!ids.length||!confirm(`Usunąć ${ids.length} wpisów?`))return;try{await grist.docApi.applyUserActions([['BulkRemoveRecord','Main',ids]]);state.selected.clear();updateBulkBtn();toast('Usunięto');loadMain()}catch(e){toast('Nie udało się usunąć',true)}}
function updateBulkBtn(){const b=document.getElementById('bulkDel');b.hidden=!state.selected.size;b.textContent=`Usuń zaznaczone (${state.selected.size})`;document.getElementById('tbody').classList.toggle('has-sel',!!state.selected.size)}
function renderSteps(){const f=state.flags,a=[['kiero','Kierownicy zgłaszają (20.08–02.09)',f.kiero],['dyr','Dyrektorzy akceptują (17.09–30.09)',f.dyr],['prezes','Prezesi zatwierdzają (01–07.10)',f.prezes]];steps.innerHTML=a.map((x,i)=>(i?'<span class="step-arrow">›</span>':'')+`<span class="step s-${x[0]}${x[2]?' on':''}"><span class="dot"></span>${x[1]}</span>`).join('')}
function renderHead(){renderCols();const f=state.flags,live='<span class="live">aktywny etap</span>';secRow.innerHTML=`<th class="selcol"></th><th colspan="5" class="sec-kiero${f.kiero?' sec-act':''}">Planowanie Kierowników ${f.kiero?live:''}</th><th colspan="2" class="sec-dyr${f.dyr?' sec-act':''}">Akceptacja Dyrektorów ${f.dyr?live:''}</th><th colspan="2" class="sec-prezes${f.prezes?' sec-act':''}">Zatwierdzenie Prezesów ${f.prezes?live:''}</th>`;const th=(key,label,sortable,edge)=>`<th data-rescol="${key}" ${sortable?`data-sortcol="${key}"`:''} class="${sortable?'sortable ':''}${state.sort?.col===key?'sorted ':''}${edge||''}" title="${sortable?'Sortuj':''}">${label}${sortable?`<span class="arr">${state.sort?.col===key&&state.sort.dir<0?'↓':'↑'}</span>`:''}<div class="resizer"></div></th>`;colRow.innerHTML=`<th class="selcol"><input type="checkbox" id="selAll"></th>${th('Pracownik','Pracownik',1,f.kiero?'sec-l':'')}${th('Szkolenie','Szkolenie',1,'')}${th('Termin','Termin',1,'')}${th('Priorytet','Priorytet',0,'')}${th('Uzasadnienie','Uzasadnienie',0,f.kiero?'sec-r':'')}${th('Dyr_Akceptacja','Akcept.',0,f.dyr?'sec-l':'')}${th('Dyr_Komentarz','Komentarz',0,f.dyr?'sec-r':'')}${th('Prezes_Akceptacja','Zatw.',0,f.prezes?'sec-l':'')}${th('Prezes_Komentarz','Komentarz',0,f.prezes?'sec-r':'')}`;requestAnimationFrame(()=>{const h=secRow.getBoundingClientRect().height||26;[...colRow.cells].forEach(x=>x.style.top=h+'px')})}
function drawSecIndicators(){}
const input=(r,c,list,val,ph,on)=>`<input type="text" data-id="${r.id}" data-col="${c}" list="${list}" value="${esc(val)}" placeholder="${ph}" title="${esc(val)}" ${on?'':'disabled'}>`;
function cellSzkolenie(r,on){const l=szkLabel(r.Szkolenie),v=l?esc(l).replace(/^(\[[^\]]+\])/, '<strong>$1</strong>'):'<span class="empty-val">— wybierz —</span>';return `<div class="cellcol"><label class="szk-cell"><span class="szk-disp">${v}</span>${input(r,'Szkolenie','dl-szk',l,'— wybierz —',on)}</label></div>`}
function cellTermin(r,on){const t=validTermin(r),p=[];if(t){if(t.lokalizacja)p.push(`<span class="${/online|zdaln/i.test(t.lokalizacja)?'online':''}">${esc(t.lokalizacja)}</span>`);const d=((t.Termin_Detail||'').match(/\(([^)]+)\)\s*$/)||[])[1];if(d)p.push(esc(d));if(t.dni_robocze)p.push(esc(t.dni_robocze+' dn.'));if(t.koszt)p.push(`<span class="${/bezkoszt/i.test(t.koszt)?'':'cost-paid'}">${esc(t.koszt)}</span>`)}return `<div class="cellcol">${input(r,'Termin','dl-term-'+(r.Szkolenie||0),t?.termin||'',r.Szkolenie?'— termin —':'najpierw szkolenie',on&&r.Szkolenie)}${p.length?`<div class="sub">${p.join(' · ')}</div>`:''}</div>`}
const text=(r,c,on,ph)=>`<textarea rows="1" data-id="${r.id}" data-col="${c}" placeholder="${ph}" ${on?'':'disabled'}>${esc(r[c])}</textarea>`,accept=(r,c,on)=>`<label class="accept-toggle"><input type="checkbox" data-id="${r.id}" data-col="${c}" ${r[c]?'checked':''} ${on?'':'disabled'}><span class="at-no">✗</span><span class="at-yes">✓</span></label>`;
function rowHtml(r){const f=state.flags,cl=(s,on,e)=>`class="c-${s} ${on?'on':'off'}${e?' '+e:''}"`;return `<tr data-id="${r.id}"><td class="selcol"><input type="checkbox" class="rowsel" data-selid="${r.id}" ${state.selected.has(r.id)?'checked':''}></td><td ${cl('kiero',f.kiero,'sec-l')}>${input(r,'Pracownik','dl-prac',pracLabel(r.Pracownik),'— wybierz —',f.kiero)}</td><td ${cl('kiero',f.kiero)}>${cellSzkolenie(r,f.kiero)}</td><td ${cl('kiero',f.kiero)}>${cellTermin(r,f.kiero)}</td><td ${cl('kiero',f.kiero)} style="text-align:center"><label class="priority-star"><input type="checkbox" data-id="${r.id}" data-col="Priorytet" ${r.Priorytet?'checked':''} ${f.kiero?'':'disabled'}><span class="star">★</span></label></td><td ${cl('kiero',f.kiero,'sec-r')}>${text(r,'Uzasadnienie_Kierownika',f.kiero,'Uzasadnienie…')}</td><td ${cl('dyr',f.dyr,'sec-l')} style="text-align:center">${accept(r,'Dyr_Akceptacja',f.dyr)}</td><td ${cl('dyr',f.dyr,'sec-r')}>${text(r,'Dyr_Komentarz',f.dyr,'Komentarz…')}</td><td ${cl('prezes',f.prezes,'sec-l')} style="text-align:center">${accept(r,'Prezes_Akceptacja',f.prezes)}</td><td ${cl('prezes',f.prezes,'sec-r')}>${text(r,'Prezes_Komentarz',f.prezes,'Komentarz…')}</td></tr>`}
function rerenderRow(id){const tr=document.querySelector(`#tbody tr[data-id="${id}"]`),r=state.main.find(x=>x.id===id);if(!tr||!r)return render();const t=document.createElement('tbody');t.innerHTML=rowHtml(r);tr.replaceWith(t.firstElementChild);fitTextareas(tbody)}
function fitTextareas(s){[...s.querySelectorAll('textarea')].forEach(x=>{x.style.height='auto';x.style.height=x.scrollHeight+2+'px'})}
function filteredRecords(){const q=state.search.trim().toLowerCase();return state.main.filter(r=>!q||[pracLabel(r.Pracownik),szkLabel(r.Szkolenie),pracKom(r.Pracownik),r.Uzasadnienie_Kierownika||''].some(x=>x.toLowerCase().includes(q)))}
function sortKey(r,c){return c==='Pracownik'?pracLabel(r.Pracownik):c==='Szkolenie'?szkLabel(r.Szkolenie):c==='Termin'?(validTermin(r)?.termin||''):''}function cmp(a,b){return state.sort?sortKey(a,state.sort.col).localeCompare(sortKey(b,state.sort.col),'pl')*state.sort.dir||a.id-b.id:a.id-b.id}
function groupRow(k,n){return `<tr class="group${state.collapsed.has(k)?' collapsed':''}" data-gkey="${esc(k)}"><td colspan="10"><span class="chev">▾</span>${esc(k)}<span class="meta">${n} wpisów</span></td></tr>`}function addRow(){return state.flags.kiero?'<tr class="addrow"><td colspan="10"><button class="addline" id="addLine">＋ Dodaj wpis</button></td></tr>':''}
function render(){renderSteps();renderHead();const rs=filteredRecords();if(!rs.length){tbody.innerHTML=`<tr><td colspan="10"><div class="state-msg">${state.main.length?'Brak wyników dla tego filtra.':'<b>Brak wpisów.</b>'}</div></td></tr>`+addRow();return}let h='';if(state.groupBy==='none')rs.sort(cmp).forEach(r=>h+=rowHtml(r));else{const fn=state.groupBy==='biuro'?r=>r.Pracownik_biuro||'— bez biura':state.groupBy==='komorka'?r=>pracKom(r.Pracownik)||'— bez przydziału':state.groupBy==='pracownik'?r=>pracLabel(r.Pracownik)||'— bez przydziału':r=>szkLabel(r.Szkolenie)||'— bez szkolenia',g=new Map();rs.forEach(r=>{const k=fn(r);if(!g.has(k))g.set(k,[]);g.get(k).push(r)});let ks=[...g.keys()];ks.sort(state.groupSortDesc?(a,b)=>g.get(b).length-g.get(a).length:(a,b)=>a.localeCompare(b,'pl'));for(const k of ks){h+=groupRow(k,g.get(k).length);if(!state.collapsed.has(k))g.get(k).sort(cmp).forEach(r=>h+=rowHtml(r))}}tbody.innerHTML=h+addRow();const dr=tbody.querySelectorAll('tr[data-id]');if(dr.length)dr[dr.length-1].classList.add('lastdata');fitTextareas(tbody)}
function resolveRef(c,v,r){if(!v)return 0;return c==='Pracownik'?state.pracByLabel.get(v):c==='Szkolenie'?state.szkByLabel.get(v):state.termByKey.get(r.Szkolenie+'|'+v)}function refLabel(c,r){return c==='Pracownik'?pracLabel(r.Pracownik):c==='Szkolenie'?szkLabel(r.Szkolenie):validTermin(r)?.termin||''}
tbody.addEventListener('change',e=>{const x=e.target;if(x.classList.contains('rowsel')){x.checked?state.selected.add(+x.dataset.selid):state.selected.delete(+x.dataset.selid);return updateBulkBtn()}const id=+x.dataset.id,c=x.dataset.col;if(!id||!c)return;const r=state.main.find(y=>y.id===id);let v=x.type==='checkbox'?x.checked:REF_COLS.includes(c)?resolveRef(c,x.value.trim(),r):x.value;if(v===undefined){x.value=refLabel(c,r);return toast('Nie znaleziono takiej pozycji na liście',true)}if(v===(r[c]||(/checkbox/.test(x.type)?false:0)))return;const f={[c]:v};if(c==='Szkolenie'&&state.term.get(r.Termin)?.SzkolenieRef_id!==v)f.Termin=0;updateRec(id,f)});
tbody.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();e.target.blur()}});tbody.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA')fitTextareas(tbody)});tbody.addEventListener('focusin',e=>{const x=e.target;if(x.matches('input[list]:not(:disabled)')){x.dataset.prev=x.value;x.dataset.ph=x.placeholder;if(x.value){x.placeholder=x.value;x.value=''}}});tbody.addEventListener('focusout',e=>{const x=e.target;if(x.matches('input[list]')){if(!x.value&&x.dataset.prev)x.value=x.dataset.prev;x.placeholder=x.dataset.ph||x.placeholder}if(reloadPending){reloadPending=false;scheduleReload()}});tbody.addEventListener('click',e=>{if(e.target.closest('#addLine'))return addRec();const g=e.target.closest('tr.group');if(g){state.collapsed.has(g.dataset.gkey)?state.collapsed.delete(g.dataset.gkey):state.collapsed.add(g.dataset.gkey);render()}});
colRow.addEventListener('click',e=>{if(e.target.closest('.resizer'))return;const th=e.target.closest('th.sortable');if(!th)return;const c=th.dataset.sortcol;if(state.sort?.col!==c)state.sort={col:c,dir:1};else if(state.sort.dir===1)state.sort.dir=-1;else state.sort=null;render()});
colRow.addEventListener('pointerdown',e=>{const rz=e.target.closest('.resizer');if(!rz)return;e.preventDefault();e.stopPropagation();const th=rz.closest('th'),key=th.dataset.rescol,c=COLS.find(x=>x.key===key);if(!c)return;const sx=e.clientX,sw=widthOf(c);rz.setPointerCapture(e.pointerId);rz.classList.add('rz-active');document.body.classList.add('resizing');const move=ev=>setColWidth(key,sw+ev.clientX-sx),up=()=>{rz.classList.remove('rz-active');document.body.classList.remove('resizing');rz.removeEventListener('pointermove',move);rz.removeEventListener('pointerup',up);rz.removeEventListener('pointercancel',up)};rz.addEventListener('pointermove',move);rz.addEventListener('pointerup',up);rz.addEventListener('pointercancel',up)});
colRow.addEventListener('change',e=>{if(e.target.id==='selAll'){e.target.checked?filteredRecords().forEach(r=>state.selected.add(r.id)):state.selected.clear();updateBulkBtn();render()}});groupSeg.addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;state.groupBy=b.dataset.g;state.collapsed.clear();[...groupSeg.children].forEach(x=>x.classList.toggle('on',x===b));groupSortBtn.hidden=state.groupBy==='none';render()});groupSortBtn.onclick=()=>{state.groupSortDesc=!state.groupSortDesc;groupSortBtn.classList.toggle('active',state.groupSortDesc);render()};search.oninput=e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=e.target.value;render()},180)};bulkDel.onclick=delSelected;refreshBtn.onclick=()=>loadAll().then(()=>toast('Odświeżono')).catch(()=>toast('Błąd odświeżania',true));
grist.ready({requiredAccess:'full'});grist.onRecords(scheduleReload);loadAll().catch(e=>{console.error(e);tbody.innerHTML='<tr><td colspan="10"><div class="state-msg"><b>Nie udało się wczytać danych.</b></div></td></tr>'});setInterval(()=>{if(!document.hidden)scheduleReload()},45000);
</script>
