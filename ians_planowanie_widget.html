ure transition to SWIM, covered in more details in the IM-DE2 follow-up course, is introduced together with future strategies and regulations. An important aspect of these two new courses is the evolution of data exchange supporting not only ATM but also aviation in general, including additional stakeholders such as airports, airlines, etc.","objectives":"At the end of this course, participants will have a sound understanding of the IP networking capabilities being deployed in Europe and the world, and how existing and future applications are making use of these. They will also obtain an initial introduction of how these applications will evolve to make use of SWIM technical features, developed further in the companion course IM-DE2.","audience":"Technical and operational staff involved in data exchange systems and applications in ATM and aviation. Regulators and managers will also benefit from an overview of the evolution of these systems.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE Course manager Manuel Garcia Martin Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course replaces previous COM-DATA and COM-NewPENS courses","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"IM-DE1-V":{"terminy":[{"s":"2026-11-02 09:00","e":"2026-11-06 15:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"IM-DE1-V","title_full":"Data Exchange in Aviation - IP Networks and Applications [IM-DE1-V]","title_clean":"Data Exchange in Aviation - IP Networks and Applications","description":"This virtual course covers networks and applications, namely IP deployments (NewPENS in particular), existing applications such as OLDI, surveillance distribution, messaging (AMHS), Network Manager (NM), EAD, etc., as well as new ones such Voice over IP, Data Link, etc. The initial and future transition to SWIM, covered in more details in the IM-DE2 follow-up course, is introduced together with future strategies and regulations. An important aspect of these two new courses is the evolution of data exchange supporting not only ATM but also aviation in general, including additional stakeholders such as airports, airlines, etc.","objectives":"At the end of this course, participants will have a sound understanding of the IP networking capabilities being deployed in Europe and the world, and how existing and future applications are making use of these. They will also obtain an initial introduction of how these applications will evolve to make use of SWIM technical features, developed further in the companion course IM-DE2.","audience":"Technical and operational staff involved in data exchange systems and applications in ATM and aviation. Regulators and managers will also benefit from an overview of the evolution of these systems.","duration":"This course takes place over 5 days. You will have 5 virtual sessions. You need to plan 30 hours to complete this course.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE Course manager Manuel Garcia Martin Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"This virtual course provides an equivalent level of competence to the IM-DE1 classroom course. It is offered in addition to the classroom course in semesters where demand exceeds available capacity.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"IM-DE2":{"terminy":[{"s":"2026-11-02 10:00","e":"2026-11-05 13:30","dni":4,"dow":"Pon-Czw","lok":"Brussels"}],"course_id":"IM-DE2","title_full":"Data Exchange in Aviation - SWIM [IM-DE2]","title_clean":"Data Exchange in Aviation - SWIM","description":"IM-DE2 builds on the content of the IM-DE1 course, which covers the lower layers of the data exchange process, i.e. network protocols and basic applications (IP, AMHS, OLDI/FMTP etc). IM-DE2 walks participants through the process needed to assess requirements, and to develop and implement operational services within a SWIM-enabled infrastructure. The course begins with an overview of the provisions of the CP1 regulation, i.e. Commission Implementing Regulation (EU) 2021/116, mainly in relation to ATM Functionality 5-SWIM. From there, the course covers in detail the different steps which lead to implementation and operational use of the SWIM services. Practical examples and the presentation of specific cases of implementation are included. Additional aspects such as business considerations, strategies and migration from legacy systems (e.g. AMHS) are also looked at in the course.","objectives":"At the end of the course, participants will: - understand the content and implications of the CP1 Regulation with regards to SWIM; - have developed a good understanding of the process-oriented methodology to develop, implement and use SWIM services; - be aware of other implementation issues like migration from legacy systems, strategies, etc.","audience":"AIM, MET, Flight, CNS, Airport, Military technical and operational staff, regulators and management. Other aviation professionals directly involved in ATM-related data exchange would also benefit from the course.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Ioana TOANCHINA Course manager Hubert LEPORI Tutor Mr Alessandro PRESTIGIACOMO Tutor Abdel YOUSSOUF Tutor Jaroslaw KWASNIEWSKI Tutor Anonymized Anonymized Tutor Anonymized Anonymized Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"Familiarity with the content of the IM-DE1 course is expected in this course. However, having followed IM-DE1 is NOT a prerequisite for enrolling in IM-DE2.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"IM-DO":{"terminy":[{"s":"2026-09-14 10:00","e":"2026-09-16 16:00","dni":3,"dow":"Pon-Śr","lok":"Online"}],"course_id":"IM-DO","title_full":"Aeronautical Information for Data Originators [IM-DO]","title_clean":"Aeronautical Information for Data Originators","description":"ICAO defines aeronautical information management as the dynamic, integrated management of aeronautical information services through the provision and exchange of quality-assured digital aeronautical data, in collaboration with all parties. Traditional aeronautical information services (AIS) are gradually giving way to AIM, through the introduction of digital data and an increase in the levels of automation. This being the case, it is essential that data originators also streamline and align their processes in order to establish a robust aeronautical data chain, which can assure the end-distribution of high-quality aeronautical information products. The European Commission and ICAO recently published new sets of requirements which define the baseline for the organisational, operational and technical aspects to be taken into consideration by every entity involved with the origination of aeronautical data and aeronautical information. This course will provide an analysis of these regulatory requirements, supplemented by detailed discussions about the practical aspects of their implementation.","objectives":"To take account of the regulatory framework for the origination, provision and management of aeronautical data and aeronautical information by data originators and data providers (other than the AISP); To consider the main principles governing the origination, provision and management of aeronautical data and aeronautical information; To apply the technical aspects of the origination, provision and management of aeronautical data and aeronautical information.","audience":"Aerodrome operators certified by Commission Regulation (EU) No 139/2014; Entities originating aeronautical data (other than the AISP) certified by Commission Implementing Regulation (EU) 2017/373 (e.g. flight procedure designers, airspace designers, route planners, etc.); Entities originating aeronautical data not certified by Commission Implementing Regulation (EU) 2017/373 nor by Commission Regulation (EU) No 139/2014 (e.g. surveyors, geodetic institutes, etc.).","duration":"This course takes place over 3 days. You will have 3 virtual sessions. You need to plan 12 hours to complete this course.","price":"No fee applies for course participants from EUROCONTROL Member States competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1200 EUR.","delivered_by":"Ioana TOANCHINA Course manager Roland Baumann Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"IM-NOTAM":{"terminy":[{"s":"2026-06-29 10:00","e":"2026-07-03 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"},{"s":"2026-09-21 10:00","e":"2026-09-25 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"},{"s":"2026-10-12 10:00","e":"2026-10-16 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"},{"s":"2026-11-09 10:00","e":"2026-11-13 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"},{"s":"2026-12-07 10:00","e":"2026-12-11 12:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"}],"course_id":"IM-NOTAM","title_full":"eEAD: Conventional NOTAM and Digital NOTAM for Data Provider [IM-NOTAM]","title_clean":"eEAD: Conventional NOTAM and Digital NOTAM for Data Provider","description":"This course provides participants with an extensive introduction to the integration of conventional NOTAM and Digital NOTAM offered by eEAD applications. It also offers an overview of Digital NOTAM, including relevant aspects of the AIXM Temporality Concept. In the first part, participants receive a mix of hands-on demonstrations and practical sessions on eEAD CNOTAM functionalities and the usage of HMI, enabling them to create and manage NOTAMs in the EUROCONTROL iNM/eEAD system. In the second part, participants engage with the eEAD Digital NOTAM functionalities, HMI, and encoding scenarios as implemented in the system (Digital NOTAM Management). The Digital NOTAM component is natively part of the AIS Data Management (ADM) application, while also being supported by Conventional NOTAM (CNOTAM) for the issuance of legacy NOTAMs. This course demonstrates the interdependencies between these applications and components, as well as the associated business processes supporting the exchange of dynamic AIM data. It includes extensive presentations and practical sessions on real-world cases (based on worldwide NOTAMs) to showcase the functionalities of the eEAD CNOTAM and DNOTAM solutions. Pre-requisites Before taking this course, knowledge of current EAD applications and procedures is required in order to facilitate this conversion course. Also, knowledge of ICAO NOTAM structure, EUROCONTROL OPADD are strongly recommended. No prior knowledge of data modelling or of AIXM is required for this course.","objectives":"By the end of this course, participants will be able to: 1. Explain the purpose of DNOTAM concepts within eEAD system. 2. Identify the main functionalities of the CNOTAM and DNOTAM within eEAD system. 3. Explain the conceptual and operational integration between CNOTAM and DNOTAM within eEAD, including supported workflows, digitisation logic, and system interdependencies. 4. Create, validate and process conventional NOTAM and NOTAM Proposals using the eEAD CNOTAM HMI in accordance with applicable NOTAM business and validation rules. 5. Encode, verify and manage Digital NOTAM in the eEAD DNOTAM application using predefined DNOTAM scenarios. 6. Apply the CNOTAM–DNOTAM integrated workflow to digitise, correct and release NOTAMs in a training environment.","audience":"This course is designed for aeronautical information operational professionals working in NOTAM offices of AISPs.","duration":"This course takes place over 5 days.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1850 EUR.","delivered_by":"Oscar CENTENO GIRALDE Content Manager Ioana TOANCHINA Course manager Aleksander WOJTOWICZ Tutor Claudia MANEZ ALONSO Tutor Georgiana ANDREI Tutor Eduard POROSNICU Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"HQ - Headquarters, Brussels (Belgium) Display details Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"IM-NOTAM-LAB":{"terminy":[{"s":"2026-07-07 10:00","e":"2026-07-09 16:00","dni":3,"dow":"Wt-Czw","lok":"Online"},{"s":"2026-07-22 10:00","e":"2026-07-24 16:00","dni":3,"dow":"Śr-Pt","lok":"Online"},{"s":"2026-09-15 10:00","e":"2026-09-17 16:00","dni":3,"dow":"Wt-Czw","lok":"Online"}],"course_id":"IM-NOTAM-LAB","title_full":"eEAD: Hands-On CNOTAM and DNOTAM for Data Provider [IM-NOTAM-LAB]","title_clean":"eEAD: Hands-On CNOTAM and DNOTAM for Data Provider","description":"This course provides participants with a practice-oriented application of Conventional NOTAM (CNOTAM) and Digital NOTAM (DNOTAM) functionalities within the eEAD system. It includes structured exercises and scenario-based simulations designed to enhance the participants’ familiarity with the eEAD interfaces and workflows. In the first part, participants engage with practical sessions focused on eEAD CNOTAM functionalities and the use of the HMI. In the second part, participants explore Digital NOTAM functionalities, including encoding predefined scenarios and working with the DNOTAM as implemented in the system (Digital NOTAM Management). The Digital NOTAM component is natively part of the AIS Data Management (ADM) application, while also being supported by Conventional NOTAM (CNOTAM) for the issuance of legacy NOTAMs. The course emphasizes the practical use of the system through structured tasks and simulation-based learning, supporting skill development for managing dynamic aeronautical information within the eEAD system Pre-requisites To ensure effective participation, the following knowledge and experience are recommended before attending this course: - Familiarity with the structure and content of ICAO NOTAMs. - Good understanding of EUROCONTROL OPADD and current EAD applications and procedures. - Prior experience using eEAD CNOTAM and/or DNOTAM functionalities, including basic navigation of the respective HMIs – this may include involving personnel who have attended the eEAD: Conventional NOTAM and Digital NOTAM for Data Provider [IM-NOTAM] course. This course is intended as a practice-based application course, not an introduction to NOTAM concepts or eEAD.","objectives":"By the end of the course, participants will be able to: 1. Apply eEAD functionalities to create, manage, and review Conventional and Digital NOTAM using the CNOTAM and DNOTAM HMIs 2. Navigate predefined DNOTAM encoding scenarios and understand their use within the AIS Data Management (ADM) application 3. Recognise the interrelation between CNOTAM and DNOTAM processes and how they are supported within the eEAD environment 4. Practise with real-world NOTAM cases, gaining confidence in applying concepts in realistic and varied situations","audience":"This course is designed for aeronautical information operational professionals working in NOTAM offices of AISPs.","duration":"This course takes place over 3 days. You will have 6 virtual sessions. You need to plan 12 hours to complete this course.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1200 EUR.","delivered_by":"Ioana TOANCHINA Course manager Claudia MANEZ ALONSO Tutor Georgiana ANDREI Tutor Aleksander WOJTOWICZ Tutor Olga PATOKA Tutor Oscar CENTENO GIRALDE Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"IM-REG":{"terminy":[{"s":"2026-09-22 09:30","e":"2026-09-23 15:30","dni":2,"dow":"Wt-Śr","lok":"Online"}],"course_id":"IM-REG","title_full":"The regulatory context in the AIS/AIM domain [IM-REG]","title_clean":"The regulatory context in the AIS/AIM domain","description":"The aim of this course is to give a general overview of the global, regional and national regulatory frameworks affecting the AIS/AIM domain. The course focuses on the ICAO SARPS, on the new Regulation (EU) 2017/373 (Part-AIS) and it discusses consolidated understandings and possible approaches to address the States obligations. You can complement this course with the course IM-AIDE: Aeronautical Information in the Digital Environment to gain an insight into the practical aspects of the digital aeronautical data and information supply chain.","objectives":"After completing the course, participants should be able to: Have a detailed understanding of: The different regulations directly affecting the AIS/AIM domain The main aspects of the transition from Regulation 73/2010 (ADQ) to Regulation 2017/373 Explain the main regulatory developments directly affecting the AIS/AIM domain Apply possible approaches to address the State obligations stemming from the regulations directly affecting the AIS/AIM domain","audience":"Anybody interested in getting an overview of the regulations directly affecting the AIS/AIM domain, in particular those working for competent authorities and providers of aeronautical information services.","duration":"This course takes place over 2 days. You will have 2 virtual sessions. You need to plan 8 hours to complete this course.","price":"No fee applies for course participants from EUROCONTROL Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 800 EUR.","delivered_by":"Ioana TOANCHINA Course manager Boris CORIC Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-2803-INTRO":{"terminy":[{"s":"2026-09-16 09:30","e":"2026-09-16 16:00","dni":1,"dow":"Śr","lok":"Online"},{"s":"2026-10-29 09:30","e":"2026-10-29 16:00","dni":1,"dow":"Czw","lok":"Online"}],"course_id":"LEX-2803-INTRO","title_full":"Overview of SES2+ recast [LEX-2803-INTRO]","title_clean":"Overview of SES2+ recast","description":"The course provides an overview of Regulation 2024/2803 on the implementation of SES (SES2+ recast). The course addresses in particular: the general principles of the Single European Sky (SES) its history the motivation for a SES2+ recast the legislative process the proposals of the European Commission NSAs and their tasks service provision performance and charging schemes network management airspace, interoperability and technological innovation the implementation of the new framework.","objectives":"After completing the course, participants will be well aware of the scope, objective and overall content of Regulation 2024/2803 on the implementation of SES (SES2+ recast) as well as the roles and responsibilities of the main players.","audience":"Anybody interested in getting an overview of Regulation 2024/2803 (SES2+ recast): ATM/ANS service providers, national competent authorities (NCAs), national supervisory authorities (NSAs), Common Information Service providers, EASA, other civil and military ATM regulatory bodies, etc.","duration":"This course takes place over 1 days. You will have 2 virtual sessions. You need to plan 5 hours to complete this course.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 400 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nDipl.-Ing. MBA Alfred GULDER - Tutor","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-373-AR":{"terminy":[{"s":"2026-11-16 09:30","e":"2026-11-20 16:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"LEX-373-AR","title_full":"Requirements for Competent Authorities - Part-AR of Regulation 2017/373 [LEX-373-AR]","title_clean":"Requirements for Competent Authorities - Part-AR of Regulation 2017/373","description":"This course focuses on Part-AR (Annex II) of Regulation (EU) 2017/373: Requirements for competent authorities - Oversight of ATM/ANS services and other ATM network functions. It covers all of its subparts: Subpart A - General requirements Subpart B - Management Subpart C - Oversight, certification and enforcement It addresses in particular the certification/declaration processes, the oversight planning cycle, and its associated concept of risk and performance based oversight. It gives an overview of the management systems for competent authorities, including the compliance monitoring aspects and the oversight of changes. The course also includes demonstrations of example software tools supporting the certification and oversight tasks and a presentation of lessons learnt from EASA standardisation inspections. It should be noted that the topic Oversight of changes is covered in more detail in other ALC courses, in particular in the LEX-CHG-OC-1 course.","objectives":"After completing the course, participants will have a detailed understanding of Part-AR (Annex II) of Regulation (EU) 2017/373 and its AMC/GM.","audience":"This course is designed for personnel working for a competent authority as defined in Regulation 2017/373 (i.e. in the field of ATM/ANS). It is also relevant to personnel working for a National Supervisory Authority (NSA) as defined in Regulation 2024/2803. It may be of interest to staff working for an ATM/ANS provider who: interact with their competent authority intend to apply, or have applied for certification of some ATM/ANS services wish to develop a detailed understanding of the interactions between ATM/ANS providers and competent authorities in the field of ATM/ANS.","duration":"This course takes place over 5 days. You will have 10 virtual sessions. You need to plan 22 hours to complete this course.","price":"No fee applies for course participants from Member States competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 2000 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nMr Petros Stratis - Tutor","location_text":"","important_note":"Although this course is delivered in a virtual format by default, it can also be delivered as an onsite classroom course, on request.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-373-INTRO":{"terminy":[{"s":"2026-12-08 09:00","e":"2026-12-10 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-04-06 09:00","e":"2027-04-08 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-12-07 09:00","e":"2027-12-09 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"LEX-373-INTRO","title_full":"Overview of Regulation 2017/373 [LEX-373-INTRO]","title_clean":"Overview of Regulation 2017/373","description":"This course provides an overview of Regulation 2017/373 for all ATM/ANS providers except data providers (for data providers, please refer to the LEX-373-DAT course) The course focuses on the main requirements of Regulation 2017/373, both the cover regulation (articles) and all of its annexes, except Part-DAT/Annex VII (the latter is covered in detail in the LEX-373-DAT course). As the course is continuously updated to take account of the regulatory developments affecting Regulation 2017/373, it can be regarded as a refresher course for those having attended the course a couple of years ago.","objectives":"After completing the course, participants should have a good general understanding of the objectives, applicability, structure and scope of Regulation 2017/373 the main requirements described in Regulation 2017/373, both in the cover regulation (articles) and all its annexes, except Part-DAT (Annex VII)","audience":"Anybody interested in getting an overview of Regulation 2017/373, in particular those working for competent authorities and ATM/ANS providers (including the Network Manager), except data providers. Note: the LEX-373-INTRO course is not suitable for data providers. The LEX-373-DAT course has been designed to address the specific needs of data providers.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nDipl.-Ing. MBA Alfred GULDER - Tutor","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"In November 2023, the EASA Air Traffic Department has verified the training material of this course against the regulatory framework on the ATM/ANS common requirements (Regulation 2017/373). As a result of this verification, EASA has endorsed the content of the course as it is in line and meets the intent of the aforementioned framework.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"LEX-AUDIT-1":{"terminy":[{"s":"2026-08-24 09:00","e":"2026-08-28 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2026-09-28 09:00","e":"2026-10-02 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-02-01 09:00","e":"2027-02-05 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-26 09:00","e":"2027-04-30 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-08-23 09:00","e":"2027-08-27 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-11-08 09:00","e":"2027-11-12 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"LEX-AUDIT-1","title_full":"Audit Techniques and Practice Stage 1 [LEX-AUDIT-1]","title_clean":"Audit Techniques and Practice Stage 1","description":"This course offers sufficient understanding of the basic principles of auditing to enable participants to conduct in-depth and searching regulatory audits of ATM services as required by the Commission Regulation laying down technical requirements and administrative procedures related to service providers and the oversight thereof. The course consists of three stages; all three stages MUST be followed.","objectives":"Participants will demonstrate knowledge and practical skills necessary to conduct audits in the ATM/ANS and Aerodrome domains, in accordance with applicable EU regulations.","audience":"This course is designed for staff working within an NCA/NSA and is a mandatory element of the NCA/NSA Training Programme. It may also be of interest to staff working for other civil or military ATM safety regulatory bodies, for ATM/ANS service provider organisations or for Aerodrome operators. This redesigned course could also be of interest to staff involved in internal (compliance monitoring) auditing, coming from ATM/ANS providers as well as from Airport operators.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Igor POLTORACKI Course manager Björn SCHRÄDER Speaker Mr Petros Stratis Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg Display details Course Registration Request","important_note":"The LEX-AUDIT-1 course has been completely redesigned (more than 80% of the material is completely new) and is now fully aligned with the currently applicable regulatory requirements for oversight auditing in the domains of ATM/ANS and Aerodromes. Pre-requisites Participants must complete LEX-REG and LEX-AUDIT-BASIC e-learning courses before attending this course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"LEX-AUDIT-3":{"terminy":[{"s":"2026-11-24 09:00","e":"2026-11-26 15:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-05-11 09:00","e":"2027-05-13 15:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-10-26 09:00","e":"2027-10-28 15:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"LEX-AUDIT-3","title_full":"Audit Techniques and Practice Stage 3 [LEX-AUDIT-3]","title_clean":"Audit Techniques and Practice Stage 3","description":"This course offers sufficient understanding of the basic principles of auditing. It enables participants to conduct regulatory and compliance audits in the domains of ATM/ANS (as required by Regulation (EU) 2017/373) and Aerodromes (as required by Regulation (EU) 139/2014). The course is structured into three mandatory stages, all of which MUST be completed.","objectives":"Participants will demonstrate knowledge and practical skills necessary to conduct audits in the ATM/ANS and Aerodrome domains, in accordance with applicable EU regulations.","audience":"This course is designed for staff working within a NCA/NSA and is a mandatory element of the NCA/NSA Training Programme. It may also be of interest to staff working for other civil or military ATM safety regulatory bodies, for ATM/ANS service provider organisations or for Aerodrome operators.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Igor POLTORACKI Course manager Mr Petros Stratis Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"As of second semester 2026 this course will be available both as classroom and as a virtual course (LEX-AUDIT-3-V) Pre-requisites Participants must have completed Audit Stage 1 and 2 before attending this course.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"LEX-AUDIT-3-V":{"terminy":[{"s":"2026-10-27 09:30","e":"2026-10-29 16:00","dni":3,"dow":"Wt-Czw","lok":"Online"},{"s":"2027-01-12 09:30","e":"2027-01-14 16:00","dni":3,"dow":"Wt-Czw","lok":"Online"},{"s":"2027-07-13 09:30","e":"2027-07-15 16:00","dni":3,"dow":"Wt-Czw","lok":"Online"}],"course_id":"LEX-AUDIT-3-V","title_full":"Audit Techniques and Practice Stage 3 [LEX-AUDIT-3-V]","title_clean":"Audit Techniques and Practice Stage 3","description":"This course offers sufficient understanding of the basic principles of auditing. It enables participants to conduct regulatory and compliance audits in the domains of ATM/ANS (as required by Regulation (EU) 2017/373) and Aerodromes (as required by Regulation (EU) 139/2014). The course is structured into three mandatory stages, all of which MUST be completed. Pre-requisites Participants must have completed Audit Stage 1 and 2 before attending this course.","objectives":"Participants will demonstrate knowledge and practical skills necessary to conduct audits in the ATM/ANS and Aerodrome domains, in accordance with applicable EU regulations.","audience":"This course is designed for staff working within a NCA/NSA and is a mandatory element of the NCA/NSA Training Programme. It may also be of interest to staff working for other civil or military ATM safety regulatory bodies, for ATM/ANS service provider organisations or for Aerodrome operators.","duration":"This course takes place over 3 days. You will have 6 virtual sessions. You need to plan 14 hours to complete this course.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1200 EUR.","delivered_by":"Igor POLTORACKI Course manager About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-BR-1139-V":{"terminy":[{"s":"2027-01-05 09:30","e":"2027-01-08 12:00","dni":4,"dow":"Wt-Pt","lok":"Online"}],"course_id":"LEX-BR-1139-V","title_full":"Overview of Basic Regulation 2018/1139 for ATM/ANS and Aerodromes [LEX-BR-1139-V]","title_clean":"Overview of Basic Regulation 2018/1139 for ATM/ANS and Aerodromes","description":"The Basic Regulation 2018/1139 is the cornerstone of the EU regulatory framework in civil aviation, hence an important piece of legislation to be aware of. This course describes its main features & requirements in or affecting the fields of ATM/ANS and aerodromes, in particular: Delegated acts vs. implementing acts Objectives and scope Substantive and essential requirements in the fields of ATM/ANS and aerodromes, especially when it comes to interoperability ATM/ANS systems and ATM/ANS constituents organisations involved in the design, production or maintenance of such systems and equipment certification of ATM/ANS providers (and possibilities for exemption) safety-related aerodrome equipment Functions and tasks assigned to EASA in or affecting the fields of ATM/ANS and aerodromes Possibilities for reallocation of responsibilities with regards to certification, oversight and enforcement tasks. Pool of European aviation inspectors Repository of information Exemption mechanisms Oversight support mechanism Qualified entities Interdependencies between civil aviation safety & socio-economic factors or aviation security The course also addresses Regulation 2025/1044 supplementing the Basic Regulation with detailed rules & procedures on the acceptance of ATCO licences and certificates issued by third countries, but not in detail (those who need to dig deeper into Regulation 2025/1044 are recommended to register for the LEX-COMP-ATCO course).","objectives":"After completing the course, participants should: be able to describe the main features and requirements of the Basic Regulation 2018/1139, in or affecting the fields of ATM/ANS and aerodromes be aware of Regulation 2025/1044 supplementing the Basic Regulation 2018/1139 with detailed rules and procedures on the acceptance of ATCO licenses and certificates issued by third countries.","audience":"Anyone involved in the fields of ATM/ANS and aerodromes, who wishes to develop an understanding of the Basic Regulation 2018/1139 and the impact it has or could have on these fields (now and in the future).","duration":"This course takes place over 4 days. You will have 7 virtual sessions. You need to plan 15 hours to complete this course.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nRenata ZLOPASA - Tutor","location_text":"","important_note":"This course content has been checked by the EASA’s Air Traffic Department and Legal and Procurement Department in March 2025. EASA has concluded that the content of the LEX-BR-1139-V course is in line with the intent and scope of the regulatory framework of Regulation (EU) 2018/1139.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-CAGE-DPO":{"terminy":[{"s":"2026-10-12 09:30","e":"2026-10-16 13:00","dni":5,"dow":"Pon-Pt","lok":"Online"},{"s":"2027-03-15 09:30","e":"2027-03-19 13:00","dni":5,"dow":"Pon-Pt","lok":"Online"},{"s":"2027-12-06 09:30","e":"2027-12-10 13:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"LEX-CAGE-DPO","title_full":"Approval of DPOs and attestation of ATM/ANS equipment [LEX-CAGE-DPO]","title_clean":"Approval of DPOs and attestation of ATM/ANS equipment","description":"This course focusses on the obligations applicable to organisations involved in the design or production of ATM/ANS systems and ATM/ANS constituents (DPOs) in relation to the regulatory framework on the conformity assessment of ATM/ANS equipment, as described in: DA 2023/1768 laying down detailed rules for the certification and declaration of ATM/ANS systems and constituents; IA 2023/1769 laying down technical and administrative procedures for the approval of organisations involved in the design or production of ATM/ANS systems and constituents. It addresses in particular: in-depth look at the approval process applicable to certain design or production organisations (DPOs); the attestation processes applicable to certain ATM/ANS equipment (certification, declaration or statement of compliance); key associated concepts: detailed specifications (DS), certification specifications (CS), acceptable means of compliance (AMC), guidance material (GM), attestation basis, etc; the obligations of DPOs and interactions with EASA in particular, but also with ATM/ANS service providers (SPs) and National Competent Authorities (NCAs); application of transitional provisions; what the future holds.","objectives":"After completing the course, participants will have a good understanding of the obligations applicable to DPOs in relation to the regulatory framework on the conformity assessment of ATM/ANS equipment.","audience":"This course is designed for staff working for an organisation involved or wishing to get involved in the design and/or production of ATM/ANS equipment (DPO): either an ATM/ANS system manufacturer, or an ATM/ANS service provider acting as a DPO.","duration":"This course takes place over 5 days. You will have 9 virtual sessions. You need to plan 21 hours to complete this course.","price":"No fee applies for course participants from Member States' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1800 EUR","delivered_by":"Igor POLTORACKI Course manager Jean-Francois PIRIOU Tutor Jose Luis Garcia-Chico Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"This course is developed in coordination with EASA. In August 2024, the EASA Air Traffic Department has verified the training material of this course against the newly introduced regulatory framework for ATM/ANS equipment (comprising in particular Regulations 2023/1768, 2023/1769 and 2023/1771). As a result of this verification, EASA has endorsed the content of this course as it is in line and meets the intent of the aforementioned framework. Pre-requisites Before attending this course, it is strongly recommended to complete the LEX-CAGE-INTRO (or LEX-CAGE-INTRO-C) course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-CAGE-DPO-C":{"terminy":[{"s":"2027-06-15 10:00","e":"2027-06-18 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"LEX-CAGE-DPO-C","title_full":"Approval of DPOs and attestation of ATM/ANS equipment [LEX-CAGE-DPO-C]","title_clean":"Approval of DPOs and attestation of ATM/ANS equipment","description":"This course focuses on the obligations applicable to organisations involved in the design or production of ATM/ANS systems and ATM/ANS constituents (DPOs) in relation to the regulatory framework on the conformity assessment of ATM/ANS equipment, as described in: DA 2023/1768 laying down detailed rules for the certification and declaration of ATM/ANS systems and constituents; IA 2023/1769 laying down technical and administrative procedures for the approval of organisations involved in the design or production of ATM/ANS systems and constituents. It addresses in particular: in-depth look at the approval (certification) process applicable to certain design or production organisations (DPOs); the attestation processes applicable to certain ATM/ANS equipment (certification, declaration or statement of compliance); key associated concepts: detailed specifications (DS), certification specifications (CS), acceptable means of compliance (AMC), guidance material (GM), attestation basis, etc; the obligations of DPOs and interactions with EASA in particular, but also with ATM/ANS service providers (SPs) and National Competent Authorities (NCAs); application of transitional provisions; what the future holds.","objectives":"After completing the course, participants will have a good understanding of the obligations applicable to DPOs in relation to the regulatory framework on the conformity assessment of ATM/ANS equipment.","audience":"This course is designed for staff working for an organisation involved or wishing to get involved in the design and/or production of ATM/ANS equipment (DPO): either an ATM/ANS system manufacturer, or an ATM/ANS service provider acting as a DPO.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1800 EUR.","delivered_by":"Igor POLTORACKI Course manager Jean-Francois PIRIOU Tutor Jose Luis Garcia-Chico Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course is developed in coordination with EASA. In August 2024, the EASA Air Traffic Department has verified the training material of this course against the newly introduced regulatory framework for ATM/ANS equipment (comprising in particular Regulations 2023/1768, 2023/1769 and 2023/1771). As a result of this verification, EASA has endorsed the content of this course as it is in line and meets the intent of the aforementioned framework. Pre-requisites Before attending this course, it is strongly recommended to complete the LEX-CAGE-INTRO (or LEX-CAGE-INTRO-C) course.","more_information":"Course timetable","certificate_awarded":"All candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"LEX-CAGE-INTRO":{"terminy":[{"s":"2026-09-07 13:30","e":"2026-09-11 16:00","dni":5,"dow":"Pon-Pt","lok":"Online"},{"s":"2027-02-01 13:30","e":"2027-02-05 16:00","dni":5,"dow":"Pon-Pt","lok":"Online"},{"s":"2027-09-06 13:30","e":"2027-09-10 16:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"LEX-CAGE-INTRO","title_full":"Overview of regulatory framework on the conformity assessment of ATM/ANS equipment [LEX-CAGE-INTRO]","title_clean":"Overview of regulatory framework on the conformity assessment of ATM/ANS equipment","description":"This course provides an overview of the regulatory framework on the conformity assessment of ATM/ANS equipment, as described in: DA 2023/1768 laying down detailed rules for the certification and declaration of ATM/ANS systems and constituents IA 2023/1769 laying down technical and administrative procedures for the approval of organisations involved in the design or production of ATM/ANS systems and constituents IA 2023/1770 laying down common provisions on aircraft equipment required for the use of the SES airspace and operating rules related to the use of the SES airspace, and repealing Regs 29/2009 (on datalink services), 1206/2011 (on aircraft identification), 1207/2011 (on surveillance performance and interoperability) and 1079/2012 (on air ground voice channel spacing) IA 2023/1771 amending Reg. 2017/373 as regards ATM/ANS systems and constituents, and repealing Regs 1032/2006 (on coordination and transfer), 633/2007 (on FMTP), 262/2009 (on Mode S) IA 2023/1772 amending Regulation 923/2012 as regards the operating rules related to the use of ATM/ANS systems and constituents in the SES airspace, and repealing Regulation 1033/2006 (on initial flight plans) It addresses in particular: the certification and declaration processes applicable to certain ATM/ANS equipment, including the 3 methods of attestation (certification, declaration and compliance) and their scope the approval (certification) of certain design or production organisations (DPOs) key associated concepts: detailed specifications (DS), certification specifications (CS), acceptable means of compliance (AMC), guidance material (GM), certification basis (CB), etc. the roles and responsibilities of the main actors in the field of ATM/ANS interoperability: ATM/ANS service providers (SPs), National Competent Authorities (NCAs), Design and Production Organisations (DPOs), EASA, etc. the impact of the regulatory framework on the main actors listed above the impact of the regulatory framework on the conformity assessment of ATM/ANS equipment as defined by: Reg. 2017/373 (common requirements for ATM/ANS providers and their competent authorities) Reg. 923/2012 (common rules of the air) an overview explaining how the 8 existing implementing regulations for interoperability (previously developed under Reg. 552/2004) are transposed in the EASA regulatory framework examples of “Detailed Specifications” (including “Certification Specifications Acceptable Means of Compliance and Guidance Material”) application of the transitional provisions what the future holds The course also includes a half-day slot where EASA will answer questions and highlight some key messages.","objectives":"After completing the course, participants will have a good understanding of the regulatory framework on the conformity assessment of ATM/ANS equipment, especially: its impact on organisations involved in the design or production of ATM/ANS equipment (DPOs), ATM/ANS service providers (SPs), National Competent Authorities (NCAs) and EASA the approval and certification process for DPOs, the conformity assessment of ATM/ANS equipment and the 3 methods of attestation (certification, declaration and statements of compliance) the roles & responsibilities of the main actors as listed above","audience":"This course is designed for staff involved (or wishing to get involved) in conformity assessment of ATM/ANS equipment, and working for: an organisation involved in the design or production of ATM/ANS equipment (DPO) an ATM/ANS service provider (SP) a national competent authority (NCA) EASA It may be also of interest for staff who wish to develop a general understanding of the regulatory framework, its impact on the conformity assessment of ATM/ANS equipment and its impact on their organisation.","duration":"This course takes place over 5 days. You will have 9 virtual sessions. You need to plan 14 hours to complete this course.","price":"No fee applies for course participants from Member States'''' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1800 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nJose Luis Garcia-Chico - Tutor\nIgor POLTORACKI - Tutor","location_text":"","important_note":"In February 2024, the EASA Air Traffic Department has verified the training material of this course against the regulatory frameworks on the ATM/ANS common requirements (Regulation 2017/373) and on the newly introduced ATM/ANS equipment (comprising in particular Regulations 2023/1768, 2023/1769 and 2023/1771). As a result of this verification, EASA has endorsed the content of the course as it is in line and meets the intent of the aforementioned frameworks.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-CHG-OC-1":{"terminy":[{"s":"2027-01-04 13:00","e":"2027-01-08 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"LEX-CHG-OC-1","title_full":"Oversight of Changes in ATM/ANS Part 1 [LEX-CHG-OC-1]","title_clean":"Oversight of Changes in ATM/ANS Part 1","description":"The Oversight of Changes in the ATM/ANS Part 1 course builds on the knowledge acquired in the Management & Oversight of Changes in ATM/ANS course [SAF-CHG-INTRO] or Management & Oversight of Changes First Steps [SAF-CHG-FS]. The course is consistent with Regulation 2017/373 and its relevant AMC/GM. This course focuses on the tasks of competent authorities in ATM/ANS as regards the oversight of changes in ATM/ANS, and covers the following topics: Approval of an alternative means of compliance (AltMOC), Approval of change management procedures, Notification of planned changes, The decision to review a change, Oversight of changes, Oversight audits (monitoring of changes) It describes the obligations of the competent authority, and how to effectively oversee changes to the ATM/ANS functional system. Pre-requisites The SAF-CHG-INTRO or SAF-CHG-FS course must be successfully completed before attending this course. LEX-SES-E e-learning course is recommended. The participant should read through the relevant EU legislation pertaining to ATM/ANS changes, as described in the course syllabus.","objectives":"After completing the course, participants will have a thorough understanding of the aspects to be considered when overseeing changes in ATM/ANS, in particular changes to the ATM/ANS functional system in accordance with the Regulation 2017/373.","audience":"This course is designed for personnel working for a competent authority and involved in the oversight of changes in ATM/ANS. Note: staff working for an ATM/ANS service provider who are involved in the maintenance or application of its change management procedures may also register.","duration":"This course takes place over 5 days.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Michel DE REDE Content Manager Sandrine TASQUIN Course manager Mr Petros Stratis Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"LEX-COMP-ATCO":{"terminy":[{"s":"2026-11-10 10:00","e":"2026-11-13 12:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"LEX-COMP-ATCO","title_full":"ATCO Competence and Training Organisation Certification [LEX-COMP-ATCO]","title_clean":"ATCO Competence and Training Organisation Certification","description":"One of the key elements necessary for providing a safe service is the competence of the staff involved in providing that service, as highlighted by the SES regulatory framework, which includes a variety of provisions relating to competence. The oversight of the competence arrangements for ATM staff and their implementation is becoming more important, particularly as the complexity of the ATM system increases. The licensing of air traffic controllers was the first step in providing such safety assurance. The course focuses on the role of ANSPs in the implementation of the ATCO competence and of the Competent Authority (CA) to perform oversight of such arrangements as defined by Commission Regulation (EU) 2015/340 together with its associated acceptable means of compliance (AMC) and guidance material (GM), ICAO standards and recommended practices and supporting EUROCONTROL guidance material.","objectives":"After completing the course, participants will have a thorough understanding of the aspects which need to be considered in the implementation of the competence arrangements for of air traffic controllers.","audience":"This course is designed for those working within a Competent Authority and for staff working for ATM/ANS service providers, both civil and military, implementing competence requirements for their air traffic controllers.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Peter ALDERSON Course manager Timo BLUNCK Tutor Nils Jahn Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"This course content has been checked by EASA in April 2024 against the EU Regulation 2015/340 laying down technical requirements and administrative procedures relating to air traffic controllers'''' licences and certificates. EASA has evaluated that the course content is in line with the intent of this rule and the provisions of EU Regulation 2018/1139 (repealing Regulation No. 216/2008), and its Acceptable Means of Compliance (AMC) and Guidance Material (GM). The impact of Commission Regulations (EU) 2023/203, 2023/893 and 2025/1044 are also covered. Pre-requisites Participants following the NCA Training Programme must have successfully completed its mandatory courses (LEX-SES, LEX-AUDIT and LEX-NCA-NSA courses) before attending this course. Prior to attending the course, all participants should read through Annexes I (Part ATCO) and II (Part ATCO.AR) to Commission Regulation (EU) 2015/340 and its associated acceptable means of compliance (AMC) and guidance material (GM).","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"LEX-COST-PERF":{"terminy":[{"s":"2026-09-08 09:30","e":"2026-09-10 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"LEX-COST-PERF","title_full":"SES Performance and Charging Schemes [LEX-COST-PERF]","title_clean":"SES Performance and Charging Schemes","description":"Air Navigation Services are financed in Europe through (en-route & terminal) air navigation charges. Member States establish their tariffs (unit rates) in accordance with rules set at EUROCONTROL and/or at the European Union (in the case of States participating in the Single European Sky). Airspace users are billed on the basis of the services they receive and have to pay the corresponding air navigation charges. Since 1960, EUROCONTROL (the CRCO) has been tasked with billing and recovering en-route charges on behalf of EUROCONTROL States. This service has been extended to terminal services at the request of any States. This common charging system ensures full consistency between the applicable SES Charging Scheme Regulation and EUROCONTROL’s Principles concerning the establishment and collection of air navigation charges. This training will give you an in-depth knowledge of the establishment of cost bases and the financing of Air Navigation Services (ANS) in Europe through air navigation charges based on the latest applicable regulation. It also details the link between ANS charges and the performance scheme of the European Union. The core of the training is based on hands-on practical exercises on how to fill in the reporting tables. The training will also focus on providing the participants with insights on the latest regulation and decisions related to RP3. In particular it will aim to shed lights on the adopted revised versions of the SES performance and charging scheme regulation and identify the latest changes and their rationale. The 4 key performance areas of the SES Performance scheme - Safety, Capacity, Environment and Cost-Efficiency – will all have a dedicated focus. In addition, participants are expected to gain a thorough understanding of the Union-wide target setting, the local target setting and associated performance planning and decision-making processes. Furthermore, the participants will review the Performance monitoring processes and results as the performance monitoring function plays a key role in ensuring a good understanding and a better management of ANS performance. Last but not least, the course also proposes a dedicated section on the key aspects of the cost-efficiency KPA showing, in particular, how the performance and charging scheme aspects interact. Pre-requisites Prior attendance of the LEX-SES course is not mandatory but would be an advantage.","objectives":"By the end of the training, the participants will be able to : explain the financing of both en-route and terminal Air Navigation Services in Europe; fill in the reporting tables for the establishment of cost bases and financing through air navigation charges; explain the link between ANS charges and the performance scheme of the European Union; have a thorough understanding of the Performance and Charging scheme regulation.","audience":"Any staff (including new-comers) from NSA, CAA, ANSP, MET and airspace users working in financial departments who would benefit from an in-depth knowledge of the charging scheme and practice of the filling in of reporting tables.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member States'''' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Sandrine TASQUIN Course manager Natasa LAJIC Tutor Rana HOKKACI Tutor Guglielmo GUASTALLA Tutor Denis HUET Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your food on their website or in their app. You can order your food in advance or up to 10:00 on the day itself. Your food will be delivered to the Aviation Learning Centre and made available in the canteen during your lunch break. You are responsible for your order and its payment. If you do not order anything, no food will be available on site for you. Address EUROCONTROL Aviation Learning Centre, Rue Antoine de Saint Exupéry, 12, L-1432, Luxembourg. Open in Maps Link Visiting Us Course Registration Request","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"LEX-CYBER":{"terminy":[{"s":"2026-10-12 09:30","e":"2026-10-14 13:00","dni":3,"dow":"Pon-Śr","lok":"Online"},{"s":"2027-03-08 09:30","e":"2027-03-10 13:00","dni":3,"dow":"Pon-Śr","lok":"Online"},{"s":"2027-09-27 09:30","e":"2027-09-29 13:00","dni":3,"dow":"Pon-Śr","lok":"Online"}],"course_id":"LEX-CYBER","title_full":"Oversight of Security Management Systems in ATM [LEX-CYBER]","title_clean":"Oversight of Security Management Systems in ATM","description":"This course provides an overview of the current (Cyber) Security requirements stemming from the Global and European Regulatory Framework. It helps participants to understand the legislative requirements from ICAO, SES legislation, their implementing rules, and the measures to be taken from the NSA/ANSP for their implementation. It gives the participants a basic understanding to conduct the effective Security Oversight activities and verify the compliance of the ANSP with the latest (cyber) security requirements. It gives an introduction to ATM Security and explains the important role of a Security Management Systems.","objectives":"After completing the course, participants will have a basic understanding of the main (Cyber) Security Regulations in force and their requirements. They will be able to understand the security oversight process and the aspects which need to be considered in the context of the oversight of the security management systems implemented by ANSPs.","audience":"This course is designed for those working within an NSA and is an optional element of the NSA Training Initiative. It may also be of interest to staff working for other civil or military ATM security regulatory bodies or for ATM service provider organisations.","duration":"This course takes place over 3 days. You will have 4 virtual sessions. You need to plan 12 hours to complete this course.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 600 EUR.","delivered_by":"Denisa OSMANI Content Manager Sandrine TASQUIN Course manager Timo BLUNCK Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"This virtual course is exactly the same as the previous LEX-CYBER classroom course","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-ISMS":{"terminy":[{"s":"2026-09-14 09:30","e":"2026-09-16 12:30","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"},{"s":"2026-11-24 09:30","e":"2026-11-26 12:30","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-01-25 09:30","e":"2027-01-27 12:30","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"},{"s":"2027-09-06 09:30","e":"2027-09-09 12:30","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"LEX-ISMS","title_full":"Compliance with Part-IS Requirements for Information Security Management Systems [LEX-ISMS]","title_clean":"Compliance with Part-IS Requirements for Information Security Management Systems","description":"The course is built on the new Regulation 2023/203 and Regulation 2022/1645 PART-IS and the Acceptable Means of Compliance and Guidance Material to the Annexes of Part IS.I.OR and Part IS.D.OR. This Regulation sets out the requirements to be met by the organisations and competent authorities in order: (a) to identify and manage information security risks with potential impact on aviation safety which could affect information and communication technology systems and data used for civil aviation purposes, (b) to detect informati n [LEX-MET]","title_clean":"Oversight of Aeronautical Meteorological Service Provision","description":"The course will commence by providing a basic overview of: the ICAO and World Meteorological Organization (WMO) set-up with respect to aeronautical meteorology (MET), such as the high-level roles and responsibility of each, including their inter-relationships and governance, the MET aspects of ICAO Annexes, and relevant WMO references, from a regulatory perspective, current and applicable European Regulation on aeronautical MET service provision,, in particular (EU) 2017/373 and including new ones such as SES2+ and CP1, the content of aeronautical meteorological provisions, including a basic overview of how this is done by the MET ANSP, as well as the exchange of meteorological information via AFTN/AMHS and now SWIM, before then spending time addressing the main roles/tasks of a competent authority involved in the oversight process of a MET ANSP: overview regarding certification and oversight; and, to highlight and discuss with course participants several MET ANSP oversight dilemmas and real word examples/problems.","objectives":"This course will provide a basic understanding of: the structure of meteorological information services provision and the role in the ATM system, the applicable ICAO/WMO and EU regulatory framework, the role of NCA in meteorological services oversight, practical experience organising oversight on meteorological information services.","audience":"This course is aimed at the NCA staff that will be asked to execute the oversight of aeronautical meteorological service provision and may also be of interest to staff of the MET ANSP concerned with compliance and oversight aspects. The participants should be able to communicate well in English language.","duration":"This course takes place over 3 days.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Annex I - Part definitions, Annex II - Part ATM/ANS.AR (for NCA), Annex III - Part-ATM/ANS.OR, Annex V - Part-MET, Annex XIII – Part-PERS.","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance.","terms_and_conditions":"Please see our Price List"},"LEX-NCA-NSA":{"terminy":[{"s":"2026-11-03 09:30","e":"2026-11-06 15:30","dni":4,"dow":"Wt-Pt","lok":"Online"},{"s":"2026-12-07 09:30","e":"2026-12-10 15:30","dni":4,"dow":"Pon-Czw","lok":"Online"},{"s":"2027-02-15 09:30","e":"2027-02-18 15:30","dni":4,"dow":"Pon-Czw","lok":"Online"},{"s":"2027-11-29 09:30","e":"2027-12-02 15:30","dni":4,"dow":"Pon-Czw","lok":"Online"}],"course_id":"LEX-NCA-NSA","title_full":"Roles and Responsibilities of National Aviation Authorities [LEX-NCA-NSA]","title_clean":"Roles and Responsibilities of National Aviation Authorities","description":"This course provides an understanding of the National Competent Authority’s role and function, detailing the responsibilities of personnel within the NCA and highlighting best practices to fulfil these duties. Participants will get insight into NCA responsibilities as outlined in the SES regulations and the training will assist them in identifying and implementing efficient working methods. Pre-requisites LEX-REG","objectives":"After completing the course, participants will have an appreciation of the functions of an NCA and the necessary processes to be able to conduct certification and effective oversight of service provider organisations. Other covered topics are record keeping, legal considerations and other authority duties.","audience":"This course is for National Competent Authorities (NCAs) and National Supervisory Authorities (NSAs) under the current EU regulatory framework This course is designed for those working within an NCA and is a mandatory element of the NCA Training Programme. It may also be of interest to staff working for other civil or military ATM regulatory bodies or for ATM service provider organisations.","duration":"This course takes place over 4 days. You will have 4 virtual sessions. You need to plan 16 hours to complete this course.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Sandrine TASQUIN Course manager Denisa OSMANI Tutor About Contact FAQ Getting Started Privacy Statement","location_text":"","important_note":"","more_information":"Course timetable","certificate_awarded":"Candidates passing the examination will receive a certificate of accomplishment. Other candidates will receive a certificate of attendance. Course Registration Request","terms_and_conditions":"Please see our Price List"},"LEX-SES":{"terminy":[{"s":"2026-10-20 09:00","e":"2026-10-23 13:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-02-23 09:00","e":"2027-02-26 13:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-10-05 09:00","e":"2027-10-08 13:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"LEX-SES","title_full":"Overview of EU legislation for ATM/ANS [LEX-SES]","title_clean":"Overview of EU legislation for ATM/ANS","description":"This course provides an overview of EU legislation for ATM/ANS. It focuses on the relevant high-level regulations (in particular the Basic Regulation 2018/1139 and Regulation 2024/2803 on the implementation of the Single European Sky) as well as their main implementing and delegated acts - those which affect most or all ATM/ANS service providers and their National Competent Authorities (NCAs) or National Supervisory Authorities (NSAs), in particular: the common requirements and oversight regulation 2017/373 (as variously amended) the performance and charging scheme regulation 2019/317 the ATCO licensing regulation 2015/340. Regulation 2023/1768 on the certification, declaration and Statement of Compliance of ATM/ANS equipment It is an excellent refresher course for those who have attended the LEX-SES course a couple of years ago, and would like to be informed about the latest changes introduced in EU legislation for ATM/ANS (SES 2+ recast), and what the future holds.","objectives":"After completing the course, participants should be aware of: - the EU regulatory framework (hierarchy and types of legal acts, rulemaking mechanisms, etc.) - the scope, objective and overall content of the Single European Sky (SES) legislative package (including SES2+ recast) - the EASA rulemaking procedure - the roles and responsibilities of the main players in the Single European Sky - the main ongoing regulatory developments in ATM/ANS.","audience":"This course is designed for anybody who wishes to develop an understanding of the Single European Sky initiative and the legislation that supports it: ATM/ANS service providers, National Competent Authorities in the field of ATM/ANS, National Supervisory Authorities (NSAs), ATM/ANS system manufacturers, EASA, other civil and military ATM regulatory bodies, etc.","duration":"This course takes place over 4 days.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nDenis HUET - Tutor\nOlga KAZMIERSKA - Tutor\nDipl.-Ing. MBA Alfred GULDER - Tutor","location_text":"EUROCONTROL Aviation Learning Centre, Luxembourg For practical information related to your travel and your stay in Luxembourg, visit our website and download the “Welcome to Luxembourg” guide. ALC is working with Lunchtime to provide catering services during your course. We invite you to create an account with lunchtime.lu and to order your
