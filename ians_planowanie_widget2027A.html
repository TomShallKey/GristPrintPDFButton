y two independent assessors. If a student fails to pass the assessment, a re-sit will be conducted on Friday, the last day of the course (Day 10).","pre_requisites":"Participants must hold or have held an air traffic controller licence.","objectives":"After completing the course, future On-the-Job Training Instructors (OJTI) and Synthetic Training Device Instructors (STDI) will have the skills necessary to help and safely guide air traffic controllers and students to progress toward a successful conclusion of their training.","audience":"This course is designed for air traffic controllers holding (or who have held) a surveillance rating who will be undertaking OJTI/STDI duties.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 3700 EUR.","delivered_by":"Peter ALDERSON - Course manager\nMiroslav ANDREEVSKI - Tutor\nDragan MILANOVSKI - Tutor\nPhilip AMMERMANN - Tutor"},"HUM-OJTI-M":{"terminy":[{"s":"2027-02-22 09:00","e":"2027-02-26 16:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-OJTI-M","title_full":"Practical Training Instructor skills for OJTI and STDI [HUM-OJTI-M]","title_clean":"Practical Training Instructor skills for OJTI and STDI","description":"This course is subject of approval by the Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. The Training Programme for On-the-Job Training Instructors (OJTI) and Synthetic Training Device Instructors (STDI) provides theoretical knowledge and practical skills for air traffic controllers who will undertake OJTI/STDI duties. The course combines virtual (online) sessions, self-paced e-learning and one week practical training in Luxembourg through variety of interactive learning methods such as case studies, role plays, videos, self-tests, discussions and practical exercises. The practical exercises are carried out on a ACS simulator. Participants act as practical instructors, students and pseudo-pilots focussing on coaching techniques, coupled with extensive feedback and assessments from the course instructors.","important_note":"Registrations will close 4 weeks before the start date of the course in Luxembourg to allow time for completion of the e-learning part of this course. It is essential that participants are allowed at least 20 hours of official time in the 4 weeks before the start of the course in Luxembourg to complete the e-learning. This course includes a theory exam and practical assessments of OJTI and STDI skills that take place in Luxembourg. Two virtual sessions will be arranged with the participants in the weeks before the practical part of the course to review the e-learning and prepare for the theory exam. The theory exam is held on Day 1 in Luxembourg. A student must achieve a minimum of 75% to pass the theoretical part of the training. A re-sit will be organised if a student fails to achieve 75%. The practical assessments take place on Day 4 and 5. A student must achieve a minimum average of 75% in two assessements to pass the practical part of the training. A re-sit will be organised if a student fails to achieve 75%.","pre_requisites":"Participants must hold or have held an air traffic controller licence.","objectives":"After completing the course, future On-the-Job Training and Synthetic Training Device Instructors will have the skills necessary to help student controllers and trainees to progress toward a successful conclusion of their operational or simulator training.","audience":"This course is designed for air traffic controllers holding (or who have held) an ATCO licence with the associated rating(s) who will be undertaking OJTI/STDI duties.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 3700 EUR.","delivered_by":"Peter ALDERSON - Course manager\nMiroslav ANDREEVSKI - Tutor\nDragan MILANOVSKI - Tutor\nPhilip Marques - Tutor\nIbrahim GUNAYDIN - Tutor\nPhilip AMMERMANN - Tutor"},"HUM-OJTI-R":{"terminy":[{"s":"2027-04-28 09:00","e":"2027-04-30 16:30","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"},{"s":"2027-05-12 09:00","e":"2027-05-14 16:30","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"}],"course_id":"HUM-OJTI-R","title_full":"Practical Training Instructor Skills for OJTI and STDI - Refresher [HUM-OJTI-R]","title_clean":"Practical Training Instructor Skills for OJTI and STDI - Refresher","description":"This course is approved by the Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. It is required that the refresher course is taken by suitably qualified OJTIs/STDIs every 3 years. This course encourages the active participation through discussions in a reflective classroom. During the theory part, in addition to instructor-led presentations, the participants will be analysing various scenarios and exploring different contexts the practical instructors may experience. The exchange of experience between participants of different backgrounds has proved to be a significant added value of refresher training. The practical training and the assessment is carried out on a radar skill trainer where the course participants will be performing roles of OJTIs, and EALC course instructors/assessors will be playing the role of a student.","important_note":"This course is based on the Commission Implementing Regulation (EU) 2015/340, ATCO.C.020 (b),(c) and ATCO.C.040 (b), (c) allowing REVALIDATION (a valid endorsement) and RENAWAL (an expired endorsement) of practical training instructor endorsements. Therefore, all practical instructors holding or have held an OJTI or STDI endorsements are welcome on the course. Two weeks before the course starts, all participants will receive access to training material including mandatory eLearning. To successfully complete the course, a participant must pass the practical instructor competence assessment.","pre_requisites":"A course participant must hold or have held an ATCO licence with an OJTI or STDI endorsement.","objectives":"The objective of this course is to refresh and enhance the knowledge, skills and instructional techniques of the practical instructors holding or have held OJTI or STDI endorsement (revalidation and renewal).","audience":"This course is designed for ATCOs (civil or military) who have previously completed training for practical instructors.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1110 EUR.","delivered_by":"Peter ALDERSON - Course manager\nMiroslav ANDREEVSKI - Tutor\nDragan MILANOVSKI - Tutor\nPhilip AMMERMANN - Tutor"},"HUM-SFM":{"terminy":[{"s":"2027-03-22 10:00","e":"2027-03-24 14:00","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"}],"course_id":"HUM-SFM","title_full":"Stress and Fatigue management [HUM-SFM]","title_clean":"Stress and Fatigue management","description":"Based on Commission Implementing Regulation (EU) 2017/373 and ICAO annex 11 EUROCONTROL provides a safety related course on fatigue and stress management. The course will enable participants through practise and discussions to grasp the key factors producing stress and fatigue and to evaluate and recognise impacts and develop coping strategies.The course will then give you practicle ways to start developing Fatigue management in ATM and to understand the difference between FRM and FRMS.","important_note":"","pre_requisites":"Participants should have a basic knowledge on fatigue and stress and impact on human performance. This can be obtained by following the HUM-FAT-MGT and HUM-STRESS e-learning modules.","objectives":"To provide tools and support at both individual and organisational levels for managing stress and fatigue in operations. The course will provide participants with practical tools and knowledge to start a management plan (both at prescriptive and FRMS level).","audience":"Managers and professionals that need to understand how to manage stress and fatigue in ATM. Personnel that are going to start implementing systems for faitgue management in ATM, HR people concerned with rostering...","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Fabrice DROGOUL - Course manager\nTutor"},"HUM-SIM":{"terminy":[{"s":"2027-02-08 10:00","e":"2027-02-12 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-03-01 10:00","e":"2027-03-05 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-19 10:00","e":"2027-04-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-SIM","title_full":"Design of ATC Simulation Exercises and Courses [HUM-SIM]","title_clean":"Design of ATC Simulation Exercises and Courses","description":"The current European ATM regulatory framework requires all staff undertaking safety-related tasks to be appropriately trained and competent. Such training is often carried out using a combination of practical skills training and classroom-based training. Practical skills training for air traffic controllers is carried out using simulators. In order to be of value, it is important that this training is designed according to specific objectives. Our course includes both theoretical and practical work to achieve meaningful training for the creation of ATC simulation exercises for ACS/APS based on predefined training objectives. The topics covered include the fundamental principles and parameters of simulation exercise design, workload evaluation and evaluation of a simulation course. Pre-requisites Participants should have ATC experience. Experience with PCs (Windows) and MS Excel is strongly recommended.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have an understanding of the necessary elements in ATC simulation exercise and course design and will have gained practical experience in designing such exercises.","audience":"This course is designed for ATC instructors who are, or will be, involved in simulation courses and developing ATC simulation courses.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Miroslav ANDREEVSKI Course manager About Contact FAQ Getting Started Privacy Statement"},"HUM-SUP":{"terminy":[{"s":"2027-04-20 09:00","e":"2027-04-23 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"HUM-SUP","title_full":"Operational Supervisor [HUM-SUP]","title_clean":"Operational Supervisor","description":"The skills required to supervise an operations room are very different from those needed to provide air traffic services. This course develops participants'''' knowledge on the following subjects in an interactive environment that encourages discussion and the sharing of experience. Communication This is a key skill as supervisors need to communicate effectively to obtain the help of others in carrrying out their duties. The Supervisor & Safety The significant difference between the role of a controller and a supervisor in providing a safe ATC service is explained. Individual Style This module helps to improve awareness of how individuals behave and the impact this can have on interpersonal relationships in the workplace. Leadership The importance of leadership and behaviours that can help a supervisor to be accepted by colleagues as an effective leader are explored. Teamwork This module considers how a supervisor can support their organisation in obtaining the benefits of teamwork. Motivation What motivates people about their job, how this can change over time and tools that a supervisor can use to help motivate colleagues is considered. Managing Conflict The causes of conflict, individual reaction to conflict situations and how these can be constructively dealt with are explored using various scenarios.","important_note":"Please note this course is intended for once only attendance. Refresher training for experienced supervisors is available for delivery at the client''s premises on request. Pre-requisites A high level of English language proficiency is essential.","pre_requisites":"","objectives":"To facilitate the transition of ATC staff into supervisory roles. To equip operational supervisors with the knowledge, skills and confidence to enhance performance in their current or future supervisory roles. To enable supervisors to follow a systematic process that gives appropriate importance to all aspects of their role. To link performance to the internal and external environments.","audience":"This course is designed to facilitate the transition of ATC staff into supervisory roles. The course is equally designed for operational ATC staff recently appointed into supervisory roles.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Peter ALDERSON Course manager Philip AMMERMANN Tutor About Contact FAQ Getting Started Privacy Statement"},"HUM-TRM-F":{"terminy":[{"s":"2027-02-08 10:00","e":"2027-02-12 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-TRM-F","title_full":"TRM Facilitator [HUM-TRM-F]","title_clean":"TRM Facilitator","description":"Team Resource Management (TRM) focuses on operational human performance and teamwork in ATM operations. It explores the gap between \"Work as Imagined\" and \"Work as Done\" in human factors terms. When implemented effectively, TRM focuses on things that go well during daily ATM operations and facilitates ways to replicate this success. It encourages the exchange and understanding of operational pitfalls and strengthens the human safety net. Personnel attending this course will be trained so that they are able to deliver TRM sessions for air traffic controllers. A high level of English language proficiency is needed as participants can expect to facilitate a group discussion and to co-facilitate a half-day TRM session.","important_note":"EU Commission Regulation 2015/340 states that one of the Acceptable Means of Compliance (AMC) for meeting the human factors ATC Refresher Training requirements (as part of Continuation Training) is to train air traffic controllers in team resource management. EUROCONTROL’s well-established TRM concept and prototype training material may be used by ANSPs to implement this AMC and consequently meet the regulatory requirement.","pre_requisites":"A sound theoretical background of the TRM initiative is needed as this course focuses on practical TRM aspects. Participants are therefore required to have either completed the TRM in ATM course, Introduction to TRM course or Team Resource Management: The basics course.","objectives":"By the end of the course, participants will be able to: Use facilitation techniques to deliver TRM subject material Customize TRM training materials.","audience":"This course is designed for personnel who wish to become TRM facilitators. It is primarily aimed at air traffic controllers. However ATSEP and AIM personnel will also benefit from this course.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Peter ALDERSON - Course manager\nMaximilian Bezzina - Tutor"},"HUM-TTI":{"terminy":[{"s":"2027-03-01 09:00","e":"2027-03-05 15:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-TTI","title_full":"Theoretical Training Instructor Skills [HUM-TTI]","title_clean":"Theoretical Training Instructor Skills","description":"Training is a vital part of ensuring that everybody involved in ATM is competent for the tasks that they are asked to undertake. Training can take many forms, but to be effective it is important that the trainer understands the fundamental elements involved in transferring knowledge during a lesson. This course is designed to help those who are asked to produce and deliver classroom training material or to deliver work related presentations - to do it in the most effective way. Although mostly focused on a classroom-based training environment and ATCO training, the principles covered by this course are equally applicable to many other training situations (ATSEP; AIS/AIM ..)","important_note":"This course is an examined and assessed training course.","pre_requisites":"We welcome interested participants with ICAO English language skills at level 4 or higher.","objectives":"With this course we aim at supporting you in tailoring your work presentations and lessons. After completing this course, participants will have hands-on experience of delivering short theoretical training in lesson format. You will be asked to prepare and design, develop and deliver two lessons lasting up to 25 min each, together with designing one written test. Participant's sessions are debriefed, based on set guidelines.","audience":"This course is appropriate for colleagues who will be asked to design, develop and deliver theoretical training for ATM staff and/or presentation on ATM related events. It aims at fulfilling criteria from Acceptable Means of Compliance to Part-ATCO, subpart C, Section 1 (Instructors) for Commission Regulation (EU) 2015/340.","price":"This course is subject to User-Pays-Principle (UPP) from 1 Sep 2022. The price for all course participants is 1850 EUR.","delivered_by":"Fabrice DROGOUL - Course manager"},"IM-DE1":{"terminy":[{"s":"2027-02-22 10:00","e":"2027-02-26 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"IM-DE1","title_full":"Data Exchange in Aviation - IP Networks and Applications [IM-DE1]","title_clean":"Data Exchange in Aviation - IP Networks and Applications","description":"This course – replacing previous COM-DATA and COM-NEWPENS – covers networks and applications, namely IP deployments (NewPENS in particular), existing apps such as OLDI, surveillance distribution, messaging (AMHS), Network Manager (NM), EAD, etc., as well as new ones such Voice over IP, Data Link, etc. The initial and future transition to SWIM, covered in more details in the IM-DE2 follow-up course, is introduced together with future strategies and regulations. An important aspect of these two new courses is the evolution of data exchange supporting not only ATM but also aviation in general, including additional stakeholders such as airports, airlines, etc.","important_note":"This course replaces previous COM-DATA and COM-NewPENS courses","pre_requisites":"","objectives":"At the end of this course, participants will have a sound understanding of the IP networking capabilities being deployed in Europe and the world, and how existing and future applications are making use of these. They will also obtain an initial introduction of how these applications will evolve to make use of SWIM technical features, developed further in the companion course IM-DE2.","audience":"Technical and operational staff involved in data exchange systems and applications in ATM and aviation. Regulators and managers will also benefit from an overview of the evolution of these systems.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE Course manager Manuel Garcia Martin Tutor About Contact FAQ Getting Started Privacy Statement"},"LEX-2803-INTRO":{"terminy":[{"s":"2027-01-27 09:30","e":"2027-01-27 16:00","dni":1,"dow":"Śr","lok":"Online"},{"s":"2027-03-17 09:30","e":"2027-03-17 16:00","dni":1,"dow":"Śr","lok":"Online"},{"s":"2027-05-21 09:30","e":"2027-05-21 16:00","dni":1,"dow":"Pt","lok":"Online"}],"course_id":"LEX-2803-INTRO","title_full":"Overview of SES2+ recast [LEX-2803-INTRO]","title_clean":"Overview of SES2+ recast","description":"The course provides an overview of Regulation 2024/2803 on the implementation of SES (SES2+ recast). The course addresses in particular: the general principles of the Single European Sky (SES) its history the motivation for a SES2+ recast the legislative process the proposals of the European Commission NSAs and their tasks service provision performance and charging schemes network management airspace, interoperability and technological innovation the implementation of the new framework.","important_note":"","pre_requisites":"Before attending the LEX-2803-INTRO course, it is strongly recommended to complete the following e-learning courses: EU rulemaking mechanisms [LEX-RULE] Fundamentals of EU legal framework for aviation [LEX-REG] Overview of main regulations affecting ATM/ANS [LEX-ATMANS]","objectives":"After completing the course, participants will be well aware of the scope, objective and overall content of Regulation 2024/2803 on the implementation of SES (SES2+ recast) as well as the roles and responsibilities of the main players.","audience":"Anybody interested in getting an overview of Regulation 2024/2803 (SES2+ recast): ATM/ANS service providers, national competent authorities (NCAs), national supervisory authorities (NSAs), Common Information Service providers, EASA, other civil and military ATM regulatory bodies, etc.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 400 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nDipl.-Ing. MBA Alfred GULDER - Tutor"},"LEX-373-INTRO":{"terminy":[{"s":"2027-04-06 09:00","e":"2027-04-08 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"LEX-373-INTRO","title_full":"Overview of Regulation 2017/373 [LEX-373-INTRO]","title_clean":"Overview of Regulation 2017/373","description":"This course provides an overview of Regulation 2017/373 for all ATM/ANS providers except data providers (for data providers, please refer to the LEX-373-DAT course) The course focuses on the main requirements of Regulation 2017/373, both the cover regulation (articles) and all of its annexes, except Part-DAT/Annex VII (the latter is covered in detail in the LEX-373-DAT course). As the course is continuously updated to take account of the regulatory developments affecting Regulation 2017/373, it can be regarded as a refresher course for those having attended the course a couple of years ago.","important_note":"In November 2023, the EASA Air Traffic Department has verified the training material of this course against the regulatory framework on the ATM/ANS common requirements (Regulation 2017/373). As a result of this verification, EASA has endorsed the content of the course as it is in line and meets the intent of the aforementioned framework.","pre_requisites":"Before attending the LEX-373-INTRO course, it is recommended to complete the following e-learning courses: EU rulemaking mechanisms [LEX-RULE] Fundamentals of EU legal framework for aviation [LEX-REG] Overview of main regulations affecting ATM/ANS [LEX-ATMANS]","objectives":"After completing the course, participants should have a good general understanding of the objectives, applicability, structure and scope of Regulation 2017/373 the main requirements described in Regulation 2017/373, both in the cover regulation (articles) and all its annexes, except Part-DAT (Annex VII)","audience":"Anybody interested in getting an overview of Regulation 2017/373, in particular those working for competent authorities and ATM/ANS providers (including the Network Manager), except data providers. Note: the LEX-373-INTRO course is not suitable for data providers. The LEX-373-DAT course has been designed to address the specific needs of data providers.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nDipl.-Ing. MBA Alfred GULDER - Tutor"},"LEX-AUDIT-1":{"terminy":[{"s":"2027-02-01 09:00","e":"2027-02-05 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-26 09:00","e":"2027-04-30 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"LEX-AUDIT-1","title_full":"Audit Techniques and Practice Stage 1 [LEX-AUDIT-1]","title_clean":"Audit Techniques and Practice Stage 1","description":"This course offers sufficient understanding of the basic principles of auditing to enable participants to conduct in-depth and searching regulatory audits of ATM services as required by the Commission Regulation laying down technical requirements and administrative procedures related to service providers and the oversight thereof. The course consists of three stages; all three stages MUST be followed.","important_note":"The LEX-AUDIT-1 course has been completely redesigned (more than 80% of the material is completely new) and is now fully aligned with the currently applicable regulatory requirements for oversight auditing in the domains of ATM/ANS and Aerodromes. Pre-requisites Participants must complete LEX-REG and LEX-AUDIT-BASIC e-learning courses before attending this course.","pre_requisites":"","objectives":"Participants will demonstrate knowledge and practical skills necessary to conduct audits in the ATM/ANS and Aerodrome domains, in accordance with applicable EU regulations.","audience":"This course is designed for staff working within an NCA/NSA and is a mandatory element of the NCA/NSA Training Programme. It may also be of interest to staff working for other civil or military ATM safety regulatory bodies, for ATM/ANS service provider organisations or for Aerodrome operators. This redesigned course could also be of interest to staff involved in internal (compliance monitoring) auditing, coming from ATM/ANS providers as well as from Airport operators.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Igor POLTORACKI Course manager Björn SCHRÄDER Speaker Mr Petros Stratis Tutor About Contact FAQ Getting Started Privacy Statement"},"LEX-AUDIT-3":{"terminy":[{"s":"2027-05-11 09:00","e":"2027-05-13 15:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"LEX-AUDIT-3","title_full":"Audit Techniques and Practice Stage 3 [LEX-AUDIT-3]","title_clean":"Audit Techniques and Practice Stage 3","description":"This course offers sufficient understanding of the basic principles of auditing. It enables participants to conduct regulatory and compliance audits in the domains of ATM/ANS (as required by Regulation (EU) 2017/373) and Aerodromes (as required by Regulation (EU) 139/2014). The course is structured into three mandatory stages, all of which MUST be completed.","important_note":"As of second semester 2026 this course will be available both as classroom and as a virtual course (LEX-AUDIT-3-V) Pre-requisites Participants must have completed Audit Stage 1 and 2 before attending this course.","pre_requisites":"","objectives":"Participants will demonstrate knowledge and practical skills necessary to conduct audits in the ATM/ANS and Aerodrome domains, in accordance with applicable EU regulations.","audience":"This course is designed for staff working within a NCA/NSA and is a mandatory element of the NCA/NSA Training Programme. It may also be of interest to staff working for other civil or military ATM safety regulatory bodies, for ATM/ANS service provider organisations or for Aerodrome operators.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Igor POLTORACKI Course manager Mr Petros Stratis Tutor About Contact FAQ Getting Started Privacy Statement"},"LEX-AUDIT-3-V":{"terminy":[{"s":"2027-01-12 09:00","e":"2027-01-14 16:00","dni":3,"dow":"Wt-Czw","lok":"Online"}],"course_id":"LEX-AUDIT-3-V","title_full":"Audit Techniques and Practice Stage 3 [LEX-AUDIT-3-V]","title_clean":"Audit Techniques and Practice Stage 3","description":"This course offers sufficient understanding of the basic principles of auditing. It enables participants to conduct regulatory and compliance audits in the domains of ATM/ANS (as required by Regulation (EU) 2017/373) and Aerodromes (as required by Regulation (EU) 139/2014). The course is structured into three mandatory stages, all of which MUST be completed.","important_note":"","pre_requisites":"Participants must have completed Audit Stage 1 and 2 before attending this course.","objectives":"Participants will demonstrate knowledge and practical skills necessary to conduct audits in the ATM/ANS and Aerodrome domains, in accordance with applicable EU regulations.","audience":"This course is designed for staff working within a NCA/NSA and is a mandatory element of the NCA/NSA Training Programme. It may also be of interest to staff working for other civil or military ATM safety regulatory bodies, for ATM/ANS service provider organisations or for Aerodrome operators.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1200 EUR.","delivered_by":"Igor POLTORACKI - Course manager"},"LEX-BR-1139-V":{"terminy":[{"s":"2027-01-05 09:30","e":"2027-01-08 12:00","dni":4,"dow":"Wt-Pt","lok":"Online"}],"course_id":"LEX-BR-1139-V","title_full":"Overview of Basic Regulation 2018/1139 for ATM/ANS and Aerodromes [LEX-BR-1139-V]","title_clean":"Overview of Basic Regulation 2018/1139 for ATM/ANS and Aerodromes","description":"The Basic Regulation 2018/1139 is the cornerstone of the EU regulatory framework in civil aviation, hence an important piece of legislation to be aware of. This course describes its main features & requirements in or affecting the fields of ATM/ANS and aerodromes, in particular: Delegated acts vs. implementing acts Objectives and scope Substantive and essential requirements in the fields of ATM/ANS and aerodromes, especially when it comes to interoperability ATM/ANS systems and ATM/ANS constituents organisations involved in the design, production or maintenance of such systems and equipment certification of ATM/ANS providers (and possibilities for exemption) safety-related aerodrome equipment Functions and tasks assigned to EASA in or affecting the fields of ATM/ANS and aerodromes Possibilities for reallocation of responsibilities with regards to certification, oversight and enforcement tasks. Pool of European aviation inspectors Repository of information Exemption mechanisms Oversight support mechanism Qualified entities Interdependencies between civil aviation safety & socio-economic factors or aviation security The course also addresses Regulation 2025/1044 supplementing the Basic Regulation with detailed rules & procedures on the acceptance of ATCO licences and certificates issued by third countries, but not in detail (those who need to dig deeper into Regulation 2025/1044 are recommended to register for the LEX-COMP-ATCO course).","important_note":"This course content has been checked by the EASA’s Air Traffic Department and Legal and Procurement Department in March 2025. EASA has concluded that the content of the LEX-BR-1139-V course is in line with the intent and scope of the regulatory framework of Regulation (EU) 2018/1139.","pre_requisites":"Before attending the LEX-BR-1139-V course, it is strongly recommended to complete the following e-learning courses: EU rulemaking mechanisms [LEX-RULE] Fundamentals of EU legal framework for aviation [LEX-REG] Overview of main regulations affecting ATM/ANS [LEX-ATMANS]","objectives":"After completing the course, participants should: be able to describe the main features and requirements of the Basic Regulation 2018/1139, in or affecting the fields of ATM/ANS and aerodromes be aware of Regulation 2025/1044 supplementing the Basic Regulation 2018/1139 with detailed rules and procedures on the acceptance of ATCO licenses and certificates issued by third countries.","audience":"Anyone involved in the fields of ATM/ANS and aerodromes, who wishes to develop an understanding of the Basic Regulation 2018/1139 and the impact it has or could have on these fields (now and in the future).","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nRenata ZLOPASA - Tutor"},"LEX-CAGE-DPO":{"terminy":[{"s":"2027-03-15 09:30","e":"2027-03-19 13:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"LEX-CAGE-DPO","title_full":"Approval of DPOs and attestation of ATM/ANS equipment [LEX-CAGE-DPO]","title_clean":"Approval of DPOs and attestation of ATM/ANS equipment","description":"This course focusses on the obligations applicable to organisations involved in the design or production of ATM/ANS systems and ATM/ANS constituents (DPOs) in relation to the regulatory framework on the conformity assessment of ATM/ANS equipment, as described in: DA 2023/1768 laying down detailed rules for the certification and declaration of ATM/ANS systems and constituents; IA 2023/1769 laying down technical and administrative procedures for the approval of organisations involved in the design or production of ATM/ANS systems and constituents. It addresses in particular: in-depth look at the approval process applicable to certain design or production organisations (DPOs); the attestation processes applicable to certain ATM/ANS equipment (certification, declaration or statement of compliance); key associated concepts: detailed specifications (DS), certification specifications (CS), acceptable means of compliance (AMC), guidance material (GM), attestation basis, etc; the obligations of DPOs and interactions with EASA in particular, but also with ATM/ANS service providers (SPs) and National Competent Authorities (NCAs); application of transitional provisions; what the future holds.","important_note":"This course is developed in coordination with EASA. In August 2024, the EASA Air Traffic Department has verified the training material of this course against the newly introduced regulatory framework for ATM/ANS equipment (comprising in particular Regulations 2023/1768, 2023/1769 and 2023/1771). As a result of this verification, EASA has endorsed the content of this course as it is in line and esses in particular: in-depth look at the approval (certification) process applicable to certain design or production organisations (DPOs); the attestation processes applicable to certain ATM/ANS equipment (certification, declaration or statement of compliance); key associated concepts: detailed specifications (DS), certification specifications (CS), acceptable means of compliance (AMC), guidance material (GM), attestation basis, etc; the obligations of DPOs and interactions with EASA in particular, but also with ATM/ANS service providers (SPs) and National Competent Authorities (NCAs); application of transitional provisions; what the future holds.","important_note":"This course is developed in coordination with EASA. In August 2024, the EASA Air Traffic Department has verified the training material of this course against the newly introduced regulatory framework for ATM/ANS equipment (comprising in particular Regulations 2023/1768, 2023/1769 and 2023/1771). As a result of this verification, EASA has endorsed the content of this course as it is in line and meets the intent of the aforementioned framework. Pre-requisites Before attending this course, it is strongly recommended to complete the LEX-CAGE-INTRO (or LEX-CAGE-INTRO-C) course.","pre_requisites":"","objectives":"After completing the course, participants will have a good understanding of the obligations applicable to DPOs in relation to the regulatory framework on the conformity assessment of ATM/ANS equipment.","audience":"This course is designed for staff working for an organisation involved or wishing to get involved in the design and/or production of ATM/ANS equipment (DPO): either an ATM/ANS system manufacturer, or an ATM/ANS service provider acting as a DPO.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1800 EUR.","delivered_by":"Igor POLTORACKI Course manager Jean-Francois PIRIOU Tutor Jose Luis Garcia-Chico Tutor About Contact FAQ Getting Started Privacy Statement"},"LEX-CAGE-INTRO":{"terminy":[{"s":"2027-02-01 13:30","e":"2027-02-05 16:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"LEX-CAGE-INTRO","title_full":"Overview of regulatory framework on the conformity assessment of ATM/ANS equipment [LEX-CAGE-INTRO]","title_clean":"Overview of regulatory framework on the conformity assessment of ATM/ANS equipment","description":"This course provides an overview of the regulatory framework on the conformity assessment of ATM/ANS equipment, as described in: DA 2023/1768 laying down detailed rules for the certification and declaration of ATM/ANS systems and constituents IA 2023/1769 laying down technical and administrative procedures for the approval of organisations involved in the design or production of ATM/ANS systems and constituents IA 2023/1770 laying down common provisions on aircraft equipment required for the use of the SES airspace and operating rules related to the use of the SES airspace, and repealing Regs 29/2009 (on datalink services), 1206/2011 (on aircraft identification), 1207/2011 (on surveillance performance and interoperability) and 1079/2012 (on air ground voice channel spacing) IA 2023/1771 amending Reg. 2017/373 as regards ATM/ANS systems and constituents, and repealing Regs 1032/2006 (on coordination and transfer), 633/2007 (on FMTP), 262/2009 (on Mode S) IA 2023/1772 amending Regulation 923/2012 as regards the operating rules related to the use of ATM/ANS systems and constituents in the SES airspace, and repealing Regulation 1033/2006 (on initial flight plans) It addresses in particular: the certification and declaration processes applicable to certain ATM/ANS equipment, including the 3 methods of attestation (certification, declaration and compliance) and their scope the approval (certification) of certain design or production organisations (DPOs) key associated concepts: detailed specifications (DS), certification specifications (CS), acceptable means of compliance (AMC), guidance material (GM), certification basis (CB), etc. the roles and responsibilities of the main actors in the field of ATM/ANS interoperability: ATM/ANS service providers (SPs), National Competent Authorities (NCAs), Design and Production Organisations (DPOs), EASA, etc. the impact of the regulatory framework on the main actors listed above the impact of the regulatory framework on the conformity assessment of ATM/ANS equipment as defined by: Reg. 2017/373 (common requirements for ATM/ANS providers and their competent authorities) Reg. 923/2012 (common rules of the air) an overview explaining how the 8 existing implementing regulations for interoperability (previously developed under Reg. 552/2004) are transposed in the EASA regulatory framework examples of “Detailed Specifications” (including “Certification Specifications Acceptable Means of Compliance and Guidance Material”) application of the transitional provisions what the future holds The course also includes a half-day slot where EASA will answer questions and highlight some key messages.","important_note":"In February 2024, the EASA Air Traffic Department has verified the training material of this course against the regulatory frameworks on the ATM/ANS common requirements (Regulation 2017/373) and on the newly introduced ATM/ANS equipment (comprising in particular Regulations 2023/1768, 2023/1769 and 2023/1771). As a result of this verification, EASA has endorsed the content of the course as it is in line and meets the intent of the aforementioned frameworks.","pre_requisites":"Before attending the LEX-CAGE-INTRO course, it is recommended to complete the following e-learning courses: EU rulemaking mechanisms [LEX-RULE] Fundamentals of EU legal framework for aviation [LEX-REG] Overview of main regulations affecting ATM/ANS [LEX-ATMANS]","objectives":"After completing the course, participants will have a good understanding of the regulatory framework on the conformity assessment of ATM/ANS equipment, especially: its impact on organisations involved in the design or production of ATM/ANS equipment (DPOs), ATM/ANS service providers (SPs), National Competent Authorities (NCAs) and EASA the approval and certification process for DPOs, the conformity assessment of ATM/ANS equipment and the 3 methods of attestation (certification, declaration and statements of compliance) the roles & responsibilities of the main actors as listed above","audience":"This course is designed for staff involved (or wishing to get involved) in conformity assessment of ATM/ANS equipment, and working for: an organisation involved in the design or production of ATM/ANS equipment (DPO) an ATM/ANS service provider (SP) a national competent authority (NCA) EASA It may be also of interest for staff who wish to develop a general understanding of the regulatory framework, its impact on the conformity assessment of ATM/ANS equipment and its impact on their organisation.","price":"No fee applies for course participants from Member States'''' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1800 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nJose Luis Garcia-Chico - Tutor\nIgor POLTORACKI - Tutor"},"LEX-CHG-OC-1":{"terminy":[{"s":"2027-01-04 13:00","e":"2027-01-08 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"LEX-CHG-OC-1","title_full":"Oversight of Changes in ATM/ANS Part 1 [LEX-CHG-OC-1]","title_clean":"Oversight of Changes in ATM/ANS Part 1","description":"The Oversight of Changes in the ATM/ANS Part 1 course builds on the knowledge acquired in the Management & Oversight of Changes in ATM/ANS course [SAF-CHG-INTRO] or Management & Oversight of Changes First Steps [SAF-CHG-FS]. The course is consistent with Regulation 2017/373 and its relevant AMC/GM. This course focuses on the tasks of competent authorities in ATM/ANS as regards the oversight of changes in ATM/ANS, and covers the following topics: Approval of an alternative means of compliance (AltMOC), Approval of change management procedures, Notification of planned changes, The decision to review a change, Oversight of changes, Oversight audits (monitoring of changes) It describes the obligations of the competent authority, and how to effectively oversee changes to the ATM/ANS functional system. Pre-requisites The SAF-CHG-INTRO or SAF-CHG-FS course must be successfully completed before attending this course. LEX-SES-E e-learning course is recommended. The participant should read through the relevant EU legislation pertaining to ATM/ANS changes, as described in the course syllabus.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have a thorough understanding of the aspects to be considered when overseeing changes in ATM/ANS, in particular changes to the ATM/ANS functional system in accordance with the Regulation 2017/373.","audience":"This course is designed for personnel working for a competent authority and involved in the oversight of changes in ATM/ANS. Note: staff working for an ATM/ANS service provider who are involved in the maintenance or application of its change management procedures may also register.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Michel DE REDE Content Manager Sandrine TASQUIN Course manager Mr Petros Stratis Tutor About Contact FAQ Getting Started Privacy Statement"},"LEX-CYBER":{"terminy":[{"s":"2027-03-08 09:30","e":"2027-03-10 13:00","dni":3,"dow":"Pon-Śr","lok":"Online"}],"course_id":"LEX-CYBER","title_full":"Oversight of Security Management Systems in ATM [LEX-CYBER]","title_clean":"Oversight of Security Management Systems in ATM","description":"This course provides an overview of the current (Cyber) Security requirements stemming from the Global and European Regulatory Framework. It helps participants to understand the legislative requirements from ICAO, SES legislation, their implementing rules, and the measures to be taken from the NSA/ANSP for their implementation. It gives the participants a basic understanding to conduct the effective Security Oversight activities and verify the compliance of the ANSP with the latest (cyber) security requirements. It gives an introduction to ATM Security and explains the important role of a Security Management Systems.","important_note":"This virtual course is exactly the same as the previous LEX-CYBER classroom course","pre_requisites":"","objectives":"After completing the course, participants will have a basic understanding of the main (Cyber) Security Regulations in force and their requirements. They will be able to understand the security oversight process and the aspects which need to be considered in the context of the oversight of the security management systems implemented by ANSPs.","audience":"This course is designed for those working within an NSA and is an optional element of the NSA Training Initiative. It may also be of interest to staff working for other civil or military ATM security regulatory bodies or for ATM service provider organisations.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 600 EUR.","delivered_by":"Denisa OSMANI Content Manager Sandrine TASQUIN Course manager Timo BLUNCK Tutor About Contact FAQ Getting Started Privacy Statement"},"LEX-ISMS":{"terminy":[{"s":"2027-01-25 09:30","e":"2027-01-27 12:30","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"}],"course_id":"LEX-ISMS","title_full":"Compliance with Part-IS Requirements for Information Security Management Systems [LEX-ISMS]","title_clean":"Compliance with Part-IS Requirements for Information Security Management Systems","description":"The course is built on the new Regulation 2023/203 and Regulation 2022/1645 PART-IS and the Acceptable Means of Compliance and Guidance Material to the Annexes of Part IS.I.OR and Part IS.D.OR. This Regulation sets out the requirements to be met by the organisations and competent authorities in order: (a) to identify and manage information security risks with potential impact on aviation safety which could affect information and communication technology systems and data used for civil aviation purposes, (b) to detect information security events and identify those which are considered information security incidents with potential impact on aviation safety, (c) to respond to, and recover from, those information security incidents.","important_note":"","pre_requisites":"","objectives":"Describe the components of an ISMS Explain the regulatory requirements of Part-IS Use the PART-IS related Acceptable Means of Compliance (AMC) and Guidance Material (GM)","audience":"All aviation actors","price":"The price for all course participant is 1110 EUR.","delivered_by":"Timo BLUNCK Content Manager Sandrine TASQUIN Course manager Tim STELKENS-KOBSCH Tutor Denisa OSMANI Tutor Kristof LAMONT Tutor About Contact FAQ Getting Started Privacy Statement"},"LEX-NCA-NSA":{"terminy":[{"s":"2027-02-15 09:30","e":"2027-02-18 15:30","dni":4,"dow":"Pon-Czw","lok":"Online"}],"course_id":"LEX-NCA-NSA","title_full":"Roles and Responsibilities of National Aviation Authorities [LEX-NCA-NSA]","title_clean":"Roles and Responsibilities of National Aviation Authorities","description":"This course provides an understanding of the National Competent Authority’s role and function, detailing the responsibilities of personnel within the NCA and highlighting best practices to fulfil these duties. Participants will get insight into NCA responsibilities as outlined in the SES regulations and the training will assist them in identifying and implementing efficient working methods. Pre-requisites LEX-REG","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have an appreciation of the functions of an NCA and the necessary processes to be able to conduct certification and effective oversight of service provider organisations. Other covered topics are record keeping, legal considerations and other authority duties.","audience":"This course is for National Competent Authorities (NCAs) and National Supervisory Authorities (NSAs) under the current EU regulatory framework This course is designed for those working within an NCA and is a mandatory element of the NCA Training Programme. It may also be of interest to staff working for other civil or military ATM regulatory bodies or for ATM service provider organisations.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Sandrine TASQUIN Course manager Denisa OSMANI Tutor About Contact FAQ Getting Started Privacy Statement"},"LEX-SES":{"terminy":[{"s":"2027-02-23 09:00","e":"2027-02-26 13:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"LEX-SES","title_full":"Overview of EU legislation for ATM/ANS [LEX-SES]","title_clean":"Overview of EU legislation for ATM/ANS","description":"This course provides an overview of EU legislation for ATM/ANS. It focuses on the relevant high-level regulations (in particular the Basic Regulation 2018/1139 and Regulation 2024/2803 on the implementation of the Single European Sky) as well as their main implementing and delegated acts - those which affect most or all ATM/ANS service providers and their National Competent Authorities (NCAs) or National Supervisory Authorities (NSAs), in particular: the common requirements and oversight regulation 2017/373 (as variously amended) the performance and charging scheme regulation 2019/317 the ATCO licensing regulation 2015/340. Regulation 2023/1768 on the certification, declaration and Statement of Compliance of ATM/ANS equipment It is an excellent refresher course for those who have attended the LEX-SES course a couple of years ago, and would like to be informed about the latest changes introduced in EU legislation for ATM/ANS (SES 2+ recast), and what the future holds.","important_note":"","pre_requisites":"Before attending the LEX-SES course, it is strongly recommended to complete the following e-learning courses: EU rulemaking mechanisms [LEX-RULE] Fundamentals of EU legal framework for aviation [LEX-REG] Overview of main regulations affecting ATM/ANS [LEX-ATMANS]","objectives":"After completing the course, participants should be aware of: - the EU regulatory framework (hierarchy and types of legal acts, rulemaking mechanisms, etc.) - the scope, objective and overall content of the Single European Sky (SES) legislative package (including SES2+ recast) - the EASA rulemaking procedure - the roles and responsibilities of the main players in the Single European Sky - the main ongoing regulatory developments in ATM/ANS.","audience":"This course is designed for anybody who wishes to develop an understanding of the Single European Sky initiative and the legislation that supports it: ATM/ANS service providers, National Competent Authorities in the field of ATM/ANS, National Supervisory Authorities (NSAs), ATM/ANS system manufacturers, EASA, other civil and military ATM regulatory bodies, etc.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Jean-Francois PIRIOU - Course manager\nDenis HUET - Tutor\nOlga KAZMIERSKA - Tutor\nDipl.-Ing. MBA Alfred GULDER - Tutor"},"LEX-U-SPACE":{"terminy":[{"s":"2027-05-11 10:00","e":"2027-05-13 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"LEX-U-SPACE","title_full":"Overview of U-space regulatory framework [LEX-U-SPACE]","title_clean":"Overview of U-space regulatory framework","description":"This course provides an overview of Commission Implementing Regulation (EU) 2021/664, 665 and 666 establishing the framework for the safe integration of drones into EU airspace through U-space. It covers: The roles and responsibilities of U-space service providers (USSPs), common information service providers (CISPs), and UAS operators, National Competent Authorities & European Union Aviation Safety Agency (EASA) Common Information Service (CIS) models (decentralized CISPs and centralized Single CISP). Certification requirements for U-space services and CIS. Mandatory U-space services such as network identification, geo-awareness, traffic information, and flight authorization, plus optional services. The designation and management of U-space airspace, including safety principles like Dynamic Airspace Restriction (DAR) (per (EU) 2021/665) and eConspicuity (per (EU) 2021/666). Interactions with national authorities and the European Union Aviation Safety Agency","important_note":"The course is developed with partnership with EASA.","pre_requisites":"","objectives":"Participants joining this course aim to: Describe the EU U-space regulatory framework, specifically Commission Implementing Regulations (EU) 2021/664, 665, and 666, and how they enable the safe integration of drones into European airspace Identify the roles and responsibilities of key stakeholders such as U-space Service Providers (USSPs), Common Information Service Providers (CISPs), and UAS operators, NCAs & EASA including the operational differences between decentralized and centralized CIS model Identify certification requirements for both U-space and Common Information Service Providers. Explain mandatory and optional U-space services, including network identification, geo-awareness, traffic information, and flight authorization. Describe how U-space airspace is designated and managed, with attention to safety concepts such as Airspace Risk Assessment (ARA) and Dynamic Airspace Reconfiguration (DAR). Learn how U-space stakeholders interact with national authorities and EASA, ensuring compliance and effective coordination in U-space deployment Discuss interoperability with manned aviation (eConspicuity) & anticipate future developments for U-space","audience":"Personnel of National Competent Authorities (NCAs), U-space Service Providers (USSPs) and Common Information Service Providers (CISPs), Air Traffic Service (ATS) Providers / ANSPs, Manned Aviation Operators in U-space Airspace, UAS Operators and anybody who wishes to develop an understanding of EU U-space regulatory framework","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Dr Aycan MUTLU - Course manager\nCecilia CLARAMUNT PUCHOL - Tutor\nStephane VAUBOURG - Tutor\nNorberto VERA VELEZ - Tutor"},"NAV-GNSS":{"terminy":[{"s":"2027-01-11 10:00","e":"2027-01-15 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"NAV-GNSS","title_full":"Global Navigation Satellite System for Aviation [NAV-GNSS]","title_clean":"Global Navigation Satellite System for Aviation","description":"Will GNSS ever become the \"sole means\" navigation service? What does this mean? Can the current satellite systems be improved to achieve \"sole means\" and what are the enhancements required to make the system acceptable for civil aviation use? This 5 day GNSS course is designed to give a clear explanation of satellite constellations used for navigation, signal structures, system errors and a full explanation of the different types of augmentation that can be applied. The course will look at the current limitations of satellite systems, reviews GNSS vulnerabilities and discusses GNSS reversion. The course will also discuss future planned improvements to GPS and GLONASS before reviewing the European and Chinese constellations: GALILEO and BEIDOU. The course will provide insight to the different types of augmentation and review the progress of SBAS and GBAS. This course aims to provide participants with an in-depth view of GNSS, its principles and benefits for civil aviation.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have an in-depth understanding of GNSS, its principles and benefits for civil aviation.","audience":"This course is designed for anyone who wishes to obtain a broad understanding of GNSS, its principles and its limitations.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Dusan UGRENOVIC - Course manager\nJakub KARAS - Speaker\nEmilio González - Speaker\nMikaël MABILLEAU - Tutor"},"NMO-FMP-2-C":{"terminy":[{"s":"2027-01-25 10:00","e":"2027-01-29 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-03-15 10:00","e":"2027-03-19 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-19 10:00","e":"2027-04-23 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-05-10 10:00","e":"2027-05-14 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"NMO-FMP-2-C","title_full":"FMP Module 2 [NMO-FMP-2-C]","title_clean":"FMP Module 2","description":"Network Operations serves the Aircraft Operators and Air Traffic Services. The vital link at local level in ATFCM operations is the Flow Management Position (FMP). The training of FMP personnel is essential for the success of ATFCM operations. This course is part of a modular training programme for FMP staff consisting of two classroom-based modules (one week each), supported by web based training modules, and now on request a refresher or tailor made module for suitably qualified staff (FMP4). This course is the first classroom-based module: FMP Module 2. Content: Theoretical classroom training in which the concepts and basics of ATFCM are explained, such as; - NM systems and main flows of data - Capacity and demand - Traffic volumes - Traffic counts (differences between entry & occupancy counts) - The different ATFCM solutions - Regulations - The slot pre-allocation and allocation processes - IR 255 and compliance monitoring - ATFCM phases - A-CDM and impact of the DPI messages in ETFMS & CIFLO - CIFLO operational procedures - All ATFCM messages The FMP courses consist of four Modules: - Module 1 contains the \"Fundamentals of ATFCM\" and \"Ops Room Tour\" web based training modules - Module 2 is a one-week theory course taking place either in Luxembourg or on site (UUP) - Module 3 is a one-week practical course taking place either in Luxembourg or on site (UPP) - Module 4 is a four-day regionally focused refresher or tailor made course which is organised on request only (UPP). Pre-requisites Participants have to have completed the FMP 1 course (Fundamentals of ATFCM). Additionally, for participants that are not that familiar with CHMI, the CIFLO - CHMI Interface for Flow [NMO-CIFLO-HELP] reference material is provided within the course.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have an understanding of the fundamental concepts of operation applied by Network Operations and of FMPs.","audience":"This course is only for Flow Management Position staff, Air Traffic Controllers, ATS unit managers and personnel who are directly (or are about to be) involved in the daily operation of Network Operations and the Flow Management Position concept.","price":"No fee applies for course participants from world-wide airspace users and participants from Member States? competent authorities and certified organisation. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe TOUCHARD Course manager Sijmen SMIDT Tutor About Contact FAQ Getting Started Privacy Statement"},"NMO-FMP-3-C":{"terminy":[{"s":"2027-02-15 10:00","e":"2027-02-19 12:45","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-03-22 10:00","e":"2027-03-26 12:45","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-05-24 10:00","e":"2027-05-28 12:45","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"NMO-FMP-3-C","title_full":"FMP Module 3 [NMO-FMP-3-C]","title_clean":"FMP Module 3","description":"Network Operations serves the Aircraft Operators and Air Traffic Services. The vital link at local level in ATFCM operations is the Flow Management Position (FMP). The training of FMP personnel is essential for the success of ATFCM operations. This course is part of a modular training programme for FMP staff consisting of two classroom-based modules (one week each), supported by web based training modules, and a refresher module for suitably qualified staff. This is the second classroom-based module: FMP Module 3. Content: - Demonstrations and exercises in a classroom/simulated environment in order to improve understanding in FMP/NMOC interaction, the application of CHMI/NMP/NMUI and available methods for ATFCM problem resolution. Info: - This is the third part of the successive modular ATFCM training package - It should be remembered that this module may only be attended after you have completed Module 2 - It is possible to apply for places on Module 3 at the same time as applying for places on Module 2. The FMP courses consist of four modules; - Module 1 contains the \"Fundamentals of ATFCM\" and \"Virtual Ops Room Tour\" web based training modules - Module 2 is a one-week theory course taking place in Luxembourg - Module 3 is a one-week practical course taking place in Luxembourg - Module 4 is a four-day regionally focused refresher or tailor made course taking place in Luxembourg Pre-requisites Two pre-requisites exist for this course: 1. Having followed the FMP Module 2 course in the last 2 years; 2. Work at an FMP as an operational staff member These will be checked to allow participation on the course","important_note":"","pre_requisites":"","objectives":"To increase the level of knowledge and awareness of FMP staff in respect to ATFCM problems and available solutions to those problems.","audience":"This course is only for Flow Management Position staff, ATS unit managers and personnel who are directly involved in the daily operation of Network Operations and the Flow Management Position concept.","price":"No fee applies for course participants from world-wide airspace users and participants from Member States? competent authorities and certified organisation. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe TOUCHARD Course manager About Contact FAQ Getting Started Privacy Statement"},"NMO-FPFM-1-C":{"terminy":[{"s":"2027-01-26 10:00","e":"2027-01-27 16:00","dni":2,"dow":"Wt-Śr","lok":"Luxembourg"}],"course_id":"NMO-FPFM-1-C","title_full":"Flight Planning and Flight Management - Basics [NMO-FPFM-1-C]","title_clean":"Flight Planning and Flight Management - Basics","description":"This classroom course covers the concepts and the theoretical knowledge in order to understand the basics of flight planning and flow management processes within Europe. The course participants will obtain a thorough understanding of the NM systems, their interaction and the impact on operations. A detailed introduction to the NM interfaces and their basic functionalities will provide a basic overview and understanding of the NM systems and operations. The course covers the following subjects: Legal framework Purpose and scope of IFPS Theoretical introduction to CHMI, NOP, NMUI flight tool NM systems and main flow of data and messages submission of a FPL and updates, IFPUV & flight management revalidation FF-ICE ATFCM phases and solutions Regulations and slot allocation Contacts and support Pre-requisites NMO-FPL-INTRO, NMO-ATFCM-BASIC and NMO-ATFCM-MSG e-learning courses are recommended.","important_note":"","pre_requisites":"","objectives":"Obtain an overview of the flight planning and ATFCM in Europe and get a basic theoretical understanding of the NM concepts, systems, and tools such as IFPS including the NMUI flight, NOP and CIAO.","audience":"Staff working in Airline or Military Operations or ARO and engaged with Flight Planning, Air Traffic Flow and Capacity Management and Network Operations.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations and worldwide airspace users. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Christian FABER Course manager About Contact FAQ Getting Started Privacy Statement"},"NMO-FPFM-2-C":{"terminy":[{"s":"2027-01-18 10:00","e":"2027-01-20 16:00","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"}],"course_id":"NMO-FPFM-2-C","title_full":"Flight Planning & Flight Management - Advanced [NMO-FPFM-2-C]","title_clean":"Flight Planning & Flight Management - Advanced","description":"Practical familiarisation with the NM tools available for flight planning and ATFCM in Europe, including best practices, The following toipics are included: short review of FPFM-1-C practical exercises for CHMI, NOP, NMUI flight validation and submission of FPLs reroutings flight management FF-ICE collaboration with NMOC and e-help desk use of Mirror AUP-UUP RAD restrictions","important_note":"This session (03-05/11/2026) will take place at the EUROCONTROL Heaqdquarters (classroom : NEXUS) Pre-requisites Flight Planning and Flight Management [NMO-FPFM-1-C] course.","pre_requisites":"","objectives":"This classroom course will provide a detailed overview of the concepts and proposes a combined approach of different tools and system offered by NM in order the ensure the Planning and the Management of your flights through the Integrated Initial Flight Planning System (IFPS), Network Operations Portal (NOP) and the Collaboration Human Machine Interface for Aircraft Operators (CIAO).","audience":"Staff with some experience working in Airline or Military Operations or ARO and engaged with Flight Planning, Air Traffic Flow and Capacity Management and Network Operations, who would like to know more about available NM tools and best practices.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations and worldwide airspace users. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Christian FABER Course manager About Contact FAQ Getting Started Privacy Statement"},"SAF-CHG-AC-1":{"terminy":[{"s":"2027-03-08 10:00","e":"2027-03-12 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"},{"s":"2027-05-31 10:00","e":"2027-06-04 12:30","dni":5,"dow":"Pon-Pt","lok":"Budapest"}],"course_id":"SAF-CHG-AC-1","title_full":"Assessment of Changes to the Functional System Part 1 [SAF-CHG-AC-1]","title_clean":"Assessment of Changes to the Functional System Part 1","description":"The \"Assessment of Changes in the ATM/ANS Part 1\" course builds on the knowledge acquired in the \"Management & Oversight of Changes in ATM/ANS\" course (SAF-CHG-INTRO), the \"Change Management Process: First Steps\" course (SAF-CHG-FS) or the \"Overview of Regulation 2017/373\" course (LEX-373-INTRO). The course provides an overview of the steps to be undertaken during the assessment, from a safety perspective, of a change to the ATM/ANS functional system, covering both its safety assessment and its safety support assessment, if appropriate, as per Regulation 2017/373 and its AMC/GM. It combines \"theory\" and practical exercises, both based on real and topical examples of changes to the ATM/ANS functional system: - remote tower operations at an international, medium-sized airport (exercises) - Radio Direction Finder System (RDFS) at a busy ACC (illustration of the \"theory\") - Replacement of Voice Communication System (VCS) - Implementation of an Aerodrome Weather Observation System (AWOS) The course covers the following topics: safety assessment of changes to the ATM/ANS functional system safety support assessment of changes to the ATM/ANS functional system interactions between safety assessments and safety support assessments multi-actor changes and overarching argument","important_note":"This course content has been checked by the ATM Department of EASA in January 2023 against the EU Regulation 2017/373 common requirements for providers of ATM/ANS services. EASA has evaluated that the content of the course material is in line and meets the intent of the rule. Pre-requisites Before attending this course, you must have completed: the SAF-CHG-BASIC e-learning course and the SAF-CHG-INTRO classroom course, OR the SAF-CHG-BASIC e-learning course and the LEX-373-INTRO classroom course. You may also submit to the course manager a request for exemption from the pre-requisite courses if you can show that you have experience in safety assessment and/or safety support assessment.","pre_requisites":"","objectives":"After completing the course, participants should: have a detailed understanding of: the generic steps to be undertaken during the safety assessment and safety support assessment of a change to the ATM/ANS functional system the interactions between safety assessments and safety support assessments multi-actor changes and overaching argument the main changes between safety risk management (in accordance with ICAO Safety Management Manual, section 2.5) and safety (support) assessment as per Regulation 2017/373 and its AMC/GM be able to contribute to the safety assessment and/or safety support assessment of a change to the ATM/ANS functional system, as per Regulation 2017/373 and its AMC/GM.","audience":"This course is designed for personnel working for an ATM/ANS service provider who need a detailed and practical understanding of the steps to be undertaken during the safety assessment and/or safety support assessment of a change to the ATM/ANS functional system as per Regulation 2017/373 and its AMC/GM. Staff working for ATM/ANS service providers involved in assessment of changes to the ATM/ANS functional system (safety assessment and safety support assessment), as well as staff working for competent authorities involved in the review of changes to the functional system.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Francois PIRIOU Course manager Frederic ROOSELEER Tutor About Contact FAQ Getting Started Privacy Statement"},"SAF-CHG-INTRO":{"terminy":[{"s":"2027-03-08 10:00","e":"2027-03-12 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-05-31 10:00","e":"2027-06-04 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-CHG-INTRO","title_full":"Management and Oversight of Changes [SAF-CHG-INTRO]","title_clean":"Management and Oversight of Changes","description":"This course is the entry point for two training programmes: Management and assessment of changes - Reg 2017/373 [SAF-PRG-CHG-373] Oversight of changes as per Reg 2017/373 [LEX-PRG-CHG-373]. This course provides an overview, from the perspective of both ATM/ANS service providers and the competent ATM/ANS authorities of: The management of changes in ATM/ANS; The process of change assessment, from a safety perspective (including safety assessment and safety support assessment for changes to the ATM/ANS functional system); The process for the oversight of changes in ATM/ANS. The course also highlights the relationship between the management and assessment of changes, including both quality and safety management systems, and the project lifecycle and project-related activities. The course is consistent with Regulation No. 2017/373 and its relevant AMC/GM. It combines theoretical and practical exercises based on both ATS and non-ATS examples of changes.","important_note":"This course is an equivalent to the \"Change Management Process: First Steps [SAF-CHG-FS]\" virtual course. Please do not register if you already attended to the virtual course.","pre_requisites":"The SAF-CHG-BASIC e-learning course must be successfully completed before this course can be followed. Completion of the LEX-RULE and LEX-REG e-learning courses is recommended.","objectives":"After completing the course, participants should be able to: Explain the generic steps required in a typical change management process; Explain the generic steps required in a typical safety (support) assessment process; Explain the relationship between change management processes and a quality and safety management system; Explain the relationship between safety (support) assessment processes, and both a quality/safety management system, and the project lifecycle and project-related activities; Explain the generic steps required in a typical process for the oversight of changes in ATM/ANS; Explain the main roles and responsibilities (as regards changes in ATM/ANS), of - and the interactions between- providers of ATM/ANS services and the competent ATM/ANS authorities.","audience":"This course is designed for personnel working in the field of ATM/ANS, either for a service provider or for a competent authority.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Michel DE REDE - Content Manager\nSandrine TASQUIN - Course manager\nDipl.-Ing. MBA Alfred GULDER - Tutor"},"SAF-CHG-MC-1":{"terminy":[{"s":"2027-04-19 13:00","e":"2027-04-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-CHG-MC-1","title_full":"Monitoring of Changes in ATM/ANS Part 1 [SAF-CHG-MC-1]","title_clean":"Monitoring of Changes in ATM/ANS Part 1","description":"The Monitoring of Changes in ATM/ANS Part 1 course builds on the knowledge provided by the Management and Oversight of Changes in ATM/ANS course [SAF-CHG-INTRO] or Management and Oversight of Changes: First Steps [SAF-CHG-FS]. The course covers all aspects of the safety monitoring of changes in operations. It addresses questions relating to: the maintenance/updating of safety cases and/or safety support cases; the follow-up of system behaviour/specifications and safety support requirements during operations for non-ATSPs; the follow-up of safety criteria (objectives) and safety requirements during operations for ATSPs; and the migration/move to a unit safety dashboard/case. The course is consistent with Regulation No. 2017/373 (laying down common requirements for service and the oversight in air traffic management/air navigation services and other air traffic management network functions) and its relevant Acceptable Means of Compliance (AMC) and Guidance Material (GM).","important_note":"This course is an equivalent to the \"Monitoring of Changes in ATM/ANS Part 1 [SAF-CHG-MC-1-V]\" virtual course. Please do not register if you already attended to the virtual course. Pre-requisites The SAF-CHG-INTRO or SAF-CHG-FS course must be successfully completed before this course can be followed. Participants should be aware of their internal change management and maintenance processes. This information is usually part of the quality/safety management system of their organisation. Completion of the SAF-CHG-AC-1 course would be helpful.","pre_requisites":"","objectives":"After completing the course, participants will be able to contribute to the monitoring of changes in ATM/ANS, including the maintenance / update of safety (support) cases, in accordance with Regulation No. 2017/373 and its AMC and GM.","audience":"This course is designed for personnel working for an ATM/ANS service provider involved in the monitoring of changes in ATM/ANS, and in the maintenance / update of safety (support) cases.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Michel DE REDE Content Manager Sandrine TASQUIN Course manager About Contact FAQ Getting Started Privacy Statement"},"SAF-INV":{"terminy":[{"s":"2027-04-12 09:00","e":"2027-04-16 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-19 09:00","e":"2027-04-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Brussels"}],"course_id":"SAF-INV","title_full":"ATM Occurrence Investigation and Analysis [SAF-INV]","title_clean":"ATM Occurrence Investigation and Analysis","description":"The course provides instruction on current best practices for systemic ATM safety investigation techniques, and the efficient use and sync
