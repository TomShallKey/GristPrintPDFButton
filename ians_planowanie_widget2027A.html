<script type="application/json" id="lz-opisy-data">{"AI-INTRO":{"terminy":[{"s":"2027-04-12 10:00","e":"2027-04-14 16:00","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"}],"course_id":"AI-INTRO","title_full":"Artificial Intelligence in Future ATM [AI-INTRO]","title_clean":"Artificial Intelligence in Future ATM","description":"Artificial intelligence (AI) is a fast-evolving family of technologies inspired by human intellectual processes, such as the ability to reason, discover meaning, generalise, act flexibly, or learn from past experience. By improving prediction and optimising operations and resource allocation, the use of artificial intelligence has already delivered breakthroughs in various applications and has the potential for a wide array of economic and societal benefits across the entire spectrum of industries and social activities, including aviation. AI can, however, also entail new risks or have negative consequences for individuals, organisations, or society. For this reason, the European Commission has recently adopted the AI Act, which introduces a regulatory framework for AI, including requirements for AI literacy. As of February 2, 2025, organizations involved in the development, adoption, commercialization, or use of AI systems must ensure their personnel have the necessary knowledge, skills, and awareness to make informed decisions when deploying AI. This course supports these literacy objectives by equipping participants with foundational AI concepts and an understanding of its regulatory and operational implications in aviation. The EASA Artificial Intelligence Roadmap further highlights the importance of this topic, outlining the its vision on its safety and ethical dimensions.","important_note":"","pre_requisites":"","objectives":"This course represents an introductory course on the subject of the introduction of artificial intelligence in the ATM sector. After completing the course: Participants will have an understanding of the foundational concepts of artificial intelligence (AI), with a particular focus on the current and future applications of AI in the ATM domain. Participants will be able to describe possible applications and analyse benefits for individuals, organisations, and the overall ATM system, as well as the possible safety, ethical, and legal implications of using AI systems. Participants will recognize the AI literacy requirements under the EU AI Act including the essential skills and knowledge needed for informed AI deployment in aviation. The course will raise awareness about the AI roadmap developed by EASA and the regulatory aspects of using AI systems at European level.","audience":"The course is designed for a wide audience, including but not limited to managers interested in ATM technological innovation, safety managers, ATCOs, and ATSEPs.","price":"The price per course for all participant is 1110 EUR.","delivered_by":"Ioana TOANCHINA - Course manager\nPaola Lanzi - Tutor\nDr. Elisa Spiller - Tutor"},"AI-INTRO-V":{"terminy":[{"s":"2027-02-03 10:00","e":"2027-02-05 15:00","dni":3,"dow":"Śr-Pt","lok":"Online"}],"course_id":"AI-INTRO-V","title_full":"Artificial Intelligence in Future ATM [AI-INTRO-V]","title_clean":"Artificial Intelligence in Future ATM","description":"Artificial intelligence (AI) is a fast-evolving family of technologies inspired by human intellectual processes, such as the ability to reason, discover meaning, generalise, act flexibly or learn from past experience. By improving prediction and optimising operations and resource allocation, the use of artificial intelligence has already delivered breakthroughs in various applications and has the potential for a wide array of economic and societal benefits across the entire spectrum of industries and social activities, including aviation. AI can, however, also entail new risks or have negative consequences for individuals, organisations, or society. For this reason, the European Commission has recently adopted the AI Act, which introduces a regulatory framework for AI, including requirements for AI literacy. As of February 2, 2025, organizations involved in the development, adoption, commercialization, or use of AI systems must ensure their personnel have the necessary knowledge, skills, and awareness to make informed decisions when deploying AI. This course supports these literacy objectives by equipping participants with foundational AI concepts and an understanding of its regulatory and operational implications in aviation. The EASA Artificial Intelligence Roadmap further highlights the importance of this topic, outlining its vision on its safety and ethical dimensions.","important_note":"","pre_requisites":"","objectives":"This is an introductory course on the subject of the introduction of artificial intelligence in the ATM sector. After completing the course: Participants will have an understanding of the foundational concepts of artificial intelligence (AI), with a particular focus on the current and future applications of AI in the ATM domain. Participants will be able to describe possible applications and analyse benefits for individuals, organisations, and the overall ATM system, as well as the possible safety, ethical, and legal implications of using AI systems. Participants will recognize the AI literacy requirements under the EU AI Act including the essential skills and knowledge needed for informed AI deployment in aviation. The course will raise awareness about the AI roadmap developed by EASA and the regulatory aspects of using AI systems at European level.","audience":"The course is designed for a wide audience, including but not limited to managers interested in ATM technological innovation, safety managers, ATCOs, and ATSEPs.","price":"The price per course participant is 1110 EUR.","delivered_by":"Ioana TOANCHINA - Course manager\nDr. Elisa Spiller - Tutor\nPaola Lanzi - Tutor"},"APT-ACAP":{"terminy":[{"s":"2027-03-16 09:00","e":"2027-03-18 16:30","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"APT-ACAP","title_full":"Airport Capacity and Performance [APT-ACAP]","title_clean":"Airport Capacity and Performance","description":"With the introduction of the SES framework, the need for familiarisation with airport capacity and its performance in the network context has become a very important topic. IR 390/ 2013 requires local target setting for airports at national level. In many cases smaller airports have no means for assessing their capacities. The Stakeholders/Actors involved in ATM do not have the same background on all parts of the network, in this case airports and the determination of their capacity. If the Network CDM processes are to be improved, a better understanding of the existing interdependencies is pivotal.","important_note":"","pre_requisites":"","objectives":"At the end of the course, ATM stakeholders should have an understanding of airport capacity and its relevance within the network context.","audience":"Airport Planners, Flow managers, ATC staff (Tower), NSAs, Airline Operators, Performance Managers.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Frederic ROOSELEER Content Manager Sandrine TASQUIN Course manager Dimitrios KASTANIS Speaker Yves DE WANDELER Speaker Catherine CHALON MORGAN Speaker Valerio CAPPELLAZZO Speaker Francisco HOYAS Speaker Ivan DE VISSCHER Speaker Jaroslaw NIEWINSKI Speaker About Contact FAQ Getting Started Privacy Statement"},"APT-ACDM":{"terminy":[{"s":"2027-03-16 09:00","e":"2027-03-18 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"APT-ACDM","title_full":"Airport Collaborative Decision Making [APT-ACDM]","title_clean":"Airport Collaborative Decision Making","description":"Given the traffic movements expected in the aviation industry in the coming years and the recent enhancements to the ATC en-route network, European airports are a restricting bottleneck of the overall ATM system. It is therefore important to make the best possible use of the existing airport infrastructure. Airport CDM is about partners working together more efficiently and transparently in how they share data. This course begins by highlighting the importance of full and common operational situational awareness for airport partners. Subsequently, it provides the participants with knowledge of the A-CDM process by describing the various elements involved. Furthermore, it describes the relationship and interaction with the ATFM network. The course content also provides some guidance on how to implement A-CDM at the airport, and this is complemented by presentations from invited airport stakeholders that have successfully implemented A-CDM. Pre-requisites It is strongly recommended to follow an eLearning Course on Airport Collaborative Decision Making (Course code in the catalogue: APT-ACDM-FUND) prior to attendance to the A-CDM classroom course.","important_note":"","pre_requisites":"","objectives":"After completing the course participants will have a detailed understanding of the Airport CDM process and will have received practical guidance on its implementation. In addition, they will have gained an understanding of the difficulties that may be encountered and of how to successfully overcome those. There is an emphasis on the A-CDM benefits brought to all airport partners and the overall ATFM network.","audience":"This course is designed for operational staff of ANSPs, airports, airlines and ground handlers. It may also be of interest to anyone from other organisations involved in the implementation of A-CDM activities.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"David BOOTH Content Manager Sandrine TASQUIN Course manager Calin PAVLOV Speaker Tarja KETTUNEN Speaker Jaroslaw NIEWINSKI Speaker Mattia BONAVENTURA Speaker Francisco HOYAS Speaker Ioana SUCIU Speaker About Contact FAQ Getting Started Privacy Statement"},"APT-ARM":{"terminy":[{"s":"2027-04-19 10:00","e":"2027-04-23 12:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"APT-ARM","title_full":"Aerodrome and Runway Safety Management [APT-ARM]","title_clean":"Aerodrome and Runway Safety Management","description":"Runway incursions occur when communication breaks down, errors are not caught in time and situational awareness is lost. Aerodrome and Runway Safety Management is a training course for airports stakeholders'' operational staff addressing the prevention of runway and taxiway incursions. It will help airports'' stakeholders develop a strategy to prevent these occurrences from happening. The successful introduction of a local runway safety team is fundamental to ensuring the prevention of runway and taxiway incursions. The goal of such a team is to work together to identify the local causal factors of the incursions and find local solutions to prevent their recurrence. Currently all the members of these multi-professional teams work at the forefront of operational safety as individuals, whereas they need to be carrying out their work on the manoeuvring area as a team. This course is designed to train people in facilitating local runway safety teams involving all operational staff working on the manoeuvring area. The facilitation process and its corresponding techniques is a fundamental element of this course. Pre-requisites Course participants will be asked to facilitate group discussions during several case studies throughout the course. A sufficient command of English to lead such a discussion is absolutely essential to successfully follow the course. Participants are required to read the associated EUROCONTROL document ‘A guide to ARM and facilitation’ (available for download in Learning Zone) prior to the course.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have an awareness of the daily operational hazards faced when working on or around the manouevring area and runway, and they will understand the importance of communication, error management and situational awareness for managing the risks associated with these hazards. This course aims to give participants knowledge on how to lead group discussions through the use of facilitation techniques by investigating several real-life case studies.","audience":"This course is designed for operational staff working on the manoeuvring area, including aerodrome air traffic controllers, pilots, and people whose jobs require them to drive in the manoeuvring area. The course will also be useful to members of airport local runway safety teams and others involved with runway safety activities.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"David BOOTH Content Manager Sandrine TASQUIN Course manager Francisco HOYAS Speaker Jaroslaw NIEWINSKI Speaker About Contact FAQ Getting Started Privacy Statement"},"APT-ASMGCS-DPL":{"terminy":[{"s":"2027-05-31 13:00","e":"2027-06-03 12:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"APT-ASMGCS-DPL","title_full":"Deployment of A-SMGCS services [APT-ASMGCS-DPL]","title_clean":"Deployment of A-SMGCS services","description":"This course provides in-depth knowledge of the Services (Surveillance, Airport Safety Support, Routing and Guidance) and requirements for an Advanced-Surface Movement Guidance and Control System (A-SMGCS) to support their deployment at an aerodrome. It mainly reflects the content of the EUROCONTROL Specification for A-SMGCS Services published on the 22nd of April 2020. The Airport Safety Support and the Routing Services are planned for synchronised deployment in a total of 24 airports in Europe, in accordance with the Commission Implementing Regulation (EU) 2021/116 of 1 February 2021 on the establishment of the Common Project One. This course elaborates on the experience gained from the European implementation of A-SMGCS Surveillance and Runway Monitoring and Conflict Alerting (RMCA) Services and includes the new Services (Airport Safety Support, Routing and Guidance) that have been subject to validation in the SESAR programme. Pre-requisites Basic knowledge of A-SMGCS surveillance and display systems","important_note":"","pre_requisites":"","objectives":"After a brief introduction of how the current status was reached and an overview of the available documentation the four A-SMGCS services and their sub-functions will be explained. The experience from validations using the research platform Integrated Tower Working Position (ITWP) within the SESAR project will be disseminated. The course also includes practical exercises with ITWP.","audience":"Personnel of airports/ANSPs that have installed A-SMGCS surveillance and that have sufficient knowledge of the A-SMGCS surveillance service. Manufacturers who produce A-SMGCS","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Ing. Mohamed ELLEJMI Content Manager Sandrine TASQUIN Course manager David BOOTH Tutor About Contact FAQ Getting Started Privacy Statement"},"APT-UAS":{"terminy":[{"s":"2027-06-08 10:00","e":"2027-06-10 15:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"APT-UAS","title_full":"Airport - Unmanned Aircraft Operations at Aerodromes [APT-UAS]","title_clean":"Airport - Unmanned Aircraft Operations at Aerodromes","description":"The course provides an overview of the regulatory and operational requirements for operations of UAS in airport environments. It covers the rules and practical aspects of using drones at airports. The course will include use cases for drones at airports, explain the key rules for safe drone use, go through the necessary steps for using drones in airports legally, and give guidance on the systems needed for drones and regular planes to work together smoothly.","important_note":"","pre_requisites":"","objectives":"After completing the course participants will be able to: list possible use cases for use of unmanned aircraft in airport environments. explain the operational requirements for effective and safe use of UAS depending on the application in relevant airport environments apply the required regulatory processes to operate UAS in airport environments. identify the processes and infrastructures (e.g. U-space) required for coordination between manned and unmanned aircraft.","audience":"Staff from CAAs, airport operators, UAS operators and ANSPs","price":"The price per course participant from other organisations or individuals is 1110EUR.","delivered_by":"Dr Aycan MUTLU Course manager Dr. Marco Ducci Speaker About Contact FAQ Getting Started Privacy Statement"},"ASM-ATFCM":{"terminy":[{"s":"2027-01-18 10:00","e":"2027-01-22 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-02-08 10:00","e":"2027-02-12 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-05 10:00","e":"2027-04-09 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-06-07 10:00","e":"2027-06-11 14:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"ASM-ATFCM","title_full":"Introduction to Air Traffic Flow and Capacity Management [ASM-ATFCM]","title_clean":"Introduction to Air Traffic Flow and Capacity Management","description":"Air traffic flow and capacity management (ATFCM) has become a vital part of air traffic management (ATM). ATFCM enables the full capacity of the air transport system to be exploited without running the risk of safety being infringed as a result of overload situations. The Network Manager Operation Centre (NMOC), with all its supporting personnel and systems, together with the local flow management positions (FMPs) in the area control centres, will continue to be vital elements in the management of these important functions, in conjunction with the airports community and the airline operators (AOs). The course provides an overview of the functions and procedures applicable to this area, and highlights the roles and responsibilities of the main actors.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have a general overview of the provision of air traffic flow and capacity management within Europe, including information on: • the NMOC and its current operations, and how the NMOC plans to cope with the future challenges; • the priorities and working principles for FMP positions, Airport and AO operation. Please note that it is strongly recommended that flow management position (FMP) staff who wish to develop an in-depth understanding of FMP operations follow the dedicated modular course offered by the EUROCONTROL NMOC for flow management staff.","audience":"This course is designed for staff working in air traffic management, airline operations and the military, for whom a general overview of the NMOC and air traffic flow and capacity management is desirable.","price":"No fee applies for course participants from Member States? competent authorities and certified organisation. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe TOUCHARD Course manager Mr Alessandro PRESTIGIACOMO Tutor Francisco SALGUERO Tutor Ralph TERREIN Tutor Stéphane ANDRIANJAKARIVELO Tutor Carlo VERELST Tutor About Contact FAQ Getting Started Privacy Statement"},"ASM-CAP":{"terminy":[{"s":"2027-06-14 13:00","e":"2027-06-15 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"ASM-CAP","title_full":"Network Capacity Planning [ASM-CAP]","title_clean":"Network Capacity Planning","description":"A capacity planning process has been implemented for two decades and it has been recently re-enforced through the creation of the Network Manager and the implementation of the European Performance Scheme. In order to apply a consolidated and harmonised process network-wide, all involved stakeholders have to fully understand the details and the various steps of the capacity planning process and its supporting tools and data. Understanding and implementing these mechanisms is essential to improve operational performance at local and network level. This course starts with an overview of the regulatory background and then explores the various steps of the capacity planning process. Pre-requisites Basic knowledge of airspace structure and ACC operational aspects.","important_note":"","pre_requisites":"","objectives":"This course enables stakeholders to understand and perform the capacity planning process and to see how this ensures a harmonised network integration.","audience":"Operational/strategic planning units from ANSPs (ACC staff, HQ staff), NSAs and FAB teams.","price":"No fee applies for course participants from Member States? competent authorities and certified organisation. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Raffaele RUSSO Content Manager Sandrine TASQUIN Course manager Jelena MILENKOVIC Speaker Andrej MIKULA Speaker Laszlo ELBERT Speaker Goran PAVLOVIC Speaker About Contact FAQ Getting Started Privacy Statement"},"ASM-LARA-HK":{"terminy":[{"s":"2027-03-09 09:00","e":"2027-03-12 12:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"ASM-LARA-HK","title_full":"LARA Housekeeper Course [ASM-LARA-HK]","title_clean":"LARA Housekeeper Course","description":"Available dates The LARA Houskeeper Course is designed to equip airspace managers and support staff with the essential knowledge and skills to effectively configure, maintain and operate the Local and sub-regional Airspace Management (LARA) system from an operational perspective. (For the technical management of LARA, please see the LARA Technical Training). LARA is developed by EUROCONTROL to support, enhance and harmonise airspace management processes across Europe, promoting the advanced flexible use of airspace. The system is implemented in more than 30 EUROCONTROL Member States","important_note":"","pre_requisites":"","objectives":"Understand the core principles and functionalities of the LARA system. · Understand how to configure and maintain the national LARA Cluster in line with applicable local requirements. · Train local users on the use of LARA in line with national procedures · Troubleshoot basic operational issues and apply effective solutions within the LARA environment","audience":"The course is reserved for staff who have a key role in the use and management of LARA in their respective countries","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Jan SCHOLZ - Content Manager\nSandrine TASQUIN - Course manager\nPavlin BELICHOVSKY - Tutor"},"ASM-LARA-SA":{"terminy":[{"s":"2027-06-01 09:00","e":"2027-06-04 12:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"ASM-LARA-SA","title_full":"LARA System Administrators Course [ASM-LARA-SA]","title_clean":"LARA System Administrators Course","description":"The LARA System Administrators Course is designed to provide system administrators and supporting technical staff with the essential knowledge and skills to effectively install, configure, maintain and operate the Local and sub-regional Airspace Management (LARA) system from a technical perspective. (For the operational management of LARA, please see the LARA Housekeeper Course). LARA is developed by EUROCONTROL to support, enhance and harmonise airspace management processes across Europe, promoting the advanced flexible use of airspace. The system is implemented in more than 30 EUROCONTROL Member States.","important_note":"","pre_requisites":"","objectives":"Understand the core principles, architecture and functionalities of the LARA system. · Install, configure, monitor and maintain the LARA system modules aligned with the agreed Local Concept of Operations. · Train local support staff on the management of LARA in line with national procedures. · Troubleshoot basic operational and deployment issues and apply effective solutions within the LARA environment.","audience":"The course is reserved for staff who have a key role in the management of LARA in their respective countries.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Sandrine TASQUIN Course manager Alvaro RAMOS DEL RIO Tutor David FRANCO Tutor About Contact FAQ Getting Started Privacy Statement"},"ASM-NEST-ADV":{"terminy":[{"s":"2027-06-28 09:00","e":"2027-07-01 16:00","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"ASM-NEST-ADV","title_full":"Advanced NEST Training [ASM-NEST-ADV]","title_clean":"Advanced NEST Training","description":"This course provides advanced knowledge about the Network strategic tool (NEST) which is a simulation software for network capacity planning and airspace: NEST is a scenario-based modelling tool developed by EUROCONTROL. It is used by the air navigation service providers (ANSPs) and the EUROCONTROL Network Manager to: - optimise the available resources and improve performance at network level; - design and develop the airspace structure; - plan the capacity and performing related post operations analyses; - organise the traffic flows in the air traffic flow and capacity management (ATFCM) strategic phase; - prepare scenarios to support fast and real-time simulations; - Ad-hoc studies at local and network level.desig used by","important_note":"","pre_requisites":"Participants must have attended a NEST basic training (ASM-NEST-BASIC or ASM-NEST-BASIC-V)” Participants need full access to the Demand Data Repository (DDR). DDR is a web application that provides an accurate picture of pan-European air traffic demand, past and future, from several years ahead until the day before operations. It can be used to support network planning (strategic, seasonal and pre-tactical), for special events, or for major ATM development projects. The NEST software package is available on DDR, part of the OneSky Online Platform.","objectives":"This course will provide the course participants the advanced knowledge of how to use the functionalities of NEST and its simulations capabilities such as future traffic samples, 4D traffic distribution, regulation builder, delay simulation or configuration optimiser.","audience":"Operational/strategic planning units from ANSPs (ACC staff, HQ staff), Airports, NSAs and FAB teams or any stakeholder involved in Strategic planning at the network or local level.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Ioana TOANCHINA - Course manager\nRobert FALK - Tutor\nMaria POPESCU-BOBOC - Tutor\nDavid DESCHAUME - Tutor"},"ASM-NEST-BASIC":{"terminy":[{"s":"2027-06-16 10:00","e":"2027-06-18 16:30","dni":3,"dow":"Śr-Pt","lok":"Luxembourg"}],"course_id":"ASM-NEST-BASIC","title_full":"Basic NEST Training [ASM-NEST-BASIC]","title_clean":"Basic NEST Training","description":"This course provides basic knowledge about the Network strategic tool (NEST) which is a simulation software for network capacity planning and airspace: NEST is a scenario-based modelling tool developed by EUROCONTROL. It is used by the air navigation service providers (ANSPs) and the EUROCONTROL Network Manager to: - optimise the available resources and improve performance at network level; - design and develop the airspace structure; - plan the capacity and performing related post operations analyses; - organise the traffic flows in the air traffic flow and capacity management (ATFCM) strategic phase; - prepare scenarios to support fast and real-time simulations; - Ad-hoc studies at local and network level","important_note":"","pre_requisites":"Need a full access to the DDR2. DDR2 is a simple and comprehensive web interface, accessible to registered users. DDR2 provides an accurate picture of pan-European air traffic demand, past and future, from several years ahead until the day before operations. It can be used to support network planning (strategic, seasonal and pre-tactical), for special events, or for major ATM development projects. The NEST software package is available on DDR, part of the OneSky Online Platform.","objectives":"This course will provide the course participants the basic knowledge of how to use the functionalities of NEST and its simulations capabilities such as Data browsers, Statistics, Simulation, Airspace design, Simulation principle, ICO.","audience":"Operational/strategic planning units from ANSPs (ACC staff, HQ staff), Airports, NSAs and FAB teams or any stakeholder involved in Strategic planning at the network or local level.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Maria POPESCU-BOBOC - Course manager\nRobert FALK - Tutor\nIoana TOANCHINA - Tutor\nDavid DESCHAUME - Tutor"},"ASM-OPS":{"terminy":[{"s":"2027-04-20 10:00","e":"2027-04-22 14:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-05-25 10:00","e":"2027-05-27 14:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"ASM-OPS","title_full":"Operational Airspace Management [ASM-OPS]","title_clean":"Operational Airspace Management","description":"The Advanced Flexible Use of Airspace concept (AFUA) is the cornerstone of the European strategy for the optimum use of the airspace between commercial, military and general aviation. The integration of dynamic, flexible and near real-time management of the airspace as a tool for matching capacity to demand is an important enabler for effective network performance. This operational airspace management course looks at the Advanced Flexible Use of Airspace Concept and how it is integrated into network performance management both now and in the short-term future.","important_note":"On request, the course can be adapted for an audience outside of Europe with a focus on the Flexible Use of Airspace Concept (FUA) as adopted by ICAO. Pre-requisites Operational expertise in ATS provision.","pre_requisites":"","objectives":"By the end of the Operational Airspace Management course, participants will be able to apply the Advanced Flexible Use of airspace concept at levels 2 and 3.","audience":"The course is designed for the following staff: a. Staff working in airspace management cells, military operations and flow management positions. b. Airspace providers, CAA and NSA staff requiring knowledge of operational management and use of airspace.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Jan SCHOLZ Content Manager Sandrine TASQUIN Course manager About Contact FAQ Getting Started Privacy Statement"},"ASM-STRAT":{"terminy":[{"s":"2027-03-09 10:00","e":"2027-03-11 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"},{"s":"2027-06-15 10:00","e":"2027-06-17 16:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"ASM-STRAT","title_full":"European Airspace Strategy [ASM-STRAT]","title_clean":"European Airspace Strategy","description":"The airspace strategy course provides an overview of developments in Europe and future strategies for airspace design, management, regulations and performance.","important_note":"The airspace strategy course replaces the EUROCONTROL airspace organisation and management course (ASM-ASM)","pre_requisites":"","objectives":"By the end of the airspace strategy course, participants will be able to actively participate in European Level 1 and Level 2 strategy fora for airspace and network improvements.","audience":"The course is designed for experienced operational staff who will be participating in National and/or International airspace and network management fora.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Dr Giuseppe ACAMPORA Content Manager Sandrine TASQUIN Course manager Catalin LEPADATU Tutor Alberto PERDONES DIAZ Tutor About Contact FAQ Getting Started Privacy Statement"},"CNS-EVOL":{"terminy":[{"s":"2027-03-15 10:00","e":"2027-03-19 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"CNS-EVOL","title_full":"CNS Evolution in Europe [CNS-EVOL]","title_clean":"CNS Evolution in Europe","description":"This course provides a comprehensive overview of the planned evolution of the European Communication, Navigation and Surveillance (CNS) infrastructure. It focuses on the strategic framework for optimising and modernising Europe''s CNS infrastructure, the CNS Evolution Plan, which is key to realising the vision of the ATM Master Plan. This five-day course equips participants with the knowledge and tools to understand and address the challenges and opportunities associated with evolving CNS technologies and supporting regulatory and standardisation framework. Through a combination of expert presentations and practical exercises, participants will gain insights into the CNS Evolution Plan''s key components, including spectrum management, advancements in CNS domains, civil-military interoperability, and the EU regulatory and standardisation framework. Participants will benefit from diverse perspectives, including insights from the pilots, ANSP managers, and CNS domain experts, culminating in a hands-on exercise focusing on defining and implementing Minimum Operational Networks (MONs). The course offers a collaborative environment for networking and exchanging the best practices, fostering alignment with the European and global CNS modernisation initiatives. Key Topics Covered: Introduction to the CNS Evolution Plan and its strategic objectives. In-depth exploration of Communication, Navigation, and Surveillance domains. Spectrum management and frequency allocation challenges and solutions. Integration of civil and military CNS requirements. Avionics and operational perspectives from cockpit operations. Presentation of the European CNS MON concept and design criteria, and how to address local requirements in the development of national MONs. Practical approaches to CNS modernisation and optimisation","important_note":"This course will take place in EUROCONTROL HQ in Brussels and will last 4 days instead of 5 days due to a shorter schedule.","pre_requisites":"Participants should have a professional background in aviation, with experience in Communication, Navigation, and Surveillance (CNS) systems, Air Traffic Management, or related fields. Familiarity with EU regulatory framework, EUROCAE technical standards, European ATM Master Plan and ICAO Global Air Navigation Plan (GANP), is highly beneficial. While technical expertise is advantageous, the course is designed to accommodate participants with diverse levels of knowledge, making it suitable for both technical and managerial roles.","objectives":"Gain a comprehensive understanding of the CNS Evolution Plan, its strategic objectives, and its alignment with the European ATM Master Plan. Develop detailed insights into the latest developments, challenges, and future prospects across the Communication, Navigation, and Surveillance domains. Understand modern methodologies for Frequency and Spectrum management, Civil-Military Interoperability, and integration of new technologies. Engage in discussions and practical exercises to address key challenges such as modernisation of CNS systems and defining Minimum Operational Networks. Connect diverse perspectives from pilots, ANSP managers, regulators, and other stakeholders to drive CNS evolution.","audience":"This course is designed for civil and military staff from Air Navigation Service Providers (ANSPs), Aerodrome Operators, National Competent Authorities, such as National Supervisory Authorities (NSAs) and Civil Aviation Authorities (CAAs), involved in the regulatory oversight and compliance of CNS systems.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE - Course manager\nBogdan PETRICEL - Tutor\nDominique GUILLERM - Tutor\nPetr JONAS - Tutor\nFrancisco HOYAS - Tutor\nJohn MICALLEF - Tutor\nTereza TOPKOVA - Tutor\nDusan UGRENOVIC - Tutor\nDr Aycan MUTLU - Tutor\nAndré Gustavo Botelho Maia - Tutor\nMattia NURISSO - Tutor\nLtCol Jorge PEREIRA - Tutor"},"COM-AMHS-V":{"terminy":[{"s":"2027-03-15 09:00","e":"2027-03-19 15:00","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"COM-AMHS-V","title_full":"ATS Messaging [COM-AMHS-V]","title_clean":"ATS Messaging","description":"The ATS Message Handling System (AMHS) has been specified by ICAO as the new message handling standard to replace the current AFTN/CIDIN (Aeronautical Fixed Telecommunication Network/Common ICAO Data Interchange Network). This course provides an overview, suitable for technical, operational and managerial staff, of the messaging techniques and applications used in ATM. It addresses the current situation (AFTN/CIDIN), the near future (AMHS) and how to migrate to AMHS. The course provides a summary of the planned implementation of AMHS in Europe and worldwide, and its coexistence with the AFTN/CIDIN. The ATS Messaging Management Centre (AMC) and European Directory Services (EDS) are also presented. Relevant Single European Sky Community Specification and a discussion of the position of AMHS in recent strategic plans (SESAR, etc.) are also included. The planned transition to SWIM - System Wide Information Management - is also discussed with examples, putting everything in the global ICAO GANP and ASBU context. Initial concepts related to SWIM transition and AMHS coexistence are introduced, as well as the role of a potential SWIM-AMHS gateway. Practical experience from real AMHS operations is a highlight of this course.","important_note":"The course takes place from 9 AM to 3 PM, for 5 days, including a one-hour lunch break. Pre-requisites A general background in data communications technology and its application to ATM will be useful. The IM-DE1 course would provide suitable background knowledge.","pre_requisites":"","objectives":"After completing the course, participants will have a good understanding of the \"big picture\" of the ATS Message Handling System and its management. In addition, participants will have information and skills that will assist them in practical AMHS deployment plans and will be informed on the future plans for a possible transition to the next step, System Wide Information Management (SWIM).","audience":"This course is designed for those who are or will be involved in the planning, procurement, installation, operation and/or use of the current and future aeronautical messaging systems, i.e. technical, operational, managerial and procurement staff. It may also be of interest to users and developers of systems making use of ATS messaging technologies, and to NSA staff involved in corresponding system approval.","price":"The price for all course participant or individuals is 1480 EUR.","delivered_by":"Philippe SACRE Course manager Manuel Garcia Martin Tutor About Contact FAQ Getting Started Privacy Statement"},"COM-FCI":{"terminy":[{"s":"2027-05-10 10:00","e":"2027-05-14 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"COM-FCI","title_full":"Air/Ground Data Links, ATS-B2 and Future Communications Infrastructure [COM-FCI]","title_clean":"Air/Ground Data Links, ATS-B2 and Future Communications Infrastructure","description":"This course is dedicated to the Future Communications Infrastructure (FCI), which includes air/ground Data Link networks (ATN/OSI and ATN/IPS), existing and planned Data Link technologies such as VDL2, SATCOMS, LDACS, etc, as well as applications like CPDLC and ADS-C among others. Both technical and operational aspects for the various families of Data Link are covered in detail. The coexistence with the ACARS world is also explained, including Airline Operational Communications (AOC) and oceanic (FANS) and airport applications. Data Link is a rich and complex world, and is at the core of current and future operational concepts in Europe and the world. In Europe itself, the \"Data Link Services\" mandate from the European Commission (Commission Regulation (EC) 29/2009, amended by Regulation (EU) 2015/310) has been fully in force above FL285 since February 2020 for air and ground stakeholders. ATN Baseline 1 and the CPDLC application (controller-pilot data link communications) is thus used operationally in continental European airspace, and the course will address lessons learned and experience obtained from this implementation. In 2022, the course increases its focus on the next steps of Data Link implementation, i.e. ATS-S Baseline 2 and the ADS-C application (Automatic Dependent Surveillance - Contract), under the CP1 regulation (IR 116/2021) in support of initial and full 4D management concepts. Necessary additional air/ground Data Link technologies have been or are being developed in SESAR, including new satellite communications, AeroMACS and LDACS.They are covered in the course, as well as crucial radio spectrum aspects. The institutional and regulatory aspects will also be covered, as well as relevant strategy roadmaps at ICAO and European levels. A strong element of the course remains the sharing of lessons learned by experienced professionals from airlines, air navigation service providers, regulators and industry, who present the subject from their perspective throughout the course.","important_note":"This course is the successor of the COM-DLK course, which is removed from the portfolio","pre_requisites":"","objectives":"On completion of the course, participants will have a better understanding of the complexities of the Data Link world, and be able to more efficiently support deployment in their respective environments. Data Link is a core enabler of any future ATM Concept of Operations, and this understanding will be a valuable skill. Now that ATN Baseline 1 has been deployed in Europe, participants will have a view of lessons learned and understand the next steps, including Baseline 2 (ATS-B2), as explained by specialists from industry, ANSPs and airlines.","audience":"This course has been designed for those undertaking work related to the implementation of Data Link services. This includes management, technical and operational staff from ANSPs, airlines, and regulatory agencies.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE - Course manager\nThierry SALEE - Tutor\nDan IVANESCU - Tutor\nBart VAN DEN EINDEN - Tutor\nFrancisco HOYAS - Tutor\nKacper WALCZAK - Tutor\nCyril OLLIER - Tutor\nMiquel Alimbau - Tutor\nCorinne Lefebvre - Tutor\nJuan Luis Manas Gonzalez - Tutor\nGonzalo Prieto - Tutor\nLtCol Jorge PEREIRA - Tutor"},"COM-FREQ-BASIC":{"terminy":[{"s":"2027-04-19 13:30","e":"2027-04-23 12:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"COM-FREQ-BASIC","title_full":"European Frequency Management - Principles and Tools [COM-FREQ-BASIC]","title_clean":"European Frequency Management - Principles and Tools","description":"Frequency management is a specific task of the Network Manager, and this course supports all stakeholders in that goal. The training is divided in two main parts. The first part introduces the frequency management principles, rules and procedures as defined by ICAO and the newly introduced Network manager radio frequency function (RFF). (ICAO Annex 10, ICAO EUR DOC 011 and RFF collaborative decision making). The second part of the training focuses more on the practical aspects of frequency management, providing detailed tutorials on the software tools (SAFIRE, MANIF-AFM) and the associated procedures for their use. The course is aimed at providing frequency managers with the basic knowledge to improve their daily work and enhance the international coordination of frequencies.","important_note":"Priority for enrolment on this course will be given to persons directly involved in frequency management roles in their administration.","pre_requisites":"","objectives":"• To obtain a good understanding of the European frequency management principles, rules and procedures. • To develop basic efficient use of SAFIRE and MANIF","audience":"This course is designed for persons involved in aviation radio frequency management at national level (technical, operational, and managerial staff). This course may also interest all persons (technical and operational staff) indirectly involved in aviation frequency management matters.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE - Course manager\nBertrand DESPERIER - Tutor\nCristina MARGARETO - Tutor\nTereza TOPKOVA - Tutor\nFelipe DOMINGUEZ - Tutor"},"COM-VOIP":{"terminy":[{"s":"2027-04-19 10:00","e":"2027-04-23 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"COM-VOIP","title_full":"Implementing Voice over IP in Aeronautical Communications [COM-VOIP]","title_clean":"Implementing Voice over IP in Aeronautical Communications","description":"Ground-Ground and Air-Ground voice communications are a key component of ATM service provision. This course provides a detailed view of the principles of aeronautical telephony and radio networks. After a review of the analogue and digital signalling techniques used in aviation (MFC-R2 and ATS-QSIG), the course largely focuses on Voice over Internet Protocol (VoIP), and looks in detail at VoIP principles and its use in aeronautical communications for fixed and mobile voice communication. The standardisation work of EUROCAE WG 67 is reviewed in detail, and the question of integrating VoIP into the ATM network architecture is discussed. The benefits of using VoIP are highlighted, together with other aspects such as security and ICAO, EUROCONTROL and SESAR strategic plans and developments. An outlook on futuristic concepts addressed in SESAR, such as sectorless operations and digital air/ground voice, are also included. Demos are also included in the course with some hands-on experience for participants. Pre-requisites It is recommended that participants have a general background in telecommunications technology and its application to ATM.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have an understanding of ATM fixed voice communication systems in general and of current strategic developments. In addition, participants will have information and skills that will assist them in practical deployment plans.","audience":"This course is designed for technical staff working with voice communication systems and for managers involved in procurement decisions related to voice communication systems. It may also be of interest to NSA staff involved in corresponding system approval.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Philippe SACRE Course manager Manuel Garcia Martin Tutor About Contact FAQ Getting Started Privacy Statement"},"ENV-AWARE":{"terminy":[{"s":"2027-05-11 10:00","e":"2027-05-14 13:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"ENV-AWARE","title_full":"Towards an environment friendly future for aviation [ENV-AWARE]","title_clean":"Towards an environment friendly future for aviation","description":"Global demand for passenger travel is increasing. This growth needs managing sustainably and respond to society''s demands to address aviation''s environmental impact and contribution to climate change. To achieve this it is essential that minimising environmental impacts becomes normal business practice for all stakeholders involved. This course provides a unique multi-stakeholder overview of the environmental impact of the aviation sector. It addresses measures that all stakeholders can take to maintain the sector''''s current operations whilst securing its future sustainable development. Outcomes will help you to: Identify the main environmental regulatory frameworks Understand environmental impact assessment Understand climate change in an aviation context Discuss operational responses Explain how Collaborative Environmental Management (CEM) fosters collaboration and communication between stakeholders. During the course, participants are given the opportunity to apply both their professional practice, and the knowledge and understanding acquired through a series of interactive sessions and practical exercises.","important_note":"This is the introductory course which deals with environmental aspects within the aviation sector.","pre_requisites":"","objectives":"After completing the course, participants will have gained a broad overview and understanding of the aviation sector’s environmental impact and measures it can take to reduce them. Specifically, they will be equipped with the tools to understand the role that ATM stakeholders can play to minimise its impacts, maintain current operations and enable the sustainable development of the aviation sector.","audience":"Developed in the first instance for aviation sector personnel recently tasked by their management with carrying out any type of environmental duties, this course may also be of interest to individuals, trade associations, regulators, business aviation, academia and other interested parties.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Maria POPESCU-BOBOC - Course manager\nFrancisco HOYAS - Tutor\nKonstantinos PAPOUTSIS - Tutor\nAlexander VANWELSENAERE - Tutor\nPascal HOP - Tutor"},"GEN-AE":{"terminy":[{"s":"2027-01-26 11:00","e":"2027-01-29 14:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-04-06 11:00","e":"2027-04-09 14:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"GEN-AE","title_full":"Airline Economics: Principles and Realities [GEN-AE]","title_clean":"Airline Economics: Principles and Realities","description":"This course provides an overview of the evolution of the aviation industry, exploring political shifts, liberalisation, and privatisation. The market segmentation, its sophistication, and personalisation will be examined and explained. Network planning, the hub-and-spoke model, and factors such as geographical location, night curfews, and time zones will be discussed, followed by a comparison with the point-to-point model. The capacity management challenges will be explored, including denied boardings and involuntary rerouting, as well as sales strategies and the evolution of sales channels. The unique cost structure of the airline industry, where production cannot be stored, will be addressed. Aviation’s regulatory landscape, shaped by bilateralism and impacted by open skies agreements, will be analysed, with a focus on their effects on regional economies. The session will conclude with fleet planning, the industry's most complex task, and a look at future challenges in aviation.","important_note":"","pre_requisites":"","objectives":"• Identify the economic principles governing airlines and how they differ from those in other industries. • Explain the specifics related to airline planning, including time horizons and the complexity of the decision-making process. • Recognise the contrasting characteristics of legacy and low-cost carriers. • Develop the ability to critically analyse current issues in the aviation industry, such as the impact of airspace closures on competition and the challenges of sustainability, including the potential for major airlines to achieve environmental sustainability.","audience":"Individuals already working in aviation, including staff from ANSPs, oversight authorities, as well as those at airports or in operational and supporting divisions of airlines are welcome.","price":"No fee applies for course participants from Member State Certified Organisations.The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Maria POPESCU-BOBOC Course manager Dr Piotr Ikanowicz Tutor About Contact FAQ Getting Started Privacy Statement"},"GEN-ATC-INTRO":{"terminy":[{"s":"2027-06-14 09:00","e":"2027-06-15 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"GEN-ATC-INTRO","title_full":"Discover Air Traffic Control [GEN-ATC-INTRO]","title_clean":"Discover Air Traffic Control","description":"Many people with an interest in aviation or employed in the support of Air Traffic Services (ATS) such as CNS, AIS, MET, finance, legal service, human resources or administration etc, would like to understand more about the job of the Air Traffic Controller. The GEN-ATC-INTRO course has been designed to provide a basic understanding of today’s Air Traffic Management (ATM), and to experience the working environment for air traffic controllers through “hands-on” practical exercises using real-time Air Traffic Control simulators. All participants will actively conduct guided Air Traffic Control simulator exercises in an Area Control environment and in a Tower Control environment. The insights and the experience that they will acquire will help the participants to appreciate the role of Air Traffic Control within the ATM system. Pre-requisites You need to have completed the GEN-ATM-INTRO e-learning course before attending this course.","important_note":"","pre_requisites":"","objectives":"The aim is to give non-operational personnel, with an interest in aviation, the opportunity to understand and experience first hand the working environment, tasks and responsibilities of air traffic controllers.","audience":"GEN-ATC-INTRO is a short journey of discovery open to anyone interested or involved in ATC/ATM, eager to gain a better understanding what it feels like to be an air traffic controller. No prior Air Traffic Control (ATC) experience is required. The course and its pre-requisite are targeted at participants without aviation knowledge but participants should have a good command of the English language.","price":"The price per course participant is 740 EUR.","delivered_by":"Philip AMMERMANN Course manager Dragan MILANOVSKI Tutor Dr Aycan MUTLU Tutor Peter ALDERSON Tutor Miroslav ANDREEVSKI Tutor About Contact FAQ Getting Started Privacy Statement"},"GEN-CIVMIL":{"terminy":[{"s":"2027-05-25 13:00","e":"2027-05-28 14:00","dni":4,"dow":"Wt-Pt","lok":"Brussels"}],"course_id":"GEN-CIVMIL","title_full":"Civil - Military ATM Coordination [GEN-CIVMIL]","title_clean":"Civil - Military ATM Coordination","description":"This course, provided by the EUROCONTROL Civil-Military Coordination Division, looks at the work being done to enhance future civil-military coordination in the Single European Sky. The course examines the improvement of European ATM efficiency and effectiveness for the benefit of civil and military aerial needs and the development of viable solutions to support military ATM/CNS performance and civil-military systems interoperability. The military participation in all relevant Single European Sky (SES) and Single European Sky ATM Research (SESAR) activities is also discussed. Particular emphasis is given to national security and defence requirements.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have an improved understanding of civil-military ATM/CNS requirements and of the need for greater military involvement in national and international ATM processes.","audience":"This course is designed for civil and military staff from national civil and military aviation authorities, air navigation service providers, manufacturers and airspace users, working at both national and international level.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"Mariana ANGUELOVA Content Manager Sandrine TASQUIN Course manager Timo BLUNCK Tutor Edgar REUBER Tutor Col. Igor KUREN Tutor LtCol Jorge PEREIRA Tutor Pavlin BELICHOVSKY Tutor Patrick PETRÉ Tutor Mario BOYERO PEREZ Tutor Mónica LOPES Tutor Yordan ILIEV Tutor Remus LACATUS Tutor About Contact FAQ Getting Started Privacy Statement"},"GEN-MANS":{"terminy":[{"s":"2027-02-16 10:00","e":"2027-02-19 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"GEN-MANS","title_full":"Management Systems in the context of ATM/ANS [GEN-MANS]","title_clean":"Management Systems in the context of ATM/ANS","description":"Many successful organisations have for years been implementing management systems, or functional systems for quality, safety, environmental, etc. The motivation for those organisations was mainly to improve the business and/or to comply with regulations requiring the implementation of a management system. The implementation of management systems has not, however, always resulted in actual measurable improvements. The reasons for failure were mostly owing the fact that the concept of management systems was not understood, was misinterpreted or was ineffectively implemented, without taking account of the context of the organisation. Management commitment and staff buy-in are pre-requisite for an effective management system. The importance of management systems in the Single European Sky context has considerably increased. The implementation of a management system is compulsory for competent authority and service providers for all services within the ATM/ANS framework. Staff of the competent authorities involved in the oversight of service providers need to have knowledge what management systems are in order to effectively verify compliance, in particular in the view to execute risk based oversight The course will provide a systemic view of management systems, addressing the key components such as process management, risk management, compliance management, performance management, etc. Furthermore, it details some practices for the design and implementation of management systems. Finally, it addresses the Single European Sky (SES) regulatory requirements related to management systems, as well as practices for the competent authority and for service providers conducting internal audits of the management system. The course will attempt to provide answers to the following themes: Why do we need management systems? What are the components of a generic management system? Why do processes need to be managed? How do we know that the management system is performing as planned? What is the purpose of an ISO 9001 certificate? What is the purpose of compliance management? What are the regulatory requirements with regards to management systems? How do project management tools help to succeed with a change?","important_note":"","pre_requisites":"","objectives":"Upon completing this course you will be able to: Understand the principles of management systems and the benefits they bring to the Organisation; Understand what management systems are composed of; Understand the concept of processes, their interrelations and their management; Understand the concept of performance measurement to monitor the performance of Management Systems; Understand the principles and the elements of the ISO 9001 standard; Understand the concept of compliance management, ensuring that an organisation complies with the applicable regulations and able to demonstrate it to the competent authority; Understand programme management tools and how they can be applied to implement management systems; Appreciate the Single European Sky (SES) regulations related to management systems; Appreciate the techniques associated with the oversight of management systems.","audience":"This course is recommended for staff from: ATM/ANS providers Complementary knowledge and skills for internal auditors and staff working in the area of quality, safety, security, etc. Competent Authority Complementary knowledge and skills for inspectors to support audits in the context of risk-based oversight. Organisations involved in ATM/ANS","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480,- EUR.","delivered_by":"Igor POLTORACKI Course manager About Contact FAQ Getting Started Privacy Statement"},"GEN-MENT":{"terminy":[{"s":"2027-05-26 09:00","e":"2027-05-27 16:30","dni":2,"dow":"Śr-Czw","lok":"Luxembourg"}],"course_id":"GEN-MENT","title_full":"Prepare and run an effective Mentoring program [GEN-MENT]","title_clean":"Prepare and run an effective Mentoring program","description":"The two day course is designed for HR specialists, Human Factor specialists and expertsworking on Diversity, Equity and Inclusion (DEI). The course gives introduction on mentoring in general, mentoring in aviation, how to set up, deploy, and manage an efficient mentoring programme. Mentoring is found to be one of the most efficient techniques in improving DEI in any company and specifically in CRM/TRM in aviation in general. ICAO will disseminate the PTP under its own auspices as well as through the TRAINAIR PLUS network.","important_note":"","pre_requisites":"","objectives":"By the end of the course the participants will be able to explain: Fundaments of mentoring Mentoring in aviation Phases of mentoring program Basics of being an effective mentor/mentee Reverse mentoring","audience":"HR specialists, Human Factors specialists, DEI specialists","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Milena BOWMAN Content Manager Sandrine TASQUIN Course manager Allyson Kukel Tutor About Contact FAQ Getting Started Privacy Statement"},"HUM-CCA":{"terminy":[{"s":"2027-03-08 10:00","e":"2027-03-12 17:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-04-12 10:00","e":"2027-04-16 17:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-CCA","title_full":"Controller Competency Assessor [HUM-CCA]","title_clean":"Controller Competency Assessor","description":"This course is approved by the Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. A key element of assuring the safety of air traffic services is ensuring that controllers are competent to perform their tasks safely. Because of this, both the EC Single European Sky regulatory framework and the EUROCONTROL Guideline Material include obligations to ensure that a controller is assessed as competent before being granted an air traffic controller licence. This is a competency based training course which utilizes CBTA methods and principles as prescribed by ICAO and EASA. The assessment process being taught, uses a formal competence scheme and an adapted competency model to assess the competence of air traffic controllers and to make a decision on whether they are competent to acquire a new qualification or renew an existing qualification. The course covers the use of both practical (dedicated and continuous) and oral assessments as means to determine competency of a candidate. Participants are provided with the rationale, knowledge, techniques and practical skills needed to undertake the role of a competence assessor. Pre-requisites Participants must hold or have held an air traffic controller licence.","important_note":"","pre_requisites":"","objectives":"After completing this regulated course, participants will have been assessed on practical and pedagogical skills of competence assessment and will have an understanding of the current European controller competence regulations and the principles of competence assessment. In addition, participants will have an appreciation of competence assessment techniques and best practices to prepare them to take on the role of Competence Assessor.","audience":"This course is designed for air traffic controllers who will carry out assessments of competence of other air traffic controllers for either the issue of new qualifications or the renewal of existing qualifications.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1850 EUR.","delivered_by":"Philip AMMERMANN Course manager Dragan MILANOVSKI Tutor Peter ALDERSON Tutor Maximilian Bezzina Tutor Miroslav ANDREEVSKI Tutor About Contact FAQ Getting Started Privacy Statement"},"HUM-CCA-R":{"terminy":[{"s":"2027-04-26 09:00","e":"2027-04-27 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-05-10 09:00","e":"2027-05-11 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"HUM-CCA-R","title_full":"Controller Competency Assessor – Refresher [HUM-CCA-R]","title_clean":"Controller Competency Assessor – Refresher","description":"This course is approved by the Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. This course provides experienced air traffic controllers who are competency assessors/examiners with refresher training that highlights and reinforces the knowledge and skills required to conduct effective assessments. The course encourages the active involvement of the participants. In addition to instructor-led presentations, participants are expected to analyse different topics and to participate in and facilitate small working groups. The cross-fertilisation of participant''s assessor experience has proved to be an important positive feature of the course. It is required that this course is taken by suitably qualified assessors at least every 3 years. As a practical element is part of this course, a valid Assessor endorsement will be required for all course participants. On the second day of the course participants will require to take a theory exam. Upon satisfactory completion of the course (examination pass mark = 75 %) each candidate is issued with a \"Certificate of Accomplishment\". Theoretical examination conducted in the HUM-CCA-R course shall have the structure and format of standard TZ computer based test. In case of failure, candidate(s) will be issued a \"Certificate of Attendance\".","important_note":"","pre_requisites":"Participants must hold or must have held an air traffic controller licence with a valid Assessor endorsement.","objectives":"After completing the course, participants with previous controller competency assessment (CCA) experience will have undertaken refresher training that reinforces the knowledge and skills in assessment techniques needed by a competency assessor.","audience":"This course is designed for air traffic controllers who are (or who were) competency assessors or who have previously completed a CCA course.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price for all course participants is 740 EUR.","delivered_by":"Miroslav ANDREEVSKI - Course manager\nPhilip AMMERMANN - Tutor\nPeter ALDERSON - Tutor"},"HUM-CISM":{"terminy":[{"s":"2027-04-12 09:00","e":"2027-04-14 16:00","dni":3,"dow":"Pon-Śr","lok":"Luxembourg"}],"course_id":"HUM-CISM","title_full":"Critical Stress Management Peer training (certified course) [HUM-CISM]","title_clean":"Critical Stress Management Peer training (certified course)","description":"CISM is an interlocking and comprehensive peer-based programme to support colleagues after experiencing a critical incident. The aim is to manage the stress reactions caused by the critical incident and restore the individual''''s ability to work. This course is delivered with the support of the EUROPEAN CISM user group and the course is affiliated with ICISF. The following topics are included: natures & definitions of a psychological crisis and psychological crisis intervention nature and definition of critical incident stress management and its role as a continuum of care. empathic communication techniques practice of psychological triage SAFER-Revised model of individual psychological crisis intervention risks of iatrogenic “harm” associated with psychological crisis intervention principles of self-care","important_note":"","pre_requisites":"","objectives":"- Understand the concepts behind CISM and the practicalities of the approach. - Understand the need and ways to implement CISM based on EASA regulations and EUROCONTROL best practices. - Discover examples of CISM intervention from ATM examples. - Gain certification of indivudual and group Crisis intevention skills ffrom ICISF on top of the EUROCONTROL diploma.","audience":"ATCOs, supervisors, safety and operational staff that are going to become CISM peers.","price":"The price per course participant is 1110 EUR.","delivered_by":"Fabrice DROGOUL Course manager Marc Baumgartner Tutor Claudine Meyer-Sager Tutor About Contact FAQ Getting Started Privacy Statement"},"HUM-CISM-R":{"terminy":[{"s":"2027-05-24 11:00","e":"2027-05-25 14:30","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"}],"course_id":"HUM-CISM-R","title_full":"Critical Incident Stress Management (CISM) Refresher [HUM-CISM-R]","title_clean":"Critical Incident Stress Management (CISM) Refresher","description":"This 2-day refresher course is designed for Air Traffic Controllers (ATCOs), supervisors, and trained CISM peers operating in safety-critical Air Traffic Management (ATM) environments. The course consolidates and updates participants’ knowledge of Critical Incident Stress Management (CISM) in accordance with existing practices and the Mitchell model, while reinforcing practical intervention skills through ATC-specific scenarios. The training places strong emphasis on peer support, psychological first aid, group and individual crisis interventions, and follow-up processes, with direct application to high-pressure operational contexts such as near-misses, system failures, operational errors, and traumatic events. Through scenario-based exercises, simulations, and structured role-plays, participants refresh their ability to support colleagues, manage their own stress reactions, and contribute to the continuous improvement of their organisation’s CISM programme. The course prioritises practical skills, resilience-building, self-care for peers, and effective coordination with supervisors and organisational stakeholders, ensuring CISM remains an effective, trusted, and sustainable support mechanism within ATM operations.","important_note":"","pre_requisites":"The course participants are required to arrive at the cource with a presentation (oral or PPT) of 10 to 15 mn for experience sharing on CISM practices. Out of their experience as a peer, they need to select a case or an experience in the CISM program development/implementation that was challenging or eye opening for them and that they consider can benefits others in their practices. Participation at own expense to a group dinner is mandatory to complete the hours requred by the course.","objectives":"At the end of the course, given realistic ATC critical incident scenarios and CISM tools, participants (CISM peers / ATCOs / supervisors) will be able to: Explain the core principles of the CISM framework in the context of ATC operational stressors, ensuring alignment with organisational CISM processes. Identify common ATC critical incidents and associated psychological stress reactions during and after high-pressure operational events, distinguishing normal stress responses from indicators requiring follow-up or referral. Apply appropriate CISM interventions (individual, group, and referral) during simulated ATC critical incidents, in accordance with established CISM protocols. Demonstrate effective use of Psychological First Aid and crisis communication techniques when supporting peers following an ATC incident. Conduct structured defusing, demobilisation sessions adapted to ATC-specific incident scenarios, maintaining psychological safety and professional boundaries. Support peers, supervisors, and teams through post-incident recovery processes, clearly understanding respective roles and responsibilities within the CISM system. Implement personal stress management and self-care strategies to maintain peer effectiveness and long-term resilience.","audience":"CISM peers","price":"The price is 740 EUR for all participants.","delivered_by":"Fabrice DROGOUL - Course manager"},"HUM-HFA":{"terminy":[{"s":"2027-01-11 10:00","e":"2027-01-15 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"},{"s":"2027-03-15 10:00","e":"2027-03-19 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-HFA","title_full":"Human Factors for ATM Safety Actors [HUM-HFA]","title_clean":"Human Factors for ATM Safety Actors","description":"Human factors (HF) is a discipline looking at all aspects of the human being at work. Thus, understanding HF in safety activities is crucial. This course covers the fundamentals of HF and is designed for a wide audience. The course focuses on understanding the strengths of the human being in order to intervene in the working environment to capitalise on human flexibility, adaptability and good judgement.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will have an understanding of safety issues from a human factors perspective, which encompasses individual factors, social and organisational factors, the HMI and working environment factors. Participants will be able to recognise and emphasise the strengths of the human being - such as flexibility, adaptability and learning skills - thereby enlarging the scope of HF analysis beyond human errors and incident investigation. Additionally, participants will have an understanding of the central contribution of the human factor to any safety activity. The large number of theoretical training (over 20 hours) on HF topics and the range of these topics make the course compliant to the HF requirements of EU regulations 965/2012, 1321/2014, 2015/340 as well as consistent with the ICAO documents 7192 in terms of HF (Training Manual).","audience":"This course is designed for staff having any safety role and responsibility in an ATM system, and other interested persons with a good understanding of operational matters.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Fabrice DROGOUL Course manager Nicola Cavagnetto Tutor Simone Pozzi Tutor About Contact FAQ Getting Started Privacy Statement"},"HUM-OJTI":{"terminy":[{"s":"2027-01-25 10:00","e":"2027-02-05 16:30","dni":12,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"HUM-OJTI","title_full":"Practical Training Instructor skills for OJTI and STDI [HUM-OJTI]","title_clean":"Practical Training Instructor skills for OJTI and STDI","description":"The Belgian Supervisory Authority for Air Navigation Services (BSA-ANS) has approved this course as compliant with Commission Regulation (EU) 2015/340 of 20 Feb 2015. Find out more about the approval and/or download the certificate. The training for On-the-Job Training Instructors (OJTI) and Synthetic Training Device Instructors (STDI) provides theoretical knowledge and practical skills for ATC controllers who will undertake OJTI/STDI duties. The course uses various teaching methods such as role plays, videos, quizzes and discussions. Expect an interactive team and reflective learning classroom activites. The course comprises practical exercises in training techniques, coupled with comprehensice feedback from the course instructors. The practical exercises are carried out on radar simulators, using a Radar Skill Trainer (RST). No previous preparation is needed regardless of your ATC rating. This is an assessed course which includes examinations and assessments in both theory and practical OJTI/STDI skills.","important_note":"During the practical exercises, students will have the following roles: Student OJTIs Student controllers Pseudo-pilots, for which training will be provided. This course includes an exam of theoretical knowledge and understanding as well as practical assessments of OJTI and STDI skills. The exam is held on Monday in the second course week (Day 6). A student must achieve a minimum of 75% to pass the theoretical part of the training. A re-sit will be organised if a student fails to achieve 75%. On Wednesday and Thursday of the second week (Days 8 and 9), the assessment of practical OJTI/STDI skills takes place. The final assessment result is calculated based on two competence assessments per student conducted b
