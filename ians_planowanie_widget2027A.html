hronised interpretation of EUROCONTROL’s Systemic Occurrence Analysis Methodology (SOAM) guidelines. The course provides participants with necessary knowledge and a wide range of practical skills to assist with the investigation of ATM safety occurrences. The course is generic enough to be understandable and applicable for systemic safety investigation across the global ATM/ANS community: - whatever the institutional arrangements in place for the provision of ATM services; - whatever the size of the “regulated” service provider organisations; - whatever the cultural environment in which it is intended to be applied. Pre-requisites There is a small amount of preparatory work suggested for this course. Some pre-course reading will be emailed to you about a week before your course commences, and it would be helpful if you could read this prior attending. While there are no formal SAF-INV course pre-requisites, if you have not completed training on Safety Management Systems in ATM [e.g. SAF-SMS-O, SAF-SMS-A] you may find it useful to do so before attending this course. Additionally, some basic Human Factors knowledge could help participants'' understanding of the topics presented during the course. The SMS courses can be found under the Safety domain of our training catalogue.","important_note":"","pre_requisites":"","objectives":"After completing the SAF-INV course, participants will appreciate the reasons for conducting systemic safety occurrence investigations (including incidents and accidents) and will be able to apply a range of practical safety investigation techniques. Participants will also be able to apply specific systemic investigation and analysis tools, including EUROCONTROL’s SOAM.","audience":"The course is designed for experienced ATM service provider personnel with sound operational knowledge, who have been or may be appointed as ATM occurrence investigators. As well, participants from other organisations such as national competent authorities (NCAs) and state safety investigation authorities (SIAs) are welcome to attend the course and have evaluated it as being very useful for their day-to-day operations.","price":"This course is subject to a User-Pays-Principle (UPP). Course registration is subject to a fee for all participants. The price per course participant is 1850 EUR.","delivered_by":"Claudiu BOJAN Course manager Brent Hayward Tutor About Contact FAQ Getting Started Privacy Statement"},"SAF-MGR":{"terminy":[{"s":"2027-05-10 09:00","e":"2027-05-14 13:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-MGR","title_full":"The ATM Safety Manager [SAF-MGR]","title_clean":"The ATM Safety Manager","description":"This course is designed for those responsible for developing, implementing and participating in a systematic approach to managing ATM safety, including the necessary organisational structures, accountabilities, policies and procedures. A high level of interaction is expected in this course. There will be sub-group exercises with a final (major) exercise. To facilitate a better understanding of the topic a number of examples and good practices will be presented to the audience during the course.","important_note":"EU regulation requires an Air Traffic Service Provider to appoint a Safety Manager who will be responsible for the implementation and maintenance of an effective, pro-active, and explicit SMS. This Safety Manager, naturally, needs more than just basic knowledge of safety management because he or she has a wide area of responsibility where the purpose of the job with regards to safety will be: - Implementation, maintenance, promotion and effectiveness of SMS consistent with best practices and the regulatory requirements, and - Independent assessment of the organisation‘s safety performance to identify trends and promote awareness. Over the years the need for Safety Manager training became necessary following the maturity of the ATSPs’ SMS and also because of people changing jobs, internal re-organisations, etc. This course has been designed to cover this necessity.","pre_requisites":"It is essential that participants have attended either the SAF-SMS-O, SAF-SMS-A. For the recognition/acceptance of other equivalent training and/or experience please contact the Course Reservation Office at the time of registration.","objectives":"After completing the course, participants will: Describe the Safety Manager's tasks and responsibilities; Understand the requirements related to the Safety Manager's role; Apply the knowledge gained to solve problems, identify relationships, and come up with possible solutions and how to apply these solutions in their local context; Network and share information and materials with other attendees.","audience":"This course is intended for aspiring Safety Managers and other key management personnel who will be instrumental in the development, implementation, and management of SMS. Competent Authority representatives who will be responsible for approving, auditing, and monitoring the SMS system will also benefit from attending this course.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Claudiu BOJAN - Course manager\nChristian THIRIJ - Tutor"},"SAF-SAS-3":{"terminy":[{"s":"2027-01-26 10:00","e":"2027-01-27 16:00","dni":2,"dow":"Wt-Śr","lok":"Luxembourg"}],"course_id":"SAF-SAS-3","title_full":"Safety Management Survey - Stage 3 [SAF-SAS-3]","title_clean":"Safety Management Survey - Stage 3","description":"This is the third stage of the Safety Management Survey Training Programme. Participants must have completed the 3-day SAF-SAS-1 Safety Management Survey course and participated in at least one safety survey within their own organisation before attending this course, which represents the stage 2 of this course (SAF-SAS-2). During stage 3 (SAF-SAS-3), course participants review, analyse and discuss the surveys conducted during stage 2.","important_note":"This course is only scheduled when a sufficient number of participants has expressed interest in attending. If you are interested in joining this course, please use the button ''Show interest'' to let us know. Pre-requisites Participants must have completed stages 1 and 2 before attending this course.","pre_requisites":"","objectives":"By the end of stage 3 of the Safety Management Survey Training Programme, participants will be able to critically review and further improve their ability to conduct a safety survey.","audience":"The Safety Survey Stage 3 is restricted to participants who have completed the 3-day SAF-SAS-1 course and have participated in at least one safety survey within their own organisation (SAF-SAS-2).","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Claudiu BOJAN Course manager Cosmin-Mihai OGICA Tutor About Contact FAQ Getting Started Privacy Statement"},"SAF-SC":{"terminy":[{"s":"2027-06-14 13:00","e":"2027-06-18 16:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SAF-SC","title_full":"Safety Case Fundamentals for ATM/ANS [SAF-SC]","title_clean":"Safety Case Fundamentals for ATM/ANS","description":"In the context of Regulation (EU) 2017/373 and its AMC and GM; this course aims at providing ANSP and NCA participants the knowledge on how to build a Safety (Support) Argument, structure the Safety (Support) Case, identify the relevant evidence and how the oversight could be performed.","important_note":"","pre_requisites":"","objectives":"After completing the course, participants will be able to contribute to the building and development of Safety (Support) Cases in accordance with Regulation (EU) 2017/373 and its AMC and GM. It addresses questions relating to: The development of the safety (support) argument The building of the structure of the safety (support) case The understanding of the different elements of the arguments (criteria, justification, context, assumptions) The identification of the required direct and backing evidence The development of the Safety (Support) Case report The lifecycle of the Safety (Support) Case and the link to Unit Safety (Support) Case","audience":"Representatives of the ANSPs: staff involved in (Safety) Management who need to develop procedures and templates, staff in charge of managing changes to the functional system, project managers, staff in charge of the continuous demonstration that the service provided is in line with the safety criteria or the service specifications (as applicable) Representatives of the NCAs in charge of the oversight of changes to the functional system or the continuous oversight of operations.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"Jean-Michel DE REDE Content Manager Sandrine TASQUIN Course manager About Contact FAQ Getting Started Privacy Statement"},"SAF-SMS-A":{"terminy":[{"s":"2027-01-19 09:00","e":"2027-01-21 16:00","dni":3,"dow":"Wt-Czw","lok":"Brussels"},{"s":"2027-02-16 09:00","e":"2027-02-18 16:00","dni":3,"dow":"Wt-Czw","lok":"Brussels"}],"course_id":"SAF-SMS-A","title_full":"Introduction to ATM Safety Management System [SAF-SMS-A]","title_clean":"Introduction to ATM Safety Management System","description":"This course is designed as an introduction to all aspects of safety management in ATM. It aims to present the SMS implementation within an ATSP. To reinforce the learning points and trigger interaction between participants a number of real life examples and best practices of SMS implementation will be given. The objective is to improve participants'' safety awareness and to help them understand their safety roles and responsibilities within their own organisation. The SAF-SMS-A (Awareness) course constitutes the foundation for all current courses within the SAF domain, particularly the Safety Manager course.","important_note":"Present EU regulations mandate that all service providers must implement a Management System (MS) but Air Traffic Service Providers (ATSPs) will need to implement a Safety Management System (SMS) in addition to the Management System. The SMS tasks are normally spread over three levels: Corporate, Local and Safety Specialisation. The Safety Director/Safety Manager, who is responsible for the implementation, administration and overall operation of the SMS, is usually at the highest or corporate level. In large organisations these tasks are then cascaded down to local safety managers, sometimes referred to as Safety Coordinators or Safety Officers. These persons therefore perform tasks similar to the Safety Managers but on a reduced (local) scale. In smaller organisations often this level is not used since it leads only to duplication of work without any significant benefits. The final level of the SMS involves a number of persons performing tasks related to only one element/area of the SMS. Such persons are called experts/practitioners/specialists and usually perform the role of Occurrence Investigator, Safety Assessor, Safety Surveyor or a combination of these roles. It is recommended that before embarking on a career in SMS, whatever the level of activity, the employees receive basic knowledge of the whole SMS. Such knowledge ensures that they know the constituent elements of the SMS and understand the relationships and interaction of these elements. Thus, this knowledge will be a great asset in assisting them when later they come to apply and analyse their particular area of SMS specialisation.","pre_requisites":"","objectives":"This course is designed to give the attendees a basic understanding of the elements and functions involved in a compliant ICAO and EASA Safety Management System. Thus the objectives of the course are: Understand the need for the implementation of the Safety Management System; Describe the primary elements of the SMS; Explain and summarise the links between the various SMS elements; Enable participants to network and share information and materials with other attendees.","audience":"The course is open to all participants who have an interest in safety management or will be embarking on a career in safety management. Any person from the Air Navigation Service Providers, in particular Air Traffic Service Providers or Competent Authority will benefit from attending it.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Claudiu BOJAN - Course manager\nChristian THIRIJ - Tutor"},"SAF-SMS-O":{"terminy":[{"s":"2027-06-14 09:00","e":"2027-06-16 12:45","dni":3,"dow":"Pon-Śr","lok":"Online"}],"course_id":"SAF-SMS-O","title_full":"Overview of SMS Requirements in ATM [SAF-SMS-O]","title_clean":"Overview of SMS Requirements in ATM","description":"This course will run across three consecutive mornings (around 3.5 hours each day) with presentation sessions which include Q&A, followed by instructions related to preparations for the next day. The virtual course provides a very brief introduction to the requirements and the practical aspects of SMS implementation in ATS. It is beneficial to other ANSPs too when it comes to implementing a Management System. The Q&A sessions on this course will stimulate thinking, confirm participant understanding, reinforce the learning points and trigger interaction between participants.","important_note":"This virtual course provides an overview of the different aspects and practicalities that need to be considered when implementing a SMS within the ATSP. The virtual course is not a replacement for the SAF-SMS-A classroom-training course, which provides more in-depth instruction for participants involved in the implementation of the SMS in ATM.","pre_requisites":"","objectives":"The objective of the SAF-SMS-O virtual course is to introduce participants to the requirements and practical aspects of SMS implementation.","audience":"The course is open to all participants who have an interest in or may be considering embarking on a career in safety management. Any personnel from Air Navigation Service Providers, in particular Air Traffic Service Providers, from the Competent Authorities or State Safety Investigation Agencies will benefit from participating. Airport Operators and Aircraft Operators will also find this course of some benefit because they require similar SMS in their own domains.","price":"No fee applies for course participants from Member States, competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 600 EUR.","delivered_by":"Claudiu BOJAN - Course manager\nChristian THIRIJ - Tutor"},"SAF-SSI-INTRO":{"terminy":[{"s":"2027-03-15 09:00","e":"2027-03-19 12:45","dni":5,"dow":"Pon-Pt","lok":"Online"}],"course_id":"SAF-SSI-INTRO","title_full":"Introduction to Systemic Safety Investigation and Analysis [SAF-SSI-INTRO]","title_clean":"Introduction to Systemic Safety Investigation and Analysis","description":"This virtual course will provide a brief introduction to the principles of systemic safety investigation and analysis, with some sessions presenting necessary knowledge on the subject and some practical exercises to stimulate thinking and confirm participant understanding. The virtual course will run across five consecutive mornings with presentation sessions of about 90 minutes (including Q&A time) followed by practical sessions focussed on application of the theoretical knowledge presented earlier and some preparation for the following day. During this entry level generic virtual course opportunities for application of theoretical concepts, effective coaching and skill development will be limited by use of the video conferencing medium. The classroom-based \"ATM Occurrence Investigation and Analysis [SAF-INV]\" course provides greater opportunity for effective coaching to develop practical investigation skills and apply analysis methodologies, and is thus recommended for those who will be conducting investigations.","important_note":"This virtual course is designed to provide a basic introduction to systemic safety investigation and analysis principles. It is intended as an awareness-raising course for those interested in ATM safety occurrence investigations. It should not be considered as a replacement for attending the \"ATM Occurrence Investigation and Analysis [SAF-INV]\" classroom course, which provides advanced level instruction and skill development.","pre_requisites":"While there are no formal pre-requisites for this virtual course, it may be useful to complete training on Safety Management Systems in ATM [e.g. SAF-SMS-O, SAF-SMS-A, SAF-SMS-P] before attending this course. Additionally, some basic Human Factors knowledge could help participants' understanding of the topics presented during the course.","objectives":"The objective of the virtual course is to increase participants' awareness of the reasons for conducting systemic investigations and the importance of using logical, objective methods to collect data, and analyse and report findings about safety events.","audience":"The course is open to all participants who have an interest in or may be considering embarking on a career in safety management, and in particular in safety investigation and analysis, which is one of the most important elements of safety management activities within organisations. Any personnel from air navigation service providers, in particular air traffic service providers, or from the competent authorities or state safety investigation agencies will benefit from participating.","price":"The price per course participant from all organisations or individuals is 1000 EUR.","delivered_by":"Claudiu BOJAN - Course manager\nBrenton Hayward - Tutor"},"SEC-CYBER":{"terminy":[{"s":"2027-01-19 10:00","e":"2027-01-22 12:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"},{"s":"2027-03-02 10:00","e":"2027-03-05 12:30","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"SEC-CYBER","title_full":"Cyber security in ATM - Main threats and solutions [SEC-CYBER]","title_clean":"Cyber security in ATM - Main threats and solutions","description":"This is an awareness course for all ATM staff who deal with information systems for ATM, including CNS systems and operational data. It starts with an introduction on ATM security principles, regulatory aspects and the security risk assessment methodology. This 1-day introduction is followed by presentations about information security, incident management - including how it is implemented in EATM and an example ANSP - and a few case studies. The rapid development of Information Systems technology is obviously increasing cyber risks. Threats to ATM systems accessible via data communications networks are becoming prevalent and sophisticated. Vulnerabilities inherent in almost all computer operating systems, many support services and, network and CNS applications can be exploited in a variety of ways. On the other hand, civil aviation organisations rely on the interconnection of electronic communications networks even for critical parts of their operations, including safety-critical functions (e.g. surveillance data exchange, flight plan processing, etc). The protection of information systems from malicious attacks and the means of dealing with the consequences of such attacks are encompassed by cyber security. Security events and security incidents could be the result of accidental or deliberate acts of staff or malicious attacks by an external attacker. They may also arise from weaknesses in hardware, software, configurations or processes. This course describes the Cyber threats to ATM, the vulnerabilities to be mitigated and the methods for managing incidents. Pre-requisites It is recommended to have attended the SEC-RA course, in order to understand the steps to be conducted during a Security risk assessment.","important_note":"","pre_requisites":"","objectives":"At the end of the course the student will be able: - to describe the scope of ATM cyber security - to state the different cyber threats in ATM - to state the vulnerabilities to be mitigated - to explain how Cyber security incidents can be managed","audience":"- all ATM staff who deal with information systems for ATM, including CNS systems and operational data - ATM staff dealing with security, more specifically cyber security - Project leaders of cyber-related projects, i.e. CNS and IM - System managers of ATM systems.","price":"No fee applies for course participants from Member States? competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480EUR.","delivered_by":"Kristof LAMONT Content Manager Sandrine TASQUIN Course manager Szymon LOZA Tutor Aleksandar MOMIROSKI Tutor Tim STELKENS-KOBSCH Tutor Patrick MANA Tutor Timo BLUNCK Tutor About Contact FAQ Getting Started Privacy Statement"},"SEC-CYBER-OPS":{"terminy":[{"s":"2027-01-28 10:00","e":"2027-01-29 16:00","dni":2,"dow":"Czw-Pt","lok":"Luxembourg"}],"course_id":"SEC-CYBER-OPS","title_full":"Cybersecurity for operational staff [SEC-CYBER-OPS]","title_clean":"Cybersecurity for operational staff","description":"The course will provide information about the threat landscape for Air Traffic management as well as a more detailed presentation of operational aspect of cybersecurity issues (CNS, ATM Systems, Human Factors)","important_note":"Training managers and focal points can contact us to get a quote to have this course delivered at their organisation. It can be condensed into one calendar day. Pre-requisites Basic ATM knowledge","pre_requisites":"","objectives":"At the end of the course, the participants should have a general understanding about specific threats for the ATM domain as well as a basic understanding of the potential implications of cyber attacks in an operational environment.","audience":"Mainly operational staff from ANSPs as well as ANSP managers.","price":"No fee applies for course participants from Member States's competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 740 EUR.","delivered_by":"Timo BLUNCK Content Manager Sandrine TASQUIN Course manager Tim STELKENS-KOBSCH Tutor About Contact FAQ Getting Started Privacy Statement"},"SEC-RA":{"terminy":[{"s":"2027-03-23 10:00","e":"2027-03-25 15:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"SEC-RA","title_full":"Managing security in ATM [SEC-RA]","title_clean":"Managing security in ATM","description":"ATM security is concerned with those threats that are aimed at (primary scope) the ATM system directly, such as attacks on ATM assets, and (secondary scope) where ATM plays a key role in the prevention or response to threats to other parts of the aviation system (or national and international assets of high value) and limiting their effects on the overall ATM network. ATM security measures, as part of aviation security, are designed to safeguard civil aviation against acts of unlawful interference and are therefore becoming ever more important in the ATM industry. This course provides participants with a systematic approach to managing ATM security risks. It teaches the participants how to conduct a security Risk Assessment (RA) and how to deal with the result of this RA, i.e. putting in place security controls. As an important introduction to ATM security risk management, the course sets out some fundamentals regarding scope, regulatory framework and security management systems.","important_note":"Pre-requisites A basic understanding of an ATM system and ATM operations is required.","pre_requisites":"","objectives":"This course provides ATM personnel with the knowledge, skills and attitudes required to integrate a security culture into their daily tasks. Having successfully completed the course, the participants will be able to: identify ATM security assets; identify risks; select control options;","audience":"All ATM personnel (e.g. project managers, systems engineers, operational personnel, regulatory personnel, etc.) with little or no expertise in ATM security.","price":"No fee applies for course participants from Member States'' competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1110 EUR.","delivered_by":"Timo BLUNCK Content Manager Sandrine TASQUIN Course manager Kristof LAMONT Tutor Tim STELKENS-KOBSCH Tutor About Contact FAQ Getting Started Privacy Statement"},"SUR-ARTAS":{"terminy":[{"s":"2027-04-13 10:00","e":"2027-04-16 13:20","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"SUR-ARTAS","title_full":"ARTAS from concept to reality [SUR-ARTAS]","title_clean":"ARTAS from concept to reality","description":"ARTAS (ATM Surveillance Tracker and Server) is EUROCONTROL''s Surveillance Data Processing System (SDPS). It is operational in most of EUROCONTROL''s Member States and is being implemented in a number of other states for pre-operational evaluation. The latest version of ARTAS supports all modern surveillance techniques, such as Mode S, ADS-B and wide-area multilateration (WAM). This course gives an overview of the ARTAS system and its essential functional blocks. The course is comprehensively illustrated with screenshots and demonstrations. In addition, participants will have the opportunity to practise the knowledge gained in a computer lab. The course also provides an overview of the status and organisation of the ARTAS project . Current priorities, activities and future developments are also reviewed in details. Finally, the course provides a technical report on the integration of ARTAS at the EUROCONTROL Maastricht Upper Area Control Centre (MUAC).","important_note":"","pre_requisites":"Participants should have a basic knowledge of the surveillance techniques currently in use, and of data communication concepts.","objectives":"After completing the course, participants will be able to describe the ARTAS architecture and explain the basic algorithms and functions of each of the system''s main components. Participants will also learn about the organisation of the ARTAS project and have the information they need to start implementing ARTAS.","audience":"This course is designed for engineers and technicians involved in surveillance data processing. It may also be of interest to managers involved in the purchase of surveillance data processing systems.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR - Course manager\nBernard CUSTINNE - Tutor\nBernhard Garz - Tutor"},"SUR-ARTAS-LAMOS":{"terminy":[{"s":"2027-05-10 13:00","e":"2027-05-14 16:00","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SUR-ARTAS-LAMOS","title_full":"Local ARTAS Maintenance and Operational Support [SUR-ARTAS-LAMOS]","title_clean":"Local ARTAS Maintenance and Operational Support","description":"ARTAS (ATM Surveillance Tracker and Server) is the European state-of-the-art SDPS (surveillance data processing system). It is operational in an increasing number of European states and is being implemented in a number of other states for pre-operational evaluation. The latest versions of ARTAS support all modern surveillance techniques, such as Mode S, ADS-B, ADS-C and wide-area multi-lateration (WAM). This course is aimed at training ARTAS maintenance and operational support teams. After providing an overview of the concept of ARTAS; the course provides demonstrations of the system installation and functioning. Furthermore, the students have the opportunity to practise the knowledge gained, during extensive hands-on sessions.","important_note":"","pre_requisites":"The participants should have a basic knowledge of the surveillance techniques currently in use, and of data communication concepts. The participants would preferably - have attended the SUR-ARTAS course, - have advanced computer (in particular Linux) knowledge, - have experience in maintaining client server architectures.","objectives":"After completing the course, participants will be able to perform the daily maintenance and the first level troubleshooting of the ARTAS system. They shall be able to install the system, to configure its Man Machine Supervision node and to operate the system from its graphical user interface.","audience":"This course is designed for ARTAS maintenance and operational support teams.","price":"The price per course participant from all organisations or individuals is 1850 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR - Course manager\nVivek Kovileri - Tutor\nBernhard Garz - Tutor"},"SUR-INTRO":{"terminy":[{"s":"2027-05-24 13:00","e":"2027-05-28 13:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SUR-INTRO","title_full":"Introduction to ATM Surveillance [SUR-INTRO]","title_clean":"Introduction to ATM Surveillance","description":"This course provides a broad definition of ATM surveillance within the ECAC area. A wide variety of aspects are covered, including the mission, the technical backbone, the organisation, regulation, and management of ATM SUR. On the technical side, the course examines the benefits and limitations of the various SUR ground sensor technologies and the reciprocal onboard equipment. It provides information on primary, secondary and Mode S radars, as well as ADS-B and multi-lateration systems, and the related transponder equipment. In addition, the course covers the SUR data processing chain and its different applications. With regard to SUR stakeholders, this training course examines the topic of civil/military cooperation and related safety and cyber security situations. In addition, the course investigates recent regulatory developments relating to the ATM/ANS equipment conformity framework. Finally, the course provides an overview of EUROCONTROL''s role and the different initiatives in place for optimising the EUROPEAN ATM SUR network.","important_note":"This course serves as an introduction to all the aspects related to the Surveillance chain. For that it covers and extend material included in: the Surveillance Data Processing section of the DPS-DPC training, the ADS-B and WAM section of the SUR-ADS-B-MLAT training, the surveillance overview section of the GEN-ICNSS training, the spectrum section of the SUR-EMIT training. It further provides sections on avionics, spectrum, performance-based surveillance, surveillance applications, civil-military cooperation, safety and security, the regulation framework and the surveillance network management and organisation.","pre_requisites":"","objectives":"After completing the course, participants will be able to: Understand the main SUR sensor technologies, their principle, benefits, and limitations, understand the reciprocal necessary on-board equipment and their current challenges, understand the basics of the SUR data processing chain and its applications, from the sensor to the controller screen, understand the civil-military cooperation and the safety and security challenges, understand the regulatory and organisational aspects of the ATM SUR network in ECAC.","audience":"This course is designed for a wide audience (specially newcomers), including managers, engineers, technicians, controllers, or staff involved in regulatory aspects. The candidate might start working in the SUR domain or might want to refresh his expertise. It is not aimed at experts seeking advanced or in-depth technical training.","price":"No fee applies for course participants from Member States’ competent authorities and certified organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR Course manager Cyrille FAQUET Tutor Angel JARAMA Tutor Miroslav SPÁK Tutor Javier CEBALLOS GUTIERREZ Tutor About Contact FAQ Getting Started Privacy Statement"},"SUR-RAD-ADV":{"terminy":[{"s":"2027-03-22 10:00","e":"2027-03-25 16:30","dni":4,"dow":"Pon-Czw","lok":"Luxembourg"}],"course_id":"SUR-RAD-ADV","title_full":"Advanced Radar Technology [SUR-RAD-ADV]","title_clean":"Advanced Radar Technology","description":"Radar is still the widespread technique for independent Surveillance, with an important contribution to safety and the overall performance of the Network. This course goes into the details of primary and secondary radar, including Mode S. At the end of the course the student will have an in-depth understanding of what happens from detection to output: antenna, receiver/transmitter, signal processing and plot processing/extraction. The course consists of 3 days theoretical lectures and a 1-day practical session.","important_note":"Be sure you can stay until at least 16.00h on the last day, otherwise you miss an interesting practical session.","pre_requisites":"Basic radar knowledge, corresponding to the radar sections of the SUR-INTRO or DPS-DPC course, is required.","objectives":"At the end of the course students will be able to: - Explain the complete radar chain - Describe the main blocks in the radar chain (Antenna, TX/RX, Signal and plot processing) - Explain radar limitations - Explain how radar measurements and analysis can be made - Explain the context in which radar operates (regulation, safety, performance)","audience":"Surveillance engineers with a Surveillance understanding that corresponds with the objectives of the SUR-INTRO or DPS-DPC course","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1480 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR - Course manager\nSpeaker - Speaker\nDOMIEN DE RUYCK - Speaker\nMalcolm Maclean - Tutor"},"SUR-SDDS":{"terminy":[{"s":"2027-03-15 09:00","e":"2027-03-19 16:30","dni":5,"dow":"Pon-Pt","lok":"Luxembourg"}],"course_id":"SUR-SDDS","title_full":"Surveillance Data Distribution System [SUR-SDDS]","title_clean":"Surveillance Data Distribution System","description":"SDDS (Surveillance Data Distribution), the successor of the RMCDE, is the European state-of-the-art system for Surveillance Data Distribution and as such operational in an increasing number of European States. This course provides participants with a solid understanding of the SDDS network architecture, along with the skills required for SDDS configuration, operation, and management. The programme combines both theoretical and practical components. Participants first receive a structured introduction to surveillance data distribution concepts, focusing on network principles, ASTERIX, and the SDDS system architecture. These theoretical sessions are immediately followed by hands-on exercises that simulate real operational tasks. Attendees install, configure, monitor, and maintain the system using realistic scenarios that reflect real life SDDS operations.","important_note":"","pre_requisites":"Basic understanding of Surveillance and G/G Data Communication. Basic familiarity with Linux OS, which will be an advantage for the practical exercises.","objectives":"After completing the course, participants will be able to: - explain the principles of a SDD Network - describe the architecture of a SDD Network - perform essential configuration actions on the SDDS - perform essential monitoring actions on the SDDS - perform essential maintenance actions on the SDDS","audience":"This course is designed for engineers and technicians who are or will be involved in Surveillance Data Distribution.","price":"No fee applies for course participants from Member State Certified Organisations. The training cost is sponsored by the EUROCONTROL Work Programme. The price per course participant from other organisations or individuals is 1850 EUR.","delivered_by":"ATM Training Expert Fabrice LABOR - Course manager\nDr Cosimo Damiano TARANTINO - Tutor\nHajar BERDOUZI - Tutor\nRoman KIVLENOK - Tutor\nJohannes HOUBEN - Tutor"},"UAS-ATM":{"terminy":[{"s":"2027-06-01 10:00","e":"2027-06-04 13:00","dni":4,"dow":"Wt-Pt","lok":"Luxembourg"}],"course_id":"UAS-ATM","title_full":"Unmanned Aircraft Systems - ATM Integration [UAS-ATM]","title_clean":"Unmanned Aircraft Systems - ATM Integration","description":"Unmanned Aircraft Systems (UAS) have the capability to provide new services and make a substantial contribution to the economy. To achieve the full potential of this technology, it will be necessary to accommodate UAS in airspace previously dominated by manned aviation without compromising the good safety record. The adoption of the U-space regulatory package in the EU is expected to create the conditions necessary for both drones and manned aircraft to operate safely in U-space airspace. At the same time, integration in the existing ATM environment is challenging and new procedures and technologies are needed. This course provides an overview of processes for the integration of UAS in the existing ATM environment and the implementation of U-space and its main services from an ATM perspective.","important_note":"The material presented in this course assumes participants have at least a basic knowledge of ATM, UAS, U-space and the relevant European Commission Regulations. For those unfamiliar with these regulations, it is strongly recommended to participate in the virtual course, UAS-REG-V, before attending the UAS-ATM integration course. Please note that availability of presenters may cause changes to the course timetable. Participants will be notified in advance as far as practicable. Pre-requisites The material presented in this course assumes participants have at least a basic knowledge of ATM, UAS, U-space and the relevant European Commission Regulations. For those unfamiliar with these regulations, it is strongly recommended to participate in the UAS-REG course, before attending the UAS-ATM integration course. It is strongly recommended to complete the \"Fundamentals of UAS and U-space Airspace [UAS-REG-FUND]\" e-learning course.","pre_requisites":"","objectives":"After completing the course, participants should be able to: Identify key initiatives related to U-space and UAS Traffic Management (UTM) led by entities such as ICAO, the European Commission, EASA, SESAR JU and FAA. Explaining the regulatory procedures linked to the provision of U-space/UTM services. Describing the operational concept underpinning UAS integration into Air Traffic Managment (ATM). Applying Commission Implementing Regulation EU 2021/664 Highlighting the primary characteristics of U-space types proposed by SESAR JU and Project CORUS. Identifying roles and deliverables generated by Standards Development Organisations (SDOs).","audience":"Personnel of ANSPs, airport operators and competent authorities.","price":"The price per course participant from all organisations or individuals is 1480 EUR.","delivered_by":"Dr Aycan MUTLU Course manager Toby Enzerink Tutor About Contact FAQ Getting Started Privacy Statement"},"UAS-CUAS":{"terminy":[{"s":"2027-02-15 09:00","e":"2027-02-16 17:00","dni":2,"dow":"Pon-Wt","lok":"Luxembourg"},{"s":"2027-02-17 09:00","e":"2027-02-18 17:00","dni":2,"dow":"Śr-Czw","lok":"Luxembourg"}],"course_id":"UAS-CUAS","title_full":"Counter UAS Fundamentals [UAS-CUAS]","title_clean":"Counter UAS Fundamentals","description":"In support of NATO’s ongoing efforts to strengthen Counter-Unmanned Aircraft Systems (C-UAS) capabilities, the Joint Air Power Competence Centre has developed a C-UAS Fundamentals Training Course tailored for the NATO C-UAS Community of Interest (COI). Starting in 2025, the C-UAS Fundamentals Training Course is offered to members across all ranks of the NATO C-UAS COI, including relevant law enforcement agencies and critical infrastructure stakeholders. The course aims to raise drone awareness and provide a foundational understanding of the C-UAS problem. The curriculum currently includes lessons about drone operation tactics, techniques and procedures (TTP), drone threats throughout the spectrum of terrorism, espionage, sabotage, subversion, and organized crime (TESSOC), drone detection and relevant sensing methods, passive drone mitigation in peacetime and operations, active drone mitigation and relevant engagement methods, potential future UAS and C-UAS concepts, as well as C-UAS planning, including a tabletop planning exercise.","important_note":"This course is delivered by JAPCC. Only course instances hosted at EUROCONTROL Aviation Learning Centre are advertised here. To see a full training schedule at all other locations, please visit https://www.japcc.org/training/#cuas","pre_requisites":"","objectives":"This course aims to raise awareness of drone threats and provide foundational understanding of C-UAS challenges.","audience":"NATO C-UAS Community of Interest (Includes military, civilian, law enforcement, academic, defence, and critical infrastructure personnel)","price":"This course is free of charge.","delivered_by":"Lt Col Andre Haider Content Manager Dr Aycan MUTLU Course manager Timo BLUNCK Tutor Rocco Burdo Tutor About Contact FAQ Getting Started Privacy Statement"},"UAS-REG":{"terminy":[{"s":"2027-03-09 10:00","e":"2027-03-11 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"UAS-REG","title_full":"Unmanned Aircraft Systems - a Regulatory Overview [UAS-REG]","title_clean":"Unmanned Aircraft Systems - a Regulatory Overview","description":"The course provides an overview of the emerging ICAO provisions and regulations on UAS (Unmanned Aircraft Systems). This includes standards and recommended practices from ICAO, recommended requirements from JARUS, and emerging rules from FAA and EASA. The course focuses also on the changes introduced by the new EASA Basic Regulation (2018/1139) that extended the mandate of EASA to drones of any mass, and presents the related implementing and delegated acts as well as the differences among open, specific and certified categories of UAS operations. Standard scenarios defined by JARUS and EASA are also presented in the course. The EU Legislation applicable to civil drones goes much beyond safety, so not only 2018/1139 and associated rules will be covered, but also other relevant EU Regulations (e.g. 765/2004, 679/2016, 376/2014 and 996/2010) will be highlighted, as well as the provisions on U-Space (e.g. Implementing Regulations 2021/664, 2021/665, 2021/666). The course is composed of both theoretical modules, necessary to understand the regulatory framework, and group exercises and use cases, meant to consolidate the assimilated concepts and to share knowledge among the participants. Nevertheless, this course does not train participants to execute a specific regulatory or operational task linked to non-military drones. The course instead intends to provide attendees with a thorough insight in the overall scenario related to drones, including the societal point of view.","important_note":"This course is organised back-to-back with \"UAS Regulations in Practice: Operational Implementation\" course, delivered by CNFPC, to allow participants to attend them in the same week and location for completing the “UAS Regulation - From Theory to Practice [UAS-LP-REG]” learning path. Please consider registering for both courses during the same week! An update to the course title and agenda is planned for 2027. Pre-requisites It is strongly recommended to follow the \"Fundamentals of UAS and U-space Airspace [UAS-REG-FUND]\" eLearning course prior to attendance to the UAS-REG course.","pre_requisites":"","objectives":"At the end of the course, participants will be able to: Summarise key principles of emerging rules across the aviation domains (organisations, airworthiness, competence of remote pilots, operations, detect and avoid, command and control data link, airspace integration etc.). List the main EU Regulations affecting non-military UAS and explain their applicability. Envisage expected developments of emerging ICAO provisions and requirements at global level (ICAO, JARUS)","audience":"Professionals from industry wishing to acquire familiarisation with drone rules, or wishing to understand the regulatory context around their specific task. Staff of aviation authorities (potentially) dealing with non-military drones for policy development, rulemaking, certification, licensing and oversight.","price":"The price per course participant is 1110 EUR.","delivered_by":"Dr Aycan MUTLU Course manager Laura González Combrink Tutor About Contact FAQ Getting Started Privacy Statement"},"UAS-SAF":{"terminy":[{"s":"2027-04-13 10:00","e":"2027-04-15 17:00","dni":3,"dow":"Wt-Czw","lok":"Luxembourg"}],"course_id":"UAS-SAF","title_full":"Overview of UAS Specific Operations Risk Assessment (SORA) Methodology [UAS-SAF]","title_clean":"Overview of UAS Specific Operations Risk Assessment (SORA) Methodology","description":"EU Regulations 2019/947 and 2019/945 establish a risk-based regulatory framework for UAS, categorizing operations into open, specific, and certified. Specific operations require UAS operators to submit a risk assessment to the CAA for approval, using the EASA''s Specific Operations Risk Assessment (SORA). SORA evaluates ground and air risk from the UAS operator''s perspective, considering the applicable operational scenarios. The process includes identifying potential hazards, assessing risks, and determining appropriate mitigation measures to ensure safe operation. This course covers how SORA assesses ground and air risks from various viewpoints, including UAS operators, ANSP, and aviation authorities, providing a comprehensive understanding of the risk assessment process and its practical application in ensuring safe UAS operations.","important_note":"Participants are asked to bring their own laptops due to an exercise conducted. This course is organised back-to-back with \"SORA in Practice: Conducting an Authorised UAS Operation\" course, delivered by CNFPC, to allow participants to attend them in the same week and location for completing the “UAS SORA Framework with Hands-on implementation [UAS-LP-SAF]” learning path. Please consider registering for both courses during the same week! An update to the course title and agenda is planned for 2027. Pre-requisites The material presented in this course assumes participants have at least a basic knowledge of ATM, UAS, U-space and the relevant European Commission Regulations. For those unfamiliar with these regulations, it is strongly recommended to participate in the virtual or classroom UAS-REG course, before attending the UAS-SAF course. It is strongly recommended to complete the \"Fundamentals of UAS and U-space Airspace [UAS-REG-FUND]\" e-learning course.","pre_requisites":"","objectives":"Participants will be able to: explain the various subcategories in EU Regulation 2019/947 understand the key concepts of the Specific Operations Risk Assessment (SORA) apply the basics of the SORA methodology to a pre-determined use case. Participants from the competent authorities should be able to assist in the review of the application received from the drone operators with respect to ground risks and air risks and the applied mitigations.","audience":"Personnel of service providers that want to understand how SORA deal with the interaction between UAS and other traffic. Personnel of competent authorities that need to evaluate applications based on SORA for operations in complex airspace environments. Personnel of UAS industry, remote pilots, instructors and other aviation professionals","price":"The price per course participant is 1110 EUR.","delivered_by":"Dr Aycan MUTLU Course manager Laura González Combrink Tutor About Contact FAQ Getting Started Privacy Statement"}}</script>
<div id="toast"></div>
<script>
"use strict";
const TABLE='T2027_A_Planowanie';
const LS_WIDTHS='ians-akceptacja-col-widths-v1';
const COLS=[
 {key:'zg',def:120,min:80},{key:'biuro',def:70,min:50},{key:'uczestnik',def:200,min:120},
 {key:'szkolenie',def:300,min:160},{key:'priorytet',def:56,min:40},{key:'uzasadnienie',def:170,min:90},
 {key:'koszt',def:86,min:60},
 {key:'dyrpriorytet',def:60,min:44},{key:'dyrakcept',def:70,min:56},
 {key:'prezesakcept',def:78,min:56}
];
const state={main:[],groupBy:'none',collapsed:new Set(),sort:null,search:'',loaded:false,colWidths:{},groupSortDesc:false,lastMainJson:'',suppressUntil:0};
try{Object.assign(state.colWidths,JSON.parse(localStorage.getItem(LS_WIDTHS)||'{}'))}catch(e){}
let reloadTimer=null,searchTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function colToRecs(data){return(data.id||[]).map((id,i)=>{const r={id};for(const c of Object.keys(data))if(c!=='id')r[c]=data[c][i];return r})}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='',err?3500:1400)}
function widthOf(c){const n=Number(state.colWidths[c.key]);return Math.max(c.min,Math.min(c.max||1000,Number.isFinite(n)?n:c.def))}
function tableWidth(){return COLS.reduce((s,c)=>s+widthOf(c),0)}
function renderCols(){document.getElementById('colgroup').innerHTML=COLS.map(c=>`<col data-colkey="${c.key}" style="--cw:${widthOf(c)}px">`).join('');document.getElementById('tbl').style.width=tableWidth()+'px'}
function setColWidth(key,w){const c=COLS.find(x=>x.key===key);if(!c)return;w=Math.max(c.min,Math.min(c.max||1000,Math.round(w)));state.colWidths[key]=w;const col=document.querySelector(`#colgroup col[data-colkey="${CSS.escape(key)}"]`);if(col)col.style.setProperty('--cw',w+'px');document.getElementById('tbl').style.width=tableWidth()+'px';try{localStorage.setItem(LS_WIDTHS,JSON.stringify(state.colWidths))}catch(e){}}
/* ── ładowanie danych: jedna płaska tabela, reszta (Role/HistoriaIANS) już zaciągnięta przez formuły Grista ── */
async function loadAll(){const data=await grist.docApi.fetchTable(TABLE);state.main=colToRecs(data);state.lastMainJson=JSON.stringify(data);const first=!state.loaded;state.loaded=true;render(first)}
async function loadMain(){const data=await grist.docApi.fetchTable(TABLE),j=JSON.stringify(data);if(j===state.lastMainJson)return;state.lastMainJson=j;state.main=colToRecs(data);render()}
function scheduleReload(){if(Date.now()<state.suppressUntil)return;clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>loadMain().catch(console.error),150)}
async function updateRec(id,fields){const r=state.main.find(x=>x.id===id),prev=r?{...r}:null;if(r)Object.assign(r,fields);rerenderRow(id);try{await grist.docApi.applyUserActions([['UpdateRecord',TABLE,id,fields]]);state.suppressUntil=Date.now()+2500;toast('Zapisano')}catch(e){if(r&&prev)Object.assign(r,prev);rerenderRow(id);toast('Nie udało się zapisać — brak uprawnień na tym etapie?',true)}}
function uczLabel(r){return r.Uczestnik||''}
function fmtKoszt(v){v=Number(v)||0;return v?`${v.toLocaleString('pl-PL')} EUR`:''}
function renderHead(){renderCols();secRow.innerHTML=`<th colspan="7" class="sec-info">Zgłoszenie <span style="font-weight:500;text-transform:none">(tylko odczyt)</span></th><th colspan="2" class="sec-dyr sec-l">Akceptacja Dyrektora</th><th colspan="1" class="sec-prezes">Zatwierdzenie Prezesa</th>`;
 const th=(key,label,sortable,extra)=>`<th data-rescol="${key}" ${sortable?`data-sortcol="${key}"`:''} class="${sortable?'sortable ':''}${state.sort?.col===key?'sorted ':''}${extra||''}" title="${sortable?'Sortuj':''}">${label}${sortable?`<span class="arr">${state.sort?.col===key&&state.sort.dir<0?'↓':'↑'}</span>`:''}<div class="resizer"></div></th>`;
 colRow.innerHTML=th('zg','Zgłaszający',1,'')+th('biuro','Biuro',1,'')+th('uczestnik','Uczestnik',1,'')+th('szkolenie','Temat',1,'')+th('priorytet','Priorytet',0,'')+th('uzasadnienie','Uzasadnienie',0,'')+th('koszt','Dod. koszt',1,'')+th('dyrpriorytet','Priorytet',0,'sec-l')+th('dyrakcept','Akcept.',0,'')+th('prezesakcept','Zatw.',0,'');
 requestAnimationFrame(()=>{const h=secRow.getBoundingClientRect().height||26;[...colRow.cells].forEach(x=>x.style.top=h+'px')})}
function star(r,c,on){return `<label class="priority-star${on?'':' ro'}"><input type="checkbox" data-id="${r.id}" data-col="${c}" ${r[c]?'checked':''} ${on?'':'disabled'}><span class="star">★</span></label>`}
function accept(r,c,on){return `<label class="accept-toggle"><input type="checkbox" data-id="${r.id}" data-col="${c}" ${r[c]?'checked':''} ${on?'':'disabled'}><span class="at-no">✗</span><span class="at-yes">✓</span></label>`}
function cellSzkolenie(r){const v=r.Szkolenie?esc(r.Szkolenie):'<span class="empty-val">—</span>';const code=kursCode(r),ib=code&&opisFor(code)?`<button class="info-btn" data-info="${esc(code)}" title="Opis szkolenia z biuletynu">i</button>`:'';return `<div class="cellcol szk-flex"><span class="readtxt" style="flex:1;min-width:0">${v}</span>${ib}</div>`}
function cellUczestnik(r){const v=uczLabel(r)?esc(uczLabel(r)):'<span class="empty-val">—</span>';const hist=(r.Historia_Pracownika||'').trim();const hb=hist?`<button class="hist-btn" data-hist="${esc(hist)}" data-name="${esc(uczLabel(r))}" title="Historia szkoleń uczestnika">🕘</button>`:'';return `<div class="cellcol uc-flex"><span class="readtxt" style="flex:1;min-width:0">${v}</span>${hb}</div>`}
function rowHtml(r){const dv=(c)=>`<span class="readtxt mut">${r[c]?esc(r[c]):''}</span>`;
 return `<tr data-id="${r.id}"><td>${dv('Zg_aszajacy')}</td><td>${dv('Biuro')}</td><td>${cellUczestnik(r)}</td><td>${cellSzkolenie(r)}</td><td style="text-align:center">${star(r,'Priorytet',false)}</td><td><span class="readtxt mut">${esc(r.Uzasadnienie||'')}</span></td><td>${dv2fmtKoszt(r)}</td><td class="c-dyr sec-l" style="text-align:center">${star(r,'Dyr_Priorytet',true)}</td><td class="c-dyr" style="text-align:center">${accept(r,'Akceptacja_Dyr',true)}</td><td class="c-prezes" style="text-align:center">${accept(r,'Akceptacja_Prezes',true)}</td></tr>`}
function dv2fmtKoszt(r){const n=Number(r.DodatkowyKoszt_EUR_)||0,v=fmtKoszt(n);return `<span class="readtxt ${n>0?'cost-paid':'mut'}">${v||''}</span>`}
function rerenderRow(id){const tr=document.querySelector(`#tbody tr[data-id="${id}"]`),r=state.main.find(x=>x.id===id);if(!tr||!r)return render();const t=document.createElement('tbody');t.innerHTML=rowHtml(r);tr.replaceWith(t.firstElementChild)}
function filteredRecords(){const q=state.search.trim().toLowerCase();return state.main.filter(r=>!q||[r.Zg_aszajacy,uczLabel(r),r.Biuro,r.Szkolenie,r.Uzasadnienie].some(x=>(x||'').toLowerCase().includes(q)))}
function sortKey(r,c){return c==='zg'?(r.Zg_aszajacy||''):c==='biuro'?(r.Biuro||''):c==='uczestnik'?uczLabel(r):c==='szkolenie'?(r.Szkolenie||''):c==='koszt'?String(Number(r.DodatkowyKoszt_EUR_)||0).padStart(12,'0'):''}
function cmp(a,b){return state.sort?sortKey(a,state.sort.col).localeCompare(sortKey(b,state.sort.col),'pl')*state.sort.dir||a.id-b.id:a.id-b.id}
function groupRow(k,n){return `<tr class="group${state.collapsed.has(k)?' collapsed':''}" data-gkey="${esc(k)}"><td colspan="10"><span class="chev">▾</span>${esc(k)}<span class="meta">${n} wpisów</span></td></tr>`}
function render(){renderHead();const rs=filteredRecords();if(!rs.length){tbody.innerHTML=`<tr><td colspan="10"><div class="state-msg">${state.main.length?'Brak wyników dla tego filtra.':'<b>Brak wpisów.</b>'}</div></td></tr>`;return}
 let h='';if(state.groupBy==='none')rs.sort(cmp).forEach(r=>h+=rowHtml(r));
 else{const fn=state.groupBy==='biuro'?r=>r.Biuro||'— bez biura':state.groupBy==='komorka'?r=>r.Komorka||'— bez komórki':state.groupBy==='pracownik'?r=>uczLabel(r)||'— bez uczestnika':r=>r.Szkolenie||'— bez szkolenia',g=new Map();
  rs.forEach(r=>{const k=fn(r);if(!g.has(k))g.set(k,[]);g.get(k).push(r)});
  let ks=[...g.keys()];ks.sort(state.groupSortDesc?(a,b)=>g.get(b).length-g.get(a).length:(a,b)=>a.localeCompare(b,'pl'));
  for(const k of ks){h+=groupRow(k,g.get(k).length);if(!state.collapsed.has(k))g.get(k).sort(cmp).forEach(r=>h+=rowHtml(r))}}
 tbody.innerHTML=h}
tbody.addEventListener('change',e=>{const x=e.target;const id=+x.dataset.id,c=x.dataset.col;if(!id||!c)return;const r=state.main.find(y=>y.id===id);const v=x.checked;if(v===!!r[c])return;updateRec(id,{[c]:v})});
tbody.addEventListener('click',e=>{const ib=e.target.closest('.info-btn[data-info]');if(ib)return showKursInfo(ib,ib.dataset.info);const hb=e.target.closest('.hist-btn[data-hist]');if(hb)return showHistoria(hb,hb.dataset.hist,hb.dataset.name);const g=e.target.closest('tr.group');if(g){state.collapsed.has(g.dataset.gkey)?state.collapsed.delete(g.dataset.gkey):state.collapsed.add(g.dataset.gkey);render()}});
colRow.addEventListener('click',e=>{if(e.target.closest('.resizer'))return;const th=e.target.closest('th.sortable');if(!th)return;const c=th.dataset.sortcol;if(state.sort?.col!==c)state.sort={col:c,dir:1};else if(state.sort.dir===1)state.sort.dir=-1;else state.sort=null;render()});
colRow.addEventListener('pointerdown',e=>{const rz=e.target.closest('.resizer');if(!rz)return;e.preventDefault();e.stopPropagation();const th=rz.closest('th'),key=th.dataset.rescol,c=COLS.find(x=>x.key===key);if(!c)return;const sx=e.clientX,sw=widthOf(c);rz.setPointerCapture(e.pointerId);rz.classList.add('rz-active');document.body.classList.add('resizing');const move=ev=>setColWidth(key,sw+ev.clientX-sx),up=()=>{rz.classList.remove('rz-active');document.body.classList.remove('resizing');rz.removeEventListener('pointermove',move);rz.removeEventListener('pointerup',up);rz.removeEventListener('pointercancel',up)};rz.addEventListener('pointermove',move);rz.addEventListener('pointerup',up);rz.addEventListener('pointercancel',up)});
groupSeg.addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;state.groupBy=b.dataset.g;state.collapsed.clear();[...groupSeg.children].forEach(x=>x.classList.toggle('on',x===b));groupSortBtn.hidden=state.groupBy==='none';render()});
groupSortBtn.onclick=()=>{state.groupSortDesc=!state.groupSortDesc;groupSortBtn.classList.toggle('active',state.groupSortDesc);render()};
search.oninput=e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=e.target.value;render()},180)};
refreshBtn.onclick=()=>loadAll().then(()=>toast('Odświeżono')).catch(()=>toast('Błąd odświeżania',true));
/* ── Popover (mały dymek przy przycisku, zamiast pełnoekranowego okna) ── */
let popAnchor=null;
function closePopover(){popover.hidden=true;popAnchor=null}
function positionPopover(anchor){const r=anchor.getBoundingClientRect(),pw=popover.offsetWidth||380,ph=popover.offsetHeight||300;
 let left=r.left;if(left+pw>window.innerWidth-12)left=window.innerWidth-pw-12;if(left<12)left=12;
 let top=r.bottom+6;if(top+ph>window.innerHeight-12){top=r.top-ph-6;if(top<12)top=12}
 popover.style.left=left+'px';popover.style.top=top+'px'}
function openPopover(anchor,html){if(popAnchor===anchor&&!popover.hidden)return closePopover();document.getElementById('popBody').innerHTML=html;popover.hidden=false;popAnchor=anchor;positionPopover(anchor)}
popClose.onclick=closePopover;
document.addEventListener('click',e=>{if(popover.hidden)return;if(popover.contains(e.target)||e.target.closest('.info-btn,.hist-btn'))return;closePopover()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopover()});
document.querySelector('.wrap').addEventListener('scroll',()=>{if(!popover.hidden)closePopover()});
/* ── Historia szkoleń uczestnika (formuła Historia_Pracownika: "[rok]---[temat]" na wiersz) ── */
function showHistoria(anchor,raw,name){const lines=(raw||'').split('\n').map(x=>x.trim()).filter(Boolean);
 const items=lines.map(l=>{const m=l.match(/^\[([^\]]*)\]---\[([^\]]*)\]$/);return m?{rok:m[1],temat:m[2]}:{rok:'',temat:l}});
 items.sort((a,b)=>String(b.rok).localeCompare(String(a.rok)));
 const rows=items.map(o=>`<div class="term-item">${o.rok?`<span class="hist-year">${esc(o.rok)}</span>`:''}<span class="hist-topic">${esc(o.temat)}</span></div>`).join('');
 openPopover(anchor,`<div class="opis-title" style="margin-right:22px">Historia szkoleń${name?' — '+esc(name):''}</div><div class="opis-sec"><h4>Poprzednie szkolenia (${items.length})</h4>${rows||'<p>Brak wpisów.</p>'}</div>`)}
/* ── Biuletyn: opisy kursów wbudowane w widget (blok #lz-opisy-data, źródło: BazaLearningZone / Katalog Szkoleń IANS) ── */
const LZ_OPISY=(()=>{try{return JSON.parse(document.getElementById('lz-opisy-data').textContent||'{}')}catch(e){return{}}})();
function kursCode(r){const s=(r.Skrot||'').trim().toUpperCase().replace(/^\[|\]$/g,'');if(s&&LZ_OPISY[s])return s;const m=(r.Szkolenie||'').match(/\[([^\]]+)\]/);return m?m[1]:s}
function opisFor(code){if(!code)return null;return LZ_OPISY[code]||LZ_OPISY[String(code).trim().toUpperCase()]||null}
function opisSec(label,text){text=(text||'').trim();return text?`<div class="opis-sec"><h4>${esc(label)}</h4><p>${esc(text)}</p></div>`:''}
function feeClass(t){const n=(t||'').toLowerCase().replace(/\s+/g,' ');if(!n.trim())return'';
 if(/no fee applies for course participants|training cost is sponsored by the eurocontrol work programme|this course is sponsored for staff members|this course is free of charge for/.test(n))return'free';
 return /(\d{2,}(?:[\s.,]\d{3})*(?:[.,]\d{2})?\s*(?:eur|usd|gbp|chf|euro|€|\$|£))|(?:(?:eur|usd|gbp|chf|euro|€|\$|£)\s*\d{2,})/.test(n)?'paid':''}
function feeBox(price){price=(price||'').trim();if(!price)return'';const f=feeClass(price);
 return `<div class="fee ${f||'none'}"><div class="fee-tag">${f==='paid'?'Płatne':f==='free'?'Bezkosztowe':'Koszt'}</div>${esc(price)}</div>`}
function noteBox(t){t=(t||'').trim();return t?`<div class="note"><b>Ważne: </b>${esc(t)}</div>`:''}
/* sekcje i kolejność jak w katalogu IANS: Opis, Ważne, Wymagania wstępne, Cele, Grupa docelowa, Koszt, Prowadzący */
function renderOpis(o,full,skipHead){let h=skipHead?'':`<div class="opis-code">${esc(o.course_id||'')}</div><div class="opis-title">${esc(o.title_clean||o.title_full||'')}</div>`;h+=opisSec('Opis',o.description);if(full)h+=noteBox(o.important_note);h+=opisSec('Wymagania wstępne',o.pre_requisites)+opisSec('Cele',o.objectives)+opisSec('Grupa docelowa',o.audience);if(full)h+=feeBox(o.price)+opisSec('Prowadzący',o.delivered_by);return h}
function terminyList(code){const emb=(opisFor(code)?.terminy)||[];if(!emb.length)return'';
 const rows=emb.map(t=>{const online=/online|zdaln/i.test(t.lok||''),date=((t.s||'')+' – '+(t.e||'')).trim(),dni=(t.dni!=null&&t.dni!=='')?esc(t.dni+' dn.'):'';return `<div class="term-item"><span class="term-date">${esc(date)}</span>${dni?`<span class="term-dow">${dni}</span>`:''}${t.lok?`<span class="term-loc${online?' online':''}">${esc(t.lok)}</span>`:''}</div>`}).join('');
 return `<div class="opis-sec"><h4>Terminy (${emb.length})</h4>${rows}</div>`}
function showKursInfo(anchor,code){const o=opisFor(code);if(!o)return;openPopover(anchor,renderOpis(o,false)+terminyList(code))}
function renderBooklet(){const q=(bookletSearch.value||'').toLowerCase().trim();let items=Object.values(LZ_OPISY);items.sort((a,b)=>(a.title_clean||a.title_full||'').localeCompare(b.title_clean||b.title_full||'','pl'));if(q)items=items.filter(o=>[o.course_id,o.title_clean,o.title_full,o.description].some(v=>(v||'').toLowerCase().includes(q)));bookletBody.innerHTML=items.length?items.map(o=>`<div class="bk-card" data-code="${esc(o.course_id||'')}"><div class="bk-head"><span class="bk-code">${esc(o.course_id||'')}</span><span class="bk-title">${esc(o.title_clean||o.title_full||'')}</span><span class="bk-chev">▸</span></div><div class="bk-det"></div></div>`).join(''):`<div class="state-msg">Brak kursów${q?' pasujących do wyszukiwania':''}.</div>`}
/* samodzielna strona biuletynu — układ 1:1 jak "Katalog Szkoleń IANS" (dane z BazaLearningZone) */
function bookletHtml(){
 const items=Object.values(LZ_OPISY).sort((a,b)=>(a.course_id||'').localeCompare(b.course_id||'','pl'));
 const terminRow=t=>`<tr><td class="mono">${esc(t.s||'')}</td><td class="mono">${esc(t.e||'')}</td><td class="mono c">${esc(String(t.dni??''))}</td><td class="c">${esc(t.dow||'')}</td><td class="c">${esc(t.lok||'')}</td></tr>`;
 const sec=(l,t)=>{t=(t||'').trim();return t?`<h3>${esc(l)}</h3><p>${esc(t)}</p>`:''};
 let alld=[];for(const o of items)for(const t of(o.terminy||[])){if(t.s)alld.push(t.s.slice(0,10));if(t.e)alld.push(t.e.slice(0,10))}
 alld.sort();
 const okres=alld.length?`${alld[0]} do ${alld[alld.length-1]}`:'';
 const today=new Date().toLocaleDateString('pl-PL');
 const toc=items.map(o=>`<a href="#k-${esc(o.course_id)}">[${esc(o.course_id)}] ${esc(o.title_clean||o.title_full)}</a>`).join('');
 const body=items.map(o=>{
  const f=feeClass(o.price);
  const feeLabel=f==='paid'?'Płatne':f==='free'?'Bezkosztowe':'Price';
  const feeHtml=(o.price||'').trim()?`<h3 class="${f}">${feeLabel}</h3><div class="fee ${f||'none'}">${esc(o.price)}</div>`:'';
  const noteHtml=o.important_note?`<h3>Important Note</h3><div class="note">${esc(o.important_note)}</div>`:'';
  const terms=o.terminy||[];
  const tt=terms.length?`<table><tr><th>Start (data i godzina)</th><th>Koniec (data i godzina)</th><th>Dni</th><th>Dni tyg.</th><th>Lokalizacja</th></tr>${terms.map(terminRow).join('')}</table>`:'';
  return `<section class="page kurs" id="k-${esc(o.course_id)}">
   <h2>[${esc(o.course_id)}] ${esc(o.title_clean||o.title_full)}</h2>
   ${tt}
   ${sec('Description',o.description)}
   ${noteHtml}
   ${sec('Pre-requisites',o.pre_requisites)}
   ${sec('Objectives',o.objectives)}
   ${sec('Audience',o.audience)}
   ${feeHtml}
   ${sec('Delivered By',o.delivered_by)}
   <a class="top" href="#toc">↑ Spis treści</a></section>`}).join('');
 return `<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog Szkoleń IANS</title><style>
 *{box-sizing:border-box}
 body{font:13.5px/1.5 "Red Hat Text",system-ui,"Segoe UI",sans-serif;color:#202020;margin:0;background:#50565E}
 .page{width:820px;max-width:100%;min-height:1060px;background:#fff;margin:16px auto;padding:48px 54px;box-shadow:0 2px 14px rgba(0,0,0,.45);position:relative}
 .toolbtn{position:fixed;top:14px;right:16px;z-index:10;border:0;background:#1F4E78;color:#fff;border-radius:8px;padding:9px 16px;font:600 13px inherit;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
 .toolbtn:hover{background:#163a5c}
 .cover{display:flex;flex-direction:column;justify-content:center;text-align:center}
 .cover h1{font-size:34px;color:#1F4E78;letter-spacing:1px;margin:0 0 6px}
 .cover .sub{font-size:15px;color:#666;margin-bottom:34px}
 .cover .info{font-size:13.5px;line-height:2;color:#333}
 .cover .info i{color:#666}
 h2.toch{font-size:20px;color:#1F4E78;margin:0 0 4px}
 .hint{font-size:12px;color:#666;margin:0 0 14px}
 .toc a{display:block;color:#1F4E78;text-decoration:underline;font-size:12.5px;padding:2px 0}
 .toc a:hover{color:#B42318}
 .kurs h2{font-size:18px;color:#1F4E78;margin:0 0 12px;line-height:1.35}
 .kurs h3{font-size:12.5px;color:#1F4E78;text-transform:uppercase;letter-spacing:.4px;margin:16px 0 4px}
 .kurs h3.free{color:#2E7D32}.kurs h3.paid{color:#B42318}
 .kurs p{margin:0;font-size:13px;white-space:pre-line}
 table{border-collapse:collapse;width:100%;margin:2px 0 6px;font-size:11.5px}
 th{background:#1F4E78;color:#f5f5f5;text-align:center;padding:6px 8px;font-weight:600}
 td{padding:5px 8px;border:.5px solid #CCCCCC;text-align:center}
 td.mono{font-family:"Red Hat Mono",Consolas,monospace}
 tr:nth-child(even) td{background:#fff}tr:nth-child(odd) td{background:#F5F5F5}
 table tr:first-child th{border:.5px solid #CCCCCC}
 .fee{border:1.5px solid;border-radius:6px;padding:9px 13px;font-size:13px;margin-top:2px}
 .fee.paid{background:#F8D7DA;border-color:#B42318;color:#7a1a12}
 .fee.free{background:#D9F4D8;border-color:#2E7D32;color:#1b4d1e}
 .fee.none{background:#f5f5f5;border-color:#ccc}
 .note{background:#FFF3CD;border:1px solid #F4D58D;color:#A15C00;border-radius:6px;padding:9px 13px;font-size:13px;margin-top:2px}
 .top{position:absolute;bottom:22px;right:54px;font-size:11.5px;color:#1F4E78;text-decoration:none}
 .top:hover{text-decoration:underline}
 @media print{body{background:#fff}.toolbtn,.top{display:none}.page{box-shadow:none;margin:0;width:auto;min-height:0;padding:24px 0;page-break-after:always}}
 </style></head><body>
 <button class="toolbtn" onclick="print()">🖨 Drukuj / zapisz PDF</button>
 <section class="page cover"><h1>KATALOG SZKOLEŃ IANS</h1><div class="sub">LearningZone EUROCONTROL Aviation Learning Centre</div>
  <div class="info"><b>Liczba unikalnych szkoleń:</b> ${items.length}<br><b>Data generacji:</b> ${esc(today)}<br>${okres?`<b>Okres:</b> ${esc(okres)}<br>`:''}<br><i>Każda strona zawiera szczegóły szkolenia i wszystkie dostępne terminy.</i></div></section>
 <section class="page" id="toc"><h2 class="toch">Spis treści</h2><p class="hint">Kliknij tytuł, aby przejść do odpowiedniej sekcji.</p><nav class="toc">${toc}</nav></section>
 ${body}
 <scr`+`ipt>document.addEventListener('click',function(e){var a=e.target.closest('a[href^="#"]');if(!a)return;var el=document.getElementById(a.getAttribute('href').slice(1));if(el){e.preventDefault();el.scrollIntoView(true)}});<\/scr`+`ipt>
 </body></html>`}
bookletBtn.onclick=()=>{bookletOverlay.hidden=false;renderBooklet();bookletSearch.focus()};
bookletPdfBtn.onclick=()=>{
 try{
  const url=URL.createObjectURL(new Blob([bookletHtml()],{type:'text/html'}));
  const w=window.open(url,'_blank');
  if(w)return;
 }catch(e){}
 toast('Zezwól na wyskakujące okna, aby otworzyć biuletyn PDF',true);
};
bookletClose.onclick=()=>bookletOverlay.hidden=true;
bookletSearch.oninput=()=>renderBooklet();
bookletOverlay.addEventListener('click',e=>{if(e.target===bookletOverlay)bookletOverlay.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')bookletOverlay.hidden=true});
bookletBody.addEventListener('click',e=>{const h=e.target.closest('.bk-head');if(!h)return;const c=h.parentElement,d=c.querySelector('.bk-det');if(!c.classList.contains('open')&&!d.dataset.f){const o=opisFor(c.dataset.code);if(o){d.innerHTML=renderOpis(o,true,true)+terminyList(c.dataset.code);d.dataset.f='1'}}c.classList.toggle('open')});
grist.ready({requiredAccess:'full'});grist.onRecords(scheduleReload);loadAll().catch(e=>{console.error(e);tbody.innerHTML='<tr><td colspan="10"><div class="state-msg"><b>Nie udało się wczytać danych.</b></div></td></tr>'});setInterval(()=>{if(!document.hidden)scheduleReload()},45000);
</script>
</body>
