<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAŻP — Dashboard KPI 2027</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  /* brand palette (storytelling-with-data: neutral ink everywhere; colour is
     spent only on RAG status — pastel red = currently over the limit, pastel
     yellow = was over the limit earlier this year but is back on track) */
  --navy:#0F304D; --accent:#C4007A;
  --brand-blue:#5795CA; --brand-blue-light:#8BB9D3; --brand-gray:#BEBFBF;
  --bg:#f3f5f9; --card:#ffffff; --card2:#fbfcfe;
  --line:#e3e7ee; --line2:#eef1f6;
  --txt:#1a1e27; --mut:#6b7280; --mut2:#98a2b3;
  /* KPA categories no longer carry distinct colours — a single neutral ink is
     used for all of them so colour is reserved for status only */
  --kpa-ink:#0F304D; --kpa-b:rgba(190,191,191,.28);
  --data:#8BB9D3; /* default neutral bar/data colour when "good"/no target */
  --bad:#E57373; --bad-b:rgba(229,115,115,.16); --bad-line:rgba(211,47,47,.4);
  --warn:#F0C36D; --warn-b:rgba(240,195,109,.22); --warn-line:rgba(191,133,15,.4);
  --ok:#98a2b3; --neutral:#94a3b8;
  --radius:16px; --shadow:0 1px 2px rgba(20,24,34,.04),0 8px 24px -12px rgba(20,24,34,.12);
  --shadow-hover:0 4px 10px rgba(20,24,34,.06),0 16px 36px -14px rgba(20,24,34,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;}
#app{min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#cdd3dd;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#b7bece}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:14px 22px;background:linear-gradient(135deg,#111827 0%,#1f2937 55%,#111827 100%);
  color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.topbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.topbar h1 .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.topbar .sub{font-size:12px;color:#c7cdd8;font-weight:500;margin-top:1px}
.topbar .spacer{flex:1}
.topbar .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:#c7cdd8}
.topbar .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
.btn{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;
  padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center;
  transition:.15s}
.btn:hover{background:rgba(255,255,255,.18)}
.btn:active{transform:translateY(1px)}

/* ---------- controls ---------- */
.controls{position:sticky;top:60px;z-index:30;background:var(--bg);padding:10px 22px 12px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line2)}
.search{position:relative;flex:1;min-width:220px;max-width:340px}
.search input{width:100%;padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:13px;color:var(--txt);outline:none;transition:.15s}
.search input:focus{border-color:var(--brand-blue-light);box-shadow:0 0 0 3px rgba(87,149,202,.15)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
select,.chip-select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;color:var(--txt);font-weight:600;cursor:pointer;outline:none}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;
  user-select:none;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:10px}
.toggle input{accent-color:var(--brand-blue)}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid transparent;
  color:var(--mut);background:transparent;display:flex;align-items:center;gap:7px;transition:.15s}
.tab .n{background:var(--line2);color:var(--mut);border-radius:20px;padding:1px 7px;font-size:11px}
.tab:hover{background:var(--line2)}
.tab.active{background:var(--navy);color:#fff;box-shadow:var(--shadow)}
.tab.active .n{background:rgba(255,255,255,.22);color:#fff}

/* ---------- content ---------- */
main{flex:1;padding:14px 22px 60px}
.section{margin-bottom:22px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);background:var(--card2)}
.section-head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:var(--card);
  border-bottom:1px solid var(--line2)}
.section-head .accent{width:5px;align-self:stretch;border-radius:3px;flex:none}
.section-head h3{margin:0;font-size:14px;font-weight:800;flex:1;display:flex;align-items:center;gap:8px}
.section-head .count{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--line2);padding:2px 9px;border-radius:20px}
.section-head .chev{transition:.2s;opacity:.5}
.section.collapsed .chev{transform:rotate(-90deg)}
.section.collapsed .grid{display:none}
/* auto-fill + a min-width that is the larger of 300px or 1/9th of the row
   width means a 9th column never has room to squeeze in — so at most 8
   indicator cards ever share one line (e.g. 15 cards -> 8 + 7), while still
   wrapping down to fewer columns on narrower viewports. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(300px,calc(100%/9)),1fr));gap:14px;padding:16px}

/* ---------- kpi card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:13px 14px 11px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:.15s;position:relative}
.card:hover{border-color:#d3d8e0}
.card.empty{background:var(--card2);border-style:dashed;border-left-style:dashed;opacity:.55;filter:grayscale(.5)}
.card.empty:hover{border-color:var(--line);opacity:.85;filter:none}
.card-top{display:flex;justify-content:space-between;gap:8px}
.card-title{font-size:12.8px;font-weight:700;line-height:1.3;color:var(--txt);max-width:100%}
.badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;
  white-space:nowrap;flex:none}
.badge.freq{background:transparent;color:var(--mut2);border:1px solid var(--line)}
.subline{font-size:11px;color:var(--mut);font-weight:500}
.tag{font-size:10px;font-weight:700;color:var(--mut);background:var(--line2);padding:2px 7px;border-radius:6px}
.chart-wrap{position:relative;height:150px;width:100%}
.chart-wrap.small{height:96px}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);gap:6px}
.kv{display:flex;gap:10px}
.kv b{color:var(--txt);font-weight:800}
.note-btn{border:none;background:var(--line2);color:var(--mut);width:22px;height:22px;border-radius:7px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.note-btn:hover{background:#dfe4ec}
.empty-msg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut2);font-style:italic;
  background:var(--line2);border-radius:8px;padding:8px 10px}
.progress-line{height:8px;border-radius:5px;background:var(--line2);overflow:hidden;position:relative}
.progress-line .fill{display:block;height:100%;border-radius:5px;transition:width .4s}
.progress-line .target{position:absolute;top:-3px;width:2px;height:15px;background:var(--txt);opacity:.55}
.big-stat{display:flex;align-items:baseline;gap:6px}
.big-stat .num{font-size:22px;font-weight:800}
.big-stat .cmp{font-size:11.5px;color:var(--mut)}
.unit-row{display:flex;align-items:center;gap:8px;font-size:11px}
.unit-row .u{width:64px;flex:none;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-row .track{flex:1;height:7px;border-radius:4px;background:var(--line2);overflow:hidden;position:relative}
.unit-row .fill{display:block;height:100%;border-radius:4px}
.unit-row .val{width:42px;text-align:right;font-weight:700}
.grade-chip{font-size:14px;font-weight:800;padding:3px 12px;border-radius:8px;display:inline-flex}
.pill-status{width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- multi-location panel: one indicator split into per-location boxes ---------- */
.card.panel{grid-column:1 / -1}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:2px}
.unit-box{background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:4px}
.unit-box-label{font-size:10.5px;font-weight:800;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-wrap{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.mini-note{font-size:9.5px;color:var(--warn);margin-top:2px}

/* ---------- status (RAG): only real deviations from target get tinted ---------- */
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.card.status-bad{background:var(--bad-b);border-color:var(--bad-line)}
.card.status-bad:hover{border-color:rgba(211,47,47,.6)}
.card.status-warn{background:var(--warn-b);border-color:var(--warn-line)}
.card.status-empty{opacity:.55;filter:grayscale(.5)}
.card.status-empty:hover{opacity:.85;filter:none}
.unit-box.status-bad{background:var(--bad-b);border-color:var(--bad-line)}
.unit-box.status-warn{background:var(--warn-b);border-color:var(--warn-line)}
.unit-box.status-empty{opacity:.55;filter:grayscale(.5)}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,18,25,.45);backdrop-filter:blur(2px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h4{margin:0 0 8px;font-size:14px}
.modal p{margin:0;font-size:13px;color:var(--mut);line-height:1.5;white-space:pre-wrap}
.modal .close{margin-top:16px;text-align:right}

.empty-state{padding:60px 20px;text-align:center;color:var(--mut)}
.empty-state b{display:block;font-size:15px;color:var(--txt);margin-bottom:6px}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <h1><span class="logo">P</span> Dashboard KPI 2027 <span class="sub" style="font-weight:500;color:#9aa3b2;margin-left:4px">/ PAŻP</span></h1>

    <div class="tabs" id="kpaTabs"></div>
  </section>

  <main id="content"></main>

</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h4 id="modalTitle">Komentarz</h4>
    <p id="modalBody"></p>
    <div class="close"><button class="btn" style="background:#111827;color:#fff" onclick="closeModal()">Zamknij</button></div>
  </div>
</div>

function parseCell(raw){
  if(raw===null||raw===undefined) return {empty:true};
  let s = String(raw).trim();
  if(s==='') return {empty:true};
  if(/^x$/i.test(s)) return {empty:true, na:true};
  const percent = s.includes('%');
  let op = null;
  const opM = s.match(/^(>=|<=|>|<)\s*/);
  if(opM){ op = opM[1]; s = s.slice(opM[1].length).trim(); }

  let m = s.match(/^(-?\d+(?:[.,]\d+)?)\s*%?\s*-\s*(-?\d+(?:[.,]\d+)?)\s*%?$/);

    const lo = parseFloat(m[1].replace(',','.')), hi = parseFloat(m[2].replace(',','.'));

  m = s.match(/^(\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)$/);
  if(m){
    const a=parseFloat(m[1].replace(',','.')), b=parseFloat(m[2].replace(',','.'));
    return {value: b?(a/b*100):null, fraction:[a,b], percent:true, raw:s, empty:false, op};

  m = s.match(/^(-?\d+(?:[.,]\d+)?)\s*x\s*10\s*-?\s*(\d+)$/i);

  // plain number (optionally %)
  m = s.match(/^(-?\d+(?:[.,]\d+)?)\s*%?$/);
  if(m){
    const v = parseFloat(m[1].replace(',','.'));
    return {value:v, percent, raw:s, empty:false, op};
  }
  // qualitative text / grade letter / status word
  return {text:s, qualitative:true, empty:false, op};
}

function colToRecs(data){
  return (data.id||[]).map((id,i)=>{

  });

function fmtNum(v, percent){
  if(v===null||v===undefined||Number.isNaN(v)) return '—';

   New rule set (history-aware, not just a magnitude threshold):
   - 'empty'  → nothing reported yet at all (e.g. annual indicator only settled
     at year-end) → card is greyed out / de-emphasised, no RAG judgement made.
   - 'bad'    → the LATEST reported data point currently breaches the target.
   - 'warn'   → it breached the target at some point earlier this year but the
     latest reported point is back within target (a "used to be a problem" flag).
   - 'good'   → never breached the target (or no target is known to compare
     against, in which case we simply don't accuse it of anything).
   Direction (higher-is-better vs lower-is-better) is inferred from the name,
   and drives what "breach" even means for a given indicator. */
const LOWER_IS_BETTER_KEYWORDS = ['opóźni','wypadk','incydent','niezgod','wyłącz','nadliczbow',
  'absencj','awari','skarg','błęd','reklamacj','ryzyk','brak','naruszen'];
function inferDirection(name){
  const n = (name||'').toLowerCase();
  return LOWER_IS_BETTER_KEYWORDS.some(k=>n.includes(k)) ? 'lower' : 'higher';
}
// The sheet doesn't always fill in the two annual columns consistently. Confirmed
// mapping: "Roczna_wartosc_oczekiwana" is the CEL/target (limit to compare
// against), "Roczna_wartosc_planowana" is the actually reported/expected value.
// When only ONE column is present we can't assume which role it plays, so it's
// shown as the value with no separate target rather than guessing.
function annualValueTarget(u){
  const hasExp = !u.exp.empty && u.exp.value!=null;
  const hasPlan = !u.plan.empty && u.plan.value!=null;
  if(hasExp && hasPlan) return {value:u.plan, target:u.exp};
  if(hasPlan) return {value:u.plan, target:null};
  if(hasExp) return {value:u.exp, target:null};
  return {value:null, target:null};
}
// true when `actual` is on the wrong side of `target` for the given direction
// (small 0.5% tolerance so float/rounding noise doesn't flip the verdict)
function isBreach(actual, target, direction){
  const ratio = (actual - target) / (Math.abs(target) || 1);
  const signed = direction==='lower' ? ratio : -ratio; // >0 means "worse than target"
  return signed > 0.005;
}
function computeStatus(u, direction){
  const uViz = computeUnitViz(u);
  if(uViz==='empty') return 'empty';
  if(uViz==='badge') return 'good'; // qualitative grades aren't judged numerically
  if(uViz==='quarterly'){
    // target: prefer "oczekiwana" (cel), fall back to "planowana" if that's the
    // only column filled in for this row
    const target = (!u.exp.empty && u.exp.value!=null) ? u.exp.value
                 : (!u.plan.empty && u.plan.value!=null) ? u.plan.value : null;
    const reported = u.q.filter(q=>!q.empty && q.value!=null).map(q=>q.value);
    if(reported.length===0) return 'empty';
    if(target==null) return 'good';
    const breaches = reported.map(v=> isBreach(v, target, direction));
    if(breaches[breaches.length-1]) return 'bad';           // currently over the limit
    return breaches.some(Boolean) ? 'warn' : 'good';         // was over it earlier, now clear
  }
  // annual-only indicators (single reported value per year)
  const {value, target} = annualValueTarget(u);
  if(!value || value.value==null) return 'empty';
  if(!target || target.value==null) return 'good';
  return isBreach(value.value, target.value, direction) ? 'bad' : 'good';
}
function worstStatus(statuses){
  const rank = {bad:3, warn:2, good:1, empty:0};
  return statuses.reduce((a,b)=> rank[b]>rank[a] ? b : a, 'empty');
}
const STATUS_LABEL = {bad:'przekracza cel', warn:'przekraczał wcześniej, teraz w celu', good:'w celu', empty:'brak danych'};
function statusDot(status){
  if(!status || status==='empty') return '';
  const color = status==='bad'? 'var(--bad)' : status==='warn'? 'var(--warn)' : 'var(--ok)';
  return `<span class="status-dot" style="background:${color}" title="${STATUS_LABEL[status]}"></span>`;
}

/* ===================== GROUPING ===================== */
// data-entry noise (trailing spaces, "S,03" vs "S.03" typos in Cel_strategiczny)
// must not fracture one indicator into several one-location cards — normalize
// the fields used for matching before grouping.
function normText(s){ return String(s==null? '' : s).trim().replace(/\s+/g,' '); }
function normCel(s){ return normText(s).replace(/,(?=\d)/g, '.'); }
// Some sheet columns mix scales for the *same* metric: the annual target is
// entered as a 0–1 ratio ("0,82") while the quarterly figures are entered as
// bare percentage points ("62", "88", no "%" sign) — comparing them raw would
// make every quarter look like a wild breach of target. This is a narrow,
// name-based fix (utilization/occupancy indicators only) rather than a blind
// numeric guess, so it doesn't touch unrelated counts/minutes-style metrics
// that happen to also have small targets (e.g. delay or incident counts).
function isUtilizationMetric(name){ return /wykorzystani/i.test(name||''); }
function alignUtilizationScale(u){
  [u.plan, u.exp].forEach(cell=>{
    if(!cell.empty && cell.value!=null && cell.value>0 && cell.value<=1.5 && !cell.percent){
      cell.value = cell.value*100; cell.percent = true;
    }
  });
  u.q.forEach(cell=>{
    if(!cell.empty && cell.value!=null){ cell.percent = true; }
  });
}
function buildGroups(records){
  const map = new Map();
  records.forEach(r=>{
    // NOTE: Cel_strategiczny is intentionally NOT part of the key — it's a
    // strategic-goal reference code, not something that should ever differ
    // between locations reporting the same indicator. Rows that only differ
    // by a typo'd/blank Cel_strategiczny must still land in the same card.
    const key = [normText(r.Obszar), normText(r.KPA), normText(r.Mierniki_2026)].join('§');
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  });
  const groups = [];
  map.forEach(rows=>{
    const first = rows[0];
    // prefer the first non-empty Cel_strategiczny in the group for display
    const celRow = rows.find(r=> normCel(r.Cel_strategiczny));
    const units = rows.map(r=>({
      loc: (r.Lokalizacja && String(r.Lokalizacja).trim()) || null,
      plan: parseCell(r.Roczna_wartosc_planowana),
      exp: parseCell(r.Roczna_wartosc_oczekiwana),
      q: [parseCell(r.I_kw_), parseCell(r.II_kw_), parseCell(r.III_kw_), parseCell(r.IV_kw_)],
      comment: r.TSz_Komentarz ? String(r.TSz_Komentarz).trim() : ''
    }));
    if(isUtilizationMetric(first.Mierniki_2026)) units.forEach(alignUtilizationScale);
    const hasQuarterData = units.some(u=>u.q.some(q=>!q.empty && q.value!=null));
    const anyAnnualNumeric = units.some(u=> (!u.exp.empty && u.exp.value!=null) || (!u.plan.empty && u.plan.value!=null));
    const anyQualitative = units.some(u=> (u.exp.qualitative) || (u.exp.range && !u.exp.value) || (u.plan.qualitative));
    const allEmpty = units.every(u=> u.q.every(q=>q.empty) && u.exp.empty && u.plan.empty);

    let vizType;
    if(hasQuarterData) vizType = 'quarterly';
    else if(anyQualitative && !anyAnnualNumeric) vizType = 'badge';
    else if(anyAnnualNumeric) vizType = 'annual';
    else vizType = 'empty';

    const direction = inferDirection(first.Mierniki_2026);
    units.forEach(u=> u.status = computeStatus(u, direction));
    const status = worstStatus(units.map(u=>u.status));

    groups.push({
      key: [normText(first.Obszar), normText(first.KPA), normText(first.Mierniki_2026)].join('§'),
      obszar: normText(first.Obszar) || 'Inne',
      kpa: first.KPA || 'Inne',
      cel: celRow ? normCel(celRow.Cel_strategiczny) : '',
      name: normText(first.Mierniki_2026) || '(brak nazwy)',
      freq: first.czest_ || '',
      units,
      multiUnit: units.length>1,
      vizType, direction, status,
      hasQuarterData, anyAnnualNumeric, allEmpty
    });
  });
  return groups;
}

/* ===================== FILTERING ===================== */
function getFiltered(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const obszar = document.getElementById('obszarFilter').value;
  const freq = document.getElementById('freqFilter').value;
  const onlyMissing = document.getElementById('onlyMissing').checked;
  const onlyProblems = document.getElementById('onlyProblems').checked;
  return GROUPS.filter(g=>{
    if(activeKpa!=='ALL' && g.kpa!==activeKpa) return false;
    if(obszar && g.obszar!==obszar) return false;
    if(freq && g.freq!==freq) return false;
    if(onlyMissing && !(g.allEmpty || (g.vizType==='quarterly' && g.units.some(u=>u.q.some(q=>q.empty))))) return false;
    if(onlyProblems && !(g.status==='bad' || g.status==='warn')) return false;
    if(search){
      const hay = (g.name+' '+g.obszar+' '+g.cel+' '+g.kpa).toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });
}

/* ===================== RENDER: TABS + OBSZAR FILTER OPTIONS ===================== */
function renderTabs(){
  const tabs = document.getElementById('kpaTabs');
  const counts = {ALL: GROUPS.length};
  KPA_ORDER.forEach(k=> counts[k] = GROUPS.filter(g=>g.kpa===k).length);
  const extra = [...new Set(GROUPS.map(g=>g.kpa))].filter(k=>!KPA_ORDER.includes(k));
  const list = [{k:'ALL', label:'Wszystkie'}, ...KPA_ORDER.map(k=>({k,label:kpaMeta(k).label})), ...extra.map(k=>({k,label:k}))];
  tabs.innerHTML = list.map(({k,label})=>`<button class="tab ${k===activeKpa?'active':''}" data-kpa="${k}">${label} <span class="n">${counts[k]||0}</span></button>`).join('');
  tabs.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeKpa = btn.dataset.kpa; renderTabs(); renderContent(); });
  });
}

function populateObszarFilter(){
  const sel = document.getElementById('obszarFilter');
  const cur = sel.value;
  const areas = [...new Set(GROUPS.map(g=>g.obszar))].sort();
  sel.innerHTML = '<option value="">Wszystkie obszary</option>' + areas.map(a=>`<option value="${a}">${a}</option>`).join('');
  sel.value = cur;
}

/* ===================== CARD BUILDERS ===================== */
let cardIdSeq = 0;
function cellText(cell){
  if(cell.empty) return cell.na? 'x' : '—';
  return cell.raw!==undefined? cell.raw : fmtNum(cell.value, cell.percent);
}
function planExpText(u){
  return {plan: cellText(u.plan), exp: cellText(u.exp)};
}

// classify a single unit's own data shape (independent of the rest of the group —
// different locations can have different targets / different reporting states)
function computeUnitViz(u){
  const hasQ = u.q.some(q=>!q.empty && q.value!=null);
  const hasAnnualNum = (!u.plan.empty && u.plan.value!=null) || (!u.exp.empty && u.exp.value!=null);
  const isQual = u.exp.qualitative || u.plan.qualitative || (u.exp.range && u.exp.value==null);
  if(hasQ) return 'quarterly';
  if(isQual && !hasAnnualNum) return 'badge';
  if(hasAnnualNum) return 'annual';
  return 'empty';
}

// bar chart for one location's reporting periods, with THAT location's own annual
// target drawn as a dashed reference line — target is always integrated into the
// same chart. Semi-annual indicators ("pół r.") are reported at half-year
// boundaries, which line up with quarter-ends: H1 is filed together with the
// "II kw." column (end of Q2) and H2 with the "IV kw." column (end of Q4) —
// the "I kw."/"III kw." cells are never used for these, so we pull H1/H2 from
// indices 1 and 3 instead of showing all 4 (mostly-empty) quarterly categories.
// `yScale` (when given) fixes min/max so every location in the same panel shares
// one vertical axis — otherwise Chart.js auto-scales each chart independently and
// bars for very different magnitudes (e.g. small vs. large units) look deceptively
// similar in height.
function renderUnitChart(canvasEl, u, meta, compact, yScale, freq){
  const isHalfYear = freq==='pół r.';
  const labels = isHalfYear ? ['I półr.','II półr.'] : ['I kw.','II kw.','III kw.','IV kw.'];
  const qCells = isHalfYear ? [u.q[1], u.q[3]] : u.q;
  const datasets = [{
    label:'Wartość', data: qCells.map(q=> (q.empty? null : q.value)),
    backgroundColor: statusInk(u.status), borderRadius:4, maxBarThickness: compact?20:28, order:2
  }];
  // target reference: prefer "oczekiwana", fall back to "planowana" when only
  // that column was filled in for this row (data entry isn't always consistent)
  const planVal = (!u.exp.empty && u.exp.value!=null) ? u.exp.value
                 : (!u.plan.empty && u.plan.value!=null) ? u.plan.value : null;
  if(planVal!=null){
    datasets.push({
      type:'line', label:'Cel roczny', data: labels.map(()=>planVal),
      borderColor:BRAND.navy, borderDash:[5,4], pointRadius:0, borderWidth:1.5, order:1, fill:false
    });
  }
  const yAxis = {grid:{color:'#eef1f6'}, ticks:{font:{size:compact?9:10}}, beginAtZero:true};
  if(yScale){ yAxis.min = yScale.min; yAxis.max = yScale.max; }
  charts.push(new Chart(canvasEl,{
    type:'bar',
    data:{labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:(c)=> `${c.dataset.label}: ${c.formattedValue}`}}
      },
      scales:{
        x:{grid:{display:false}, ticks:{font:{size:compact?9:10}}},
        y:yAxis
      },
      animation:{duration:300}
    }
  }));
}
// annual (single-value) indicator drawn the same way as quarterly ones — one
// vertical bar for the reported value, plus a dashed horizontal line for the
// annual target — so every chart on the board reads the same way (no mixed
// horizontal/vertical styles). Same shared-`yScale` rule as renderUnitChart.
function renderUnitAnnualChart(canvasEl, u, meta, compact, yScale){
  const {value, target} = annualValueTarget(u);
  const val = value ? value.value : null;
  const targetVal = target ? target.value : null;
  const percent = (value && value.percent) || (target && target.percent);
  const datasets = [{
    label:'Wartość', data:[val], backgroundColor: statusInk(u.status),
    borderRadius:4, maxBarThickness: compact?36:48, order:2
  }];
  if(targetVal!=null){
    datasets.push({
      type:'line', label:'Cel roczny', data:[targetVal],
      borderColor:BRAND.navy, borderDash:[5,4], pointRadius:0, borderWidth:1.5, order:1, fill:false
    });
  }
  const yAxis = {grid:{color:'#eef1f6'}, ticks:{font:{size:compact?9:10}, callback:(v)=>fmtNum(v,percent)}, beginAtZero:true};
  if(yScale){ yAxis.min = yScale.min; yAxis.max = yScale.max; }
  charts.push(new Chart(canvasEl,{
    type:'bar',
    data:{labels:[''], datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:(c)=> `${c.dataset.label}: ${fmtNum(c.parsed.y, percent)}`}}
      },
      scales:{
        x:{grid:{display:false}, ticks:{display:false}},
        y:yAxis
      },
      animation:{duration:300}
    }
  }));
}

// same "value could be in either column" ambiguity applies to qualitative
// (grade/text) cells too — same mapping as annualValueTarget: oczekiwana=cel.
function qualitativeValueTarget(u){
  const hasExp = !u.exp.empty;
  const hasPlan = !u.plan.empty;
  if(hasExp && hasPlan) return {value:u.plan, target:u.exp};
  if(hasPlan) return {value:u.plan, target:null};
  if(hasExp) return {value:u.exp, target:null};
  return {value:null, target:null};
}
function badgeHtml(u, meta){
  const {value, target} = qualitativeValueTarget(u);
  const html = [`<span class="grade-chip" style="background:${meta.bg};color:${meta.color}">${value? cellText(value):'—'}</span>`];
  if(target) html.push(`<span style="font-size:10.5px;color:var(--mut)">cel: ${cellText(target)}</span>`);
  return html.join('\n    ');
}

// renders the body (chart / badge / empty) for a single location into `container` —
// every numeric case uses a vertical bar chart for consistency. `yScale` (optional)
// forces a shared min/max so all locations of the same indicator are comparable.
function renderUnitBody(container, g, u, meta, compact, yScale){
  const uViz = computeUnitViz(u);
  if(uViz==='quarterly'){
    const wrap = document.createElement('div'); wrap.className = 'chart-wrap' + (compact? ' small':'');
    wrap.innerHTML = '<canvas></canvas>';
    container.appendChild(wrap);
    const canvas = wrap.querySelector('canvas');
    chartQueue.push(()=> renderUnitChart(canvas, u, meta, compact, yScale, g.freq));
  } else if(uViz==='annual'){
    const wrap = document.createElement('div'); wrap.className = 'chart-wrap' + (compact? ' small':'');
    wrap.innerHTML = '<canvas></canvas>';
    container.appendChild(wrap);
    const canvas = wrap.querySelector('canvas');
    chartQueue.push(()=> renderUnitAnnualChart(canvas, u, meta, compact, yScale));
  } else if(uViz==='badge'){
    container.insertAdjacentHTML('beforeend', `<div class="badge-wrap">${badgeHtml(u, meta)}</div>`);
  } else {
    container.insertAdjacentHTML('beforeend', `<div class="empty-msg">⏳ Brak danych</div>`);
  }
}

function buildCard(g){
  return g.multiUnit ? buildPanelCard(g) : buildSingleCard(g);
}

// single location per indicator — one focused chart/bullet with its target built in
function buildSingleCard(g){
  const meta = kpaMeta(g.kpa);
  const uid = 'c'+(cardIdSeq++);
  const u = g.units[0];
  const commentTxt = u.comment || '';
  const card = document.createElement('div');
  card.className = 'card status-'+g.status + (g.vizType==='empty' ? ' empty':'');
  card.style.borderLeftColor = meta.color;

  card.innerHTML = `
    <div class="card-top">
      <div class="card-title">${g.name}</div>
      <span class="badge freq">${statusDot(g.status)}${FREQ_LABEL[g.freq]||g.freq||'—'}</span>
    </div>
    <div class="subline">${[g.cel, u.loc].filter(Boolean).join(' · ')}</div>
    <div class="body-${uid}"></div>
    <div class="card-foot">
      <div></div>
      ${commentTxt? `<button class="note-btn" title="Komentarz" data-comment="${uid}">💬</button>`:''}
    </div>
  `;
  renderUnitBody(card.querySelector(`.body-${uid}`), g, u, meta, false);

  if(commentTxt){
    card.querySelector('[data-comment]').addEventListener('click', ()=> openModal(g.name, commentTxt));
  }
  return card;
}

// A panel splits one indicator across several locations/units — so all of its
// sub-charts must share ONE y-axis (same min/max), otherwise a unit reporting
// e.g. 40h of overtime and one reporting 4000h would draw equally tall bars and
// mislead the reader about relative scale. We scan every numeric value across
// ALL units of the group (quarters + annual plan/expected) and fix a common
// range, with ~10% headroom above the highest bar/target so nothing touches the
// top of the chart.
function computeGroupYScale(g){
  let max = -Infinity, min = 0, any = false;
  g.units.forEach(u=>{
    u.q.forEach(q=>{ if(!q.empty && q.value!=null){ any=true; if(q.value>max) max=q.value; if(q.value<min) min=q.value; } });
    if(!u.plan.empty && u.plan.value!=null){ any=true; if(u.plan.value>max) max=u.plan.value; if(u.plan.value<min) min=u.plan.value; }
    if(!u.exp.empty && u.exp.value!=null){ any=true; if(u.exp.value>max) max=u.exp.value; if(u.exp.value<min) min=u.exp.value; }
  });
  if(!any || max<=0) return null;
  return {min, max: max*1.1};
}

// multiple locations for the same indicator — split into one compact sub-card per
// location (each with its own target), rather than merging into one busy chart.
function buildPanelCard(g){
  const meta = kpaMeta(g.kpa);
  const commentTxt = g.units.map(u=>u.comment).filter(Boolean).join('\n---\n');
  const yScale = computeGroupYScale(g);
  const panel = document.createElement('div');
  panel.className = 'card panel status-'+g.status + (g.vizType==='empty' ? ' empty':'');
  panel.style.borderLeftColor = meta.color;

  panel.innerHTML = `
    <div class="card-top">
      <div class="card-title">${g.name}</div>
      <span class="badge freq">${statusDot(g.status)}${FREQ_LABEL[g.freq]||g.freq||'—'}</span>
    </div>
    <div class="subline">${g.cel||''} ${g.cel? '· ':''}${g.units.length} lokalizacje / jednostki${commentTxt? ' <button class="note-btn" title="Komentarz" data-comment="panel" style="margin-left:6px;vertical-align:middle">💬</button>':''}</div>
    <div class="unit-grid"></div>
  `;
  const grid = panel.querySelector('.unit-grid');
  g.units.forEach(u=>{
    const box = document.createElement('div');
    box.className = 'unit-box status-'+u.status;
    box.innerHTML = `<div class="unit-box-label">${statusDot(u.status)}${u.loc || 'Ogółem'}</div>`;
    renderUnitBody(box, g, u, meta, true, yScale);
    grid.appendChild(box);
  });

  if(commentTxt){
    panel.querySelector('[data-comment]').addEventListener('click', ()=> openModal(g.name, commentTxt));
  }
  return panel;
}

/* ===================== RENDER: SECTIONS / GRID ===================== */
function renderContent(){
  const main = document.getElementById('content');
  main.innerHTML = '';
  charts.forEach(c=>{ try{c.destroy();}catch(e){} });
  charts = [];
  chartQueue = [];

  const list = getFiltered();
  if(!list.length){
    main.innerHTML = `<div class="empty-state"><b>Brak wyników</b>Zmień kryteria filtrowania lub wyszukiwania.</div>`;
    return;
  }
  // group by Obszar within current view, ordered by count desc
  const byObszar = new Map();
  list.forEach(g=>{ if(!byObszar.has(g.obszar)) byObszar.set(g.obszar, []); byObszar.get(g.obszar).push(g); });
  const sections = [...byObszar.entries()].sort((a,b)=> b[1].length - a[1].length);

  sections.forEach(([obszar, groups])=>{
    const kpaSet = new Set(groups.map(g=>g.kpa));
    const primaryMeta = kpaMeta(kpaSet.size===1 ? groups[0].kpa : null);
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `
      <div class="section-head">
        <span class="accent" style="background:${primaryMeta.color}"></span>
        <h3>${obszar} <span class="count">${groups.length}</span></h3>
        <span class="chev">▾</span>
      </div>
      <div class="grid"></div>
    `;
    section.querySelector('.section-head').addEventListener('click', ()=> section.classList.toggle('collapsed'));
    const grid = section.querySelector('.grid');
    groups.forEach(g=> grid.appendChild(buildCard(g)));
    main.appendChild(section);
  });

  // charts are only instantiated once every card/panel is in the DOM and the
  // CSS grid has settled — creating Chart.js instances mid-layout bakes in the
  // wrong canvas width and produces misaligned / overlapping tick labels.
  const queued = chartQueue; chartQueue = [];
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    queued.forEach(fn=>{ try{ fn(); }catch(e){ console.error(e); } });
  }));
}

/* ===================== MODAL ===================== */
function openModal(title, text){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = text;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') closeModal(); });
});

/* ===================== DATA LOADING ===================== */
function setLastUpdate(ok){
  const el = document.getElementById('lastUpdate');
  const t = new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  el.innerHTML = `<span class="dot" style="background:${ok?'#34d399':'#f59e0b'}"></span> ${ok? 'zsynchronizowano':'dane demo'} • ${t}`;
}

function getDemoData(){
  const el = document.getElementById('demo-data');
  return JSON.parse(el.textContent);
}

async function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}

async function loadData(){
  const inGrist = window.grist && window.parent !== window;
  let records;
  if(inGrist){
    try{
      const data = await withTimeout(grist.docApi.fetchTable(TABLE), 6000);
      records = colToRecs(data);
      setLastUpdate(true);
    }catch(e){
      console.warn('Grist fetch failed, using demo data', e);
      records = colToRecs(getDemoData());
      setLastUpdate(false);
    }
  } else {
    records = colToRecs(getDemoData());
    setLastUpdate(false);
  }
  RAW = records;
  GROUPS = buildGroups(records);
}

async function refreshAndRender(){
  await loadData();
  populateObszarFilter();
  renderTabs();
  renderContent();
}

/* ===================== INIT ===================== */
function wireControls(){
  document.getElementById('searchInput').addEventListener('input', renderContent);
  document.getElementById('obszarFilter').addEventListener('change', renderContent);
  document.getElementById('freqFilter').addEventListener('change', renderContent);
  document.getElementById('onlyMissing').addEventListener('change', renderContent);
  document.getElementById('onlyProblems').addEventListener('change', renderContent);
  document.getElementById('refreshBtn').addEventListener('click', refreshAndRender);
}

(async function init(){
  wireControls();
  if(window.grist && window.parent !== window){
    try{ grist.ready({requiredAccess:'read table'}); }catch(e){}
    try{ grist.onRecords(()=> refreshAndRender()); }catch(e){}
  }
  await refreshAndRender();
  setInterval(()=>{ if(!document.hidden) refreshAndRender(); }, 60000);
})();

</script>
