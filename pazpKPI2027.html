<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAŻP — Dashboard KPI 2027</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  /* brand palette (storytelling-with-data: neutral ink everywhere; colour is
     spent only on RAG status — pastel red = currently over the limit, pastel
     yellow = was over the limit earlier this year but is back on track) */
  --navy:#0F304D; --accent:#C4007A;
  --brand-blue:#5795CA; --brand-blue-light:#8BB9D3; --brand-gray:#BEBFBF;
  --bg:#f3f5f9; --card:#ffffff; --card2:#fbfcfe;
  --line:#e3e7ee; --line2:#eef1f6;
  --txt:#1a1e27; --mut:#6b7280; --mut2:#98a2b3;
  /* KPA categories no longer carry distinct colours — a single neutral ink is
     used for all of them so colour is reserved for status only */
  --kpa-ink:#0F304D; --kpa-b:rgba(190,191,191,.28);
  --data:#8BB9D3; /* default neutral bar/data colour when "good"/no target */
  --bad:#E57373; --bad-b:rgba(229,115,115,.16); --bad-line:rgba(211,47,47,.4);
  --warn:#F0C36D; --warn-b:rgba(240,195,109,.22); --warn-line:rgba(191,133,15,.4);
  --ok:#98a2b3; --neutral:#94a3b8;
  --radius:16px; --shadow:0 1px 2px rgba(20,24,34,.04),0 8px 24px -12px rgba(20,24,34,.12);
  --shadow-hover:0 4px 10px rgba(20,24,34,.06),0 16px 36px -14px rgba(20,24,34,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;}
#app{min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#cdd3dd;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#b7bece}

/* ---------- controls ---------- */
.controls{position:sticky;top:0;z-index:30;background:var(--bg);padding:14px 22px 12px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line2)}
.search{position:relative;flex:1;min-width:220px;max-width:340px}
.search input{width:100%;padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:13px;color:var(--txt);outline:none;transition:.15s}
.search input:focus{border-color:var(--brand-blue-light);box-shadow:0 0 0 3px rgba(87,149,202,.15)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
select,.chip-select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;color:var(--txt);font-weight:600;cursor:pointer;outline:none}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;
  user-select:none;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:10px}
.toggle input{accent-color:var(--brand-blue)}
.collapse-all-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0}
.collapse-all-btn:hover{background:var(--line2)}
.collapse-all-btn .chev{transition:.2s;font-size:13px;color:var(--mut)}
.collapse-all-btn.all-collapsed .chev{transform:rotate(-90deg)}

/* ---------- content ---------- */
main{flex:1;padding:14px 22px 60px}
.section{margin-bottom:22px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);background:var(--card2)}
.section-head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:var(--card);
  border-bottom:1px solid var(--line2)}
.section-head .accent{width:5px;align-self:stretch;border-radius:3px;flex:none}
.section-head h3{margin:0;font-size:14px;font-weight:800;flex:1;display:flex;align-items:center;gap:8px}
.section-head .count{font-size:11.5px;font-weight:700;color:var(--mut);background:var(--line2);padding:2px 9px;border-radius:20px}
.section-head .chev{transition:.2s;opacity:.5}
.section.collapsed .chev{transform:rotate(-90deg)}
.section.collapsed .grid{display:none}
/* auto-fill + a min-width that is the larger of 300px or 1/9th of the row
   width means a 9th column never has room to squeeze in — so at most 8
   indicator cards ever share one line (e.g. 15 cards -> 8 + 7), while still
   wrapping down to fewer columns on narrower viewports. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(300px,calc(100%/9)),1fr));gap:14px;padding:16px}
/* investment rows (KP-INWEST): each spans the full grid width on its own
   line and lays its own cards out with a fixed column count, so the "big"
   (PAŻP/MA/OZ) trio and the "small" (rest) group never wrap into each
   other's row regardless of how many other cards are in the section. */
.invest-row{grid-column:1 / -1;display:grid;gap:14px;min-width:0}
.invest-row-big{grid-template-columns:repeat(3,1fr)}
.invest-row-small{grid-template-columns:repeat(6,1fr)}
@media (max-width:1100px){.invest-row-small{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.invest-row-big,.invest-row-small,.invest-row-3{grid-template-columns:repeat(1,1fr)}}
/* generic "own full-width row" for any other group of cards that should never
   wrap alongside the rest of a section's cards — same mechanism as the
   investment rows above, just a plain 3-column layout. */
.invest-row-3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.invest-row-3{grid-template-columns:repeat(1,1fr)}}
/* KP-AIM: 12 near-identical metrics split into 4 fixed rows (2/4/3/3) instead
   of the default auto-fill wrap, per requested layout: Terminowość/Jakość
   publikacji pair on top, the 4 "danych" metrics, then NOTAM trio, then PIB
   trio. Cards keep the SAME width as the normal section grid (not stretched
   to fill the row) — `auto-fill` (not auto-fit/1fr-only) generates extra
   empty tracks beyond however many cards are actually in that particular
   row, so a 2- or 3-card row just leaves blank space on the right instead of
   each card growing wider, left-aligned like every other section.*/
.invest-row-aim{grid-template-columns:repeat(auto-fill,minmax(max(300px,calc(100%/9)),1fr))}
/* "Skuteczność szkolenia podstawowego" (1 chart) + "...w zakresie uprawnienia"
   (4-location panel) + the merged simulator-availability panel (3 locations)
   all read as one connected row — columns sized 1/4/3 so each individual
   chart stays roughly the same width whichever panel it belongs to, instead
   of the single-chart card claiming as much width as a whole 4- or 3-chart
   panel. */
.invest-row-ospa{grid-template-columns:minmax(210px,1fr) minmax(420px,4fr) minmax(320px,3fr)}
.invest-row-ospa .card.panel{grid-column:auto}
/* "w jednostce" panel (3 locations) + its two close relatives (single-intake
   variant + "uzupełniające" refresher, 1 chart each) — same idea as the OSPA
   row above, columns sized 3/1/1. */
.invest-row-jednostka{grid-template-columns:minmax(320px,3fr) minmax(210px,1fr) minmax(210px,1fr)}
.invest-row-jednostka .card.panel{grid-column:auto}
@media (max-width:900px){.invest-row-ospa{grid-template-columns:repeat(1,1fr)}}
@media (max-width:900px){.invest-row-jednostka{grid-template-columns:repeat(1,1fr)}}
/* a panel's per-location box has its OWN bottom padding around the mini
   chart, on top of the outer card's bottom padding — so once the row's
   bottom-alignment rule (.card-top ~ *:last-child{margin-top:auto}, below)
   flushes the box against the card's bottom edge, the chart itself still
   sits noticeably higher than a plain single-metric card's chart in the same
   row (which only has ONE layer of bottom padding). Drop the box's own
   bottom padding here so both card types end up with exactly one bottom
   padding layer below the chart. */
.invest-row-ospa .card.panel .unit-box,.invest-row-jednostka .card.panel .unit-box{padding-bottom:0}

/* ---------- kpi card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:13px 14px 11px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:.15s;position:relative;min-width:0}
.card:hover{border-color:#d3d8e0}
.card.empty{background:var(--card2);border-style:dashed;border-left-style:dashed;opacity:.55;filter:grayscale(.5)}
.card.empty:hover{border-color:var(--line);opacity:.85;filter:none}
/* the small-scale investment row (Biura other than PAŻP/MA/OZ) gets a
   visually lighter/more compact card so its much smaller budget scale
   reads as "smaller" at a glance, not just a narrower column. */
.card-compact{padding:9px 10px 8px;gap:5px}
.card-compact .card-title{font-size:11px}
.card-top{display:flex;justify-content:space-between;gap:8px}
/* GLOBAL: whichever card sits in the same CSS-grid row as others (the grid
   stretches every card to match the tallest one in that row) should have its
   actual chart bottom-aligned rather than top-aligned — otherwise a card
   with a longer, more-wrapped title pushes its whole chart down while a
   shorter-titled neighbour's chart stays higher, so the same 0%/100% axis
   lines never line up horizontally. Bottom-anchoring whatever comes after
   the title (subline+chart, or the unit-grid in a panel) fixes this for any
   row of cards, not just one specific section. */
.card-top ~ *:last-child{margin-top:auto}
.unit-box-label ~ *:last-child{margin-top:auto}
.card-title{font-size:12.8px;font-weight:700;line-height:1.3;color:var(--txt);max-width:100%}
/* only the investment rows mix cards with visibly different title lengths
   side by side in the same row — reserve 2-line title height there so a
   longer office name doesn't push just that one card's chart lower than its
   row-mates. Everywhere else (most titles are one line) this would just
   leave an ugly gap above the chart, so it's scoped, not global. */
.invest-row-big .card-title,.invest-row-small .card-title{min-height:2.6em}
.freq-dots{display:flex;align-items:center;gap:4px;flex:none}
.freq-dots .dot{width:6px;height:6px;border-radius:50%;border:1.4px solid var(--mut2);background:transparent}
.freq-dots .dot.on{background:var(--mut2);border-color:var(--mut2)}
.subline{font-size:11px;color:var(--mut);font-weight:500}
.tag{font-size:10px;font-weight:700;color:var(--mut);background:var(--line2);padding:2px 7px;border-radius:6px}
.chart-wrap{position:relative;height:150px;width:100%;min-width:0}
.chart-wrap.small{height:96px}
.chart-wrap canvas{display:block;width:100%!important;height:100%!important;max-width:100%}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);gap:6px}
.kv{display:flex;gap:10px}
.kv b{color:var(--txt);font-weight:800}
.progress-line{height:8px;border-radius:5px;background:var(--line2);overflow:hidden;position:relative}
.progress-line .fill{display:block;height:100%;border-radius:5px;transition:width .4s}
.progress-line .target{position:absolute;top:-3px;width:2px;height:15px;background:var(--txt);opacity:.55}
.big-stat{display:flex;align-items:baseline;gap:6px}
.big-stat .num{font-size:22px;font-weight:800}
.big-stat .cmp{font-size:11.5px;color:var(--mut)}
.unit-row{display:flex;align-items:center;gap:8px;font-size:11px}
.unit-row .u{width:64px;flex:none;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-row .track{flex:1;height:7px;border-radius:4px;background:var(--line2);overflow:hidden;position:relative}
.unit-row .fill{display:block;height:100%;border-radius:4px}
.unit-row .val{width:42px;text-align:right;font-weight:700}
.grade-chip{font-size:14px;font-weight:800;padding:3px 12px;border-radius:8px;display:inline-flex}
.pill-status{width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- multi-location panel: one indicator split into per-location boxes ---------- */
.card.panel{grid-column:1 / -1}
.unit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:2px}
@media (max-width:900px){.unit-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.unit-grid{grid-template-columns:repeat(2,1fr)}}
.unit-box{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.unit-box-label{font-size:12px;font-weight:800;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-wrap{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.mini-note{font-size:9.5px;color:var(--warn);margin-top:2px}

/* ---------- status (RAG): only real deviations from target get tinted ---------- */
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.card.status-bad{background:var(--bad-b);border-color:var(--bad-line)}
.card.status-bad:hover{border-color:rgba(211,47,47,.6)}
.card.status-empty{opacity:.55;filter:grayscale(.5)}
.card.status-empty:hover{opacity:.85;filter:none}
.unit-box.status-bad{background:var(--bad-b);border-color:var(--bad-line)}
.unit-box.status-empty{opacity:.55;filter:grayscale(.5)}

.empty-state{padding:60px 20px;text-align:center;color:var(--mut)}
.empty-state b{display:block;font-size:15px;color:var(--txt);margin-bottom:6px}
</style>
</head>
<body>
<div id="app">

  <section class="controls">
    <button class="collapse-all-btn" id="toggleAllBtn" type="button" title="Zwiń/rozwiń wszystkie obszary"><span class="chev">▾</span></button>
    <select id="obszarFilter"><option value="">Wszystkie obszary</option></select>
    <select id="celFilter"><option value="">Wszystkie cele</option></select>
    <select id="kpaFilter"><option value="">Wszystkie KPA</option></select>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="#666" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" placeholder="Szukaj miernika, obszaru, celu…"/>
    </div>
    <select id="dataFilter">
      <option value="">Wszystkie</option>
      <option value="nonempty">Niepuste</option>
      <option value="empty">Puste</option>
    </select>
    <label class="toggle"><input type="checkbox" id="onlyProblems"/> <span style="color:#dc2626">●</span> tylko poza celem</label>
  </section>

  <main id="content"></main>

</div>


<script>
/* ===================== CONFIG ===================== */
const TABLE = 'KPI_PANSA_2026';
const COLS = ['Obszar','Cel_strategiczny','KPA','Mierniki_2026','Lokalizacja','czest_',
  'Roczna_wartosc_planowana','Roczna_wartosc_oczekiwana','I_kw_','II_kw_','III_kw_','IV_kw_','TSz_Komentarz'];

const KPA_META = {
  'Safety':          {color:'#0F304D', bg:'rgba(190,191,191,.28)',  label:'Bezpieczeństwo'},
  'Capacity':        {color:'#0F304D', bg:'rgba(190,191,191,.28)', label:'Przepustowość'},
  'Cost-Efficiency': {color:'#0F304D', bg:'rgba(190,191,191,.28)', label:'Efektywność kosztowa'},
  'Environment':     {color:'#0F304D', bg:'rgba(190,191,191,.28)', label:'Środowisko'},
};
const KPA_ORDER = ['Safety','Capacity','Cost-Efficiency','Environment'];
function kpaMeta(k){ return KPA_META[k] || {color:'#0F304D', bg:'rgba(190,191,191,.28)', label:k||'Inne'}; }

const FREQ_LABEL = {'kw.':'kwartalnie','pół r.':'półrocznie','r.':'rocznie','mies.':'miesięcznie','n.ż.':'nie dotyczy','':'—'};
// Instead of a text pill, cadence is shown as 4 dots representing the year's
// reporting checkpoints (quarters) — filled where that frequency actually
// files a number: quarterly reports every checkpoint, half-yearly only at
// Q2/Q4, annual only at Q4. Falls back to all-empty for unknown/n.a. cadence.
const FREQ_DOTS = {
  'kw.':    [1,1,1,1],
  'mies.':  [1,1,1,1],
  'pół r.': [0,1,0,1],
  'r.':     [0,0,0,1],
  'n.ż.':   [0,0,0,0],
  '':       [0,0,0,0],
};
function freqDotsHtml(freq){
  const pattern = FREQ_DOTS[freq] || [0,0,0,0];
  const label = FREQ_LABEL[freq] || freq || '—';
  const dots = pattern.map(on=> `<span class="dot${on? ' on':''}"></span>`).join('');
  return `<span class="freq-dots" title="${label}">${dots}</span>`;
}

// brand palette used for data ink — colour is reserved for status; everything
// "on target" stays a quiet neutral pastel (storytelling-with-data approach).
// bad = pastel red (currently breaching target), warn = pastel yellow (breached
// earlier this year, back in range now), good/empty = neutral brand blue-gray.
const BRAND = {navy:'#0F304D', accent:'#C4007A', blue:'#5795CA', blueLight:'#8BB9D3', gray:'#BEBFBF'};
const STATUS_COLOR = {bad:'#E57373', warn:'#F0C36D', good: BRAND.blueLight, empty: BRAND.gray};
function statusInk(status){ return STATUS_COLOR[status] || STATUS_COLOR.good; }

/* ===================== STATE ===================== */
let RAW = [];          // flat records straight from grist/demo
let GROUPS = [];        // one entry per indicator (grouped across Lokalizacja)
let OBSZAR_ORDER = [];   // fixed section order, recomputed only when GROUPS reloads — see computeObszarOrder
let charts = [];         // chart.js instances currently on screen, so we can destroy on re-render
let chartQueue = [];     // chart-creation callbacks, run only after the DOM grid has settled
                          // (creating Chart.js instances while CSS grid columns are still being
                          // added/resized bakes in wrong tick-label geometry — see mountCharts())
let collapsedObszars = new Set(); // obszar names currently collapsed — persisted to localStorage
                                    // so a page refresh doesn't re-expand every section

/* ===================== UI STATE PERSISTENCE ===================== */
// remembers filter selections + which obszar sections are collapsed across
// page refreshes (grist widget iframes get fully reloaded on every Grist
// panel refresh — without this, every filter/collapse choice reset back to
// defaults each time).
const UI_STATE_KEY = 'pazpKPI2027.uiState.v1';
function loadUiState(){
  try{ const raw = localStorage.getItem(UI_STATE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveUiState(){
  try{
    localStorage.setItem(UI_STATE_KEY, JSON.stringify({
      obszar: document.getElementById('obszarFilter').value,
      cel: document.getElementById('celFilter').value,
      kpa: document.getElementById('kpaFilter').value,
      search: document.getElementById('searchInput').value,
      dataFilter: document.getElementById('dataFilter').value,
      onlyProblems: document.getElementById('onlyProblems').checked,
      collapsed: [...collapsedObszars]
    }));
  }catch(e){ /* localStorage unavailable (private mode, etc.) — ignore */ }
}
// applied once, right after the very first data load (once the filter
// <select> options actually exist to restore a value into) — later
// onRecords-triggered reloads must NOT re-apply this, or a live in-session
// filter change would keep getting reset back to whatever was saved earlier.
let uiStateApplied = false;
function applyUiState(){
  const s = loadUiState();
  if(!s) return;
  const setIfPresent = (id, val)=>{
    if(val==null) return;
    const el = document.getElementById(id);
    if([...el.options].some(o=>o.value===val)) el.value = val;
  };
  setIfPresent('obszarFilter', s.obszar);
  setIfPresent('celFilter', s.cel);
  setIfPresent('kpaFilter', s.kpa);
  if(s.search) document.getElementById('searchInput').value = s.search;
  if(s.dataFilter!=null) setIfPresent('dataFilter', s.dataFilter);
  if(s.onlyProblems!=null) document.getElementById('onlyProblems').checked = s.onlyProblems;
  collapsedObszars = new Set(s.collapsed || []);
}

/* ===================== PARSING HELPERS ===================== */
function parseCell(raw){
  if(raw===null||raw===undefined) return {empty:true};
  let s = String(raw).trim();
  if(s==='') return {empty:true};
  if(/^x$/i.test(s)) return {empty:true, na:true};
  // currency amounts (e.g. "425 073 998,00 zł") — strip the "zł" suffix and
  // the thousands-separator spaces (incl. non-breaking spaces from Excel)
  // between digit groups so the numeric regexes below still match; without
  // this, every investment plan/expected value would fall through to the
  // "qualitative text" branch and be treated as an unparseable string.
  s = s.replace(/\u00a0/g, ' ').replace(/\s*zł\.?\s*$/i, '').replace(/(\d)\s+(?=\d)/g, '$1').trim();
  const percent = s.includes('%');
  let op = null;
  const opM = s.match(/^(>=|<=|>|<)\s*/);
  if(opM){ op = opM[1]; s = s.slice(opM[1].length).trim(); }

  // range "70%-80%" / "70-80%"
  let m = s.match(/^(-?\d+(?:[.,]\d+)?)\s*%?\s*-\s*(-?\d+(?:[.,]\d+)?)\s*%?$/);
  if(m){
    const lo = parseFloat(m[1].replace(',','.')), hi = parseFloat(m[2].replace(',','.'));
    return {range:[lo,hi], value:(lo+hi)/2, percent, raw:s, empty:false, op};
  }
  // fraction "7/9"
  m = s.match(/^(\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)$/);
  if(m){
    const a=parseFloat(m[1].replace(',','.')), b=parseFloat(m[2].replace(',','.'));
    return {value: b?(a/b*100):null, fraction:[a,b], percent:true, raw:s, empty:false, op};
  }
  // scientific-ish "<1,0 x 10-5"
  m = s.match(/^(-?\d+(?:[.,]\d+)?)\s*x\s*10\s*-?\s*(\d+)$/i);
  if(m){
    const base=parseFloat(m[1].replace(',','.')), exp=parseFloat(m[2]);
    return {value: base*Math.pow(10,-Math.abs(exp)), sci:true, raw:s, empty:false, op};
  }
  // plain number (optionally %)
  m = s.match(/^(-?\d+(?:[.,]\d+)?)\s*%?$/);
  if(m){
    const v = parseFloat(m[1].replace(',','.'));
    return {value:v, percent, raw:s, empty:false, op};
  }
  // qualitative text / grade letter / status word
  return {text:s, qualitative:true, empty:false, op, raw:s};
}

function colToRecs(data){
  return (data.id||[]).map((id,i)=>{
    const r = {id};
    for(const c of Object.keys(data)) if(c!=='id') r[c]=data[c][i];
    return r;
  });
}

function fmtNum(v, percent, millions){
  if(v===null||v===undefined||Number.isNaN(v)) return '—';
  if(millions){
    const scaled = Math.round((v/1e6)*10)/10;
    return scaled.toString().replace('.', ',') + ' mln';
  }
  const rounded = Math.abs(v)>=100 ? Math.round(v*10)/10 : Math.round(v*100)/100;
  // European-style thousands grouping with spaces (e.g. 120000 -> "120 000")
  // for large plain-number axes (traffic counts, headcounts, etc.) — percent
  // values never need it (always <=100) and millions-scaled ones already get
  // their own compact "mln" formatting above.
  const [intPart, decPart] = rounded.toString().split('.');
  const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const withDec = decPart ? grouped + ',' + decPart : grouped;
  return withDec + (percent? '%':'');
}
// Full-precision value (e.g. "118 995 428,60 zł") for tooltips on millions-scaled
// investment charts — the axis/bar labels stay compact ("119,0 mln") but on
// hover the user should be able to see the exact reported amount.
function fmtDetailed(v){
  if(v===null||v===undefined||Number.isNaN(v)) return '—';
  const fixed = v.toFixed(2);
  const [intPart, decPart] = fixed.split('.');
  const withThousands = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return withThousands + ',' + decPart + ' zł';
}
// Some targets are written as a threshold, not a plain number ("<3", ">=99%")
// — the tooltip should echo that operator (e.g. "Cel roczny: <3") instead of
// silently dropping it and showing just the bare number, which reads as an
// exact target rather than a ceiling/floor.
function fmtTooltipValue(c, percent, millions){
  const op = c.dataset.targetOp || '';
  const num = fmtNum(c.parsed.y, percent, millions);
  const detail = millions ? ` (${fmtDetailed(c.parsed.y)})` : '';
  return `${c.dataset.label}: ${op}${num}${detail}`;
}

/* ===================== STATUS (RAG) =====================
   Simplified rule set — only two live judgements plus "no data":
   - 'empty'  → nothing reported yet at all (e.g. annual indicator only settled
     at year-end) → card is greyed out / de-emphasised, no RAG judgement made.
   - 'bad'    → the LATEST reported data point currently breaches the target.
   - 'good'   → the latest data point is within target (an earlier breach, if
     any, is still visible as a red bar for that specific quarter — see
     renderUnitChart — but no longer promotes the whole card/box to a warning
     colour; there is no intermediate "warn" state).
   Direction (higher-is-better vs lower-is-better) is inferred from the name,
   and drives what "breach" even means for a given indicator. */
const LOWER_IS_BETTER_KEYWORDS = ['opóźni','wypadk','incydent','niezgod','wyłącz','nadliczbow',
  'absencj','awari','skarg','błęd','reklamacj','ryzyk','brak','naruszen','wtargnię','przerwan'];
// "Wykorzystanie ATCO na stanowiskach operacyjnych" is a ceiling target (max
// ~82%) — going above it is the problem (overworked controllers), so it needs
// the "lower is better" reading even though its name doesn't match any of the
// generic keywords above (and unlike the "Efektywność wykorzystania struktur
// ..." metrics, where higher is genuinely better, so this is name-specific,
// not a blanket "wykorzystanie" rule).
function inferDirection(name){
  const n = (name||'').toLowerCase();
  if(/wykorzystanie atco/.test(n)) return 'lower';
  if(/dyżurów nieoperacyjnych/.test(n)) return 'lower'; // below target = fewer non-operational duties = good
  if(/dyżurów operacyjnych/.test(n)) return 'lower'; // above target = too many operational duties = bad
  return LOWER_IS_BETTER_KEYWORDS.some(k=>n.includes(k)) ? 'lower' : 'higher';
}
// Some indicators don't have a well-established "good direction" (or we simply
// don't yet know it) — for those we never want a red/green verdict, only a
// neutral bar. "Zatrudnienie w organie"/"...ATC" now DO get judged (below
// target = understaffed = red, on request) — only the SID/STAR route-length
// metrics (unclear which side of the target is favourable), and "Wykonanie
// budżetu szkoleń" (below the 95% plan mid-year is just normal spending pace,
// not a problem — no red/green verdict makes sense here), stay neutral.
const NEUTRAL_METRIC_PATTERNS = [/wydłużenie tras (sid|star)/i, /wykonanie budżetu/i];
function isNeutralMetric(name){
  // KP-INWEST investment-realization metrics are informational (spend vs.
  // budget over the year) — there's no "good/bad" breach direction to judge
  // mid-year, so they're never colored red/blue.
  return NEUTRAL_METRIC_PATTERNS.some(re=> re.test(name||'')) || isInvestmentMetric(name);
}
// The sheet doesn't always fill in the two annual columns consistently. Confirmed
// mapping: "Roczna_wartosc_oczekiwana" is the CEL/target (limit to compare
// against), "Roczna_wartosc_planowana" is the actually reported/expected value.
// When only ONE column is present we can't assume which role it plays, so it's
// shown as the value with no separate target rather than guessing.
function annualValueTarget(u){
  const hasExp = !u.exp.empty && u.exp.value!=null;
  const hasPlan = !u.plan.empty && u.plan.value!=null;
  if(hasExp && hasPlan){
    // a "70%-80%" (or any other) range repeated IDENTICALLY in both columns
    // is just the target written twice, never an actually achieved figure —
    // same idea as the lone-"oczekiwana" case below, just for ranges instead
    // of plain numbers. Without this, the range's own midpoint would get
    // drawn as a fake "achieved" bar sitting exactly inside its own target band.
    if(u.plan.range && u.exp.range && u.plan.range[0]===u.exp.range[0] && u.plan.range[1]===u.exp.range[1]){
      return {value:null, target:u.exp};
    }
    return {value:u.plan, target:u.exp};
  }
  if(hasPlan) return {value:u.plan, target:null};
  if(hasExp){
    // "Roczna_wartosc_planowana" explicitly marked "x" means nothing was ever
    // planned/reported for this row — the lone number in "oczekiwana" is only
    // the target/cel, not an achieved result, so it must not be shown as if
    // it were one (see KP-AIM "...w PIB" rows: target ">=99%", zero data).
    if(u.plan.na) return {value:null, target:u.exp};
    return {value:u.exp, target:null};
  }
  return {value:null, target:null};
}
// true when `actual` is on the wrong side of `target` for the given direction
// (tiny epsilon only to absorb float/rounding noise, e.g. 69.9999999999 vs 70
// after the *100 percent scaling — a real shortfall like 69.67% vs a 70%
// target must still count as a breach, so this is NOT a "close enough" band)
function isBreach(actual, target, direction){
  const ratio = (actual - target) / (Math.abs(target) || 1);
  const signed = direction==='lower' ? ratio : -ratio; // >0 means "worse than target"
  return signed > 1e-6;
}
// target as a "70%-80%" style range means BOTH ends matter — the reported
// value must fall inside the band, so out-of-range in either direction (too
// low OR too high) counts as a breach, unlike a plain single-number target.
function isOutOfRange(actual, range){
  const [lo, hi] = range;
  return actual < lo - 1e-6 || actual > hi + 1e-6;
}
// A target written as "<3" or ">=99%" already states its own direction
// explicitly, per unit — this must win over the group-level inferDirection()
// guess whenever present, since a single indicator group can mix opposite-
// direction units (e.g. "Monitorowanie kowenantów": dług netto/EBITDA "<3" is
// a ceiling, but DSCR ">1,2" in the very same group is a floor).
function directionFromOp(op){
  if(op==='<' || op==='<=') return 'lower';
  if(op==='>' || op==='>=') return 'higher';
  return null;
}
// Compares two parsed cells for equality — used to detect "planowana"/
// "oczekiwana" columns that just repeat the same target twice (qualitative
// grades compare by text, numeric cells by value).
function cellsMatch(a,b){
  return (a.qualitative||b.qualitative)
    ? String(a.text||a.raw).trim().toLowerCase() === String(b.text||b.raw).trim().toLowerCase()
    : a.value === b.value;
}
// pick the target cell to judge/chart against: "oczekiwana" wins, "planowana"
// is the fallback when only that column was filled in for this row. Returns
// the whole parsed cell (not just .value) so callers can also read .range
// for band-style targets like "70%-80%" instead of only the averaged midpoint.
function pickTargetCell(u){
  if(!u.exp.empty && u.exp.value!=null) return u.exp;
  if(!u.plan.empty && u.plan.value!=null) return u.plan;
  return null;
}
function computeStatus(u, direction, neutral){
  const uViz = computeUnitViz(u);
  if(uViz==='empty') return 'empty';
  if(neutral) return 'good'; // direction/good-side unknown or not meaningful — never flag red/green
  if(uViz==='badge'){
    // qualitative grades aren't judged red/bad (no numeric direction), but a
    // target-only row (no reported grade yet) should still read as "empty"
    // (grey) just like every other not-yet-measured annual indicator.
    const {value} = qualitativeValueTarget(u);
    return value ? 'good' : 'empty';
  }
  if(uViz==='quarterly'){
    // target: prefer "oczekiwana" (cel), fall back to "planowana" if that's the
    // only column filled in for this row
    const targetCell = pickTargetCell(u);
    const target = targetCell ? targetCell.value : null;
    const reported = u.q.filter(q=>!q.empty && q.value!=null).map(q=>q.value);
    if(reported.length===0) return 'empty';
    if(target==null) return 'good';
    const latest = reported[reported.length-1];
    if(targetCell.range) return isOutOfRange(latest, targetCell.range) ? 'bad' : 'good';
    return isBreach(latest, target, directionFromOp(targetCell.op) || direction) ? 'bad' : 'good'; // only the latest point matters
  }
  // annual-only indicators (single reported value per year)
  const {value, target} = annualValueTarget(u);
  if(!value || value.value==null) return 'empty';
  if(!target || target.value==null) return 'good';
  if(target.range) return isOutOfRange(value.value, target.range) ? 'bad' : 'good';
  return isBreach(value.value, target.value, directionFromOp(target.op) || direction) ? 'bad' : 'good';
}
function worstStatus(statuses){
  const rank = {bad:2, good:1, empty:0};
  return statuses.reduce((a,b)=> rank[b]>rank[a] ? b : a, 'empty');
}
// Card-level status only ever judges the LATEST data point (see comment
// above) — but the "poza celem" filter needs to also catch indicators that
// breached target earlier this year even if the most recent quarter is back
// on track (pastel-yellow bars), so this walks every reported point instead
// of just the last one.
function computeEverBad(u, direction, neutral){
  const uViz = computeUnitViz(u);
  if(neutral || uViz==='empty' || uViz==='badge') return false;
  if(uViz==='quarterly'){
    const targetCell = pickTargetCell(u);
    if(!targetCell || targetCell.value==null) return false;
    const dir = directionFromOp(targetCell.op) || direction;
    return u.q.some(q=>{
      if(q.empty || q.value==null) return false;
      return targetCell.range ? isOutOfRange(q.value, targetCell.range) : isBreach(q.value, targetCell.value, dir);
    });
  }
  // annual indicators only ever have one reported point, so "ever bad" is
  // identical to the current status.
  const {value, target} = annualValueTarget(u);
  if(!value || value.value==null || !target || target.value==null) return false;
  const dir = directionFromOp(target.op) || direction;
  return target.range ? isOutOfRange(value.value, target.range) : isBreach(value.value, target.value, dir);
}
const STATUS_LABEL = {bad:'przekracza cel', good:'w celu', empty:'brak danych'};
function statusDot(status){
  if(!status || status==='empty') return '';
  const color = status==='bad'? 'var(--bad)' : 'var(--ok)';
  return `<span class="status-dot" style="background:${color}" title="${STATUS_LABEL[status]}"></span>`;
}

/* ===================== GROUPING ===================== */
// data-entry noise (trailing spaces, "S,03" vs "S.03" typos in Cel_strategiczny)
// must not fracture one indicator into several one-location cards — normalize
// the fields used for matching before grouping.
function normText(s){ return String(s==null? '' : s).trim().replace(/\s+/g,' '); }
function normCel(s){ return normText(s).replace(/,(?=\d)/g, '.'); }
// diacritics-insensitive comparison key for hardcoded metric-name matches
// below (e.g. "Wydajność"/"Obciążenie") — the sheet/Grist source spelling of
// Polish special characters (ą/ć/ę/ł/ń/ó/ś/ż/ź) isn't always 100% consistent
// with what got typed into these overrides, so matching drops accents on
// both sides instead of requiring an exact byte-for-byte string match.
function normKey(s){ return normText(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l'); }
// even looser than normKey: also strips ALL punctuation/spacing, so minor
// source-data drift (extra space after a comma, "IT(x)" vs "IT (x)", a
// missing/extra hyphen) can't silently break a hardcoded metric-name match —
// use for names with heavy punctuation (parentheses/commas), otherwise
// normKey is preferred (keeps word boundaries, safer against accidental
// collisions between two different short names).
function looseKey(s){ return normKey(s).replace(/[^a-z0-9]+/g,''); }
// Some sheet columns mix scales for the *same* metric: the annual target is
// entered as a 0–1 ratio ("0,82") while the quarterly figures are entered as
// bare percentage points ("62", "88", no "%" sign) — comparing them raw would
// make every quarter look like a wild breach of target. This is a narrow,
// name-based fix (utilization/occupancy indicators only) rather than a blind
// numeric guess, so it doesn't touch unrelated counts/minutes-style metrics
// that happen to also have small targets (e.g. delay or incident counts).
function isUtilizationMetric(name){ return /wykorzystani/i.test(name||''); }
// "Absencja ATCO" and "Liczba dyżurów (nie)operacyjnych ATCO" (KP-RAD/KP-TWR)
// are likewise reported as bare 0-1 fractions (target "0.2" etc.) even though
// they're conceptually rates in %.
function isAbsenceMetric(name){ return /absencj|dyżur/i.test(name||''); }
// KP-AMC reports all of its "Efektywność"/"Dostępność ... struktur" indicators
// as bare 0–1 fractions with no "%" anywhere on the row (plan/exp are both "x"),
// so there's no per-name hint like the utilization case — the whole obszar
// uses this convention, so it's keyed on Obszar instead of the metric name.
// KP-AIM's data-quality family (Jakość/Kompletność/Terminowość/Format danych)
// has the same issue for a subset of its rows: the target is sometimes a bare
// "1" (not "1%"), which `alignPercentScale` below can't recognise as a percent
// hint on its own, so those rows (e.g. "Jakość danych" exp=1, quarter=0.99)
// never got rescaled and their axis topped out around "2" instead of "100%".
function isFractionPercentMetric(name, obszar){
  return isUtilizationMetric(name) || isAbsenceMetric(name) || obszar==='KP-AMC' || obszar==='KP-AIM';
}
function alignUtilizationScale(u){
  [u.plan, u.exp].forEach(cell=>{
    if(!cell.empty && cell.value!=null && cell.value>0 && cell.value<=1.5 && !cell.percent){
      cell.value = cell.value*100; cell.percent = true;
    }
  });
  u.q.forEach(cell=>{
    // bug fix: this used to only flag the cell as `percent` without actually
    // rescaling the number, so a reported "0.62" stayed 0.62 instead of
    // becoming 62 — it rendered as "0.62%" sitting essentially at zero next
    // to an already-rescaled ~82% target line.
    if(!cell.empty && cell.value!=null && cell.value>0 && cell.value<=1.5 && !cell.percent){
      cell.value = cell.value*100;
    }
    if(!cell.empty && cell.value!=null){ cell.percent = true; }
  });
}
// General companion fix: several indicators write the target as an explicit
// percentage (">=95%", "100%"...) but report the actual quarterly/annual
// figures as bare 0–1 fractions with no "%" ("1", "0.99") — e.g. "Czas
// publikacji NOTAM" target ">=95%" vs. quarters "1"/"1", which means 100%,
// not 1%. Whenever the target itself is unambiguously a percent, any other
// cell on that same row that looks like a 0–1 fraction is safe to read the
// same way — unlike the utilization case above, there's no name-matching
// needed here because the "%" on the target already tells us the unit.
function alignPercentScale(u){
  const targetIsPercent = (!u.exp.empty && u.exp.percent) || (!u.plan.empty && u.plan.percent);
  if(!targetIsPercent) return;
  const scaleCell = (cell)=>{
    if(!cell.empty && cell.value!=null && !cell.percent && cell.value>0 && cell.value<=1.5){
      cell.value = cell.value*100; cell.percent = true;
    }
  };
  scaleCell(u.plan); scaleCell(u.exp);
  u.q.forEach(scaleCell);
}
// Whole indicator groups/names with no real reported result at all (target
// repeated but never measured) — forced to render fully blank/grey rather
// than as if the target were an achieved value. KP-TR-ATS/SZCD/SMS used to be
// forced this way too, but they're now handled per-unit (see below) so their
// target line/band/grade-scale still shows instead of a blank axis.
const FORCE_EMPTY_OBSZAR = new Set([]);
const FORCE_EMPTY_NAMES = new Set([]);
function buildGroups(records){
  const map = new Map();
  records.forEach(r=>{
    // NOTE: Cel_strategiczny is intentionally NOT part of the key — it's a
    // strategic-goal reference code, not something that should ever differ
    // between locations reporting the same indicator. Rows that only differ
    // by a typo'd/blank Cel_strategiczny must still land in the same card.
    const key = [normText(r.Obszar), normText(r.KPA), normText(r.Mierniki_2026)].join('§');
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  });
  const groups = [];
  map.forEach(rows=>{
    const first = rows[0];
    // prefer the first non-empty Cel_strategiczny in the group for display
    const celRow = rows.find(r=> normCel(r.Cel_strategiczny));
    const units = rows.map(r=>({
      loc: (r.Lokalizacja && String(r.Lokalizacja).trim()) || null,
      plan: parseCell(r.Roczna_wartosc_planowana),
      exp: parseCell(r.Roczna_wartosc_oczekiwana),
      q: [parseCell(r.I_kw_), parseCell(r.II_kw_), parseCell(r.III_kw_), parseCell(r.IV_kw_)],
      // TSz_Komentarz is a Reference (row id into "Komentarze"), not plain
      // text, and isn't shown anywhere in the UI — ignored rather than
      // stringified (which would otherwise print raw row numbers like "3").
      comment: ''
    }));
    units.forEach(alignPercentScale);
    if(isFractionPercentMetric(first.Mierniki_2026, first.Obszar)) units.forEach(alignUtilizationScale);
    // "Bezpieczeństwo świadczonej usługi osłony meteorologicznej" fills plan/exp
    // with a bare "0" (not "x") for locations that never reported anything at
    // all this year — a flat 0-vs-0 bar+target line looks like a rendering
    // glitch, not "zero incidents achieved", so for THIS metric specifically a
    // location with no quarterly data and a 0/0 annual pair is treated the
    // same as truly empty (matches how the other "no data at all" locations
    // already render, e.g. same panel's "Kompletność usługi" row).
    if(normKey(first.Mierniki_2026)===normKey('Bezpieczeństwo świadczonej usługi osłony meteorologicznej')){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        const zeroPlan = !u.plan.empty && u.plan.value===0;
        const zeroExp = !u.exp.empty && u.exp.value===0;
        if(noQ && zeroPlan && zeroExp){ u.plan = {empty:true}; u.exp = {empty:true}; }
      });
    }
    // SZCD (BCMS), KP-TR-ATS (training-effectiveness) and SMS (maturity grade)
    // indicators: every row in these obszars is annual-only, no quarterly
    // reporting at all, and "planowana"/"oczekiwana" are either "x" (nothing
    // measured) or the SAME number/range/grade repeated in both columns —
    // i.e. the target written twice, never an actually achieved result (see
    // "Pokrycie ryzyk"/"Liczba zrealizowanych testów" ranges, "Opracowanie
    // strategii..." 100%=100%, KP-TR-ATS "...w OSPA"/"...w jednostce"/
    // "Dostępność techniczna symulatora...", and SMS "Zarządzanie ryzykiem
    // w zakresie bezpieczeństwa" C=C). Marking "planowana" as explicitly n/a
    // here reuses the existing target-only rendering path (dashed line/band/
    // grade-scale marker, NO bar/chip, and no bogus "I-IV kw." axis) instead
    // of drawing a value nobody actually reported.
    if(['SZCD','KP-TR-ATS','SMS'].includes(normText(first.Obszar))){
      const cellsMatch = (a,b)=> (a.qualitative||b.qualitative)
        ? String(a.text||a.raw||'').trim()===String(b.text||b.raw||'').trim()
        : a.value===b.value;
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(!noQ) return;
        if(!u.plan.empty && !u.exp.empty && cellsMatch(u.plan, u.exp)){ u.plan = {empty:true, na:true}; }
        // KP-TR-ATS specifically: even a LONE number, whichever column it's
        // in, is still just a training-effectiveness target that hasn't been
        // measured yet (see "Skuteczność szkolenia podstawowego...w OSPA":
        // 80% sits in "planowana" with "oczekiwana" left as "x") — not a real
        // reported result, so it must be read as the CEL either way, not
        // drawn as an achieved bar.
        else if(normText(first.Obszar)==='KP-TR-ATS' && !u.plan.empty && u.exp.empty){
          u.exp = u.plan; u.plan = {empty:true, na:true};
        }
      });
    }
    // KP-HRM annual-only planning figures with no separate achieved result:
    // "planowana"/"oczekiwana" both just restate the SAME staffing/engagement
    // plan (e.g. "Planowana liczba ATCO" ACC 204=204, "Odsetek Kontrolerów...
    // ATCI in OPS" 28,40%=28,40%, "Poziom zaangażowania pracowników" 60% vs.
    // "55%-60%" target band) — nothing has actually been measured against
    // them yet, so (unlike the PRU staffing-breakdown chart, which shows the
    // planned COUNT itself as the meaningful figure) these must render as
    // target-only (dashed line/band), not a bar that looks like a reported
    // result.
    const KP_HRM_TARGET_ONLY_NAMES = new Set([
      'Planowana liczba ATCO w podziale na służby',
      'Odsetek Kontrolerów ruchu lotniczego (ATCI in OPS) w ogólnej liczbie zatrudnionych',
      'Poziom zaangażowania pracowników'
    ]);
    if(normText(first.Obszar)==='KP-HRM' && [...KP_HRM_TARGET_ONLY_NAMES].some(n=>normKey(n)===normKey(first.Mierniki_2026))){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty) u.plan = {empty:true, na:true};
      });
    }
    // MA "Zgodność gaśnic": sheet marks it "kw." (quarterly) but it's actually
    // only ever checked/reported once a year, with "planowana"/"oczekiwana"
    // both just the same 100% target repeated and no quarterly cell EVER
    // filled — so, like the SZCD/KP-TR-ATS rows above, this must render as
    // target-only (grey card, dashed cel line) rather than a fake "100%
    // achieved" bar with nothing actually measured behind it.
    if(normText(first.Obszar)==='MA' && normKey(first.Mierniki_2026)===normKey('Zgodność gaśnic')){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty && !u.exp.empty && u.plan.value===u.exp.value){ u.plan = {empty:true, na:true}; }
      });
    }
    // KP-FIS "Obciążenie ruchem lotniczym": "planowana" and "oczekiwana" are
    // two DIFFERENT traffic-load estimates (e.g. 119 698 vs 123 400) — but
    // neither is an actually reported/measured result, they're both just
    // forecast figures for the year. The generic annualValueTarget() pairing
    // would otherwise draw "planowana" as if it were the achieved bar; force
    // it to target-only (only "oczekiwana" as the dashed cel line) since no
    // real traffic count has come in yet.
    if(normText(first.Obszar)==='KP-FIS' && normKey(first.Mierniki_2026)===normKey('Obciążenie ruchem lotniczym')){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty && !u.exp.empty) u.plan = {empty:true, na:true};
      });
    }
    // "Wydajnoś FISO na godzinę pracy" and "Zatrudnienie w ośrodku FIS"
    // (KP-FIS) are both annual ("r.") figures where "planowana"/"oczekiwana"
    // are the SAME number repeated (a target, e.g. "7/9" ≈ 78%, or a plain
    // headcount) — nothing has actually been reported/measured yet. These
    // must render as target-only (dashed cel line, greyed card) via the
    // normal annual chart, not the previous whole-metric "force empty" (which
    // wrongly drew a blank QUARTERLY axis for an annual indicator and hid the
    // known target entirely).
    if(normText(first.Obszar)==='KP-FIS' && ['Wydajność FISO na godzinę pracy','Zatrudnienie w ośrodku FIS'].some(n=>normKey(n)===normKey(first.Mierniki_2026))){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty && !u.exp.empty && cellsMatch(u.plan,u.exp)) u.plan = {empty:true, na:true};
      });
    }
    // KP-ASM1 "Dokładność danych zmian struktur przestrzeni powietrznej
    // przekazanych do publikacji AIS": annual, "planowana" 95% and
    // "oczekiwana" 98% are two DIFFERENT planning figures, but neither is an
    // actually reported/measured result (no quarter ever filled) — like the
    // KP-FIS traffic-load rows above, force target-only (98% cel line) rather
    // than drawing "planowana" as if it were a real achieved 95%.
    if(normText(first.Obszar)==='KP-ASM1' && normKey(first.Mierniki_2026)===normKey('Dokładność danych zmian struktur przestrzeni powietrznej przekazanych do publikacji AIS')){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty && !u.exp.empty) u.plan = {empty:true, na:true};
      });
    }
    // OB. (both indicators, "Integracja środowiska UTM z systemami TWR" and
    // "Pełna wymiana danych pomiędzy systemami ATM i UTM"): annual,
    // "planowana"/"oczekiwana" are two DIFFERENT forecast figures (15%/10%,
    // 25%/20%) but neither is an actually reported result — force target-only
    // using "oczekiwana" as the cel line (ignore "planowana" entirely).
    if(normText(first.Obszar)==='OB.'){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty && !u.exp.empty) u.plan = {empty:true, na:true};
      });
    }
    // SZBI (both indicators), AX ("Stopień wdrożonych przez PAŻP celów ATM
    // MP w roku sprawozdawczym"/"...ogółem") and BHP "Wysokość stopy
    // procentowej na ubezpieczenie wypadkowe" are annual with "planowana" ===
    // "oczekiwana" (0/0, 100%/100%, 45%/45%, or 0,96%/0,96%) — just the target
    // repeated, nothing has actually been measured/reported this year. Force
    // target-only (grey card, dashed cel line) instead of drawing a fake
    // "achieved" bar that reads as a real, good result. (cellsMatch guards
    // this so BHP's other row, "Wypadki w pracy" — plan 0 vs exp 2, genuinely
    // different — is untouched.)
    if(normText(first.Obszar)==='SZBI' || normText(first.Obszar)==='AX' || normText(first.Obszar)==='BHP'){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty && !u.exp.empty && cellsMatch(u.plan,u.exp)) u.plan = {empty:true, na:true};
      });
    }
    // BHP "Wypadki w pracy" (0 planowana / 2 oczekiwana) and KP-FPL
    // "Skuteczność weryfikacji poprawności..." (target thresholds "<1,0 x
    // 10-5" planowana / "<5" oczekiwana): annual, no quarterly data ever —
    // "planowana" is just a forecast, not a real reported count/result. Force
    // target-only (grey card) using "oczekiwana" as the cel line.
    if((normText(first.Obszar)==='BHP' && normKey(first.Mierniki_2026)===normKey('Wypadki w pracy')) ||
       normText(first.Obszar)==='KP-FPL'){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty && !u.exp.empty) u.plan = {empty:true, na:true};
      });
    }
    // "Monitorowanie kowenantów na potrzeby umów kredytowych" (MF): the
    // reported ratios (dług netto/EBITDA, DSCR) are plain multiples ("1,68",
    // "1,95") but the source sheet's quarterly cells carry a stray "%" suffix
    // ("1.68%"), which parseCell reads as a genuine percentage and forces the
    // axis onto a 0-100% scale — squashing both the value and the "<3"/">1,2"
    // covenant targets into an unreadable sliver near zero. Strip that
    // mistaken percent flag here so the chart uses its real ratio scale.
    if(normText(first.Obszar)==='MF' && normKey(first.Mierniki_2026)===normKey('Monitorowanie kowenantów na potrzeby umów kredytowych')){
      units.forEach(u=> u.q.forEach(q=>{ if(!q.empty) q.percent = false; }));
    }
    // KP-TECH "Zapewnienie usług: COM,NAV,SUR,MET,DP(systemy),DP(sieć), IT
    // (back off- służby operacyjne)": only "planowana" (95%) is filled in —
    // "oczekiwana" is "x" and no quarter was ever reported. annualValueTarget()
    // would otherwise draw that lone 95% as if it were an achieved bar; it's
    // actually just the (secondary, planowana-only) target, so swap it into
    // the "oczekiwana" slot and force target-only rendering, same as the
    // other lone-column annual overrides above.
    if(normText(first.Obszar)==='KP-TECH' && looseKey(first.Mierniki_2026)===looseKey('Zapewnienie usług: COM,NAV,SUR,MET,DP(systemy),DP(sieć), IT (back off- służby operacyjne)')){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty && u.exp.empty){ u.exp = u.plan; u.plan = {empty:true, na:true}; }
      });
    }
    // OB. "Integracja środowiska UTM z systemami TWR (do 2030 r.)" and "Pełna
    // wymiana danych pomiędzy systemami ATM i UTM (do 2034 r.)": both are
    // long-horizon annual targets — "planowana" (15%/25%) is just next
    // milestone's forecast, not a real reported result (nothing has actually
    // been done yet), "oczekiwana" (10%/20%) is the real target/cel. Without
    // this override annualValueTarget() would draw "planowana" as an achieved
    // bar; force target-only (grey) rendering instead, using "oczekiwana" as
    // the cel line — same lone-column pattern as the other annual overrides.
    const OB_TARGET_ONLY_NAMES = ['Integracja środowiska UTM z systemami TWR (do 2030 r.)', 'Pełna wymiana danych pomiędzy systemami ATM i UTM (do 2034 r.)'];
    if(normText(first.Obszar)==='OB.' && OB_TARGET_ONLY_NAMES.some(n=>looseKey(n)===looseKey(first.Mierniki_2026))){
      units.forEach(u=>{
        const noQ = u.q.every(q=>q.empty || q.value==null);
        if(noQ && !u.plan.empty){ u.plan = {empty:true, na:true}; }
      });
    }
    const hasQuarterData = units.some(u=>u.q.some(q=>!q.empty && q.value!=null));
    // any unit with a real number in either column counts as "annual" viz —
    // even when "planowana" is explicitly "x" (nothing measured, target-only).
    // That "value vs. target" distinction is already handled per-unit by
    // annualValueTarget() (val stays null there, only the target line/band is
    // drawn) — this group-level flag only decides QUARTERLY vs ANNUAL vs
    // BADGE vs fully-EMPTY layout, so a target-only row must still count as
    // "annual" here, not collapse to the blank axis-only empty state (that
    // would silently drop the one useful piece of info these rows have: the
    // target itself, e.g. SZCD/KP-AIM "brak wyniku, cel 80%/>=99%").
    const anyAnnualNumeric = units.some(u=>{
      const hasExp = !u.exp.empty && u.exp.value!=null;
      const hasPlan = !u.plan.empty && u.plan.value!=null;
      return hasPlan || hasExp;
    });
    const anyQualitative = units.some(u=> (u.exp.qualitative) || (u.exp.range && !u.exp.value) || (u.plan.qualitative));
    const allEmpty = units.every(u=> u.q.every(q=>q.empty) && u.exp.empty && u.plan.empty);

    let vizType;
    if(hasQuarterData) vizType = 'quarterly';
    else if(anyQualitative && !anyAnnualNumeric) vizType = 'badge';
    else if(anyAnnualNumeric) vizType = 'annual';
    else vizType = 'empty';

    // whole-obszar / whole-indicator overrides: no real result was ever
    // reported for these, so never let them fall back to showing the target
    // number as if it were achieved data.
    const forceEmpty = FORCE_EMPTY_OBSZAR.has(normText(first.Obszar)) || FORCE_EMPTY_NAMES.has(normText(first.Mierniki_2026));
    if(forceEmpty) vizType = 'empty';

    const direction = inferDirection(first.Mierniki_2026);
    const neutral = isNeutralMetric(first.Mierniki_2026);
    units.forEach(u=> u.status = forceEmpty ? 'empty' : computeStatus(u, direction, neutral));
    const status = worstStatus(units.map(u=>u.status));
    units.forEach(u=> u.everBad = forceEmpty ? false : computeEverBad(u, direction, neutral));
    const everBad = units.some(u=>u.everBad);

    // "Zgodność gaśnic" is labelled "kw." in the sheet but is only ever
    // actually checked/reported once a year (see the target-only override
    // above) — so the cadence dots must show it as annual (only the last
    // checkpoint lit), not as if it reports every quarter.
    const FREQ_OVERRIDE_ANNUAL = new Set(['Zgodność gaśnic']);
    const effectiveFreq = [...FREQ_OVERRIDE_ANNUAL].some(n=>normKey(n)===normKey(first.Mierniki_2026)) ? 'r.' : (first.czest_ || '');

    groups.push({
      key: [normText(first.Obszar), normText(first.KPA), normText(first.Mierniki_2026)].join('§'),
      obszar: normText(first.Obszar) || 'Inne',
      kpa: first.KPA || 'Inne',
      cel: celRow ? normCel(celRow.Cel_strategiczny) : '',
      name: normText(first.Mierniki_2026) || '(brak nazwy)',
      freq: effectiveFreq,
      units,
      multiUnit: units.length>1,
      vizType, direction, status, everBad,
      hasQuarterData, anyAnnualNumeric, allEmpty
    });
  });
  return groups;
}

/* ===================== FILTERING ===================== */
function getFiltered(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const obszar = document.getElementById('obszarFilter').value;
  const cel = document.getElementById('celFilter').value;
  const kpa = document.getElementById('kpaFilter').value;
  const dataFilter = document.getElementById('dataFilter').value; // '' | 'nonempty' | 'empty'
  const onlyProblems = document.getElementById('onlyProblems').checked;
  return GROUPS.filter(g=>{
    if(kpa && g.kpa!==kpa) return false;
    if(obszar && g.obszar!==obszar) return false;
    if(cel && g.cel!==cel) return false;
    if(dataFilter==='empty' && g.status!=='empty') return false;
    if(dataFilter==='nonempty' && g.status==='empty') return false;
    // "poza celem": currently breaching OR breached at some earlier point
    // this year (even if the latest reported value is back on track).
    if(onlyProblems && g.status!=='bad' && !g.everBad) return false;
    if(search){
      const hay = (g.name+' '+g.obszar+' '+g.cel+' '+g.kpa).toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });
}

/* ===================== RENDER: FILTER OPTIONS ===================== */
// fixed section display order — the same order Obszar first appears in the
// source sheet/RAW rows (not a count-based sort), computed once from the
// FULL unfiltered GROUPS so filtering never reshuffles which obszar section
// sits where, only how many/which cards show inside it.
function computeObszarOrder(){
  const seen = new Set();
  OBSZAR_ORDER = [];
  GROUPS.forEach(g=>{ if(!seen.has(g.obszar)){ seen.add(g.obszar); OBSZAR_ORDER.push(g.obszar); } });
}
function populateObszarFilter(){
  const sel = document.getElementById('obszarFilter');
  const cur = sel.value;
  const areas = [...new Set(GROUPS.map(g=>g.obszar))].sort();
  sel.innerHTML = '<option value="">Wszystkie obszary</option>' + areas.map(a=>`<option value="${a}">${a}</option>`).join('');
  sel.value = cur;
}
function populateCelFilter(){
  const sel = document.getElementById('celFilter');
  const cur = sel.value;
  const cele = [...new Set(GROUPS.map(g=>g.cel).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Wszystkie cele</option>' + cele.map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value = cur;
}
function populateKpaFilter(){
  const sel = document.getElementById('kpaFilter');
  const cur = sel.value;
  const present = [...new Set(GROUPS.map(g=>g.kpa))];
  const list = [...KPA_ORDER.filter(k=>present.includes(k)).map(k=>({k,label:kpaMeta(k).label})),
    ...present.filter(k=>!KPA_ORDER.includes(k)).map(k=>({k,label:k}))];
  sel.innerHTML = '<option value="">Wszystkie KPA</option>' + list.map(({k,label})=>`<option value="${k}">${label}</option>`).join('');
  sel.value = cur;
}

/* ===================== CARD BUILDERS ===================== */
let cardIdSeq = 0;
function cellText(cell){
  if(cell.empty) return cell.na? 'x' : '—';
  // when a cell was rescaled after parsing (e.g. bare "1" recognised as 100%
  // because the target on that row is written as a percentage), cell.raw
  // still holds the ORIGINAL text ("1") — showing that verbatim would look
  // like "1%" instead of "100%", so percent-scaled cells always go through
  // fmtNum against the corrected value instead of trusting raw.
  if(cell.percent && cell.value!=null) return fmtNum(cell.value, true);
  return cell.raw!==undefined? cell.raw : fmtNum(cell.value, cell.percent);
}
function planExpText(u){
  return {plan: cellText(u.plan), exp: cellText(u.exp)};
}

// classify a single unit's own data shape (independent of the rest of the group —
// different locations can have different targets / different reporting states)
function computeUnitViz(u){
  const hasQ = u.q.some(q=>!q.empty && q.value!=null);
  const hasAnnualNum = (!u.plan.empty && u.plan.value!=null) || (!u.exp.empty && u.exp.value!=null);
  const isQual = u.exp.qualitative || u.plan.qualitative || (u.exp.range && u.exp.value==null);
  if(hasQ) return 'quarterly';
  if(isQual && !hasAnnualNum) return 'badge';
  if(hasAnnualNum) return 'annual';
  return 'empty';
}

// bar chart for one location's reporting periods, with THAT location's own annual
// target drawn as a dashed reference line — target is always integrated into the
// same chart. Semi-annual indicators ("pół r.") are reported at half-year
// boundaries, which line up with quarter-ends: H1 is filed together with the
// "II kw." column (end of Q2) and H2 with the "IV kw." column (end of Q4) —
// the "I kw."/"III kw." cells are never used for these, so we pull H1/H2 from
// indices 1 and 3 instead of showing all 4 (mostly-empty) quarterly categories.
// `yScale` (when given) fixes min/max so every location in the same panel shares
// one vertical axis — otherwise Chart.js auto-scales each chart independently and
// bars for very different magnitudes (e.g. small vs. large units) look deceptively
// similar in height.
function renderUnitChart(canvasEl, u, meta, compact, yScale, freq, direction, neutral, millions){
  const isHalfYear = freq==='pół r.';
  const labels = isHalfYear ? ['I półr.','II półr.'] : ['I kw.','II kw.','III kw.','IV kw.'];
  const qCells = isHalfYear ? [u.q[1], u.q[3]] : u.q;
  // target reference: prefer "oczekiwana", fall back to "planowana" when only
  // that column was filled in for this row (data entry isn't always consistent).
  // A "70%-80%" style cell parses to BOTH an averaged .value (legacy single-line
  // use) and a .range [lo,hi] — the range, when present, is the real target band
  // and must be drawn/judged as such instead of collapsing it to the midpoint.
  const targetCell = pickTargetCell(u);
  const planVal = targetCell ? targetCell.value : null;
  const planRange = targetCell ? targetCell.range : null;
  // Each bar is judged against the target on its own merits — a quarter that
  // breached earlier in the year stays red even if a later quarter recovered.
  // Only the card/box BACKGROUND tint (see computeStatus/buildPanelCard) looks
  // solely at the latest reported quarter — so "Q1 over, Q2 back in target"
  // shows a red Q1 bar with no red background, while "Q1 fine, Q2 over" shows
  // a red Q2 bar *and* a red background (see request).
  const barColors = qCells.map(q=>{
    if(q.empty || q.value==null) return 'transparent';
    if(neutral || planVal==null) return statusInk('good');
    if(planRange) return isOutOfRange(q.value, planRange) ? statusInk('bad') : statusInk('good');
    return isBreach(q.value, planVal, directionFromOp(targetCell.op) || direction) ? statusInk('bad') : statusInk('good');
  });
  const datasets = [{
    label:'Wartość', data: qCells.map(q=> (q.empty? null : q.value)),
    backgroundColor: barColors, borderRadius:4, maxBarThickness: compact?20:28, order:2,
    minBarLength: millions? 2 : undefined // keep a real 0 visible as a thin sliver instead of nothing
  }];
  if(planRange){
    // draw the whole "lo-hi" band as a shaded region (two flat dashed lines
    // with the area between them filled) instead of averaging it into one
    // single target line — the midpoint isn't the actual target, the WHOLE
    // range is.
    datasets.push({
      type:'line', label:'Cel (min)', data: labels.map(()=>planRange[0]),
      borderColor:BRAND.navy, borderDash:[5,4], pointRadius:0, borderWidth:1.5, order:1, fill:false
    });
    datasets.push({
      type:'line', label:'Cel (maks)', data: labels.map(()=>planRange[1]),
      borderColor:BRAND.navy, borderDash:[5,4], pointRadius:0, borderWidth:1.5, order:1,
      fill:'-1', backgroundColor:'rgba(15,48,77,0.12)'
    });
  } else if(planVal!=null){
    datasets.push({
      type:'line', label:'Cel roczny', data: labels.map(()=>planVal),
      borderColor:BRAND.navy, borderDash:[5,4], pointRadius:0, borderWidth:1.5, order:1, fill:false,
      targetOp: targetCell ? targetCell.op : null
    });
  }
  const percent = qCells.some(q=>q.percent) || (!u.exp.empty && u.exp.percent) || (!u.plan.empty && u.plan.percent);
  const yAxis = {grid:{color:'#eef1f6'}, ticks:{font:{size:compact?9:10}, callback:(v)=>fmtNum(v,percent,millions)}, beginAtZero:true};
  const localMax = Math.max(0, ...qCells.map(q=> q.empty? 0 : (q.value||0)), planVal||0);
  if(yScale){ yAxis.min = yScale.min; yAxis.max = yScale.max; }
  else if(localMax>0){
    if(millions){ const sc = niceMillionsScale(localMax); yAxis.max = sc.max; yAxis.ticks.stepSize = sc.step; }
    else yAxis.max = niceAxisMax(localMax, percent);
  }
  // percent axes normally run the full 0-100% ladder (20%-spaced gridlines) —
  // but extend past 100 (see percentAxisMax) when the reported value/shared
  // scale genuinely goes higher, instead of clipping the bar at the top.
  if(percent){
    const axisMax = yScale ? yScale.max : percentAxisMax(localMax);
    yAxis.min = 0; yAxis.max = axisMax;
    const ticks = percentAxisTicks(axisMax);
    yAxis.afterBuildTicks = (axis)=>{ axis.ticks = ticks.map(value=>({value})); };
    yAxis.ticks.autoSkip = false;
  }
  charts.push(new Chart(canvasEl,{
    type:'bar',
    data:{labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:(c)=> fmtTooltipValue(c, percent, millions)}, filter:(c)=> c.parsed.y!=null}
      },
      scales:{
        x:{grid:{display:false}, ticks:{font:{size:compact?9:10}}},
        y:yAxis
      },
      animation:{duration:300}
    }
  }));
}
// annual (single-value) indicator drawn the same way as quarterly ones — one
// vertical bar for the reported value, plus a dashed horizontal line for the
// annual target — so every chart on the board reads the same way (no mixed
// horizontal/vertical styles). Same shared-`yScale` rule as renderUnitChart.
// Chart.js can't draw a real "line" from a single data point (an annual
// chart only has one x-category) — with pointRadius:0 that leaves the target
// completely invisible, even though the dataset/value are there. This plugin
// manually draws a full-width dashed line at the target's y-pixel instead of
// relying on Chart.js's own line renderer, exactly matching how the target
// line already looks (plain, unlabeled) on the (multi-point, and therefore
// naturally visible) quarterly charts.
const annualTargetLinePlugin = {
  id: 'annualTargetLine',
  afterDatasetsDraw(chart){
    const ds = chart.data.datasets.find(d=> d.label==='Cel roczny');
    if(!ds || ds.data[0]==null) return;
    const yScale = chart.scales.y;
    const {left, right} = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    if(ds.range){
      // "70%-80%" style target: shade the whole band between the two bounds
      // instead of a single averaged line — the range IS the target, not its
      // midpoint.
      const yLo = yScale.getPixelForValue(ds.range[0]);
      const yHi = yScale.getPixelForValue(ds.range[1]);
      const top = Math.min(yLo, yHi), bottom = Math.max(yLo, yHi);
      ctx.fillStyle = 'rgba(15,48,77,0.12)';
      ctx.fillRect(left, top, right-left, bottom-top);
      ctx.setLineDash([5,4]);
      ctx.strokeStyle = ds.borderColor || BRAND.navy;
      ctx.lineWidth = ds.borderWidth || 1.5;
      ctx.beginPath(); ctx.moveTo(left, top); ctx.lineTo(right, top); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(left, bottom); ctx.lineTo(right, bottom); ctx.stroke();
    } else {
      const y = yScale.getPixelForValue(ds.data[0]);
      ctx.setLineDash([5,4]);
      ctx.strokeStyle = ds.borderColor || BRAND.navy;
      ctx.lineWidth = ds.borderWidth || 1.5;
      ctx.beginPath();
      ctx.moveTo(left, y);
      ctx.lineTo(right, y);
      ctx.stroke();
    }
    ctx.restore();
  }
};
function renderUnitAnnualChart(canvasEl, u, meta, compact, yScale, millions, noValue){
  let val, targetVal, targetRange, percent, targetOp;
  if(millions){
    // for investment cards, "planowana"/"oczekiwana" are both just the same
    // annual budget target (never an already-achieved result) — so unlike
    // the generic annualValueTarget() pairing below, the "value" bar here is
    // the actual reported execution-to-date from the quarterly cells (often
    // 0, meaning "nothing spent/reported yet") rather than the plan/exp
    // number. A 0 value bar draws nothing visible, but the real amount still
    // shows up correctly on hover instead of being hidden as "no data".
    const reported = u.q.filter(q=>!q.empty && q.value!=null).map(q=>q.value);
    val = reported.length ? reported[reported.length-1] : null;
    const targetCell = pickTargetCell(u);
    targetVal = targetCell ? targetCell.value : null;
    targetRange = targetCell ? targetCell.range : null;
    targetOp = targetCell ? targetCell.op : null;
    percent = false;
  } else if(noValue){
    // some whole-obszar overrides (KP-TR-ATS training-effectiveness targets,
    // etc.) have "planowana"/"oczekiwana" both filled in with the SAME
    // number — that's just the target repeated, never an actually reported
    // result — so, like investment cards, never draw it as if it were an
    // achieved value: only the dashed target line, greyed card, no bar.
    val = null;
    const targetCell = pickTargetCell(u);
    targetVal = targetCell ? targetCell.value : null;
    targetRange = targetCell ? targetCell.range : null;
    targetOp = targetCell ? targetCell.op : null;
    percent = targetCell ? targetCell.percent : false;
  } else {
    const vt = annualValueTarget(u);
    val = vt.value ? vt.value.value : null;
    targetVal = vt.target ? vt.target.value : null;
    targetRange = vt.target ? vt.target.range : null;
    targetOp = vt.target ? vt.target.op : null;
    percent = (vt.value && vt.value.percent) || (vt.target && vt.target.percent);
  }
  const datasets = [{
    label:'Wartość', data:[val],
    backgroundColor: (millions && val===0) ? statusInk('bad') : statusInk(u.status),
    borderRadius:4, maxBarThickness: compact?36:48, order:2,
    minBarLength: millions? 2 : undefined // keep a real 0 visible as a thin sliver instead of nothing
  }];
  if(targetVal!=null){
    const ds = {
      type:'line', label:'Cel roczny', data:[targetVal],
      borderColor:BRAND.navy, borderDash:[5,4], pointRadius:0, borderWidth:1.5, order:1, fill:false,
      targetOp
    };
    if(targetRange) ds.range = targetRange;
    datasets.push(ds);
  }
  const yAxis = {grid:{color:'#eef1f6'}, ticks:{font:{size:compact?9:10}, callback:(v)=>fmtNum(v,percent,millions)}, beginAtZero:true};
  if(yScale && yScale.step) yAxis.ticks.stepSize = yScale.step;
  const localMax = Math.max(val||0, targetVal||0);
  if(yScale){ yAxis.min = yScale.min; yAxis.max = yScale.max; }
  else if(localMax>0){
    if(millions){ const sc = niceMillionsScale(localMax); yAxis.max = sc.max; yAxis.ticks.stepSize = sc.step; }
    else yAxis.max = niceAxisMax(localMax, percent);
  }
  if(percent){
    const axisMax = yScale ? yScale.max : percentAxisMax(localMax);
    yAxis.min = 0; yAxis.max = axisMax;
    const ticks = percentAxisTicks(axisMax);
    yAxis.afterBuildTicks = (axis)=>{ axis.ticks = ticks.map(value=>({value})); };
    yAxis.ticks.autoSkip = false;
  }
  charts.push(new Chart(canvasEl,{
    type:'bar',
    data:{labels:[''], datasets},
    plugins:[annualTargetLinePlugin],
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:(c)=> fmtTooltipValue(c, percent, millions)}, filter:(c)=> c.parsed.y!=null}
      },
      scales:{
        x:{grid:{display:false}, ticks:{display:false}},
        y:yAxis
      },
      animation:{duration:300}
    }
  }));
}

// same "value could be in either column" ambiguity applies to qualitative
// (grade/text) cells too — same mapping as annualValueTarget: oczekiwana=cel.
function qualitativeValueTarget(u){
  const hasExp = !u.exp.empty;
  const hasPlan = !u.plan.empty;
  if(hasExp && hasPlan) return {value:u.plan, target:u.exp};
  if(hasPlan) return {value:u.plan, target:null};
  if(hasExp){
    // "planowana" explicitly "x" (u.plan.na) means nothing was ever measured —
    // the lone letter in "oczekiwana" is only the target grade, not an
    // achieved one (same convention as annualValueTarget's numeric case).
    if(u.plan.na) return {value:null, target:u.exp};
    return {value:u.exp, target:null};
  }
  return {value:null, target:null};
}
function badgeHtml(u, meta){
  const {value, target} = qualitativeValueTarget(u);
  const html = [`<span class="grade-chip" style="background:${meta.bg};color:${meta.color}">${value? cellText(value):'—'}</span>`];
  if(target) html.push(`<span style="font-size:10.5px;color:var(--mut)">cel: ${cellText(target)}</span>`);
  return html.join('\n    ');
}
// SMS maturity indicators ("Zarządzanie ryzykiem...", "Kultura bezpieczeństwa"
// etc.) are graded on an A-D ladder (A best, D worst) instead of a number —
// drawn as a small vertical scale with all 4 letters always visible, the
// CEL (target) row highlighted as a tinted band, and the reported grade (when
// one exists) marked as a solid chip on top of it — instead of a plain badge
// that had no sense of "where on the scale" the letter actually sits.
const GRADE_SCALE = ['A','B','C','D'];
function isGradeLetter(cell){ return cell && cell.qualitative && GRADE_SCALE.includes(String(cell.text||cell.raw||'').trim().toUpperCase()); }
function renderGradeScaleChart(canvasEl, compact, targetLetter, valueLetter){
  const targetIdx = GRADE_SCALE.indexOf(targetLetter);
  const valueIdx = valueLetter ? GRADE_SCALE.indexOf(valueLetter) : -1;
  const datasets = [{
    label:'Cel', data: GRADE_SCALE.map((g,i)=> i===targetIdx ? 1 : 0),
    backgroundColor:'rgba(15,48,77,0.14)', borderColor:BRAND.navy, borderWidth:1.5,
    borderRadius:4, maxBarThickness: compact?22:30, order:2, categoryPercentage:0.9, barPercentage:0.95
  }];
  if(valueIdx>=0){
    datasets.push({
      label:'Wartość', data: GRADE_SCALE.map((g,i)=> i===valueIdx ? 1 : 0),
      backgroundColor: statusInk('good'), borderRadius:3,
      maxBarThickness: compact?10:14, order:1, categoryPercentage:0.9, barPercentage:0.4
    });
  }
  charts.push(new Chart(canvasEl,{
    type:'bar',
    data:{labels:GRADE_SCALE, datasets},
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:(c)=> `${c.dataset.label}: ${GRADE_SCALE[c.dataIndex]}`}, filter:(c)=> c.parsed.x>0}
      },
      scales:{
        x:{display:false, min:0, max:1},
        y:{grid:{color:'#eef1f6'}, ticks:{font:{size:compact?10.5:11.5, weight:'700'}}}
      },
      animation:{duration:300}
    }
  }));
}

// KP-HRM "Planowany stan zatrudnienia w etatach (PRU)" used to be a 10-box
// grid (one tiny chart per PRU role) — much harder to compare at a glance
// than one combined chart. Now drawn as ONE bar chart: every PRU role on the
// X axis (short "PRUn" tick, full role name on hover), one shared Y axis (FTE
// count), and each role's OWN target drawn as a short horizontal tick at its
// own bar (targets differ a lot per role, so one flat line across all of them
// would be meaningless). When quarterly reporting eventually starts for this
// indicator, each role expands into its own PRUn/I kw./II kw./... sub-group
// (PRU-first, then quarter) instead of just one annual bar.
function isPRUStaffingPanel(g){
  return g.obszar==='KP-HRM' && /^Planowany stan zatrudnienia w etatach \(PRU\)/i.test(g.name||'');
}
function pruShortLabel(loc){
  const m = String(loc||'').match(/\(([^)]+)\)\s*$/);
  return m ? m[1].replace(/\s+/g,'') : String(loc||'');
}
function buildPRUChartData(g){
  const isHalfYear = g.freq==='pół r.';
  // half-year cadence: only "II kw." (H1 filed at mid-year) and "IV kw." (H2
  // filed at year-end) cells are ever used — same H1/H2-from-quarter-slots
  // convention as renderUnitChart, so PRU roles don't show two empty
  // quarterly gaps per half.
  const labels = [], fullLabels = [], targets = [], hasQFlags = [];
  const h1Values = [], h2Values = []; // room for both half-year sub-columns is
  // ALWAYS reserved (even before a role ever reports its 2nd half) so the
  // layout never has to reshuffle/shift once real half-year data starts
  // coming in — a role with only one known figure just duplicates it into
  // both slots (renders as one solid full-width bar) instead of only
  // occupying the left slot, which kept the target tick (always centred on
  // the whole category) visually misaligned from a half-width bar.
  g.units.forEach(u=>{
    const short = pruShortLabel(u.loc);
    // real reported figures land directly in whichever "I kw."/"II kw."/...
    // cell was actually filled in — the row's official cadence label ("pół
    // r.") doesn't reliably predict that (e.g. PRU1's first real headcount
    // check showed up straight in "I kw.", not "II kw."), so all four
    // quarter cells are checked directly instead of guessing based on freq.
    const qCells = isHalfYear ? [u.q[1], u.q[3]] : u.q;
    const h1 = qCells[0] && !qCells[0].empty && qCells[0].value!=null ? qCells[0].value : null;
    const h2 = qCells[1] && !qCells[1].empty && qCells[1].value!=null ? qCells[1].value : null;
    const hasQ = h1!=null || h2!=null;
    // same "value could be in either column, oczekiwana=cel" mapping used
    // everywhere else — here plan/exp are normally identical (a planned
    // staffing LEVEL, not a separately measured "achieved" figure), so the
    // bar and the target tick land on the same height until real quarterly
    // headcounts start coming in.
    const target = (!u.exp.empty && u.exp.value!=null) ? u.exp.value : ((!u.plan.empty && u.plan.value!=null) ? u.plan.value : null);
    const annualValue = (!u.plan.empty && u.plan.value!=null) ? u.plan.value : target;
    labels.push(short); // one shared label per PRU role — never split into per-half sub-labels
    fullLabels.push(u.loc||short);
    targets.push(target);
    hasQFlags.push(hasQ);
    h1Values.push(hasQ ? h1 : annualValue);
    h2Values.push(hasQ ? h2 : annualValue);
  });
  return {labels, fullLabels, targets, h1Values, h2Values, hasQFlags};
}
function renderPRUStaffingChart(canvasEl, g, compact){
  const {labels, fullLabels, targets, h1Values, h2Values, hasQFlags} = buildPRUChartData(g);
  const direction = inferDirection(g.name);
  // per request: a role's reported figure below its own target reads as
  // understaffed (red) — same "higher is better" judging every other
  // staffing metric already gets (see inferDirection); on target stays the
  // usual pastel blue, same tone as every other neutral/good chart.
  const colorFor = (values)=> values.map((v,i)=> v==null ? 'transparent' : (targets[i]!=null && isBreach(v, targets[i], direction) ? statusInk('bad') : statusInk('good')));
  // fixed 0-700 FTE axis: covers every PRU role's target/value with one
  // stable scale (per request), instead of auto-fitting to whichever role
  // happens to be tallest.
  const barThickness = compact?18:24;
  // target drawn as a manual dashed line (same "- - -" style as every other
  // chart's target reference) spanning the full width of BOTH half-year
  // columns — Chart.js point markers don't support a dash pattern, and its
  // built-in hover-radius shrinks a point marker on mouseover, which visibly
  // "narrowed" the old tick — a plugin drawing a plain canvas line sidesteps
  // both problems.
  const targetDashPlugin = {
    id:'pruTargetDash',
    afterDatasetsDraw(chart){
      const meta0 = chart.getDatasetMeta(0), meta1 = chart.getDatasetMeta(1);
