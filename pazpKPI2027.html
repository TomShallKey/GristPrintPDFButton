      const {ctx, scales:{y}} = chart;
      ctx.save();
      ctx.strokeStyle = BRAND.navy;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5,4]);
      targets.forEach((t,i)=>{
        const b0 = meta0.data[i], b1 = meta1.data[i];
        if(t==null || !b0 || !b1) return;
        const yPix = y.getPixelForValue(t);
        ctx.beginPath();
        ctx.moveTo(b0.x - b0.width/2, yPix);
        ctx.lineTo(b1.x + b1.width/2, yPix);
        ctx.stroke();
      });
      ctx.restore();
    }
  };
  charts.push(new Chart(canvasEl,{
    plugins:[targetDashPlugin],
    data:{
      labels,
      datasets:[
        { type:'bar', label:'I półr.', data:h1Values, backgroundColor:colorFor(h1Values), borderRadius:4, maxBarThickness: barThickness, order:2 },
        { type:'bar', label:'II półr.', data:h2Values, backgroundColor:colorFor(h2Values), borderRadius:4, maxBarThickness: barThickness, order:2 },
        {
          // invisible — only here so the shared "index" tooltip can list the
          // target alongside the bars; the actual dashed line is drawn by
          // targetDashPlugin above.
          type:'line', label:'Cel', data:targets,
          showLine:false, pointRadius:0, pointHoverRadius:0, borderColor:'transparent',
          order:1
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            title:(items)=> fullLabels[items[0].dataIndex],
            // roles that only have one (annual) figure duplicate it into both
            // half-year slots purely so the bar visually spans the full
            // category width — the tooltip should still read as one plain
            // "Wartość" line for those, not two identical "I/II półr." rows.
            label:(c)=>{
              if(c.datasetIndex===2) return `Cel: ${fmtNum(c.parsed.y)}`;
              const label = hasQFlags[c.dataIndex] ? c.dataset.label : 'Wartość';
              return `${label}: ${fmtNum(c.parsed.y)}`;
            }
          },
          filter:(c)=>{
            if(c.parsed.y==null) return false;
            if(c.datasetIndex===1 && !hasQFlags[c.dataIndex]) return false; // duplicate row for annual-only roles
            return true;
          }
        }
      },
      scales:{
        x:{grid:{display:false}, ticks:{font:{size:compact?9:10}, autoSkip:false, maxRotation:0, minRotation:0}},
        y:{grid:{color:'#eef1f6'}, ticks:{font:{size:compact?9:10}, callback:(v)=>fmtNum(v)}, beginAtZero:true, min:0, max:700}
      },
      animation:{duration:300}
    }
  }));
}
// one combined card (title + single wide chart) instead of the standard
// per-location grid — used for indicators where a per-unit grid of tiny
// charts is harder to read than one shared-axis chart (currently just the
// PRU staffing breakdown; see isPRUStaffingPanel).
function buildCombinedChartCard(g, compact){
  const meta = kpaMeta(g.kpa);
  const uid = 'c'+(cardIdSeq++);
  const card = document.createElement('div');
  // same rule as buildPanelCard: never tint the whole card red/yellow for one
  // (or even several) below-target PRU roles — that's what the per-bar
  // colouring inside the chart is for; the card itself only ever goes grey
  // when there's truly no data anywhere in it.
  card.className = 'card panel' + ((g.vizType==='empty' || g.status==='empty') ? ' empty':'');
  card.style.borderLeftColor = meta.color;
  card.innerHTML = `
    <div class="card-top">
      <div class="card-title">${g.name}</div>
      <span class="freq-badge">${freqDotsHtml(g.freq)}</span>
    </div>
    <div class="chart-wrap body-${uid}" style="height:${compact?170:220}px"><canvas></canvas></div>
  `;
  const canvas = card.querySelector(`.body-${uid} canvas`);
  chartQueue.push(()=> renderPRUStaffingChart(canvas, g, !!compact));
  return card;
}

// renders the body (chart / badge / empty) for a single location into `container` —
// every numeric case uses a vertical bar chart for consistency. `yScale` (optional)
// forces a shared min/max so all locations of the same indicator are comparable.
// Per standing agreement: a location/indicator with no data is left as a plain
// blank area (consistent with the greyed-out "empty" card/box styling) rather
// than announcing "Brak danych" — the muted/grey styling already communicates
// that nothing was reported, no extra text needed.
function renderUnitBody(container, g, u, meta, compact, yScale){
  const millions = isInvestmentMetric(g.name);
  // BHP: "Wypadki w pracy" counts whole incidents (can't have "half an
  // accident"), and current annual figures sit well under 5 — pin a small
  // integer-stepped 0-5 scale instead of the generic auto-fit/percent axis.
  // "Wysokość stopy procentowej na ubezpieczenie wypadkowe" is a small % rate
  // (~1%) — pin a readable 0-5% scale for the same reason.
  if(!yScale && g.obszar==='BHP'){
    if(g.name==='Wypadki w pracy') yScale = {min:0, max:5, percent:false, step:1};
    else if(g.name==='Wysokość stopy procentowej na ubezpieczenie wypadkowe') yScale = {min:0, max:5, percent:true};
  }
  // whole-group "force empty" overrides (KP-TR-ATS etc.) mean there's no real
  // reported result at all — plan/exp are just the target repeated, so this
  // must win over whatever computeUnitViz sees in this unit's own quarterly/
  // annual cells (e.g. a quarter cell that technically has a number still
  // must not draw a live chart if the whole indicator is flagged as N/A).
  const noValue = g.vizType==='empty';
  const uViz = noValue ? 'empty' : computeUnitViz(u);
  if(uViz==='quarterly'){
    const wrap = document.createElement('div'); wrap.className = 'chart-wrap' + (compact? ' small':'');
    wrap.innerHTML = '<canvas></canvas>';
    container.appendChild(wrap);
    const canvas = wrap.querySelector('canvas');
    chartQueue.push(()=> renderUnitChart(canvas, u, meta, compact, yScale, g.freq, g.direction, isNeutralMetric(g.name), millions));
  } else if(uViz==='annual'){
    const wrap = document.createElement('div'); wrap.className = 'chart-wrap' + (compact? ' small':'');
    wrap.innerHTML = '<canvas></canvas>';
    container.appendChild(wrap);
    const canvas = wrap.querySelector('canvas');
    chartQueue.push(()=> renderUnitAnnualChart(canvas, u, meta, compact, yScale, millions, noValue));
  } else if(uViz==='badge'){
    const {value, target} = qualitativeValueTarget(u);
    if(target && isGradeLetter(target)){
      // A-D graded metric (SMS): vertical ladder with the target band + the
      // reported grade marker, instead of a flat text chip with no sense of
      // scale.
      const wrap = document.createElement('div'); wrap.className = 'chart-wrap' + (compact? ' small':'');
      wrap.innerHTML = '<canvas></canvas>';
      container.appendChild(wrap);
      const canvas = wrap.querySelector('canvas');
      const targetLetter = String(target.text||target.raw).trim().toUpperCase();
      const valueLetter = (value && isGradeLetter(value)) ? String(value.text||value.raw).trim().toUpperCase() : null;
      chartQueue.push(()=> renderGradeScaleChart(canvas, compact, targetLetter, valueLetter));
    } else {
      container.insertAdjacentHTML('beforeend', `<div class="badge-wrap">${badgeHtml(u, meta)}</div>`);
    }
  } else {
    // uViz==='empty' -> no bars/message, but the Y axis stays visible (just
    // muted by the surrounding .status-empty grayscale filter) so the chart
    // area still reads as "a chart", not a blank hole in the layout.
    const wrap = document.createElement('div'); wrap.className = 'chart-wrap' + (compact? ' small':'');
    wrap.innerHTML = '<canvas></canvas>';
    container.appendChild(wrap);
    const canvas = wrap.querySelector('canvas');
    chartQueue.push(()=> renderEmptyAxisChart(canvas, compact, yScale, g.freq));
  }
}
// placeholder chart for units with genuinely no data: draws only the Y axis
// (no bars, no target line) so the layout/scale still lines up with sibling
// charts in the same panel instead of leaving an empty gap.
function renderEmptyAxisChart(canvasEl, compact, yScale, freq, percentHint){
  const isHalfYear = freq==='pół r.';
  const labels = isHalfYear ? ['I półr.','II półr.'] : ['I kw.','II kw.','III kw.','IV kw.'];
  // no real data to read a scale/format from, so fall back to the shared
  // panel yScale's percent flag (or the group's own percent hint) — without
  // this, an empty box next to %-based siblings would show a bare 0-100
  // count axis instead of the same 0/20/40/60/80/100% ladder they use.
  const percent = (yScale && yScale.percent) || !!percentHint;
  const yAxis = {grid:{color:'#eef1f6'}, ticks:{font:{size:compact?9:10}, callback:(v)=>fmtNum(v,percent)}, beginAtZero:true};
  if(yScale){ yAxis.min = yScale.min; yAxis.max = yScale.max; }
  else { yAxis.min = 0; yAxis.max = 100; }
  if(percent){
    yAxis.min = 0; yAxis.max = 100;
    yAxis.afterBuildTicks = (axis)=>{ axis.ticks = [0,20,40,60,80,100].map(value=>({value})); };
    yAxis.ticks.autoSkip = false;
  }
  charts.push(new Chart(canvasEl,{
    type:'bar',
    data:{labels, datasets:[{label:'Wartość', data:labels.map(()=>null), backgroundColor:'transparent'}]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{enabled:false} },
      scales:{
        x:{grid:{display:false}, ticks:{font:{size:compact?9:10}}},
        y:yAxis
      },
      animation:false
    }
  }));
}

function buildCard(g, yScale, compact){
  if(isPRUStaffingPanel(g)) return buildCombinedChartCard(g, compact);
  return g.multiUnit ? buildPanelCard(g, compact) : buildSingleCard(g, yScale, compact);
}

// single location per indicator — one focused chart/bullet with its target built in
function buildSingleCard(g, yScale, compact){
  const meta = kpaMeta(g.kpa);
  const uid = 'c'+(cardIdSeq++);
  const u = g.units[0];
  const card = document.createElement('div');
  card.className = 'card status-'+g.status + (g.vizType==='empty' ? ' empty':'') + (compact? ' card-compact':'');
  card.style.borderLeftColor = meta.color;

  card.innerHTML = `
    <div class="card-top">
      <div class="card-title">${g.name}</div>
      <span class="freq-badge">${freqDotsHtml(g.freq)}</span>
    </div>
    <div class="subline">${u.loc||''}</div>
    <div class="body-${uid}"></div>
  `;
  renderUnitBody(card.querySelector(`.body-${uid}`), g, u, meta, !!compact, yScale);

  return card;
}

// Axis max rounding: raw headroom (max*1.1) often lands on an ugly number like
// 90.2 or 107.6 (or, for larger 4+ digit values, 6700) that reads as noise
// rather than a deliberate ceiling. Rounding to one significant digit instead
// of two gives cleaner steps across the board (e.g. 6045 target -> 7000, not
// 6700). Percent-based metrics (utilization, on-time rate, etc.) have a
// natural ceiling of 100, so those just snap straight to 100 unless the data
// itself already runs past it.
function niceRoundUp(v){
  if(!(v>0)) return v;
  const magnitude = Math.pow(10, Math.floor(Math.log10(v)));
  // single-digit counts (e.g. incident tallies 0-9) only ever look right as
  // WHOLE numbers on an axis — a ".5" step (5.5, 3.5, ...) reads as a typo,
  // not a deliberate ceiling, so round straight up to the next integer here.
  if(magnitude===1) return Math.ceil(v);
  // for everything bigger, round up to the nearest HALF order-of-magnitude
  // step (..., 10, 15, 20, ...) instead of jumping straight to the next full
  // order of magnitude — a max of e.g. 12.1 would otherwise round all the way
  // up to 20 instead of a tighter, still-round 15.
  const step = Math.ceil((v/magnitude)*2)/2;
  return step*magnitude;
}
// For "millions" (large PLN amounts) charts, the generic niceRoundUp() half-
// order-of-magnitude step can land on an awkward max (e.g. 450 mln) that Chart.js
// then can't evenly divide into round gridlines, producing a lopsided axis like
// "0 / 100 / 200 / 300 / 450 mln". This picks a clean step (1/2/5 × a power of
// ten) AND a max that's an exact multiple of it, so every gridline lines up
// (e.g. step 100 mln → 0/100/200/300/400/500). No extra proportional headroom
// is added on top — rounding UP to the next clean step already gives enough
// breathing room, and a fixed 10% padding was pushing the ceiling a whole
// extra step past the highest real target/value (e.g. 1200 mln rounding all
// the way up to 1500 instead of stopping at a tight, still-clean 1200/1400).
function niceMillionsScale(dataMax){
  if(!(dataMax>0)) return {max:0, step:1};
  const rawStep = dataMax/5;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const residual = rawStep/magnitude;
  // geometric-mean breakpoints between the allowed 1/2/5/10 step multipliers
  // (sqrt(2), sqrt(10), sqrt(50)) — picks whichever is numerically CLOSEST on
  // a log scale, instead of the old skewed cutoffs that rounded e.g. a 2.4-2.6
  // residual all the way up to 5 (a full step too coarse).
  const niceResidual = residual>7.07 ? 10 : residual>3.162 ? 5 : residual>1.414 ? 2 : 1;
  const step = niceResidual*magnitude;
  return {max: Math.ceil(dataMax/step)*step, step};
}
// Percent axes normally run a fixed 0-100% ladder (five 20%-spaced
// gridlines) — but a metric that's genuinely allowed to overshoot 100% (e.g.
// "Terminowe inicjowanie procesu zakupowego" hitting 125% one quarter) must
// extend the scale instead of clipping/cramming that bar right at the top;
// the 20%-step gridline convention is kept, just extended with headroom.
function percentAxisMax(dataMax){
  if(!(dataMax>100)) return 100;
  let m = Math.ceil(dataMax/10)*10;
  if(m<=dataMax) m += 10;
  return m;
}
function percentAxisTicks(axisMax){
  // Pick a step that lands on ~5-8 gridlines: prefer a divisor of axisMax
  // itself (so the top tick matches the axis ceiling exactly, e.g. 0..5 in
  // steps of 1 for a pinned 0-5% scale), otherwise fall back to whichever
  // candidate keeps the tick count reasonable (e.g. 20% steps for a 0-130%
  // extended axis, matching the original 0/20/40/.../100% ladder).
  const candidates = [1,2,5,10,20,25,50];
  const step = candidates.find(c => axisMax/c<=6 && axisMax%c===0)
    || candidates.find(c => axisMax/c<=8)
    || 20;
  const ticks = [];
  for(let v=0; v<=axisMax; v+=step) ticks.push(v);
  return ticks;
}
function niceAxisMax(dataMax, percent){
  // Percentage metrics are conceptually bounded at 100% — pin the axis there
  // unless the reported value genuinely overshoots it (e.g. "Terminowe
  // inicjowanie procesu zakupowego" 125%), in which case extend instead of
  // clipping — see percentAxisMax().
  if(percent) return percentAxisMax(dataMax);
  return niceRoundUp(dataMax*1.1);
}

// A panel splits one indicator across several locations/units — so all of its
// sub-charts must share ONE y-axis (same min/max), otherwise a unit reporting
// e.g. 40h of overtime and one reporting 4000h would draw equally tall bars and
// mislead the reader about relative scale. We scan every numeric value across
// ALL units of the group (quarters + annual plan/expected) and fix a common
// range, with ~10% headroom above the highest bar/target so nothing touches the
// top of the chart.
function computeGroupYScale(g){
  let max = -Infinity, min = 0, any = false, percent = false;
  g.units.forEach(u=>{
    u.q.forEach(q=>{ if(!q.empty && q.value!=null){ any=true; if(q.value>max) max=q.value; if(q.value<min) min=q.value; if(q.percent) percent=true; } });
    if(!u.plan.empty && u.plan.value!=null){ any=true; if(u.plan.value>max) max=u.plan.value; if(u.plan.value<min) min=u.plan.value; if(u.plan.percent) percent=true; }
    if(!u.exp.empty && u.exp.value!=null){ any=true; if(u.exp.value>max) max=u.exp.value; if(u.exp.value<min) min=u.exp.value; if(u.exp.percent) percent=true; }
  });
  if(!any || max<=0) return null;
  return {min, max: niceAxisMax(max, percent), percent};
}
// Same idea as computeGroupYScale, but across several DIFFERENT indicator
// groups (not locations within one) — used to align the Y axis of a small set
// of closely-related standalone cards (see RUNWAY_SAFETY_METRICS below) so
// their bar heights stay visually comparable at a glance.
// `millions` picks the tighter, clean-step money-scale rounding
// (niceMillionsScale) instead of the generic niceAxisMax/niceRoundUp — used
// for the KP-INWEST investment clusters, whose PLN targets are big enough
// that the generic half-order-of-magnitude rounding overshoots by a whole
// extra step (e.g. 1200 mln rounding all the way up to 1500).
function computeSharedYScale(groups, millions){
  let max = -Infinity, min = 0, any = false, percent = false;
  groups.forEach(g=> g.units.forEach(u=>{
    u.q.forEach(q=>{ if(!q.empty && q.value!=null){ any=true; if(q.value>max) max=q.value; if(q.value<min) min=q.value; if(q.percent) percent=true; } });
    if(!u.plan.empty && u.plan.value!=null){ any=true; if(u.plan.value>max) max=u.plan.value; if(u.plan.value<min) min=u.plan.value; if(u.plan.percent) percent=true; }
    if(!u.exp.empty && u.exp.value!=null){ any=true; if(u.exp.value>max) max=u.exp.value; if(u.exp.value<min) min=u.exp.value; if(u.exp.percent) percent=true; }
  }));
  if(!any || max<=0) return null;
  if(millions){ const sc = niceMillionsScale(max); return {min, max: sc.max, step: sc.step, percent}; }
  return {min, max: niceAxisMax(max, percent), percent};
}
// Runway-safety trio (KP-TWR): reported side by side, all incident counts, all
// lower-is-better — sharing one Y axis makes their relative severity legible
// instead of three unrelated scales (5 vs 8 vs 10) that look "off" together.
function isRunwaySafetyMetric(name){ return /wtargnię|przerwanych startów/i.test(name||''); }
// "Realizacja inwestycji dla ..." (KP-INWEST): nine separate, same-shape cards
// (one per Biuro) — sharing one axis makes the very different budget sizes
// comparable, and values are shown in "mln" (millions) instead of raw PLN.
// The three biggest budgets (PAŻP overall, Biuro MA, Biuro OZ — hundreds of
// millions) would otherwise dwarf the rest on one shared axis, so they get
// their OWN shared scale (~500 mln) while the remaining, much smaller offices
// share a separate ~15 mln scale.
function isInvestmentMetric(name){ return /^Realizacja inwestycji/i.test(name||'') || /zabezpieczenie płynności/i.test(name||''); }
function isBigInvestmentMetric(name){ return /^Realizacja inwestycji dla (PAŻP|Biura (MA|OZ))\b/i.test(name||''); }

// multiple locations for the same indicator — split into one compact sub-card per
// location (each with its own target), rather than merging into one busy chart.
// Two specific KP-RAD panels (ACC GAT/ACC OAT/APP GD/KK/PO/WA — "Wykorzystanie
// ATCO..." and "Liczba godzin nadliczbowych ATCO") read better split into two
// rows — the ACC (radar) pair on top, the four APP towers below — instead of
// one grid that awkwardly wraps 6 boxes across 5 columns. Both rows still
// share the same y-scale/column sizing as a normal panel (no separate axis
// split, no full-width stretching of the top row).
function isAccAppRadarPanel(g){
  return g.obszar==='KP-RAD' && g.units.length===6 && g.units.some(u=>/^ACC/i.test(u.loc||'')) && g.units.some(u=>/^APP/i.test(u.loc||''));
}
function buildPanelCard(g, compact){
  if(compact===undefined) compact = true; // preserve default panel density everywhere else
  const meta = kpaMeta(g.kpa);
  const yScale = computeGroupYScale(g);
  // "Liczba godzin nadliczbowych ATCO" (KP-RAD) has one target (APP PO) at
  // 6045h — the generic auto-scale rounds that up to 7000, leaving almost no
  // headroom above the target line; pin it a bit higher (8000) instead.
  if(yScale && /^Liczba godzin nadliczbowych ATCO$/i.test(g.name||'') && g.obszar==='KP-RAD') yScale.max = 8000;
  // "Monitorowanie kowenantów..." (MF) covenant ratios sit well under 5 (targets
  // "<3", ">1,2") — pin a fixed, easy-to-read 0-5 scale instead of the
  // generic auto-fit, which would otherwise round to an oddly tight max.
  if(yScale && /^Monitorowanie kowenantów na potrzeby umów kredytowych$/i.test(g.name||'') && g.obszar==='MF'){ yScale.min = 0; yScale.max = 5; yScale.percent = false; }
  const panel = document.createElement('div');
  // the panel itself is never tinted red/yellow for a single breaching
  // location — see per-unit-box and per-bar colouring above; only the
  // "no data at all" grey state applies at the panel level. That grey state
  // must fire whenever EVERY location is empty (g.status==='empty', the
  // worst-case rank), not just when the whole group's vizType is structurally
  // empty — a panel can be vizType 'annual'/'quarterly' (it has a target) yet
  // still have zero locations with an actual reported result, and the title
  // needs to read as inactive in that case too (e.g. KP-TR-ATS training-rate
  // panels with cel-only sub-boxes).
  panel.className = 'card panel' + ((g.vizType==='empty' || g.status==='empty') ? ' empty':'');
  panel.style.borderLeftColor = meta.color;

  panel.innerHTML = `
    <div class="card-top">
      <div class="card-title">${g.name}</div>
      <span class="freq-badge">${freqDotsHtml(g.freq)}</span>
    </div>
  `;
  const addUnitGrid = (units)=>{
    const grid = document.createElement('div');
    grid.className = 'unit-grid';
    // only for these enlarged (non-compact) rows: size columns to the actual
    // unit count here specifically, instead of touching the shared
    // .unit-grid CSS rule used by every other panel on the dashboard.
    // `auto-fit`+`minmax` (not a flat `repeat(n,1fr)`) keeps that "one column
    // per unit" layout on wide screens while still letting narrow/embedded
    // widget widths wrap to fewer columns instead of squeezing every chart
    // down to nothing and spilling off the right edge.
    if(compact===false) grid.style.gridTemplateColumns = `repeat(auto-fit, minmax(max(130px, calc(100%/${units.length} - 12px)), 1fr))`;
    panel.appendChild(grid);
    units.forEach(u=>{
      const box = document.createElement('div');
      // each box reflects its OWN unit's status (based only on its latest
      // reported quarter) — a red box here means this specific location is
      // currently over target, not "some other location in this group is".
      box.className = 'unit-box status-'+u.status;
      box.innerHTML = `<div class="unit-box-label">${statusDot(u.status)}${u.loc || 'Ogółem'}</div>`;
      renderUnitBody(box, g, u, meta, compact, yScale);
      grid.appendChild(box);
    });
  };
  if(isAccAppRadarPanel(g)){
    const accUnits = g.units.filter(u=> /^ACC/i.test(u.loc||''));
    const appUnits = g.units.filter(u=> !/^ACC/i.test(u.loc||''));
    addUnitGrid(accUnits);
    addUnitGrid(appUnits);
  } else {
    addUnitGrid(g.units);
  }

  return panel;
}

/* ===================== RENDER: SECTIONS / GRID ===================== */
function renderContent(){
  const main = document.getElementById('content');
  main.innerHTML = '';
  charts.forEach(c=>{ try{c.destroy();}catch(e){} });
  charts = [];
  chartQueue = [];

  const list = getFiltered();
  if(!list.length){
    main.innerHTML = `<div class="empty-state"><b>Brak wyników</b>Zmień kryteria filtrowania lub wyszukiwania.</div>`;
    return;
  }
  // group by Obszar within current view — ordered using a FIXED order computed
  // once from the full unfiltered dataset (see computeObszarOrder), so
  // toggling filters (e.g. "tylko poza celem") never reshuffles which obszar
  // section appears where; only the set/count of cards inside each changes.
  const byObszar = new Map();
  list.forEach(g=>{ if(!byObszar.has(g.obszar)) byObszar.set(g.obszar, []); byObszar.get(g.obszar).push(g); });
  const sections = [...byObszar.entries()].sort((a,b)=>{
    const ia = OBSZAR_ORDER.indexOf(a[0]), ib = OBSZAR_ORDER.indexOf(b[0]);
    return (ia<0? Infinity:ia) - (ib<0? Infinity:ib);
  });

  sections.forEach(([obszar, groups])=>{
    // KP-FIS: "Wydajność FISO na godzinę pracy" reads as the headline figure
    // for the whole area — pin it first, ahead of the per-office traffic-load
    // and staffing cards that follow it in the raw sheet order.
    if(obszar==='KP-FIS'){
      const isFisoEfficiency = n=> normKey(n)===normKey('Wydajność FISO na godzinę pracy');
      groups.sort((a,b)=> (isFisoEfficiency(a.name)?0:1) - (isFisoEfficiency(b.name)?0:1));
    }
    const kpaSet = new Set(groups.map(g=>g.kpa));
    const primaryMeta = kpaMeta(kpaSet.size===1 ? groups[0].kpa : null);
    const section = document.createElement('div');
    section.className = 'section' + (collapsedObszars.has(obszar) ? ' collapsed' : '');
    section.dataset.obszar = obszar;
    section.innerHTML = `
      <div class="section-head">
        <span class="accent" style="background:${primaryMeta.color}"></span>
        <h3>${obszar} <span class="count">${groups.length}</span></h3>
        <span class="chev">▾</span>
      </div>
      <div class="grid"></div>
    `;
    section.querySelector('.section-head').addEventListener('click', ()=>{
      section.classList.toggle('collapsed');
      if(section.classList.contains('collapsed')) collapsedObszars.add(obszar); else collapsedObszars.delete(obszar);
      saveUiState();
      syncToggleAllBtn();
    });
    const grid = section.querySelector('.grid');
    const runwayShared = computeSharedYScale(groups.filter(g=> isRunwaySafetyMetric(g.name)));
    // KP-ZAK: "Terminowe inicjowanie procesu zakupowego" and "Terminowe
    // zawieranie umów zakupowych" read side by side — sharing one axis keeps
    // them visually comparable, and it must stretch past 100% (e.g. a 125%
    // quarter) instead of clipping the bar at the usual 100% ceiling.
    const kpZakShared = computeSharedYScale(groups.filter(g=> obszar==='KP-ZAK'));
    // "Zabezpieczenie płynności" (MF) is millions-scaled like the investment
    // budget cards (see isInvestmentMetric) but it's a single stand-alone
    // metric, not part of that PAŻP/OZ/MA/rest investment-progress cluster —
    // it must stay in its normal top-of-section position, not get pulled into
    // the low-priority full-width investment rows rendered at the bottom.
    const isBudgetInvestmentMetric = g=> /^Realizacja inwestycji/i.test(g.name||'');
    const investBig = groups.filter(g=> isBudgetInvestmentMetric(g) && isBigInvestmentMetric(g.name))
      .sort((a,b)=>{
        const rank = n=> /PAŻP\b/i.test(n) ? 0 : /Biura OZ\b/i.test(n) ? 1 : /Biura MA\b/i.test(n) ? 2 : 3;
        return rank(a.name)-rank(b.name);
      });
    const investSmall = groups.filter(g=> isBudgetInvestmentMetric(g) && !isBigInvestmentMetric(g.name))
      .sort((a,b)=>{
        // requested display order for the "rest" (smaller-budget) offices —
        // AO/AY/MF/MZ/OP/OR — rather than the raw sheet order.
        const SMALL_INVEST_ORDER = ['AO','OP','OR','AY','MF','MZ'];
        const codeOf = n=>{ const m=/\b(AO|AY|MF|MZ|OP|OR)\b/i.exec(n||''); return m? m[1].toUpperCase() : ''; };
        const rank = n=>{ const i = SMALL_INVEST_ORDER.indexOf(codeOf(n)); return i<0? 99 : i; };
        return rank(a.name)-rank(b.name);
      });
    const investBigShared = computeSharedYScale(investBig, true);
    const investSmallShared = computeSharedYScale(investSmall, true);
    // pin the "rest of the offices" investment scale to a fixed, easy-to-read
    // 0/5/10/15 mln ladder (the highest target among them, Biuro MF at 11
    // mln, otherwise auto-rounds to an odd 0/2/4/.../12 step ladder).
    if(investSmallShared){ investSmallShared.min = 0; investSmallShared.max = 15e6; investSmallShared.step = 5e6; }
    // KP-TR-ATS: "podstawowego" (1 chart), "w zakresie uprawnienia" (4
    // charts: ACS/APS/ADC/APP) and the merged simulator-availability panel (3
    // charts: P_21/BEST-Warszawa/BEST-Poznań) all read as one connected row —
    // same training/readiness cluster — sized so each individual chart column
    // stays roughly the same width across all three (1 + 4 + 3 = 8 columns).
    const ospaRow = [
      groups.find(g=> /^Skuteczność szkolenia podstawowego\b.*OSPA$/i.test(g.name)),
      groups.find(g=> /^Skuteczność szkolenia w zakresie uprawnienia\b.*OSPA$/i.test(g.name)),
      groups.find(g=> /^Dostępność techniczna symulatorów$/i.test(g.name))
    ].filter(Boolean);
    // The "w jednostce" panel (3 units: ACC/APP/TWR) reads as one connected
    // row with its two close relatives (single-intake variant + the
    // "uzupełniające" refresher training) — same proportional-row treatment
    // as the OSPA trio above (3 + 1 + 1 = 5 columns).
    const jednostkaCard = groups.find(g=> /^Skuteczność szkolenia personelu ATS w jednostce$/i.test(g.name));
    const jednostkaFollowUp = groups.filter(g=> /w odniesieniu do jednego naboru/i.test(g.name) || /^Skuteczność szkolenia uzupełniającego personelu ATS$/i.test(g.name))
      .sort((a,b)=> (/jednego naboru/i.test(a.name)?0:1) - (/jednego naboru/i.test(b.name)?0:1));
    const jednostkaRow = [jednostkaCard, ...jednostkaFollowUp].filter(Boolean);
    // KP-AIM: 12 data-quality metrics laid out in 4 fixed-width rows instead
    // of the default auto-fill wrap — publication timeliness/quality pair
    // (1-2), the "danych" quartet (3-6), NOTAM trio (7-9), PIB trio (10-12).
    // Uses the group's OWN order (already the sheet/GROUPS order) rather than
    // name-matching, so it still degrades gracefully if a filter drops some
    // cards (rows just get shorter, no family mis-match risk).
    const aimRows = [];
    if(obszar==='KP-AIM'){
      let idx = 0;
      [2,4,3,3].forEach(sz=>{
        const chunk = groups.slice(idx, idx+sz);
        idx += sz;
        if(chunk.length) aimRows.push(chunk);
      });
    }
    const investSet = new Set([...investBig, ...investSmall, ...ospaRow, ...jednostkaRow, ...aimRows.flat()]);
    if(ospaRow.length){
      const row = document.createElement('div');
      row.className = 'invest-row invest-row-ospa';
      // non-compact (full chart height) so all three cards line up with the
      // same Y-axis pixel height instead of the panels' mini-charts running
      // shorter and leaving whitespace under them.
      ospaRow.forEach(g=> row.appendChild(buildCard(g, null, false)));
      grid.appendChild(row);
    }
    aimRows.forEach(chunk=>{
      const row = document.createElement('div');
      row.className = 'invest-row invest-row-aim';
      chunk.forEach(g=> row.appendChild(buildCard(g)));
      grid.appendChild(row);
    });
    // Investment cards get their own full-width rows (one for the ~500 mln
    // PAŻP/MA/OZ trio, one for the ~20 mln rest) instead of being interleaved
    // into the regular auto-flow grid — that's the only way to guarantee they
    // land on two visually separate lines with their own (very different)
    // scales, rather than wrapping wherever the grid happens to break.
    groups.filter(g=> !investSet.has(g)).forEach(g=>{
      grid.appendChild(buildCard(g, isRunwaySafetyMetric(g.name) ? runwayShared : (obszar==='KP-ZAK' ? kpZakShared : null)));
    });
    if(jednostkaRow.length){
      const row = document.createElement('div');
      row.className = 'invest-row invest-row-jednostka';
      jednostkaRow.forEach(g=> row.appendChild(buildCard(g, null, false)));
      grid.appendChild(row);
    }
    if(investBig.length){
      const row = document.createElement('div');
      row.className = 'invest-row invest-row-big';
      investBig.forEach(g=> row.appendChild(buildCard(g, investBigShared)));
      grid.appendChild(row);
    }
    if(investSmall.length){
      const row = document.createElement('div');
      row.className = 'invest-row invest-row-small';
      investSmall.forEach(g=> row.appendChild(buildCard(g, investSmallShared, true)));
      grid.appendChild(row);
    }
    main.appendChild(section);
  });
  syncToggleAllBtn();

  // charts are only instantiated once every card/panel is in the DOM and the
  // CSS grid has settled — creating Chart.js instances mid-layout bakes in the
  // wrong canvas width and produces misaligned / overlapping tick labels.
  const queued = chartQueue; chartQueue = [];
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    queued.forEach(fn=>{ try{ fn(); }catch(e){ console.error(e); } });
  }));
}
// keeps the collapse-all button's chevron in sync with whatever the
// individual per-section collapse state actually is (e.g. after restoring a
// saved collapsed-set on load, or after a user expands/collapses one section
// by hand) rather than tracking its own separate on/off flag.
function syncToggleAllBtn(){
  const btn = document.getElementById('toggleAllBtn');
  const sections = [...document.querySelectorAll('.section')];
  const allCollapsed = sections.length>0 && sections.every(s=>s.classList.contains('collapsed'));
  btn.classList.toggle('all-collapsed', allCollapsed);
}

/* ===================== DATA LOADING ===================== */
function setLastUpdate(ok){
  // the visible "synchronizacja" indicator was removed along with the top
  // bar — keep this as a console breadcrumb only, so loadData() doesn't need
  // its own branching for "has a status element or not".
  console.debug(ok? 'zsynchronizowano z Grist' : 'brak połączenia z Grist');
}

async function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}

// no demo/embedded fallback anymore — this widget only ever shows live data
// straight from the Grist table (see TABLE above). Outside a Grist frame, or
// if the fetch fails, RAW/GROUPS stay empty and renderContent() shows the
// normal "brak wyników" empty state instead of a stale baked-in snapshot.
async function loadData(){
  const inGrist = window.grist && window.parent !== window;
  let records = [];
  if(inGrist){
    try{
      const data = await withTimeout(grist.docApi.fetchTable(TABLE), 6000);
      records = colToRecs(data);
      setLastUpdate(true);
    }catch(e){
      console.warn('Grist fetch failed', e);
      setLastUpdate(false);
    }
  } else {
    console.warn('Widget nie jest osadzony w Gricie — brak danych.');
    setLastUpdate(false);
  }
  RAW = records;
  GROUPS = mergeSpecialGroups(buildGroups(records));
}

// FISO efficiency (one org-wide figure) and FIS-office staffing (4 locations)
// both only carry a target with nothing measured yet — merged into a single
// 5-box row instead of two separate near-empty cards, per request.
function mergeSpecialGroups(groups){
  let out = groups;
  // "Dostępność techniczna symulatora (P_21)" / "(BEST-Warszawa)" /
  // "(BEST-Poznań)" (KP-TR-ATS) are 3 separate single-location metrics whose
  // location lives in the name itself — read far better as one panel with 3
  // sub-boxes (like the ACS/APS/ADC/APP breakdown above it) than as 3 nearly
  // identical full cards.
  const simIdx = out.map((g,i)=>({g,i})).filter(({g})=> /^Dostępność techniczna symulator/i.test(g.name));
  if(simIdx.length===3){
    const simGroups = simIdx.map(x=>x.g);
    const simMerged = {
      ...simGroups[0],
      key: simGroups[0].key+'§merged-sim',
      name: 'Dostępność techniczna symulatorów',
      units: simGroups.map(g=>{
        const m = /\(([^)]+)\)/.exec(g.name);
        return {...g.units[0], loc: m ? m[1] : (g.units[0].loc||'')};
      }),
      multiUnit: true
    };
    const idxSet = new Set(simIdx.map(x=>x.i));
    out = out.filter((g,i)=> !idxSet.has(i)).concat([simMerged]);
  }
  return out;
}

async function refreshAndRender(){
  await loadData();
  computeObszarOrder();
  populateObszarFilter();
  populateCelFilter();
  populateKpaFilter();
  if(!uiStateApplied){ applyUiState(); uiStateApplied = true; }
  renderContent();
}

/* ===================== INIT ===================== */
function wireControls(){
  // every filter/search change also persists to localStorage (see
  // saveUiState) so it survives the widget being reloaded by Grist.
  const onChange = ()=>{ saveUiState(); renderContent(); };
  document.getElementById('searchInput').addEventListener('input', onChange);
  document.getElementById('obszarFilter').addEventListener('change', onChange);
  document.getElementById('celFilter').addEventListener('change', onChange);
  document.getElementById('kpaFilter').addEventListener('change', onChange);
  document.getElementById('dataFilter').addEventListener('change', onChange);
  document.getElementById('onlyProblems').addEventListener('change', onChange);
  // collapse/expand-all: flips every currently rendered .section's own
  // collapsed state in one click (same class each section-head already
  // toggles individually) — lives outside #content so it survives re-renders.
  document.getElementById('toggleAllBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('toggleAllBtn');
    const nextCollapsed = !btn.classList.contains('all-collapsed');
    document.querySelectorAll('.section').forEach(s=>{
      s.classList.toggle('collapsed', nextCollapsed);
      const obszar = s.dataset.obszar;
      if(!obszar) return;
      if(nextCollapsed) collapsedObszars.add(obszar); else collapsedObszars.delete(obszar);
    });
    btn.classList.toggle('all-collapsed', nextCollapsed);
    saveUiState();
  });
}


(async function init(){
  wireControls();
  // no fixed timer anymore (per request) — only refreshes once on open and
  // whenever Grist reports the underlying table actually changed
  // (onRecords), so it doesn't silently reset filters/collapsed sections
  // every 60s with nothing new to show.
  if(window.grist && window.parent !== window){
    try{ grist.ready({requiredAccess:'read table'}); }catch(e){}
    try{ grist.onRecords(()=> refreshAndRender()); }catch(e){}
  }
  await refreshAndRender();
})();

</script>
